@if (dialog.openState()) {
  <div class="app-dialog-backdrop" (click)="dialog.close()">
    <section class="app-dialog app-card" role="dialog" aria-modal="true" aria-labelledby="membership-request-title" aria-describedby="membership-request-description" (click)="$event.stopPropagation()">
      <header class="app-dialog-header">
        <p class="eyebrow app-badge app-badge--primary">Group Access</p>
        <h2 id="membership-request-title">Request Membership</h2>
        <p id="membership-request-description" class="subtitle app-muted">Choose the group you want to join and the role you need.</p>
      </header>

      <div class="app-dialog-body">
        <div class="membership-request-form">
          <label class="form-field">
            <span>Group</span>
            <div class="group-select">
              @if (selectedGroupIconPath(); as iconPath) {
                <img class="group-select-logo" [src]="iconPath" alt="" aria-hidden="true" />
              }
              <select class="app-input" [ngModel]="dialog.groupId()" (ngModelChange)="dialog.groupId.set($event)" [disabled]="dialog.groupsLoading() || !dialog.groups().length">
                @if (dialog.groupsLoading()) {
                  <option value="">Loading groups...</option>
                } @else {
                  @for (group of dialog.groups(); track group.id) {
                    <option [ngValue]="group.id">{{ group.name }}</option>
                  }
                }
              </select>
            </div>
          </label>

          <label class="form-field">
            <span>Requested role</span>
            <select class="app-input" [ngModel]="dialog.role()" (ngModelChange)="dialog.role.set($event)">
              @for (role of dialog.roles; track role) {
                <option [ngValue]="role">{{ role }}</option>
              }
            </select>
          </label>
        </div>

        @if (dialog.error()) {
          <div class="dialog-error" role="alert">{{ dialog.error() }}</div>
        }
      </div>

      <footer class="app-dialog-actions">
        <button type="button" class="app-button app-button--ghost" (click)="dialog.close()" [disabled]="dialog.saving()">Cancel</button>
        <button type="button" class="app-button app-button--primary" (click)="dialog.submit()" [disabled]="dialog.saving() || !dialog.groupId() || dialog.groupsLoading()">
          {{ dialog.saving() ? 'Submitting...' : 'Submit request' }}
        </button>
      </footer>
    </section>
  </div>
}
