<section id="general-information" class="detail-section-card app-card">
  <div class="detail-section-header">
    <div>
      <p class="eyebrow app-badge app-badge--primary">Dataset Detail</p>
      <h2>General Information</h2>
      <p class="subtitle app-muted">Core metadata for the dataset.</p>
    </div>

  </div>

  @if (model) {
    <fieldset class="detail-fieldset detail-form-grid" [disabled]="disabled">
      <label class="detail-field">
        <span class="detail-label">Title</span>
        <input class="app-input" type="text" [(ngModel)]="model.title" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()" />
      </label>

    <label class="detail-field detail-field--full">
      <span class="detail-label">Description *</span>
      <textarea class="app-input detail-textarea" rows="4" [(ngModel)]="model.description" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()" required></textarea>
    </label>

    <div class="detail-field">
      <span class="detail-label">Keywords</span>
      <app-keyword-chips [keywords]="model.keywords" [disabled]="disabled" (keywordsChange)="updateKeywords($event)" />
    </div>

    <label class="detail-field">
      <span class="detail-label">Accrual periodicity</span>
      <input class="app-input" type="text" [(ngModel)]="model.accrualPeriodicity" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()" />
    </label>

    <label class="detail-field detail-field--full">
      <span class="detail-label">Quality annotation</span>
      <textarea class="app-input detail-textarea" rows="3" [(ngModel)]="model.qualityAnnotation" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()"></textarea>
    </label>

    <label class="detail-field">
      <span class="detail-label">Created</span>
      <input class="app-input" type="datetime-local" [(ngModel)]="model.created" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()" />
    </label>

      <label class="detail-field">
        <span class="detail-label">Updated</span>
      <input class="app-input" type="datetime-local" [(ngModel)]="model.updated" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()" />
      </label>
    </fieldset>
  }
</section>
