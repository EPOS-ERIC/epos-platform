<section
  [attr.id]="embedded ? null : 'temporal-coverage'"
  [attr.aria-label]="embedded ? 'Temporal Coverage' : null"
  class="detail-section-card"
  [class.app-card]="!embedded"
  [class.detail-section-card--embedded]="embedded"
>
  @if (!embedded) {
    <div class="detail-section-header">
      <div>
        <h2>Temporal Coverage</h2>
        <p class="subtitle app-muted">Calendar dates or geological ages.</p>
      </div>
    </div>
  }

  <fieldset class="detail-fieldset detail-form-grid" [disabled]="disabled">
    @if (allowGeological) {
      <label class="detail-field detail-field--full">
        <span class="detail-label">Coverage type</span>
        <select class="app-input" [ngModel]="mode" [ngModelOptions]="{ standalone: true }" (ngModelChange)="modeChange.emit($event)">
          <option value="calendar">Calendar dates</option>
          <option value="geological">Geological ages</option>
        </select>
      </label>
    }

    @if (mode === 'geological') {
      <label class="detail-field">
        <span class="detail-label">Start age (MYA)</span>
        <input class="app-input" type="number" min="0" step="any" [(ngModel)]="geologicalModel.startMya" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitGeologicalModelChange()" />
      </label>

      <label class="detail-field">
        <span class="detail-label">End age (MYA)</span>
        <input class="app-input" type="number" min="0" step="any" [(ngModel)]="geologicalModel.endMya" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitGeologicalModelChange()" />
      </label>
    } @else {
      <label class="detail-field">
        <span class="detail-label">Start time</span>
        <input class="app-input" type="datetime-local" [(ngModel)]="model.start" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()" />
      </label>

      <label class="detail-field">
        <span class="detail-label">End time</span>
        <input class="app-input" type="datetime-local" [(ngModel)]="model.end" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()" />
      </label>
    }
  </fieldset>
  
  @if (warningKind !== 'none') {
    <div class="temporal-warning" [class.temporal-warning--error]="warningKind === 'error'" [class.temporal-warning--warning]="warningKind === 'warning'">
      <app-icon [name]="'warning'" [size]="16" />
      <span>{{ warningMessage }}</span>
    </div>
  }
</section>
