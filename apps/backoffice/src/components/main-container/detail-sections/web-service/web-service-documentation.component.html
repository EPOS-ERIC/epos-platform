<details id="webservice-documentation" class="webservice-subsection">
  <summary class="webservice-subsection-summary">
    <span class="distribution-subtitle">Documentation</span>
    <span class="webservice-summary-hint">Closed</span>
  </summary>

  <div class="webservice-subsection-body">
    @if (model) {
      <fieldset class="detail-fieldset" [disabled]="disabled">
        <div class="detail-form-grid">
          <label class="detail-field">
            <span class="detail-label">Title</span>
            <input class="app-input" type="text" [(ngModel)]="model.title" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()" />
          </label>

          <label class="detail-field detail-field--full">
            <span class="detail-label">Description</span>
            <textarea class="app-input detail-textarea" rows="3" [(ngModel)]="model.description" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()"></textarea>
          </label>

          <label class="detail-field detail-field--full">
            <span class="detail-label">URI</span>
            <input class="app-input" type="text" [(ngModel)]="model.uri" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()" />
          </label>
        </div>
      </fieldset>
    }
  </div>
</details>
