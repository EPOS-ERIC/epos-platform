<div class="min-h-screen bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
  <app-map-view [viewMode]="mapViewMode"></app-map-view>

  <div class="pointer-events-none relative z-10">
    <app-header
      class="pointer-events-auto"
      [isDarkMode]="isDarkMode"
      (openSearch)="openSearchDialog()"
      (mapViewModeChange)="onMapViewModeChange($event)"
      (toggleTheme)="toggleTheme()"
    ></app-header>
    <app-results-panel #resultsPanel></app-results-panel>
    <router-outlet></router-outlet>
  </div>
</div>

@if (isSearchDialogOpen) {
  <div
    class="fixed inset-0 z-[120] flex items-start justify-center bg-slate-900/35 p-6 backdrop-blur-sm dark:bg-slate-950/55"
    (click)="closeSearchDialog()"
  >
    <section
      role="dialog"
      aria-modal="true"
      aria-label="Search dialog"
      class="mt-16 w-full max-w-2xl rounded-2xl border border-slate-200 bg-white p-4 shadow-2xl dark:border-slate-700 dark:bg-slate-900"
      (click)="$event.stopPropagation()"
    >
      <form class="flex flex-col gap-3" (ngSubmit)="submitSearch(resultsPanel)">
        <div class="flex flex-col gap-3 sm:flex-row">
          <input
            #globalSearchInput
            type="text"
            name="globalSearchQuery"
            [(ngModel)]="searchQuery"
            placeholder="Type your query and press Enter"
            class="w-full rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none ring-sky-500 placeholder:text-slate-400 focus:ring-2 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-100 dark:placeholder:text-slate-500"
          />
          <div class="flex gap-2">
            <button
              type="submit"
              class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-white"
            >
              Search
            </button>
            <button
              type="button"
              class="rounded-md border border-slate-300 bg-white px-4 py-2 text-sm font-medium text-slate-700 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-950 dark:text-slate-200 dark:hover:bg-slate-800"
              (click)="clearSearch(resultsPanel)"
            >
              Clear
            </button>
          </div>
        </div>

        <div class="mt-1">
          <div
            class="flex items-start justify-between gap-3 rounded-xl border border-slate-200 bg-slate-50/70 px-3 py-2 dark:border-slate-700 dark:bg-slate-950/60"
          >
            <div class="min-w-0 flex-1">
              <button
                type="button"
                class="flex items-center gap-2 text-left"
                (click)="toggleFilters()"
              >
                <p
                  class="text-xs font-semibold uppercase tracking-wide text-slate-600 dark:text-slate-300"
                >
                  Filters
                </p>
                <svg
                  class="h-4 w-4 text-slate-500 transition dark:text-slate-400"
                  [class.rotate-180]="isFiltersExpanded"
                  viewBox="0 0 20 20"
                  fill="currentColor"
                  aria-hidden="true"
                >
                  <path
                    fill-rule="evenodd"
                    d="M5.23 7.21a.75.75 0 0 1 1.06.02L10 11.168l3.71-3.94a.75.75 0 1 1 1.09 1.03l-4.24 4.5a.75.75 0 0 1-1.09 0l-4.24-4.5a.75.75 0 0 1 .02-1.06Z"
                    clip-rule="evenodd"
                  ></path>
                </svg>
              </button>

              <div class="mt-2 flex flex-wrap gap-2">
                @if (filterState.hasTemporalFilter()) {
                  <span
                    class="inline-flex items-center gap-1 rounded-full border border-sky-200 bg-sky-50 px-2.5 py-1 text-xs font-medium text-sky-700 dark:border-sky-900 dark:bg-sky-950/40 dark:text-sky-300"
                  >
                    <span>Temporal Filter</span>
                    <button
                      type="button"
                      class="ml-0.5 text-sky-500 hover:text-sky-700 dark:text-sky-300 dark:hover:text-white"
                      aria-label="Remove temporal filter"
                      (click)="filterState.clearTemporalFilter()"
                    >
                      ×
                    </button>
                  </span>
                }

                @if (filterState.hasSpatialFilter()) {
                  <span
                    class="inline-flex items-center gap-1 rounded-full border border-emerald-200 bg-emerald-50 px-2.5 py-1 text-xs font-medium text-emerald-700 dark:border-emerald-900 dark:bg-emerald-950/40 dark:text-emerald-300"
                  >
                    <span>Spatial Filter</span>
                    <button
                      type="button"
                      class="ml-0.5 text-emerald-500 hover:text-emerald-700 dark:text-emerald-300 dark:hover:text-white"
                      aria-label="Remove spatial filter"
                      (click)="filterState.clearSpatialFilter()"
                    >
                      ×
                    </button>
                  </span>
                }
              </div>
            </div>
          </div>

          @if (isFiltersExpanded) {
            <div class="mt-3 grid gap-3 md:grid-cols-2">
              <app-temporal-filter></app-temporal-filter>

              <app-spatial-filter></app-spatial-filter>
            </div>

            <div class="mt-3">
              <app-search-extra-filters></app-search-extra-filters>
            </div>
          }
        </div>
      </form>
      <p class="mt-3 text-xs text-slate-500 dark:text-slate-400">Press Esc to close</p>
    </section>
  </div>
}
