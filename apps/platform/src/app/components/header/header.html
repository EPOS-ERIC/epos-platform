<header
  class="border-b border-slate-200 bg-white/85 px-6 py-4 backdrop-blur-md dark:border-slate-800 dark:bg-slate-950/80"
>
  <div class="mx-auto flex items-center justify-between gap-4">
    <div>
      @if (isDarkMode) {
        <div class="flex items-start space-x-2">
          <img src="assets/img/logo-white.svg" alt="Platform logo" class="h-10 w-auto" />
          <span class="bg-orange-600 text-white text-xs font-semibold px-1 py-0.5 rounded-full">Beta</span>
        </div>
      } @else {
        <div class="flex items-start space-x-2">
          <!-- TODO: currently just hardcoded -->
          <a href="https://www.epos-eu.org/" target="_blank" rel="noopener noreferrer">
            <img src="assets/img/logo.svg" alt="Platform logo" class="h-10 w-auto" />
          </a>
          <span class="bg-sky-500 text-white text-xs font-semibold px-1 py-0.5 rounded-full">Beta</span>
        </div>
      }
    </div>
    <div class="flex items-center gap-3">
      <button
        type="button"
        class="cursor-pointer rounded-full border border-slate-300 bg-white p-2 text-slate-700 shadow-sm transition hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-200 dark:hover:bg-slate-800"
        [attr.aria-label]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        [attr.title]="isDarkMode ? 'Switch to light mode' : 'Switch to dark mode'"
        (click)="onToggleTheme()"
      >
        <svg
          viewBox="0 0 24 24"
          class="h-4 w-4"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2"></path>
          <path d="M12 20v2"></path>
          <path d="m4.93 4.93 1.41 1.41"></path>
          <path d="m17.66 17.66 1.41 1.41"></path>
          <path d="M2 12h2"></path>
          <path d="M20 12h2"></path>
          <path d="m6.34 17.66-1.41 1.41"></path>
          <path d="m19.07 4.93-1.41 1.41"></path>
        </svg>
      </button>

      <div
        class="rounded-full border border-slate-300 bg-white p-1 text-xs dark:border-slate-700 dark:bg-slate-900"
      >
        <button
          type="button"
          class="cursor-pointer rounded-full px-3 py-1 text-slate-600 transition dark:text-slate-300"
          [class.bg-slate-900]="mapViewMode === '2d'"
          [class.text-white]="mapViewMode === '2d'"
          (click)="onMapViewModeChange('2d')"
        >
          2D
        </button>
        <button
          type="button"
          class="cursor-pointer rounded-full px-3 py-1 text-slate-600 transition dark:text-slate-300"
          [class.bg-slate-900]="mapViewMode === 'globe'"
          [class.text-white]="mapViewMode === 'globe'"
          (click)="onMapViewModeChange('globe')"
        >
          3D
        </button>
      </div>

      <app-search-bar (openSearch)="onOpenSearch()"></app-search-bar>
    </div>
  </div>
</header>
