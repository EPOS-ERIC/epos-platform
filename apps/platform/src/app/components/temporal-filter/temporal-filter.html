<section
  class="rounded-xl border border-slate-200 bg-slate-50/70 p-3 dark:border-slate-700 dark:bg-slate-950/60"
>
  <div class="mb-3 flex items-start justify-between gap-3">
    <div>
      <p class="text-xs font-semibold uppercase tracking-wide text-slate-600 dark:text-slate-300">
        Temporal filter
      </p>
      <p class="mt-1 text-xs text-slate-500 dark:text-slate-400">
        Set a date range for the search.
      </p>
    </div>

    <button
      type="button"
      class="rounded-md border border-slate-300 bg-white px-2.5 py-1 text-[11px] font-medium text-slate-600 transition hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-300 dark:hover:bg-slate-800"
      (click)="filterState.clearTemporalFilter()"
    >
      Clear
    </button>
  </div>

  <div class="grid gap-3 sm:grid-cols-2">
    <label class="flex flex-col gap-1 text-xs text-slate-600 dark:text-slate-300">
      <span>From</span>
      <input
        type="date"
        name="temporalFilterFrom"
        [ngModel]="filterState.temporalFilterFrom()"
        (ngModelChange)="filterState.setTemporalFilterFrom($event)"
        class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none ring-sky-500 focus:ring-2 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100"
      />
    </label>

    <label class="flex flex-col gap-1 text-xs text-slate-600 dark:text-slate-300">
      <span>To</span>
      <input
        type="date"
        name="temporalFilterTo"
        [ngModel]="filterState.temporalFilterTo()"
        (ngModelChange)="filterState.setTemporalFilterTo($event)"
        class="rounded-md border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 outline-none ring-sky-500 focus:ring-2 dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100"
      />
    </label>
  </div>
</section>
