<app-base-dialog [data]="data" [title]="!feedback ? 'Contact Us' : 'Thank you for your message!'">
  <ng-container class="content">
    <div class="small-content">
      <i *ngIf="show === 'loader'" class="fas fa-spinner fa-spin" aria-hidden="true"></i>
      <span *ngIf="show === 'error'">Unable to contact form API. Please try again.</span>
    </div>
    <ng-container *ngIf="show === 'form'">
      <div class="container" *ngIf="!feedback" novalidate>
        <form class="form" [formGroup]="formGroup" (ngSubmit)="onSubmit(formGroup.value)">
          <div class="message">Send us a message about <strong>{{ itemName }}</strong></div>
          <br />
          <mat-form-field class="form-element">
            <mat-label>Your message is related to</mat-label>
            <mat-select required formControlName="type">
              <mat-option value="DATA">{{ isSoftware ? 'Software' : 'Data' }}</mat-option>
              <mat-option *ngIf="!isSoftware" value="SERVICE">Service</mat-option>
              <mat-option *ngIf="!isSoftware" value="BOTH">Both</mat-option>
            </mat-select>
            <mat-error *ngIf="!type.valid && type.touched" class="give-me-space">
              {{defaultAlert}}
            </mat-error>
          </mat-form-field>

          <mat-form-field class="form-element" floatLabel="always">
            <mat-label>Message</mat-label>
            <textarea required rows="6" matInput
              placeholder="Fill in the details here. Please try to be as specific as possible" formControlName="message"
              class="resize-none no-box"></textarea>
            <mat-error *ngIf="!message.valid && message.touched" class="give-me-space">
              {{defaultAlert}}
            </mat-error>
          </mat-form-field>

          <div *ngIf="submissionResult" class="message" role="status">{{ submissionResult }}</div>

          <div class="button-row right-float">
            <button mat-flat-button [color]="'primary'" type="submit" class="submit"
              [disabled]="submitDisabled || !formGroup.valid">Submit</button>
            <button mat-flat-button [color]="'secondary'" type="button" (click)="close()">Close</button>
          </div>

        </form>

      </div>

      <div *ngIf="feedback" class="feedback">
        <div class="message">We will get in touch with you soon.</div>
        <div class="button-row right-float">
          <button mat-flat-button [color]="'secondary'" type="submit" (click)="close()">Close</button>
        </div>
      </div>
    </ng-container>
  </ng-container>
</app-base-dialog>
