<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EPOS SHACL Form Playground</title>
    <script src="https://cdn.jsdelivr.net/npm/@ulb-darmstadt/shacl-form/dist/bundle.js" type="module"></script>
    <style>
        :root {
            --bg-1: #052f2e;
            --bg-2: #0f5f55;
            --bg-3: #1f7a69;
            --glass: rgba(255, 255, 255, 0.18);
            --glass-strong: rgba(255, 255, 255, 0.24);
            --text: #eafff5;
            --muted: #d4f6e4;
            --border: rgba(255, 255, 255, 0.26);
            --ok: #9cffb4;
            --bad: #ffd2d2;
            --btn: #f9dc5c;
            --btn-hover: #ffe98b;
            --btn-text: #2b2300;
            --shadow: 0 14px 36px rgba(0, 0, 0, 0.28);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at 18% 12%, #3ea072 0%, transparent 34%),
                radial-gradient(circle at 88% 82%, #2c8f76 0%, transparent 40%),
                linear-gradient(140deg, var(--bg-1), var(--bg-2) 55%, var(--bg-3));
        }

        .orb {
            position: fixed;
            border-radius: 999px;
            filter: blur(5px);
            opacity: 0.42;
            pointer-events: none;
            z-index: 0;
        }

        .orb.one {
            width: 380px;
            height: 380px;
            top: -120px;
            right: -80px;
            background: rgba(255, 231, 128, 0.32);
        }

        .orb.two {
            width: 300px;
            height: 300px;
            bottom: -90px;
            left: -90px;
            background: rgba(153, 255, 202, 0.25);
        }

        .shell {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            padding: 18px;
            display: grid;
            grid-template-rows: auto auto 1fr;
            gap: 12px;
        }

        .glass {
            background: var(--glass);
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px) saturate(150%);
            -webkit-backdrop-filter: blur(16px) saturate(150%);
        }

        .hero {
            padding: 16px 18px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: flex-end;
        }

        .hero h1 {
            margin: 0;
            font-size: clamp(1.1rem, 1.9vw, 1.6rem);
            letter-spacing: 0.02em;
        }

        .hero p {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 0.92rem;
        }

        .toolbar {
            padding: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: end;
        }

        .field {
            display: grid;
            gap: 4px;
            min-width: 145px;
        }

        .field label {
            font-size: 0.82rem;
            color: var(--muted);
        }

        select,
        input,
        button {
            border: 1px solid rgba(0, 0, 0, 0.16);
            border-radius: 10px;
            padding: 8px 11px;
            font-size: 0.9rem;
            font-family: inherit;
        }

        select,
        input {
            background: rgba(255, 255, 255, 0.94);
            color: #173d34;
        }

        button {
            background: var(--btn);
            color: var(--btn-text);
            font-weight: 700;
            cursor: pointer;
            transition: transform 130ms ease, background 130ms ease, box-shadow 130ms ease;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.22);
        }

        button:hover {
            transform: translateY(-1px);
            background: var(--btn-hover);
        }

        .workspace {
            min-height: 0;
            display: grid;
            grid-template-columns: 1.25fr 1fr;
            grid-template-rows: minmax(420px, 1fr);
            gap: 12px;
        }

        .panel {
            min-height: 0;
            display: grid;
            grid-template-rows: auto 1fr;
            overflow: hidden;
        }

        .panel-head {
            border-bottom: 1px solid var(--border);
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            font-weight: 700;
        }

        .panel-sub {
            color: var(--muted);
            font-size: 0.8rem;
            font-weight: 500;
        }

        #form-root {
            overflow: auto;
            padding: 10px;
        }

        .preview-wrap {
            min-height: 0;
            display: grid;
            grid-template-rows: auto 1fr auto;
        }

        .status {
            border-bottom: 1px solid var(--border);
            padding: 8px 12px;
            font-size: 0.86rem;
            color: var(--muted);
        }

        .status.ok { color: var(--ok); }
        .status.bad { color: var(--bad); }

        pre {
            margin: 0;
            padding: 12px;
            overflow: auto;
            white-space: pre;
            font-size: 0.83rem;
            line-height: 1.38;
            font-family: "JetBrains Mono", "Consolas", monospace;
            background: rgba(2, 16, 12, 0.26);
            color: #f7fff9;
        }

        .prefix { color: #7fffd1; }
        .iri { color: #ffe38f; }
        .keyword { color: #ffd34f; font-weight: 700; }
        .literal { color: #b2f8d0; }
        .comment { color: #8adfbf; font-style: italic; }

        @media (max-width: 1120px) {
            .workspace {
                grid-template-columns: 1fr;
                grid-template-rows: minmax(260px, 38vh) minmax(420px, 1fr);
            }
        }
    </style>
</head>
<body>
<div class="orb one"></div>
<div class="orb two"></div>

<main class="shell">
    <section class="hero glass">
        <div>
            <h1>EPOS Metadata Editor Playground</h1>
            <p>Dataset form with live Turtle output and SHACL validation feedback.</p>
        </div>
        <div class="panel-sub">@ulb-darmstadt/shacl-form</div>
    </section>

    <section class="toolbar glass">
        <div class="field" style="min-width: 320px; flex: 1 1 340px;">
            <label for="subject">Root Subject URI</label>
            <input id="subject" type="url" list="subject-presets" value="https://www.epos-eu.org/resource/dataset/main" placeholder="https://www.epos-eu.org/resource/dataset/custom">
            <datalist id="subject-presets">
                <option value="https://www.epos-eu.org/resource/dataset/main"></option>
                <option value="https://www.epos-eu.org/resource/dataset/test"></option>
            </datalist>
        </div>

        <div class="field">
            <label for="collapse">Collapse</label>
            <select id="collapse">
                <option value="none" selected>Off</option>
                <option value="closed">Closed</option>
                <option value="open">Open</option>
            </select>
        </div>

        <div class="field">
            <label for="dense">Density</label>
            <select id="dense">
                <option value="true" selected>Dense</option>
                <option value="false">Comfortable</option>
            </select>
        </div>

        <button id="refresh" type="button">Refresh Preview</button>
    </section>

    <section class="workspace">
        <article class="panel glass">
            <header class="panel-head">
                <span>Generated Form</span>
                <span class="panel-sub">Shape: DatasetShape</span>
            </header>
            <div id="form-root"></div>
        </article>

        <article class="panel glass preview-wrap">
            <header class="panel-head">
                <span>Turtle Preview</span>
                <span class="panel-sub">Live serialization</span>
            </header>
            <pre id="preview"></pre>
            <div id="status" class="status">Waiting for input...</div>
        </article>
    </section>
</main>

<script>
    const escapeHtml = s => s
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")

    const highlightTurtle = ttl => {
        const lines = String(ttl || "").split("\n")
        const highlighted = lines.map(line => {
            const escaped = escapeHtml(line)
            if (/^\s*#/.test(line)) {
                return `<span class="comment">${escaped}</span>`
            }

            return escaped
                .replace(/^(@prefix\s+[^\n]+\.)$/, '<span class="prefix">$1</span>')
                .replace(/(&lt;[^&\n]+&gt;)/g, '<span class="iri">$1</span>')
                .replace(/("(?:[^"\\]|\\.)*"(?:@[a-zA-Z-]+|\^\^[^\s;.,)]+)?)/g, '<span class="literal">$1</span>')
                .replace(/\b(a|rdf:type|sh:node|sh:or|sh:datatype)\b/g, '<span class="keyword">$1</span>')
        })

        return highlighted.join("\n")
    }

    ;(async () => {
        await customElements.whenDefined("shacl-form")

        const root = document.getElementById("form-root")
        const preview = document.getElementById("preview")
        const status = document.getElementById("status")
        const collapse = document.getElementById("collapse")
        const dense = document.getElementById("dense")
        const subject = document.getElementById("subject")
        const refresh = document.getElementById("refresh")

        const form = document.createElement("shacl-form")
        form.setAttribute("data-shapes-url", "./epos-dcat-ap-refined.ttl")
        form.setAttribute("data-shape-subject", "https://www.epos-eu.org/epos-dcat-ap#DatasetShape")
        form.setAttribute("data-show-root-shape-label", "")
        form.setAttribute("data-dense", "true")
        form.setAttribute("data-values-subject", subject.value)
        form.setAttribute("data-values-namespace", "https://www.epos-eu.org/resource/")

        if (typeof form.setClassInstanceProvider === "function") {
            form.setClassInstanceProvider(async classes => {
                const lines = [
                    "@prefix rdfs: <http://www.w3.org/2000/01/rdf-schema#> .",
                    ""
                ]

                for (const classIri of classes) {
                    const localName = classIri.includes('#') ? classIri.split('#').pop() : classIri.split('/').pop()
                    const safeName = encodeURIComponent((localName || "resource").toLowerCase())
                    lines.push(`<http://example.org/shacl-form/${safeName}> a <${classIri}> ;`)
                    lines.push(`  rdfs:label "Sample ${localName || "Resource"}" .`)
                    lines.push("")
                }

                return lines.join("\n")
            })
        }

        const renderPreview = (validState = null) => {
            const ttl = form.serialize("text/turtle")
            preview.textContent = ttl
            if (validState === true) {
                status.className = "status ok"
                status.textContent = "SHACL validation: valid"
            } else if (validState === false) {
                status.className = "status bad"
                status.textContent = "SHACL validation: has issues"
            } else {
                status.className = "status"
                status.textContent = "Preview updated"
            }
        }

        collapse.addEventListener("change", () => {
            if (collapse.value === "none") {
                form.removeAttribute("data-collapse")
            } else if (collapse.value === "closed") {
                form.setAttribute("data-collapse", "")
            } else {
                form.setAttribute("data-collapse", "open")
            }
        })

        dense.addEventListener("change", () => {
            form.setAttribute("data-dense", dense.value)
        })

        const updateSubject = () => {
            if (subject.value) {
                form.setAttribute("data-values-subject", subject.value)
            }
        }

        subject.addEventListener("change", updateSubject)
        subject.addEventListener("blur", updateSubject)

        refresh.addEventListener("click", () => renderPreview())

        form.addEventListener("change", event => {
            renderPreview(event.detail?.valid)
        })

        form.addEventListener("ready", () => {
            renderPreview()
        })

        root.appendChild(form)
    })()
</script>
</body>
</html>
