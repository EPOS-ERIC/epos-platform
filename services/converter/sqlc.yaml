version: "2"
sql:
  - engine: postgresql
    queries: "./db/queries/*.sql"
    schema: "./db/migrations/*.sql"
    gen:
      go:
        package: sqlc
        out: db/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: uuid
            nullable: false
            go_type:
              import: github.com/google/uuid
              type: UUID
