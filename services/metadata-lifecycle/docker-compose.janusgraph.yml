version: '3.8'

services:
  cassandra:
    image: cassandra:4.1
    container_name: epos-cassandra
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: epos-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  janusgraph:
    image: janusgraph/janusgraph:1.1.0
    container_name: epos-janusgraph
    depends_on:
      cassandra:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - JANUS_PROPS_TEMPLATE=cql-es
      - janusgraph.storage.hostname=cassandra
      - janusgraph.index.search.hostname=elasticsearch
      - janusgraph.graphname=epos
      - JANUS_STORAGE_TIMEOUT=60000
      - JAVA_OPTIONS=-Xms256m -Xmx512m
    ports:
      - "8182:8182"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/localhost/8182' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  janusgraph-visualizer:
    image: janusgraph/janusgraph-visualizer:latest
    container_name: epos-janusgraph-visualizer
    depends_on:
      janusgraph:
        condition: service_started
    environment:
      - GREMLIN_HOST=janusgraph
      - GREMLIN_PORT=8182
      - GREMLIN_TRAVERSAL_SOURCE=g
    ports:
      - "3001:3001"

volumes:
  cassandra_data:
  elasticsearch_data:
