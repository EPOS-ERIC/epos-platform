# =============================================================================
# EPOS JanusGraph Configuration - DEVELOPMENT Profile
# =============================================================================
# Local development settings with verbose logging and all debug features
#
# Activate with: EPOS_PROFILE=dev or -Depos.profile=dev
# =============================================================================

janusgraph:
  host: "localhost"
  port: 8182
  traversalSource: "g"
  username: ""
  password: ""
  maxConnectionPoolSize: 20
  connectionTimeoutMs: 5000

# Local index file
indexUrl: "http://localhost:4500/index.txt"

# Local server settings
server:
  host: "127.0.0.1"
  port: 8080

# Verbose logging for development
logging:
  level: "DEBUG"
  format: "text"
  includeTimestamp: true

# All features enabled for testing
features:
  enableSwagger: true
  enableCors: true
  enableMetrics: true

# Development-specific custom properties
custom:
  devMode: true
  mockExternalServices: false
  shacl:
    file: "/Users/valerio/Documents/epos-platform/packages/shacl/shacl.ttl"
