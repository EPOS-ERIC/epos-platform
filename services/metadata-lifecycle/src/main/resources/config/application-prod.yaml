# =============================================================================
# EPOS Neo4j Configuration - PRODUCTION Profile
# =============================================================================
# This file contains production-specific overrides.
# Only include settings that differ from application.yaml
#
# Activate with: EPOS_PROFILE=prod or -Depos.profile=prod
# =============================================================================

# Production Neo4j endpoint
neo4j:
  uri: "bolt://neo4j.epos-eu.org:7687"
  username: ""
  password: ""
  maxConnectionPoolSize: 100
  connectionTimeoutMs: 15000

# Production data source
indexUrl: "https://data.epos-eu.org/index.txt"

# Production server settings
server:
  host: "0.0.0.0"
  port: 8080

# Production logging
logging:
  level: "WARN"
  format: "json"

# Production features
features:
  enableSwagger: true
  enableCors: true
  enableMetrics: true
