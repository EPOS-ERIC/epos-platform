# =============================================================================
# EPOS Neo4j Configuration - TEST Profile
# =============================================================================
# Settings for automated testing with isolated database
#
# Activate with: EPOS_PROFILE=test or -Depos.profile=test
# =============================================================================

neo4j:
  uri: "bolt://localhost:7687"
  username: ""
  password: ""
  maxConnectionPoolSize: 10
  connectionTimeoutMs: 5000

# Test fixtures
indexUrl: "file:///test/fixtures/index.txt"

# Use test-specific base URI to avoid conflicts
baseUri: "https://test.epos-eu.org"

# Minimal logging during tests
logging:
  level: "WARN"
  format: "json"

# Disable external integrations
features:
  enableSwagger: false
  enableCors: false
  enableMetrics: false

custom:
  testMode: true
  cleanupAfterTests: true
