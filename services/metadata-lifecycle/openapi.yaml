      required: [success, message]

x-runtime-shapes:
  - name: "address"
    targetClass: "http://www.w3.org/2006/vcard/ns#Address"
    filters:
      - name: "Country Name"
        path: "http://www.w3.org/2006/vcard/ns#country-name"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
        required: true
      - name: "Locality"
        path: "http://www.w3.org/2006/vcard/ns#locality"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
        required: true
      - name: "Postal Code"
        path: "http://www.w3.org/2006/vcard/ns#postal-code"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
        required: true
      - name: "Street Address"
        path: "http://www.w3.org/2006/vcard/ns#street-address"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
        required: true
  - name: "agent"
    targetClass: "http://xmlns.com/foaf/0.1/Agent"
    filters:
      - name: "Name"
        path: "http://xmlns.com/foaf/0.1/name"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
        required: true
      - name: "Type"
        path: "http://purl.org/dc/terms/type"
        required: true
  - name: "annotation"
    targetClass: "http://www.w3.org/ns/oa#Annotation"
    filters:
      - name: "Has Body"
        path: "http://www.w3.org/ns/oa#hasBody"
        datatype: "http://www.w3.org/2001/XMLSchema#anyURI"
        required: true
      - name: "Has Target"
        path: "http://www.w3.org/ns/oa#hasTarget"
  - name: "apidocumentation"
    targetClass: "http://www.w3.org/ns/hydra/core#ApiDocumentation"
    filters:
      - name: "Description"
        path: "http://www.w3.org/ns/hydra/core#description"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
        required: true
      - name: "Entrypoint"
        path: "http://www.w3.org/ns/hydra/core#entrypoint"
        datatype: "http://www.w3.org/2001/XMLSchema#anyURI"
        required: true
      - name: "Title"
        path: "http://www.w3.org/ns/hydra/core#title"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
        required: true
  - name: "catalog"
    targetClass: "http://www.w3.org/ns/dcat#Catalog"
    filters:
      - name: "Dataset"
        path: "http://www.w3.org/ns/dcat#dataset"
        required: true
      - name: "Description"
        path: "http://purl.org/dc/terms/description"
        datatype: "http://www.w3.org/2001/XMLSchema#string"
        required: true
      - name: "Has Part"
        path: "http://purl.org/dc/terms/hasPart"
      - name: "Homepage"
        path: "http://xmlns.com/foaf/0.1/homepage"
        datatype: "http://www.w3.org/2001/XMLSchema#anyURI"
        required: true
      - name: "Is Part Of"
        path: "http://purl.org/dc/terms/isPartOf"
      - name: "Issued"
        path: "http://purl.org/dc/terms/issued"
        required: true
