    RevisionImportFileRequest:
      type: object
      description: Revision import from a single TTL source (URL or local path)
      properties:
        url:
          type: string
          description: HTTP(S) URL to a TTL file
        path:
          type: string
          description: Local filesystem path to a TTL file
