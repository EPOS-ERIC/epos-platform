openapi: 3.1.0
info:
  title: EPOS API
  version: 2.0.0
  description: |
    OpenAPI specification for the EPOS catalogue API.

    ## Design Principles
    - Search returns heterogeneous, typed resource items in a flat list.
    - Clients navigate by following `href` links; they never construct URLs themselves.
    - All cross-entity references carry an `href` pointing to the typed detail endpoint.

    ## Lifecycle States
    - **DRAFT** - Resource is being edited
    - **SUBMITTED** - Resource submitted for review
    - **PUBLISHED** - Resource is publicly visible
    - **ARCHIVED** - Outdated versions kept for historical purposes

    ## Authentication
    Mutating operations require both headers with absolute URIs:
    - `X-Agent` identifies the acting agent.
    - `X-Group` identifies the acting group.
    Example:
    - `X-Agent: mailto:user@example.org`
    - `X-Group: https://epos-eu.org/group/ingestion-team`
  termsOfService: https://www.epos-eu.org/sites/default/files/2026-02/Terms_and_ConditionsJan26_1.pdf
  contact:
    name: EPOS Development Team
    email: support@epos-eu.org
    url: https://epos-eu.org
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html

servers:
  - url: http://localhost:8080
    description: Development server

tags:
  - name: Access
    description: Unified shape access for list and detail retrieval
  - name: System
    description: System information and health checks
  - name: SPARQL
    description: Direct SPARQL query access
  - name: OAI-PMH
    description: OAI-PMH 2.0 metadata harvesting
  - name: Resources
    description: CRUD operations on metadata resources
  - name: Lifecycle
    description: Lifecycle management (submit, publish)
  - name: Versioning
    description: Resource history and versions
  - name: Batch
    description: Batch submit and publish multiple entities
  - name: Admin
    description: Administrative operations (population, maintenance)

paths:

  # ============================================================
  # SYSTEM ENDPOINTS
  # ============================================================
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Check the service status
      responses:
        '200':
          description: Service operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples:
                      - ok
                  timestamp:
                    type: integer
                    format: int64

  /api/v2/resource-types:
    get:
      tags: [System]
      summary: List resource types
      description: |
        Retrieve available resource types parsed from SHACL shapes (default view),
        or export the original cached SHACL graph in RDF formats.
      parameters:
        - name: view
          in: query
          description: Response view. `parsed` returns JSON resource types; `shacl` returns raw SHACL RDF.
          schema:
            type: string
            enum: [parsed, shacl]
            default: parsed
        - name: format
          in: query
          description: RDF serialization format used when `view=shacl`
          schema:
            type: string
            enum: [turtle, ttl, jsonld, json-ld, rdfxml, rdf+xml, ntriples, n-triples, nt]
        - name: compact
          in: query
          description: When `true` and `view=shacl`, returns compact/beautified output for JSON-LD and Turtle
          schema:
            type: boolean
            default: false
        - name: includeShapeDefinitions
          in: query
          description: Include resolvable shape definitions map keyed by shape IRI (only for `view=parsed`)
          schema:
            type: boolean
            default: false
        - name: includeTransitiveShapeDefinitions
          in: query
          description: Include only shape definitions reachable from resource type properties via sh:node references (only for `view=parsed`)
          schema:
            type: boolean
            default: false
        - name: includeResolvedRefs
          in: query
          description: Add cycle-safe recursive reference metadata per shape definition (only for `view=parsed`)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Parsed resource types or raw SHACL RDF, depending on `view`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ResourceTypeList'
                  - $ref: '#/components/schemas/ResourceTypesEnvelope'
            text/turtle:
              schema:
                type: string
            application/ld+json:
              schema:
                type: string
            application/rdf+xml:
              schema:
                type: string
            application/n-triples:
              schema:
                type: string


  /api/v2/access/search:
    get:
      tags: [Access]
      summary: Search resources
      description: Returns a flat, typed list of catalogue resources matching the supplied criteria.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ResultsPerPage'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/SpatialFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/ServiceProviders'
        - $ref: '#/components/parameters/VersioningStatusFilter'
        - $ref: '#/components/parameters/Keywords'
        - name: includeConstraints
          in: query
          description: When true, include SHACL-driven `fields` in each search item.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Search results returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v2/access/search/{shape}:
    get:
      tags: [Access]
      summary: Search resources by shape
      description: Access search scoped to a single shape (equivalent to applying `type={shape}`).
      parameters:
        - name: shape
          in: path
          required: true
          schema:
            type: string
          description: Runtime SHACL shape/resource type name.
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ResultsPerPage'
        - $ref: '#/components/parameters/SpatialFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/ServiceProviders'
        - $ref: '#/components/parameters/VersioningStatusFilter'
        - $ref: '#/components/parameters/Keywords'
        - name: includeConstraints
          in: query
          description: When true, include SHACL-driven `fields` in each search item.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Search results returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================
  # ACCESS ENDPOINT
  # ============================================================
  /api/v2/access/{shape}/{id}:
    get:
      tags: [Access]
      summary: Access shape resources and details
      description: |
        Unified access endpoint.
        - `id=all` returns all resources for the selected shape.
        - any other id returns the detailed property-value and property-relation structure.
      parameters:
        - name: shape
          in: path
          required: true
          schema:
            type: string
          description: Runtime SHACL shape/resource type name.
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Resource id or `all`.
      responses:
        '200':
          description: Access response returned successfully
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AccessListResponse'
                  - $ref: '#/components/schemas/AccessDetailResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'


  # ============================================================
  # SPARQL ENDPOINT
  # ============================================================
  /api/v2/sparql:
    post:
      tags: [SPARQL]
      summary: Execute SPARQL query
      description: |
        Execute a SPARQL query against the triple store.
        Supports SELECT, ASK, CONSTRUCT, and DESCRIBE queries.
        UPDATE operations are not allowed.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: SPARQL query string
          application/sparql-query:
            schema:
              type: string
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
      responses:
        '200':
          description: Query results
          content:
            application/sparql-results+json:
              schema:
                type: object
            application/sparql-results+xml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            application/n-triples:
              schema:
                type: string
            text/turtle:
              schema:
                type: string
        '400':
          description: Invalid query
        '403':
          description: UPDATE operations not allowed

  # ============================================================
  # OAI-PMH ENDPOINT
  # ============================================================
  /oai-pmh:
    get:
      tags: [OAI-PMH]
      summary: OAI-PMH 2.0 endpoint
      description: |
        OAI-PMH 2.0 compliant endpoint for metadata harvesting.

        Supported verbs: Identify, ListMetadataFormats, ListSets, ListIdentifiers, ListRecords, GetRecord

        Supported metadata formats: oai_dc (Dublin Core), dcat (DCAT-AP), epos_dcat_ap (EPOS-DCAT-AP)
      parameters:
        - name: verb
          in: query
          required: true
          description: OAI-PMH verb
          schema:
            type: string
            enum: [Identify, ListMetadataFormats, ListSets, ListIdentifiers, ListRecords, GetRecord]
        - name: metadataPrefix
          in: query
          description: Metadata format (required for ListIdentifiers, ListRecords, GetRecord)
          schema:
            type: string
            enum: [oai_dc, dcat, epos_dcat_ap]
        - name: identifier
          in: query
          description: Record identifier (required for GetRecord)
          schema:
            type: string
        - name: set
          in: query
          description: Set specification for selective harvesting
          schema:
            type: string
        - name: from
          in: query
          description: Start date for selective harvesting (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: End date for selective harvesting (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: resumptionToken
          in: query
          description: Token for paginated results
          schema:
            type: string
      responses:
        '200':
          description: OAI-PMH XML response
          content:
            text/xml:
              schema:
                type: string
    post:
      tags: [OAI-PMH]
      summary: OAI-PMH 2.0 endpoint (POST)
      description: |
        Same behavior as GET, with arguments in
        application/x-www-form-urlencoded body.
      requestBody:
        required: false
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                verb:
                  type: string
                  enum: [Identify, ListMetadataFormats, ListSets, ListIdentifiers, ListRecords, GetRecord]
                metadataPrefix:
                  type: string
                  enum: [oai_dc, dcat, epos_dcat_ap]
                identifier:
                  type: string
                set:
                  type: string
                from:
                  type: string
                  format: date-time
                until:
                  type: string
                  format: date-time
                resumptionToken:
                  type: string
      responses:
        '200':
          description: OAI-PMH XML response (including protocol errors)
          content:
            text/xml:
              schema:
                type: string

  # ============================================================
  # RESOURCE CRUD ENDPOINTS
  # ============================================================
  /api/v2/{resourceType}:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
        example: dataset
    get:
      tags: [Resources]
      summary: List entities
      description: Retrieve a paginated list of entities of a specific type. For status=draft, X-Agent can scope results to drafts created by that agent.
      parameters:
        - name: X-Agent
          in: header
          required: false
          schema:
            type: string
          description: Optional agent URI used to filter draft results for this actor.
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, published, archived, discarded]
            default: published
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of entities
    post:
      tags: [Resources]
      summary: Create new entity (DRAFT)
      description: Create a new entity in DRAFT state
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
          example: mailto:user@example.org
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
          example: https://epos-eu.org/group/ingestion-team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Optional client-provided conceptual id (absolute URI or local id segment). If omitted, server generates one.
                type:
                  type: string
                  description: Optional; ignored because resource type comes from path parameter.
                properties:
                  type: object
      responses:
        '201':
          description: Entity created

  /api/v2/{resourceType}/{id}:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Resource identifier (conceptual id, version id, or identifier)
    get:
      tags: [Resources]
      summary: Get entity
      description: Retrieve entity details. Supports multiple formats via Accept header or format parameter.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, published, archived, discarded]
            default: published
        - name: format
          in: query
          schema:
            type: string
            enum: [json, turtle, ttl, jsonld, rdfxml, ntriples]
      responses:
        '200':
          description: Entity details
        '404':
          description: Entity not found
    put:
      tags: [Resources]
      summary: Update entity (DRAFT only)
      description: Full replace semantics. Properties not included in the request are removed from the draft entity. Request fails with 409 if the resolved resource is not in DRAFT status.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                properties:
                  type: object
      responses:
        '200':
          description: Entity updated
        '404':
          description: Entity not found
        '409':
          description: Resolved resource is not in DRAFT status
    patch:
      tags: [Resources]
      summary: Patch entity (DRAFT only)
      description: Merge semantics. Only the provided properties are replaced; all other properties are preserved. Request fails with 409 if the resolved resource is not in DRAFT status.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                properties:
                  type: object
      responses:
        '200':
          description: Entity patched
        '404':
          description: Entity not found
        '409':
          description: Resolved resource is not in DRAFT status
    delete:
      tags: [Resources]
      summary: Delete entity (DRAFT only)
      description: Deletes a DRAFT version. Request fails with 409 if the resolved resource is not in DRAFT status.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity deleted
        '404':
          description: Entity not found
        '409':
          description: Resolved resource is not in DRAFT status

  # ============================================================
  # LIFECYCLE ENDPOINTS
  # ============================================================
  /api/v2/{resourceType}/{id}/submit:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Lifecycle]
      summary: Submit for review
      description: Move an entity from DRAFT to SUBMITTED. Path id may be a conceptual id, version id, or identifier, but it must resolve to a DRAFT version.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity submitted
        '404':
          description: Entity not found
        '409':
          description: Resource resolves to non-DRAFT status

  /api/v2/{resourceType}/{id}/publish:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Lifecycle]
      summary: Publish entity
      description: Publish an entity from SUBMITTED to PUBLISHED. Path id may be a conceptual id, version id, or identifier, but it must resolve to a SUBMITTED version.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity published
        '404':
          description: Entity not found
        '409':
          description: Resource resolves to non-SUBMITTED status

  /api/v2/{resourceType}/{id}/draft:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Lifecycle]
      summary: Create new draft from published
      description: Creates a new draft version from a published entity. Path id may be conceptual id, version id, or identifier and is resolved to conceptual resource. The new version number is auto-incremented from the current published version.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Draft created
        '404':
          description: Resource not found

  /api/v2/{resourceType}/{id}/discard:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Lifecycle]
      summary: Discard draft/submitted entity
      description: Move an entity from DRAFT or SUBMITTED to DISCARDED. Path id may be a conceptual id, version id, or identifier.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity discarded
        '404':
          description: Entity not found
        '409':
          description: Resource resolves to non-discardable status

  # ============================================================
  # VERSIONING ENDPOINTS
  # ============================================================
  /api/v2/{resourceType}/{id}/history:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Versioning]
      summary: Version history
      description: Retrieve all versions of a conceptual entity, including status, agent, and group provenance
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionHistoryResponse'

  # ============================================================
  # BATCH ENDPOINTS
  # ============================================================
  /api/v2/batch/submit:
    post:
      tags: [Batch]
      summary: Batch submit entities
      description: Submit multiple entities in a single request
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityUris:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Batch operation completed

  /api/v2/batch/publish:
    post:
      tags: [Batch]
      summary: Batch publish entities
      description: Publish multiple entities in a single request
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityUris:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Batch operation completed

  # ============================================================
  # ADMIN ENDPOINTS
  # ============================================================
  /api/v2/{resourceType}/{id}/repair:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Admin]
      summary: Repair entity metadata
      description: Repair missing conceptual graph entries or provenance records
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity repaired

  /api/v2/admin/populate:
    post:
      tags: [Admin]
      summary: Populate database
      description: |
        Population entrypoint.
        - No body: populates from configured INDEX_URL.
        - Body with `url` or `path`: populates from a single TTL source.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
        - name: X-Source-Authorization
          in: header
          required: false
          schema:
            type: string
          description: Optional auth header forwarded when fetching `url`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                path:
                  type: string
      responses:
        '200':
          description: Population completed
        '500':
          description: Population failed

  /api/v2/admin/populate/status:
    get:
      tags: [Admin]
      summary: Get population configuration
      description: Returns current population configuration
      responses:
        '200':
          description: Population configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  indexUrl:
                    type: string
                  graphdbEndpoint:
                    type: string
                  repositoryId:
                    type: string
                  graphs:
                    type: object

  /api/v2/admin/populate/content:
    post:
      tags: [Admin]
      summary: Populate from TTL content
      description: |
        Populates the database from TTL content uploaded directly in the request body.
        Useful for uploading small TTL snippets or programmatic population.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: TTL content as a string
                  examples:
                    - "@prefix dcat: <http://www.w3.org/ns/dcat#> .\\n<http://example.org/dataset1> a dcat:Dataset ."
                sourceName:
                  type: string
                  description: Optional name for provenance tracking
                  examples:
                    - my-upload
      responses:
        '200':
          description: Population completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      sourceName:
                        type: string
                      subjectsProcessed:
                        type: integer
                      triplesInserted:
                        type: integer
                      agent:
                        type: string
        '400':
