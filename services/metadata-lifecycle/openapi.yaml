openapi: 3.1.0
info:
  title: EPOS API
  version: 2.0.0
  description: |
    OpenAPI specification for the EPOS catalogue API.

    ## Design Principles
    - Search returns heterogeneous, typed resource items in a flat list.
    - Clients navigate by following `href` links; they never construct URLs themselves.
    - All cross-entity references carry an `href` pointing to the typed detail endpoint.

    ## Lifecycle States
    - **DRAFT** - Resource is being edited
    - **SUBMITTED** - Resource submitted for review
    - **PUBLISHED** - Resource is publicly visible
    - **ARCHIVED** - Outdated versions kept for historical purposes

    ## Authentication
    Mutating operations require both headers with absolute URIs:
    - `X-Agent` identifies the acting agent.
    - `X-Group` identifies the acting group.
    Example:
    - `X-Agent: mailto:user@example.org`
    - `X-Group: https://epos-eu.org/group/ingestion-team`
  termsOfService: https://www.epos-eu.org/sites/default/files/2026-02/Terms_and_ConditionsJan26_1.pdf
  contact:
    name: EPOS Development Team
    email: support@epos-eu.org
    url: https://epos-eu.org
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html

servers:
  - url: http://localhost:8080
    description: Development server

tags:
  - name: Search
    description: Search across all resource types
  - name: Access
    description: Unified shape access for list and detail retrieval
  - name: Datasets
    description: Dataset resources
  - name: Distributions
    description: Distribution resources
  - name: Software Applications
    description: Software application resources
  - name: Software Source Codes
    description: Software source code resources
  - name: Categories
    description: Category taxonomy resources
  - name: System
    description: System information and health checks
  - name: SPARQL
    description: Direct SPARQL query access
  - name: OAI-PMH
    description: OAI-PMH 2.0 metadata harvesting
  - name: Resources
    description: CRUD operations on metadata resources
  - name: Lifecycle
    description: Lifecycle management (submit, publish)
  - name: Versioning
    description: Resource history and versions
  - name: Batch
    description: Batch submit and publish multiple entities
  - name: Admin
    description: Administrative operations (population, maintenance)

paths:

  # ============================================================
  # SYSTEM ENDPOINTS
  # ============================================================
  /health:
    get:
      tags: [System]
      summary: Health check
      description: Check the service status
      responses:
        '200':
          description: Service operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples:
                      - ok
                  timestamp:
                    type: integer
                    format: int64

  /api/v2/resource-types:
    get:
      tags: [System]
      summary: List resource types
      description: |
        Retrieve available resource types parsed from SHACL shapes (default view),
        or export the original cached SHACL graph in RDF formats.
      parameters:
        - name: view
          in: query
          description: Response view. `parsed` returns JSON resource types; `shacl` returns raw SHACL RDF.
          schema:
            type: string
            enum: [parsed, shacl]
            default: parsed
        - name: format
          in: query
          description: RDF serialization format used when `view=shacl`
          schema:
            type: string
            enum: [turtle, ttl, jsonld, json-ld, rdfxml, rdf+xml, ntriples, n-triples, nt]
        - name: compact
          in: query
          description: When `true` and `view=shacl`, returns compact/beautified output for JSON-LD and Turtle
          schema:
            type: boolean
            default: false
        - name: includeShapeDefinitions
          in: query
          description: Include resolvable shape definitions map keyed by shape IRI (only for `view=parsed`)
          schema:
            type: boolean
            default: false
        - name: includeTransitiveShapeDefinitions
          in: query
          description: Include only shape definitions reachable from resource type properties via sh:node references (only for `view=parsed`)
          schema:
            type: boolean
            default: false
        - name: includeResolvedRefs
          in: query
          description: Add cycle-safe recursive reference metadata per shape definition (only for `view=parsed`)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Parsed resource types or raw SHACL RDF, depending on `view`
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ResourceTypeList'
                  - $ref: '#/components/schemas/ResourceTypesEnvelope'
            text/turtle:
              schema:
                type: string
            application/ld+json:
              schema:
                type: string
            application/rdf+xml:
              schema:
                type: string
            application/n-triples:
              schema:
                type: string

  # ============================================================
  # SEARCH ENDPOINT
  # ============================================================
  /api/v2/search:
    get:
      tags: [Search]
      summary: Search metadata resources
      operationId: searchMetadata
      description: |
        Returns a flat, typed list of catalogue resources matching the supplied criteria.
        Results may include datasets, distributions, software applications, software source
        codes, and categories. Each item carries an `href` pointing to its typed detail
        endpoint; clients should follow that link rather than construct URLs themselves.

        **Spatial Filtering:**
        - `spatialFilter`: WKT polygon string (EPSG:4326)

        **Temporal Filtering:**
        - `dateFrom`, `dateTo`: ISO 8601 date-time range

        **Multi-value Parameters:**
        Parameters like `type`, `keywords`, `serviceProvider`, and `versioningStatus` accept
        multiple values by repeating the parameter: `?type=dataset&type=distribution`

        **SHACL-driven property filters:**
        Any non-reserved query parameter is interpreted as a property filter when it matches
        a NodeShape property local name or full IRI for the selected type(s).
        You can also use `filter.<propertyName>=value`.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ResultsPerPage'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/SpatialFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/ServiceProviders'
        - $ref: '#/components/parameters/VersioningStatusFilter'
        - $ref: '#/components/parameters/Keywords'
      responses:
        '200':
          description: Search results returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                mixedResults:
                  summary: Mixed resource search results
                  value:
                    total: 42
                    items:
                      - type: dataset
                        id: "123"
                        name: "IRPINIA Seismic Stations"
                        href: "https://metadata.epos-eu.org/api/v2/dataset/123"
                        serviceProviders: ["UNINA"]
                        categories:
                          - "Seismology"
                          - "Strong Motion"
                      - type: category
                        id: "cat-seismology"
                        name: "Seismology"
                        href: "https://metadata.epos-eu.org/api/v2/category/cat-seismology"
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v2/access/search:
    get:
      tags: [Access]
      summary: Search resources (access style)
      description: Same behavior as `/api/v2/search`, grouped under the Access namespace.
      parameters:
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ResultsPerPage'
        - $ref: '#/components/parameters/TypeFilter'
        - $ref: '#/components/parameters/SpatialFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/ServiceProviders'
        - $ref: '#/components/parameters/VersioningStatusFilter'
        - $ref: '#/components/parameters/Keywords'
      responses:
        '200':
          description: Search results returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v2/access/search/{shape}:
    get:
      tags: [Access]
      summary: Search resources by shape
      description: Access search scoped to a single shape (equivalent to applying `type={shape}`).
      parameters:
        - name: shape
          in: path
          required: true
          schema:
            type: string
          description: Runtime SHACL shape/resource type name.
        - $ref: '#/components/parameters/Q'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ResultsPerPage'
        - $ref: '#/components/parameters/SpatialFilter'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/ServiceProviders'
        - $ref: '#/components/parameters/VersioningStatusFilter'
        - $ref: '#/components/parameters/Keywords'
      responses:
        '200':
          description: Search results returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================
  # ACCESS ENDPOINT
  # ============================================================
  /api/v2/access/{shape}/{id}:
    get:
      tags: [Access]
      summary: Access shape resources and details
      description: |
        Unified access endpoint.
        - `id=all` returns all resources for the selected shape.
        - any other id returns the detailed property-value and property-relation structure.
      parameters:
        - name: shape
          in: path
          required: true
          schema:
            type: string
          description: Runtime SHACL shape/resource type name.
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Resource id or `all`.
      responses:
        '200':
          description: Access response returned successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'


  # ============================================================
  # SPARQL ENDPOINT
  # ============================================================
  /api/v2/sparql:
    post:
      tags: [SPARQL]
      summary: Execute SPARQL query
      description: |
        Execute a SPARQL query against the triple store.
        Supports SELECT, ASK, CONSTRUCT, and DESCRIBE queries.
        UPDATE operations are not allowed.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  description: SPARQL query string
          application/sparql-query:
            schema:
              type: string
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
      responses:
        '200':
          description: Query results
          content:
            application/sparql-results+json:
              schema:
                type: object
            application/sparql-results+xml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            application/n-triples:
              schema:
                type: string
            text/turtle:
              schema:
                type: string
        '400':
          description: Invalid query
        '403':
          description: UPDATE operations not allowed

  # ============================================================
  # OAI-PMH ENDPOINT
  # ============================================================
  /oai-pmh:
    get:
      tags: [OAI-PMH]
      summary: OAI-PMH 2.0 endpoint
      description: |
        OAI-PMH 2.0 compliant endpoint for metadata harvesting.

        Supported verbs: Identify, ListMetadataFormats, ListSets, ListIdentifiers, ListRecords, GetRecord

        Supported metadata formats: oai_dc (Dublin Core), dcat (DCAT-AP), epos_dcat_ap (EPOS-DCAT-AP)
      parameters:
        - name: verb
          in: query
          required: true
          description: OAI-PMH verb
          schema:
            type: string
            enum: [Identify, ListMetadataFormats, ListSets, ListIdentifiers, ListRecords, GetRecord]
        - name: metadataPrefix
          in: query
          description: Metadata format (required for ListIdentifiers, ListRecords, GetRecord)
          schema:
            type: string
            enum: [oai_dc, dcat, epos_dcat_ap]
        - name: identifier
          in: query
          description: Record identifier (required for GetRecord)
          schema:
            type: string
        - name: set
          in: query
          description: Set specification for selective harvesting
          schema:
            type: string
        - name: from
          in: query
          description: Start date for selective harvesting (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: End date for selective harvesting (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: resumptionToken
          in: query
          description: Token for paginated results
          schema:
            type: string
      responses:
        '200':
          description: OAI-PMH XML response
          content:
            text/xml:
              schema:
                type: string

  # ============================================================
  # RESOURCE CRUD ENDPOINTS
  # ============================================================
  /api/v2/{resourceType}:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
        example: dataset
    get:
      tags: [Resources]
      summary: List entities
      description: Retrieve a paginated list of entities of a specific type
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, published, archived]
            default: published
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: List of entities
    post:
      tags: [Resources]
      summary: Create new entity (DRAFT)
      description: Create a new entity in DRAFT state
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
          example: mailto:user@example.org
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
          example: https://epos-eu.org/group/ingestion-team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                properties:
                  type: object
      responses:
        '201':
          description: Entity created

  /api/v2/{resourceType}/{id}:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
        description: Full entity URI
    get:
      tags: [Resources]
      summary: Get entity
      description: Retrieve entity details. Supports multiple formats via Accept header or format parameter.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, submitted, published, archived]
            default: published
        - name: format
          in: query
          schema:
            type: string
            enum: [json, turtle, ttl, jsonld, rdfxml, ntriples]
      responses:
        '200':
          description: Entity details
        '404':
          description: Entity not found
    put:
      tags: [Resources]
      summary: Update entity (DRAFT only)
      description: Full replace semantics. Properties not included in the request are removed from the draft entity.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                properties:
                  type: object
      responses:
        '200':
          description: Entity updated
    patch:
      tags: [Resources]
      summary: Patch entity (DRAFT only)
      description: Merge semantics. Only the provided properties are replaced; all other properties are preserved.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                properties:
                  type: object
      responses:
        '200':
          description: Entity patched
    delete:
      tags: [Resources]
      summary: Delete entity (DRAFT only)
      responses:
        '200':
          description: Entity deleted

  # ============================================================
  # LIFECYCLE ENDPOINTS
  # ============================================================
  /api/v2/{resourceType}/{id}/submit:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Lifecycle]
      summary: Submit for review
      description: Move an entity from DRAFT to SUBMITTED
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity submitted

  /api/v2/{resourceType}/{id}/publish:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Lifecycle]
      summary: Publish entity
      description: Publish an entity from SUBMITTED to PUBLISHED
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity published

  /api/v2/{resourceType}/{id}/draft:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Lifecycle]
      summary: Create new draft from published
      description: Creates a new draft version from a published entity
      parameters:
        - name: version
          in: query
          schema:
            type: string
            default: "2.0"
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Draft created

  # ============================================================
  # VERSIONING ENDPOINTS
  # ============================================================
  /api/v2/{resourceType}/{id}/history:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Versioning]
      summary: Version history
      description: Retrieve all versions of a conceptual entity, including status, agent, and group provenance
      responses:
        '200':
          description: Version history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionHistoryResponse'

  # ============================================================
  # BATCH ENDPOINTS
  # ============================================================
  /api/v2/batch/submit:
    post:
      tags: [Batch]
      summary: Batch submit entities
      description: Submit multiple entities in a single request
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityUris:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Batch operation completed

  /api/v2/batch/publish:
    post:
      tags: [Batch]
      summary: Batch publish entities
      description: Publish multiple entities in a single request
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entityUris:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Batch operation completed

  # ============================================================
  # ADMIN ENDPOINTS
  # ============================================================
  /api/v2/{resourceType}/{id}/repair:
    parameters:
      - name: resourceType
        in: path
        required: true
        schema:
          type: string
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Admin]
      summary: Repair entity metadata
      description: Repair missing conceptual graph entries or provenance records
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Entity repaired

  /api/v2/admin/populate:
    post:
      tags: [Admin]
      summary: Populate database from TTL files
      description: Triggers initial population from the configured INDEX_URL
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Population completed
        '500':
          description: Population failed

  /api/v2/admin/populate/from-url:
    post:
      tags: [Admin]
      summary: Populate from custom URL
      description: Triggers population from a custom index URL
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [indexUrl]
              properties:
                indexUrl:
                  type: string
                  examples:
                    - http://example.com/index.txt
      responses:
        '200':
          description: Population completed
        '400':
          description: Missing indexUrl
        '500':
          description: Population failed

  /api/v2/admin/populate/status:
    get:
      tags: [Admin]
      summary: Get population configuration
      description: Returns current population configuration
      responses:
        '200':
          description: Population configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  indexUrl:
                    type: string
                  graphdbEndpoint:
                    type: string
                  repositoryId:
                    type: string
                  graphs:
                    type: object

  /api/v2/admin/populate/file:
    post:
      tags: [Admin]
      summary: Populate from URL or local TTL file
      description: |
        Populates the database from a single TTL source.
        You can provide either:
        - `url`: an HTTP(S) URL to a TTL file
        - `path`: a local filesystem path to a TTL file available on the server
        Useful for loading individual TTL files from GitHub, HTTP endpoints, or mounted local volumes.

        **Private Repository Support:**
        Use the `X-Source-Authorization` header to access private GitHub repositories.
        The header value is forwarded as the `Authorization` header when fetching the file.

        Example URLs:
        - GitHub raw (public): https://raw.githubusercontent.com/org/repo/main/data.ttl
        - GitHub raw (private): Use X-Source-Authorization header with "token ghp_xxx"
        - Direct URLs: https://example.com/metadata.ttl
      parameters:
        - name: X-Agent
          in: header
          description: Agent URI for provenance tracking
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          description: Group URI for provenance tracking
          required: true
          schema:
            type: string
        - name: X-Source-Authorization
          in: header
          description: |
            Authorization header to forward when fetching the URL.
            For GitHub private repos, use "token ghp_YOUR_PERSONAL_ACCESS_TOKEN"
          schema:
            type: string
          example: "token ghp_xxxxxxxxxxxx"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: URL to a TTL file
                  examples:
                    - https://raw.githubusercontent.com/EPOS-ERIC/metadatone/main/metadatone.ttl
                path:
                  type: string
                  description: Local filesystem path to a TTL file
                  examples:
                    - /data/metadata/metadatone.ttl
      responses:
        '200':
          description: Population completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      sourceUrl:
                        type: string
                      subjectsProcessed:
                        type: integer
                      triplesInserted:
                        type: integer
                      agent:
                        type: string
        '400':
          description: Invalid request (missing/invalid source or both url and path provided)
        '500':
          description: Population failed

  /api/v2/admin/populate/content:
    post:
      tags: [Admin]
      summary: Populate from TTL content
      description: |
        Populates the database from TTL content uploaded directly in the request body.
        Useful for uploading small TTL snippets or programmatic population.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: TTL content as a string
                  examples:
                    - "@prefix dcat: <http://www.w3.org/ns/dcat#> .\\n<http://example.org/dataset1> a dcat:Dataset ."
                sourceName:
                  type: string
                  description: Optional name for provenance tracking
                  examples:
                    - my-upload
      responses:
        '200':
          description: Population completed
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      sourceName:
                        type: string
                      subjectsProcessed:
                        type: integer
                      triplesInserted:
                        type: integer
                      agent:
                        type: string
        '400':
          description: Missing content
        '500':
          description: Population failed

  /api/v2/admin/import/revision/file:
    post:
      tags: [Admin]
      summary: Import metadata revisions from URL or local TTL file
      description: |
        Imports TTL metadata into DRAFT revisions for existing published entities.
        Existing links between imported resources are rewritten to their corresponding draft URIs.
        This endpoint does not write directly to PUBLISHED.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionImportFileRequest'
      responses:
        '200':
          description: Revision import completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionImportApiResponse'
        '400':
          description: Invalid request
        '500':
          description: Revision import failed

  /api/v2/admin/import/revision/content:
    post:
      tags: [Admin]
      summary: Import metadata revisions from TTL content
      description: |
        Imports TTL metadata into DRAFT revisions for existing published entities.
        Existing links between imported resources are rewritten to their corresponding draft URIs.
        This endpoint does not write directly to PUBLISHED.
      parameters:
        - name: X-Agent
          in: header
          required: true
          schema:
            type: string
        - name: X-Group
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionImportContentRequest'
      responses:
        '200':
          description: Revision import completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionImportApiResponse'
        '400':
          description: Invalid request
        '500':
          description: Revision import failed

components:

  # -------------------------------------------------------------------------
  # Parameters
  # -------------------------------------------------------------------------

  parameters:

    ResourceId:
      name: id
      in: path
      required: true
      description: Local identifier of the resource
      schema:
        type: string
        examples:
          - "123"

    Q:
      name: q
      in: query
      required: false
      description: Free-text search query
      schema:
        type: string
        examples:
          - "seismic stations"

    Page:
      name: page
      in: query
      required: false
      description: 1-based page number
      schema:
        type: integer
        minimum: 1
        default: 1
        examples:
          - 1

    ResultsPerPage:
      name: resultsPerPage
      in: query
      required: false
      description: Number of items to return per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        examples:
          - 10

    TypeFilter:
      name: type
      in: query
      required: false
      description: |
        Filter results to one or more resource types. When omitted, all types are returned.
        Repeat the parameter for multiple values: `?type=dataset&type=distribution`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ResourceType'
      style: form
      explode: true

    SpatialFilter:
      name: spatialFilter
      in: query
      required: false
      description: |
        Spatial filter expressed as a WKT polygon string (EPSG:4326).
        Resources whose spatial coverage intersects this polygon are returned.
        Example: `POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))`
      schema:
        type: string
        examples:
          - "POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))"

    DateFrom:
      name: dateFrom
      in: query
      required: false
      description: |
        Start of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Resources with temporal coverage overlapping this range are returned.
      schema:
        type: string
        format: date-time
        examples:
          - "2020-01-01T00:00:00Z"

    DateTo:
      name: dateTo
      in: query
      required: false
      description: |
        End of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Must be greater than or equal to `dateFrom` when both are supplied.
      schema:
        type: string
        format: date-time
        examples:
          - "2023-12-31T23:59:59Z"

    ServiceProviders:
      name: serviceProvider
      in: query
      required: false
      description: |
        Filter by one or more service provider names.
        Repeat the parameter for multiple values: `?serviceProvider=INGV&serviceProvider=UNINA`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true

    VersioningStatusFilter:
      name: versioningStatus
      in: query
      required: false
      description: |
        Filter by one or more versioning statuses.
        When omitted, defaults to `PUBLISHED`.
        Repeat the parameter for multiple values: `?versioningStatus=PUBLISHED&versioningStatus=DRAFT`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/VersioningStatus'
        default:
          - PUBLISHED
      style: form
      explode: true

    Keywords:
      name: keywords
      in: query
      required: false
      description: |
        Filter resources that carry all the supplied keywords.
        Repeat the parameter for multiple values: `?keywords=seismology&keywords=stations`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true

  # -------------------------------------------------------------------------
  # Responses
  # -------------------------------------------------------------------------

  responses:

    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------

  schemas:

    # -----------------------------------------------------------------------
    # Shared enums
    # -----------------------------------------------------------------------

    ResourceType:
      type: string
      enum:
        - address
        - agent
        - annotation
        - apidocumentation
        - catalog
        - catalogrecord
        - concept
        - conceptscheme
        - contactpoint
        - controlaction
        - creativework
        - dataset
        - distribution
        - equipment
        - facility
        - identifier
        - iritemplate
        - iritemplatemapping
        - location
        - operation
        - organization
        - periodoftime
        - person
        - postaladdress
        - project
        - propertyvalue
        - publication
        - quantitativevalue
        - service
        - softwareapplication
        - softwaresourcecode
        - webservice

    VersioningStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - PUBLISHED
        - ARCHIVED

    # -----------------------------------------------------------------------
    # Search
    # -----------------------------------------------------------------------

    SearchResponse:
      type: object
      required:
        - total
        - items
      properties:
        total:
          type: integer
          minimum: 0
          description: Total number of matching resources across all pages
          examples:
            - 123
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchItem'

    SearchItem:
      oneOf:
        - $ref: '#/components/schemas/DatasetSearchItem'
        - $ref: '#/components/schemas/GenericSearchItem'
      discriminator:
        propertyName: type
        mapping:
          dataset: '#/components/schemas/DatasetSearchItem'
          distribution: '#/components/schemas/GenericSearchItem'
          software-application: '#/components/schemas/GenericSearchItem'
          software-source-code: '#/components/schemas/GenericSearchItem'
          category: '#/components/schemas/GenericSearchItem'

    BaseSearchItem:
      type: object
      required:
        - type
        - id
        - name
        - href
      properties:
        type:
          $ref: '#/components/schemas/ResourceType'
        id:
          type: string
          examples:
            - "123"
        name:
          type: string
          examples:
            - "IRPINIA Seismic Stations"
        href:
          type: string
          description: Absolute URL of the typed detail endpoint. Follow this link; do not construct URLs.
          examples:
            - "https://metadata.epos-eu.org/api/v2/dataset/123"

    DatasetSearchItem:
      allOf:
        - $ref: '#/components/schemas/BaseSearchItem'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              const: dataset
            serviceProviders:
              type: array
              description: Display names of organisations providing this dataset
              items:
                type: string
              examples:
                - ["UNINA", "INGV"]
            categories:
              type: array
              description: Category labels assigned to this dataset
              items:
                type: string
              examples:
                - ["Seismology", "Strong Motion"]

    GenericSearchItem:
      allOf:
        - $ref: '#/components/schemas/BaseSearchItem'
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - distribution
                - software-application
                - software-source-code
                - category

    # -----------------------------------------------------------------------
    # Resource references (for hrefs)
    # -----------------------------------------------------------------------

    ResourceRef:
      type: object
      required:
        - id
        - href
      properties:
        id:
          type: string
        title:
          type: string
        href:
          type: string
          description: Absolute URL of the typed detail endpoint

    # -----------------------------------------------------------------------
    # Detail schemas
    # -----------------------------------------------------------------------

    TemporalExtent:
      type: object
      description: Temporal coverage of a resource
      properties:
        start:
          type: string
          format: date-time
          description: Start of the temporal coverage (inclusive), ISO 8601 UTC
          examples:
            - "2010-01-01T00:00:00Z"
        end:
          type: string
          format: date-time
          description: End of the temporal coverage (inclusive), ISO 8601 UTC. Omitted for open-ended coverage.
          examples:
            - "2023-12-31T23:59:59Z"

    Dataset:
      type: object
      required:
        - id
        - title
        - status
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        keywords:
          type: array
          items:
            type: string
          examples:
            - ["seismology", "stations", "Irpinia"]
        categories:
          type: array
          description: Category labels assigned to this dataset
          items:
            type: string
          examples:
            - ["Seismology", "Strong Motion"]
        publisher:
          type: array
          description: Names of the organisations publishing this dataset
          items:
            type: string
          examples:
            - ["UNINA", "INGV"]
        spatial:
          type: string
          description: Spatial coverage expressed as a WKT polygon (EPSG:4326)
          examples:
            - "POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))"
        temporal:
          $ref: '#/components/schemas/TemporalExtent'
        status:
          $ref: '#/components/schemas/VersioningStatus'
        distributions:
          type: array
          description: Distributions that provide access to this dataset
          items:
            $ref: '#/components/schemas/ResourceRef'
        related:
          type: array
          description: Outbound related entities referenced by this dataset
          items:
            $ref: '#/components/schemas/ResourceRef'
        relatedBy:
          type: array
          description: Inbound related entities that reference this dataset
          items:
            $ref: '#/components/schemas/ResourceRef'

    Distribution:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        accessUrl:
          type: string
          format: uri
          description: URL used to access the distribution
          examples:
            - "https://service.example.org/fdsnws/station/1/query"
        operation:
          type: string
          description: Operation ID describing the service operation exposed by this distribution
          examples:
            - "getFDSNStationXML"
        related:
          type: array
          description: Outbound related entities referenced by this distribution
          items:
            $ref: '#/components/schemas/ResourceRef'
        relatedBy:
          type: array
          description: Inbound related entities that reference this distribution
          items:
            $ref: '#/components/schemas/ResourceRef'

    SoftwareApplication:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        keywords:
          type: array
          items:
            type: string
          examples:
            - ["portal", "seismology", "data access"]
        categories:
          type: array
          description: Category labels assigned to this application
          items:
            type: string
          examples:
            - ["Seismology", "Data Services"]
        downloadUrl:
          type: string
          format: uri
          description: URL to download or install the application
          examples:
            - "https://example.org/application/download"
        related:
          type: array
          description: Outbound related entities referenced by this application
          items:
            $ref: '#/components/schemas/ResourceRef'
        relatedBy:
          type: array
          description: Inbound related entities that reference this application
          items:
            $ref: '#/components/schemas/ResourceRef'

    SoftwareSourceCode:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        programmingLanguage:
          type: string
          description: Primary programming language of the source code
          examples:
            - "Java"
        keywords:
          type: array
          items:
            type: string
          examples:
            - ["portal", "seismology", "open source"]
        categories:
          type: array
          description: Category labels assigned to this source code
          items:
            type: string
          examples:
            - ["Seismology", "Data Services"]
        repository:
          type: string
          format: uri
          description: URL of the source code repository
          examples:
            - "https://github.com/example/epos-portal"
        related:
          type: array
          description: Outbound related entities referenced by this source code
          items:
            $ref: '#/components/schemas/ResourceRef'
        relatedBy:
          type: array
          description: Inbound related entities that reference this source code
          items:
            $ref: '#/components/schemas/ResourceRef'

    # -----------------------------------------------------------------------
    # Category schemas
    # -----------------------------------------------------------------------

    Category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          examples:
            - "cat-seismology"
        name:
          type: string
          examples:
            - "Seismology"
        description:
          type: string
          examples:
            - "Resources related to seismic monitoring and analysis."
        children:
          type: array
          description: Nested child categories
          items:
            $ref: '#/components/schemas/Category'

    CategoryScheme:
      type: object
      required:
        - id
        - label
        - type
      properties:
        id:
          type: string
          examples:
            - "scheme-solid-earth"
        label:
          type: string
          examples:
            - "Solid Earth"
        title:
          type: string
          examples:
            - "Solid Earth Science Categories"
        description:
          type: string
          examples:
            - "Top-level grouping for all solid earth science resources."
        logo:
          type: string
          format: uri
          examples:
            - "https://www.epos-eu.org/logos/solid-earth.png"
        homepage:
          type: string
          format: uri
          examples:
            - "https://www.epos-eu.org/solid-earth"
        color:
          type: string
          description: Hex colour code used for UI rendering
          examples:
            - "#3A7BD5"
        orderNumber:
          type: integer
          description: Display order among sibling category schemes
          examples:
            - 1
        type:
          type: string
          enum:
            - DATA
            - FACILITY
            - SOFTWARE
          examples:
            - "DATA"
        children:
          type: array
          description: Top-level categories within this scheme
          items:
            $ref: '#/components/schemas/Category'

    CategoryTreeResponse:
      type: object
      required:
        - schemes
      properties:
        schemes:
          type: array
          description: Ordered list of category schemes, each carrying its full category subtree
          items:
            $ref: '#/components/schemas/CategoryScheme'

    # -----------------------------------------------------------------------
    # Error response
    # -----------------------------------------------------------------------

    ErrorResponse:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          type: string
          examples:
            - "RESOURCE_NOT_FOUND"
        errorMessage:
          type: string
          examples:
            - "The requested resource was not found"

    # -----------------------------------------------------------------------
    # Legacy schemas (for backward compatibility with admin/resource endpoints)
    # -----------------------------------------------------------------------

    PropertyInfo:
      type: object
      properties:
        path:
          type: string
          format: uri
        name:
          type: string
        datatype:
          type: [string, 'null']
          format: uri
        datatypes:
          type: [array, 'null']
          items:
            type: string
            format: uri
        nodeKind:
          type: [string, 'null']
        nodeKinds:
          type: [array, 'null']
          items:
            type: string
        classConstraint:
          type: [string, 'null']
          format: uri
        classConstraints:
          type: [array, 'null']
          items:
            type: string
            format: uri
        nodeShapeRef:
          type: [string, 'null']
        nodeShapeRefs:
          type: [array, 'null']
          items:
            type: string
        minCount:
          type: [integer, 'null']
          format: int32
        maxCount:
          type: [integer, 'null']
          format: int32
        required:
          type: boolean
        recommended:
          type: boolean
        pattern:
          type: [string, 'null']
        minLength:
          type: [integer, 'null']
          format: int32
        maxLength:
          type: [integer, 'null']
          format: int32
        hasValueIn:
          type: [array, 'null']
          items:
            type: string
        severity:
          type: [string, 'null']
        severities:
          type: [array, 'null']
          items:
            type: string
        helpText:
          type: [string, 'null']
        description:
          type: [string, 'null']
      required: [path, name, required, recommended]

    ResourceTypeInfo:
      type: object
      properties:
        name:
          type: string
        targetClass:
          type: string
          format: uri
        properties:
          type: array
          items:
            $ref: '#/components/schemas/PropertyInfo'
        closed:
          type: boolean
        description:
          type: [string, 'null']
      required: [name, targetClass, properties, closed]

    ResourceTypeList:
      type: array
      description: Returned when shape definitions are not requested
      items:
        $ref: '#/components/schemas/ResourceTypeInfo'

    ShapeDefinitionInfo:
      type: object
      properties:
        id:
          type: string
        targetClasses:
          type: array
          items:
            type: string
            format: uri
        properties:
          type: array
          items:
            $ref: '#/components/schemas/PropertyInfo'
        resolvedRefs:
          type: [array, 'null']
          items:
            type: string
        name:
          type: [string, 'null']
        datatype:
          type: [string, 'null']
          format: uri
        datatypes:
          type: [array, 'null']
          items:
            type: string
            format: uri
        nodeKind:
          type: [string, 'null']
        nodeKinds:
          type: [array, 'null']
          items:
            type: string
        classConstraint:
          type: [string, 'null']
          format: uri
        classConstraints:
          type: [array, 'null']
          items:
            type: string
            format: uri
        nodeShapeRef:
          type: [string, 'null']
        nodeShapeRefs:
          type: [array, 'null']
          items:
            type: string
        ontologyEquivalentClasses:
          type: [array, 'null']
          items:
            type: string
            format: uri
        ontologySubClassesOf:
          type: [array, 'null']
          items:
            type: string
            format: uri
        closed:
          type: boolean
        description:
          type: [string, 'null']
      required: [id, targetClasses, properties, closed]

    ResourceTypesEnvelope:
      type: object
      description: Returned when includeShapeDefinitions or includeTransitiveShapeDefinitions is true
      properties:
        resourceTypes:
          type: array
          items:
            $ref: '#/components/schemas/ResourceTypeInfo'
        shapeDefinitions:
          type: object
          description: Map keyed by shape IRI
          additionalProperties:
            $ref: '#/components/schemas/ShapeDefinitionInfo'
      required: [resourceTypes]

    VersionInfo:
      type: object
      properties:
        uri:
          type: string
          format: uri
        version:
          type: string
        timestamp:
          type: string
        agent:
          type: [string, 'null']
        group:
          type: [string, 'null']
        status:
          type: string
          enum: [draft, submitted, published, archived, unknown]
      required: [uri, version, timestamp, status]

    VersionHistoryResponse:
      type: object
      properties:
        conceptualUri:
          type: string
          format: uri
        versions:
          type: array
          items:
            $ref: '#/components/schemas/VersionInfo'
      required: [conceptualUri, versions]

    RevisionImportFileRequest:
      type: object
      description: Revision import from a single TTL source (URL or local path)
      properties:
        url:
          type: string
          description: HTTP(S) URL to a TTL file
        path:
          type: string
          description: Local filesystem path to a TTL file
        versionMode:
          type: string
          enum: [auto, explicit]
          default: auto
        version:
          type: string
          description: Target version number, required when versionMode=explicit
          examples:
            - "2.0"
        replaceDraftIfExists:
          type: boolean
          default: true
        dryRun:
          type: boolean
          default: false

    RevisionImportContentRequest:
      type: object
      required: [content]
      description: Revision import from raw TTL content
      properties:
        content:
          type: string
        sourceName:
          type: string
          examples:
            - imported-batch-2026-04-24
        versionMode:
          type: string
          enum: [auto, explicit]
          default: auto
        version:
          type: string
          description: Target version number, required when versionMode=explicit
          examples:
            - "2.0"
        replaceDraftIfExists:
          type: boolean
          default: true
        dryRun:
          type: boolean
          default: false

    RevisionImportEntityResult:
      type: object
      properties:
        importedUri:
          type: string
        conceptualUri:
          type: string
        draftUri:
          type: string
        status:
          type: string
        message:
          type: [string, 'null']
      required: [importedUri, conceptualUri, draftUri, status]

    RevisionImportResponseData:
      type: object
      properties:
        source:
          type: string
        dryRun:
          type: boolean
        subjectsProcessed:
          type: integer
        triplesPrepared:
          type: integer
        triplesInserted:
          type: integer
        draftsCreated:
          type: integer
        draftsReused:
          type: integer
        linksRewritten:
          type: integer
        entities:
          type: array
          items:
            $ref: '#/components/schemas/RevisionImportEntityResult'
        agent:
          type: string
        group:
          type: string
      required: [source, dryRun, subjectsProcessed, triplesPrepared, triplesInserted, draftsCreated, draftsReused, linksRewritten, entities, agent, group]

    RevisionImportApiResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/RevisionImportResponseData'
      required: [success, message]

x-runtime-shapes:
  - name: "address"
    targetClass: "http://www.w3.org/2006/vcard/ns#Address"
