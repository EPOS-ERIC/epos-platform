components:

  # -------------------------------------------------------------------------
  # Parameters
  # -------------------------------------------------------------------------

  parameters:

    ResourceId:
      name: id
      in: path
      required: true
      description: Local identifier of the resource
      schema:
        type: string
        examples:
          - "123"

    Q:
      name: q
      in: query
      required: false
      description: Free-text search query
      schema:
        type: string
        examples:
          - "seismic stations"

    Page:
      name: page
      in: query
      required: false
      description: 1-based page number
      schema:
        type: integer
        minimum: 1
        default: 1
        examples:
          - 1

    ResultsPerPage:
      name: resultsPerPage
      in: query
      required: false
      description: Number of items to return per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        examples:
          - 10

    TypeFilter:
      name: type
      in: query
      required: false
      description: |
        Filter results to one or more resource types. When omitted, all types are returned.
        Repeat the parameter for multiple values: `?type=dataset&type=distribution`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/ResourceType'
      style: form
      explode: true

    SpatialFilter:
      name: spatialFilter
      in: query
      required: false
      description: |
        Spatial filter expressed as a WKT polygon string (EPSG:4326).
        Resources whose spatial coverage intersects this polygon are returned.
        Example: `POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))`
      schema:
        type: string
        examples:
          - "POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))"

    DateFrom:
      name: dateFrom
      in: query
      required: false
      description: |
        Start of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Resources with temporal coverage overlapping this range are returned.
      schema:
        type: string
        format: date-time
        examples:
          - "2020-01-01T00:00:00Z"

    DateTo:
      name: dateTo
      in: query
      required: false
      description: |
        End of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Must be greater than or equal to `dateFrom` when both are supplied.
      schema:
        type: string
        format: date-time
        examples:
          - "2023-12-31T23:59:59Z"

    ServiceProviders:
      name: serviceProvider
      in: query
      required: false
      description: |
        Filter by one or more service provider names.
        Repeat the parameter for multiple values: `?serviceProvider=INGV&serviceProvider=UNINA`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true

    VersioningStatusFilter:
      name: versioningStatus
      in: query
      required: false
      description: |
        Filter by one or more versioning statuses.
        When omitted, defaults to `PUBLISHED`.
        Repeat the parameter for multiple values: `?versioningStatus=PUBLISHED&versioningStatus=DRAFT`.
      schema:
        type: array
        items:
          $ref: '#/components/schemas/VersioningStatus'
        default:
          - PUBLISHED
      style: form
      explode: true

    Keywords:
      name: keywords
      in: query
      required: false
      description: |
        Filter resources that carry all the supplied keywords.
        Repeat the parameter for multiple values: `?keywords=seismology&keywords=stations`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true

  # -------------------------------------------------------------------------
  # Responses
  # -------------------------------------------------------------------------

  responses:

    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  # -------------------------------------------------------------------------
  # Schemas
  # -------------------------------------------------------------------------

  schemas:

    # -----------------------------------------------------------------------
    # Shared enums
    # -----------------------------------------------------------------------

    ResourceType:
      type: string
      enum:
        - address
        - agent
        - annotation
        - apidocumentation
        - catalog
        - catalogrecord
        - concept
        - conceptscheme
        - contactpoint
        - contactpointtype
        - controlaction
        - creativework
        - dataset
        - dateordatetimedatatype
        - distribution
        - equipment
        - facility
        - identifier
        - iritemplate
        - iritemplatemapping
        - location
        - operation
        - organization
        - periodoftime
        - person
        - postaladdress
        - project
        - propertyvalue
        - publication
        - quantitativevalue
        - service
        - softwareapplication
        - softwaresourcecode
        - webservice

    VersioningStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - PUBLISHED
        - ARCHIVED

    # -----------------------------------------------------------------------
    # Search
    # -----------------------------------------------------------------------

    SearchResponse:
      type: object
      required:
        - total
        - totalItems
        - page
        - totalPages
        - items
      properties:
        total:
          type: integer
          minimum: 0
          description: Backward-compatible alias of totalItems
          examples:
            - 123
        totalItems:
          type: integer
          minimum: 0
          description: Total number of matching resources across all pages
          examples:
            - 123
        page:
          type: integer
          minimum: 1
          examples:
            - 1
        totalPages:
          type: integer
          minimum: 0
          examples:
            - 13
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchItem'

    SearchItem:
      type: object
      required:
        - type
        - id
        - href
      properties:
        type:
          $ref: '#/components/schemas/ResourceType'
        id:
          type: string
          examples:
            - "123"
        href:
          type: string
          description: Absolute URL of the typed detail endpoint. Follow this link; do not construct URLs.
          examples:
            - "https://metadata.epos-eu.org/api/v2/dataset/123"
        fields:
          type: object
          description: SHACL-selected property values returned only when includeConstraints=true. Relation properties are returned as object(s) with `id`, `type`, and `href`; literal properties remain scalar/array values.
          additionalProperties: true

    AccessListItem:
      type: object
      required: [id, type, href]
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        href:
          type: string

    AccessListResponse:
      type: object
      required: [shape, total, items]
      properties:
        shape:
          type: string
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccessListItem'

    AccessPropertyValue:
      type: object
      properties:
        value:
          type: string
        id:
          type: string
        type:
          type: string
        title:
          type: string
        href:
          type: string
        predicateIri:
          type: string

    AccessDetailResponse:
      type: object
      required: [id, shape, href, properties]
      properties:
        id:
          type: string
        shape:
          type: string
        href:
          type: string
        properties:
          type: object
          additionalProperties: true

    # -----------------------------------------------------------------------
    # Resource references (for hrefs)
    # -----------------------------------------------------------------------

    ResourceRef:
      type: object
      required:
        - id
        - href
      properties:
        id:
          type: string
        title:
          type: string
        href:
          type: string
          description: Absolute URL of the typed detail endpoint

    # -----------------------------------------------------------------------
    # Error response
    # -----------------------------------------------------------------------

    ErrorResponse:
      type: object
      required:
        - errorCode
        - errorMessage
      properties:
        errorCode:
          type: string
          examples:
            - "RESOURCE_NOT_FOUND"
        errorMessage:
          type: string
          examples:
            - "The requested resource was not found"

    EntityResponse:
      type: object
      required:
        - uri
        - type
        - status
        - properties
      properties:
        uri:
          type: string
        type:
          type: string
        status:
          type: string
        properties:
          type: object
          additionalProperties: true
        version:
          type: [string, 'null']
        conceptualUri:
          type: [string, 'null']

    ResolvedEntityResponse:
      type: object
      required:
        - resolvedId
        - entity
      properties:
        resolvedId:
          type: string
        entity:
          $ref: '#/components/schemas/EntityResponse'

    # -----------------------------------------------------------------------
    # Legacy schemas (for backward compatibility with admin/resource endpoints)
    # -----------------------------------------------------------------------

    PropertyInfo:
      type: object
      properties:
        path:
          type: string
          format: uri
        name:
          type: string
        datatype:
          type: [string, 'null']
          format: uri
        datatypes:
          type: [array, 'null']
          items:
            type: string
            format: uri
        nodeKind:
          type: [string, 'null']
        nodeKinds:
          type: [array, 'null']
          items:
            type: string
        classConstraint:
          type: [string, 'null']
          format: uri
        classConstraints:
          type: [array, 'null']
          items:
            type: string
            format: uri
        nodeShapeRef:
          type: [string, 'null']
        nodeShapeRefs:
          type: [array, 'null']
          items:
            type: string
        minCount:
          type: [integer, 'null']
          format: int32
        maxCount:
          type: [integer, 'null']
          format: int32
        required:
          type: boolean
        recommended:
          type: boolean
        pattern:
          type: [string, 'null']
        minLength:
          type: [integer, 'null']
          format: int32
        maxLength:
          type: [integer, 'null']
          format: int32
        hasValueIn:
          type: [array, 'null']
