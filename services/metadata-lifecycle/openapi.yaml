      type: object
      required: [content]
      description: Revision import from raw TTL content
      properties:
        content:
          type: string
        sourceName:
          type: string
          examples:
            - imported-batch-2026-04-24
        versionMode:
          type: string
          enum: [auto, explicit]
          default: auto
        version:
          type: string
          description: Target version number, required when versionMode=explicit
