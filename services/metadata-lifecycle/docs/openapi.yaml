openapi: 3.0.3
info:
  title: EPOS Metadata Lifecycle API
  version: 2.0.0
  description: Public group metadata, group access management, resource lifecycle, user access management, and internal identity transport. Authenticated endpoints require X-EPOS-User-ID.
servers:
  - url: /
tags:
  - name: Health
    description: Service availability.
  - name: Groups
    description: Public group metadata.
  - name: Group Access
    description: Group memberships, roles, role requests, and direct permissions.
  - name: Users
    description: User directory, profiles, and global permissions.
  - name: Resources
    description: Shared dataset and software resource lifecycle.
  - name: Imports
    description: Global administrator metadata import.
  - name: Contact Points
    description: Protected canonical contact-point reads.
  - name: Organizations
    description: Public canonical organization reads.
  - name: Internal Identity
    description: Internal gateway-to-Metadata Lifecycle identity resolution.
paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Health check
      security: []
      responses:
        "200": { description: Service healthy }
        "503": { description: Database unreachable }
  /api/v1/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      description: Requires global ADMIN, global.membership.manage, global.role.manage, or global.permission.manage.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200":
          description: Users returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/UserSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/internal/users:
    post:
      tags: [Internal Identity]
      operationId: provisionUser
      summary: Provision user
      description: Internal Gateway-to-Metadata-Lifecycle creation from verified authentication claims. Must not be publicly exposed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/users/{user_id}:
    parameters:
      - { $ref: "#/components/parameters/UserID" }
    get:
      tags: [Users]
      operationId: getUser
      summary: Get user
      description: Users may read own detail. Global ADMIN, global.membership.manage, global.role.manage, and global.permission.manage may read any user detail.
      parameters:
        - $ref: "#/components/parameters/Actor"
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/users/{user_id}/block:
    parameters:
      - { $ref: "#/components/parameters/UserID" }
    post:
      tags: [Users]
      operationId: blockUser
      summary: Block user
      description: Block a user with a required reason. Requires active global ADMIN. Existing memberships, roles, grants, and subscriptions remain stored.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BlockUserRequest" }
      responses:
        "204": { description: User blocked }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/users/{user_id}/unblock:
    parameters:
      - { $ref: "#/components/parameters/UserID" }
    post:
      tags: [Users]
      operationId: unblockUser
      summary: Unblock user
      description: Restore a blocked user to ACTIVE. Requires active global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: User unblocked }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/imports/turtle:
    post:
      tags: [Imports]
      operationId: importTurtleMetadata
      summary: Import Turtle metadata
      description: Atomically creates or updates groups, categories, organizations, contact points, and dataset or software DRAFT content. Category schemes become groups. Every resource must reference categories from exactly one scheme. Global ADMIN only.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          text/turtle:
            schema: { type: string }
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { description: Content-Type must be text/turtle }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/organizations:
    post:
      tags: [Organizations]
      operationId: createOrganization
      summary: Create organization
      description: Creates a canonical organization. Requires global organization.manage or global ADMIN. Organization and identifier source IRIs are generated when omitted.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/CreateCanonicalOrganizationRequest",
              }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalOrganization" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    get:
      tags: [Organizations]
      operationId: listOrganizations
      summary: List organizations
      description: Returns complete public organization documents. Contact-point IDs are public; contact-point details require contact-point read eligibility.
      responses:
        "200":
          description: Organizations returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CanonicalOrganization" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/organizations/{organization_id}:
    parameters: [{ $ref: "#/components/parameters/OrganizationID" }]
    delete:
      tags: [Organizations]
      operationId: deleteOrganization
      summary: Delete organization
      description: Atomically deletes the organization. Foreign keys remove owned identifiers, hierarchy links, organization links, and resource creator/provider links; web-service provider links are cleared. Requires global organization.manage or global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Organization deleted }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    put:
      tags: [Organizations]
      operationId: replaceOrganization
      summary: Replace organization
      description: Fully replaces organization fields, identifiers, parent links, and contact-point links. Requires global organization.manage or global ADMIN. Organization and identifier IDs/source IRIs remain immutable except replacement identifiers receive new IDs.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              {
                $ref: "#/components/schemas/ReplaceCanonicalOrganizationRequest",
              }
      responses:
        "200":
          description: Organization replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalOrganization" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    get:
      tags: [Organizations]
      operationId: getOrganization
      summary: Get organization
      description: Returns one complete public organization document. Contact-point IDs are public; contact-point details require contact-point read eligibility.
      responses:
        "200":
          description: Organization returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalOrganization" }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/contact-points:
    post:
      tags: [Contact Points]
      operationId: createContactPoint
      summary: Create contact point
      description: Creates a canonical contact point. Requires global contact_point.manage or global ADMIN. Source IRI is generated when omitted.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateContactPointRequest" }
      responses:
        "201":
          description: Contact point created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactPoint" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    get:
      tags: [Contact Points]
      operationId: listContactPoints
      summary: List contact points
      description: Returns complete contact-point documents. Requires an active user who is a member of any group or global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200":
          description: Contact points returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ContactPoint" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/contact-points/{contact_point_id}:
    parameters: [{ $ref: "#/components/parameters/ContactPointID" }]
    delete:
      tags: [Contact Points]
      operationId: deleteContactPoint
      summary: Delete contact point
      description: Atomically unlinks organization, resource-version, and web-service references before deleting the contact point. Requires global contact_point.manage or global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Contact point deleted }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    put:
      tags: [Contact Points]
      operationId: replaceContactPoint
      summary: Replace contact point
      description: Replaces email and role while preserving source IRI. Requires global contact_point.manage or global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceContactPointRequest" }
      responses:
        "200":
          description: Contact point replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactPoint" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    get:
      tags: [Contact Points]
      operationId: getContactPoint
      summary: Get contact point
      description: Returns a complete contact-point document. Requires an active user who is a member of any group or global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200":
          description: Contact point returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactPoint" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources:
    get:
      tags: [Resources]
      operationId: searchResources
      summary: Discover resources
      description: |
        Returns summary records for discovered resources. Published records are public.
        Other statuses require X-EPOS-User-ID and active access to the resource group
        or global ADMIN. Results are returned as one mixed array without pagination.
      parameters:
        - { $ref: "#/components/parameters/ActorOptional" }
        - { $ref: "#/components/parameters/SearchQuery" }
        - { $ref: "#/components/parameters/SearchType" }
        - { $ref: "#/components/parameters/SearchSpatialFilter" }
        - { $ref: "#/components/parameters/SearchDateFrom" }
        - { $ref: "#/components/parameters/SearchDateTo" }
        - { $ref: "#/components/parameters/SearchProvider" }
        - { $ref: "#/components/parameters/SearchKeywords" }
        - { $ref: "#/components/parameters/SearchVersioningStatus" }
      responses:
        "200":
          description: Discovered resources returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DiscoveryItem" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups/{group_id}/resources:
    parameters: [{ $ref: "#/components/parameters/GroupID" }]
    post:
      tags: [Resources]
      operationId: createResource
      summary: Create resource draft
      description: Creates a logical resource and its first editable DRAFT version in the selected group.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateResourceRequest" }
      responses:
        "201": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{resource_id}/versions/{version_id}:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    get:
      tags: [Resources]
      operationId: getResourceVersion
      summary: Read resource version
      description: Returns the selected resource version. Published dataset responses may be full or public; software records are returned directly.
      parameters: [{ $ref: "#/components/parameters/ActorOptional" }]
      responses:
        "200": { $ref: "#/components/responses/ResourceRead" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_id}/versions/{version_id}/draft:
    parameters:
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    put:
      tags: [Resources]
      operationId: replaceResourceDraft
      summary: Replace resource draft
      description: Atomically replaces all mutable draft metadata when supplied revision matches selected version.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceResourceDraftRequest"
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Resources]
      operationId: discardResourceDraft
      summary: Discard resource draft
      description: Permanently deletes selected DRAFT or REJECTED version and removes its logical resource when no versions remain.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Resource draft discarded }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{resource_id}/versions/{version_id}/submit:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    post:
      tags: [Resources]
      operationId: submitResource
      summary: Submit resource draft
      description: Changes selected DRAFT version to SUBMITTED and makes its metadata immutable.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{resource_id}/versions/{version_id}/withdraw:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    post:
      tags: [Resources]
      operationId: withdrawResource
      summary: Withdraw resource submission
      description: Returns selected SUBMITTED version to editable DRAFT status.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{resource_id}/versions/{version_id}/reject:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    post:
      tags: [Resources]
      operationId: rejectResource
      summary: Reject resource submission
      description: Changes selected SUBMITTED version to REJECTED. A non-empty rejection note is required.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectRequest" }
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{resource_id}/versions/{version_id}/reopen:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    post:
      tags: [Resources]
      operationId: reopenResource
      summary: Reopen rejected resource
      description: Returns selected REJECTED version to editable DRAFT status while retaining rejection feedback.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{resource_id}/versions/{version_id}/publish:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    post:
      tags: [Resources]
      operationId: publishResource
      summary: Publish resource submission
      description: Publishes selected SUBMITTED version and atomically archives any current publication.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{resource_id}/versions/{version_id}/unpublish:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    post:
      tags: [Resources]
      operationId: unpublishResource
      summary: Unpublish resource version
      description: Archives selected PUBLISHED version without creating a replacement draft.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{resource_id}/drafts/from-publication:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
    post:
      tags: [Resources]
      operationId: createResourceDraftFromPublication
      summary: Create resource draft from publication
      description: Clones current PUBLISHED version and its version-owned metadata into a new DRAFT.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "201": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{resource_id}/drafts/from-archive:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
    post:
      tags: [Resources]
      operationId: createResourceDraftFromArchive
      summary: Create resource draft from archive
      description: Clones latest ARCHIVED version when selected logical resource has no active publication.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "201": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{resource_id}/copies:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
    post:
      tags: [Resources]
      operationId: copyResource
      summary: Copy published resource
      description: Creates an independent DRAFT resource in request target_group_id from the source PUBLISHED version. A new source IRI is required.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyResourceRequest" }
      responses:
        "201": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups:
    post:
      tags: [Groups]
      operationId: createGroup
      summary: Create group
      description: Creates a group and its category-scheme metadata. Requires global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateGroupRequest" }
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    get:
      tags: [Groups]
      operationId: listGroups
      summary: List groups
      description: Returns public group metadata. Does not include membership data.
      responses:
        "200":
          description: Groups returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups/{group_id}:
    parameters: [{ $ref: "#/components/parameters/GroupID" }]
    delete:
      tags: [Groups]
      operationId: deleteGroup
      summary: Delete group
      description: Deletes a group and its group-owned metadata. Requires global ADMIN. Deletion is blocked while logical resources belong to the group.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Group deleted }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    put:
      tags: [Groups]
      operationId: replaceGroup
      summary: Replace group
      description: Replaces group and category-scheme metadata. Requires category_scheme.manage or global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceGroupRequest" }
      responses:
        "200":
          description: Group replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    get:
      tags: [Groups]
      operationId: getGroup
      summary: Get group
      description: Returns public group metadata. Does not include membership data.
      responses:
        "200":
          description: Group returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups/{group_id}/categories:
    parameters: [{ $ref: "#/components/parameters/GroupID" }]
    post:
      tags: [Categories]
      operationId: createGroupCategory
      summary: Create group category
      description: Creates a category in the group category scheme. Requires category.manage in the group. Source IRI is generated when omitted.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateCategoryRequest" }
      responses:
        "201":
          description: Category created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalCategory" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    get:
      tags: [Categories]
      operationId: listGroupCategories
      summary: List group categories
      description: Returns the group category forest as a flat public list.
      responses:
        "200":
          description: Categories returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CanonicalCategory" }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups/{group_id}/categories/{category_id}:
    parameters:
      - { $ref: "#/components/parameters/GroupID" }
      - { $ref: "#/components/parameters/CategoryID" }
    delete:
      tags: [Categories]
      operationId: deleteGroupCategory
      summary: Delete group category
      description: Deletes the category and complete descendant subtree, atomically unlinking affected resource references. Requires category.manage in the group.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Category deleted }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    put:
      tags: [Categories]
      operationId: replaceGroupCategory
      summary: Replace group category
      description: Replaces category name and parent. Requires category.manage in the group. Parent may be null for a top-level category.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceCategoryRequest" }
      responses:
        "200":
          description: Category replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalCategory" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    get:
      tags: [Categories]
      operationId: getGroupCategory
      summary: Get group category
      description: Returns a public category owned by the path group.
      responses:
        "200":
          description: Category returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CanonicalCategory" }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups/{group_id}/memberships:
    parameters: [{ $ref: "#/components/parameters/GroupID" }]
    get:
      tags: [Group Access]
      operationId: listGroupMemberships
      summary: List group memberships
      description: Requires global ADMIN, global.membership.manage, global.role.manage, or matching active group membership/role/permission management permission.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200":
          description: Memberships returned
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GroupMembership" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups/{group_id}/membership-requests:
    parameters: [{ $ref: "#/components/parameters/GroupID" }]
    post:
      tags: [Group Access]
      operationId: requestGroupMembership
      summary: Request group membership
      description: Active user creates own PENDING membership with an explicit possibly-empty list of requested EDITOR and REVIEWER roles.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateMembershipRequest" }
      responses:
        "201":
          description: Membership requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMembership" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Group Access]
      operationId: withdrawGroupMembershipRequest
      summary: Withdraw own membership request
      description: Deletes caller's own PENDING membership request and pending role requests.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Membership request withdrawn }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups/{group_id}/memberships/{user_id}:
    parameters:
      - { $ref: "#/components/parameters/GroupID" }
      - { $ref: "#/components/parameters/UserID" }
    patch:
      tags: [Group Access]
      operationId: decideGroupMembership
      summary: Accept or reject membership request
      description: Requires group.membership.manage in this group, global.membership.manage, or global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipDecisionRequest" }
      responses:
        "200":
          description: Membership decision applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMembership" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Group Access]
      operationId: revokeGroupMembership
      summary: Revoke membership
      description: Requires group.membership.manage in this group, global.membership.manage, or global ADMIN. Membership holding GROUP_ADMIN requires global.membership.manage or global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Membership revoked }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups/{group_id}/role-requests:
    parameters: [{ $ref: "#/components/parameters/GroupID" }]
    post:
      tags: [Group Access]
      operationId: requestGroupRole
      summary: Request group role
      description: Active group member requests EDITOR or REVIEWER for self.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoleRequest" }
      responses:
        "201":
          description: Role requested
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoleRequest" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups/{group_id}/role-requests/{request_id}:
    parameters:
      - { $ref: "#/components/parameters/GroupID" }
      - { $ref: "#/components/parameters/RoleRequestID" }
    patch:
      tags: [Group Access]
      operationId: applyRoleRequestDecision
      summary: Accept or reject role request
      description: Requires group.role.manage in this group, global.role.manage, or global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleRequestDecisionRequest" }
      responses:
        "200":
          description: Role request decision applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GroupMembership" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Group Access]
      operationId: withdrawGroupRoleRequest
      summary: Withdraw own role request
      description: Deletes caller's own pending role request.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Role request withdrawn }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups/{group_id}/memberships/{user_id}/roles/{role}:
    parameters:
      - { $ref: "#/components/parameters/GroupID" }
      - { $ref: "#/components/parameters/UserID" }
      - { $ref: "#/components/parameters/GroupRole" }
    put:
      tags: [Group Access]
      operationId: assignGroupRole
      summary: Assign group role
      description: Idempotent. Group role managers assign EDITOR or REVIEWER in their group; global role managers and global ADMIN may also assign GROUP_ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Role assigned }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Group Access]
      operationId: removeGroupRole
      summary: Remove group role
      description: Idempotent. Group role managers remove EDITOR or REVIEWER in their group; global role managers and global ADMIN may also remove GROUP_ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Role removed }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups/{group_id}/memberships/{user_id}/permissions/{permission}:
    parameters:
      - { $ref: "#/components/parameters/GroupID" }
      - { $ref: "#/components/parameters/UserID" }
      - { $ref: "#/components/parameters/GroupPermission" }
    put:
      tags: [Group Access]
      operationId: grantGroupPermission
      summary: Grant direct group permission
      description: Idempotent. Requires group.permission.manage in this group or global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Permission granted }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Group Access]
      operationId: revokeGroupPermission
      summary: Revoke direct group permission
      description: Idempotent. Requires group.permission.manage in this group or global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Permission revoked }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/users/{user_id}/global-permissions/{permission}:
    parameters:
      - { $ref: "#/components/parameters/UserID" }
      - { $ref: "#/components/parameters/GlobalPermission" }
    put:
      tags: [Users]
      operationId: grantGlobalPermission
      summary: Grant global permission
      description: Idempotent. Requires global.permission.manage or global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Global permission granted }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Users]
      operationId: revokeGlobalPermission
      summary: Revoke global permission
      description: Idempotent. Requires global.permission.manage or global ADMIN.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Global permission revoked }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/users/{user_id}/global-roles/{role}:
    parameters:
      - { $ref: "#/components/parameters/UserID" }
      - { $ref: "#/components/parameters/GlobalRole" }
    put:
      tags: [Users]
      operationId: assignGlobalRole
      summary: Assign global role
      description: Idempotent. Requires active global ADMIN. Only ADMIN is a valid global role.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Global role assigned }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Users]
      operationId: removeGlobalRole
      summary: Remove global role
      description: Idempotent. Requires active global ADMIN. Removing the last active ADMIN is rejected.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Global role removed }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
components:
  parameters:
    Actor:
      {
        name: X-EPOS-User-ID,
        in: header,
        required: true,
        schema: { type: string },
      }
    ActorOptional:
      {
        name: X-EPOS-User-ID,
        in: header,
        required: false,
        schema: { type: string, format: uuid },
      }
    SearchQuery:
      name: q
      in: query
      required: false
      schema: { type: string }
    SearchType:
      name: type
      in: query
      required: false
      description: Comma-separated resource types.
      schema:
        type: array
        items: { $ref: "#/components/schemas/ResourceType" }
      style: form
      explode: false
    SearchSpatialFilter:
      name: spatialFilter
      in: query
      required: false
      description: WKT geometry intersecting dataset coverage.
      schema: { type: string }
    SearchDateFrom:
      name: dateFrom
      in: query
      required: false
      schema: { type: string, format: date-time }
    SearchDateTo:
      name: dateTo
      in: query
      required: false
      schema: { type: string, format: date-time }
    SearchProvider:
      name: provider
      in: query
      required: false
      description: Comma-separated provider or creator organization UUIDs.
      schema: { type: string }
    SearchKeywords:
      name: keywords
      in: query
      required: false
      description: Comma-separated keywords. All values must match.
      schema: { type: string }
    SearchVersioningStatus:
      name: versioningStatus
      in: query
      required: false
      description: Comma-separated lifecycle statuses. Defaults to PUBLISHED; other statuses require authentication.
      schema:
        type: array
        items:
          {
            type: string,
            enum: [PUBLISHED, DRAFT, SUBMITTED, ARCHIVED, REJECTED],
          }
        default: [PUBLISHED]
      style: form
      explode: false
    ResourceType:
      {
        name: resource_type,
        in: path,
        required: true,
        schema:
          {
            type: string,
            enum: [dataset, software-application, software-source-code],
          },
      }
    ResourceID:
      {
        name: resource_id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    VersionID:
      {
        name: version_id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    GroupID:
      {
        name: group_id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    CategoryID:
      {
        name: category_id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    ContactPointID:
      {
        name: contact_point_id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    OrganizationID:
      {
        name: organization_id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    UserID:
      { name: user_id, in: path, required: true, schema: { type: string } }
    RoleRequestID:
      {
        name: request_id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    GroupRole:
      {
        name: role,
        in: path,
        required: true,
        schema: { type: string, enum: [EDITOR, REVIEWER, GROUP_ADMIN] },
      }
    GroupPermission:
      {
        name: permission,
        in: path,
        required: true,
        schema:
          {
            type: string,
            enum:
              [
                resource.create,
                resource.edit,
                resource.submit,
                resource.withdraw,
                resource.reopen,
                resource.discard,
                resource.reject,
                resource.publish,
                resource.unpublish,
                group.membership.manage,
                group.role.manage,
                group.permission.manage,
                category.manage,
              ],
          },
      }
    GlobalPermission:
      {
        name: permission,
        in: path,
        required: true,
        schema:
          {
            type: string,
            enum:
              [
                global.membership.manage,
                global.role.manage,
                global.permission.manage,
                organization.manage,
                contact_point.manage,
                category_scheme.manage,
              ],
          },
      }
    GlobalRole:
      {
        name: role,
        in: path,
        required: true,
        schema: { type: string, enum: [ADMIN] },
      }
  responses:
    Resource:
      {
        description: Resource lifecycle record,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ResourceRecord" } },
          },
      }
    ResourceRead:
      description: Resource version record. Sensitive contact points are null unless caller is eligible to read them.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResourceRecord"
    SoftwareApplication:
      {
        description: Software application lifecycle record,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ResourceRecord" } },
          },
      }
    SoftwareSourceCode:
      {
        description: Software source code lifecycle record,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ResourceRecord" } },
          },
      }
    Dataset:
      {
        description: Dataset lifecycle record,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ResourceRecord" } },
          },
      }
    DatasetRead:
      {
        description: "Dataset lifecycle record. Public reads return null dataset and web-service contact_points.",
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ResourceRecord" } },
          },
      }
    Invalid:
      {
        description: Invalid request,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    Unauthorized:
      {
        description: Missing or invalid actor header,
        content: { text/plain: { schema: { type: string } } },
      }
    Forbidden:
      {
        description: Access denied,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    NotFound:
      {
        description: Resource or selected version not found,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    Conflict:
      {
        description: Lifecycle or revision conflict,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    InternalServerError:
      {
        description: Internal server error,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
  schemas:
    ResourceType:
      type: string
      enum: [dataset, software-application, software-source-code]
    CreateUserRequest:
      type: object
      required: [id, email, given_name, family_name]
      additionalProperties: false
      properties:
        id:
          type: string
          minLength: 1
          description: Stable external authentication identifier from AAI.
        email:
          type: string
          format: email
        given_name:
          type: string
        family_name:
          type: string
    BlockUserRequest:
      type: object
      required: [reason]
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 1
    User:
      type: object
      required:
        [
          id,
          email,
          given_name,
          family_name,
          status,
          global_roles,
          global_permissions,
          created_at,
          updated_at,
          memberships,
        ]
      additionalProperties: false
      properties:
        id:
          type: string
        email: { type: string, format: email }
        given_name: { type: string }
        family_name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, BLOCKED] }
        global_roles:
          type: array
          items: { type: string }
        global_permissions:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/UserMembership" }
    UserSummary:
      type: object
      required:
        [
          id,
          email,
          given_name,
          family_name,
          status,
          global_roles,
          global_permissions,
        ]
      additionalProperties: false
      properties:
        id: { type: string }
        email: { type: string, format: email }
        given_name: { type: string }
        family_name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, BLOCKED] }
        global_roles:
          type: array
          items: { type: string }
        global_permissions:
          type: array
          items: { type: string }
    UserMembership:
      type: object
      required:
        [
          group,
          roles,
          status,
          permissions,
          role_requests,
          created_at,
          updated_at,
        ]
      additionalProperties: false
      properties:
        group: { $ref: "#/components/schemas/GroupReference" }
        roles:
          type: array
          items: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE, REJECTED] }
        permissions:
          type: array
          items: { type: string }
        role_requests:
          type: array
          items: { $ref: "#/components/schemas/RoleRequest" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GroupReference:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Group:
      type: object
      required: [id, source_iri, name, position, concept]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        source_iri: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        label: { type: string, nullable: true }
        logo: { type: string, nullable: true }
        page: { type: string, nullable: true }
        color: { type: string, nullable: true }
        position: { type: integer, format: int32 }
        concept: { type: string, enum: [DATA, FACILITIES, SOFTWARE] }
    CanonicalCategory:
      type: object
      required: [id, group_id, parent_category_id, source_iri, name]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        parent_category_id: { type: string, format: uuid, nullable: true }
        source_iri: { type: string }
        name: { type: string }
    CreateCategoryRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        source_iri: { type: string }
        name: { type: string }
        parent_category_id: { type: string, format: uuid }
    ReplaceCategoryRequest:
      type: object
      required: [name, parent_category_id]
      additionalProperties: false
      properties:
        name: { type: string }
        parent_category_id: { type: string, format: uuid, nullable: true }
    CreateGroupRequest:
      type: object
      required: [name, concept]
      additionalProperties: false
      properties:
        source_iri: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        label: { type: string, nullable: true }
        logo: { type: string, nullable: true }
        page: { type: string, nullable: true }
        color: { type: string, nullable: true }
        position: { type: integer, format: int32 }
        concept: { type: string, enum: [DATA, FACILITIES, SOFTWARE] }
    ReplaceGroupRequest:
      type: object
      required: [name, description, label, logo, page, color, position, concept]
      additionalProperties: false
      properties:
        name: { type: string }
        description: { type: string, nullable: true }
        label: { type: string, nullable: true }
        logo: { type: string, nullable: true }
        page: { type: string, nullable: true }
        color: { type: string, nullable: true }
        position: { type: integer, format: int32 }
        concept: { type: string, enum: [DATA, FACILITIES, SOFTWARE] }
    MembershipUser:
      type: object
      required: [id, given_name, family_name, email]
      additionalProperties: false
      properties:
        id: { type: string }
        given_name: { type: string }
        family_name: { type: string }
        email: { type: string, format: email }
    GroupMembership:
      type: object
      required:
        [
          user,
          status,
          roles,
          permissions,
          role_requests,
          created_at,
          updated_at,
        ]
      additionalProperties: false
      properties:
        user: { $ref: "#/components/schemas/MembershipUser" }
        status: { type: string, enum: [PENDING, ACTIVE, REJECTED] }
        roles:
          type: array
          items: { type: string, enum: [EDITOR, REVIEWER, GROUP_ADMIN] }
        permissions:
          type: array
          items: { type: string }
        role_requests:
          type: array
          description: Pending role requests only.
          items: { $ref: "#/components/schemas/RoleRequest" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RoleRequest:
      type: object
      required: [id, role, status, requested_at]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        role: { type: string, enum: [EDITOR, REVIEWER] }
        status: { type: string, enum: [PENDING, ACCEPTED, REJECTED] }
        requested_at: { type: string, format: date-time }
    CreateMembershipRequest:
      type: object
      required: [roles]
      additionalProperties: false
      properties:
        roles:
          type: array
          uniqueItems: true
          items: { type: string, enum: [EDITOR, REVIEWER] }
    MembershipDecisionRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ACTIVE, REJECTED] }
    CreateRoleRequest:
      type: object
      required: [role]
      additionalProperties: false
      properties:
        role: { type: string, enum: [EDITOR, REVIEWER] }
    RoleRequestDecisionRequest:
      type: object
      required: [status]
      additionalProperties: false
      properties:
        status: { type: string, enum: [ACCEPTED, REJECTED] }
    ReplaceSoftwareApplicationDraftRequest:
      type: object
      required: [resource_type, revision, metadata]
      properties:
        resource_type: { type: string, enum: [software-application] }
        revision: { type: integer, format: int32, minimum: 1 }
        metadata:
          { $ref: "#/components/schemas/SoftwareApplicationDraftMetadata" }
    ReplaceSoftwareSourceCodeDraftRequest:
      type: object
      required: [resource_type, revision, metadata]
      properties:
        resource_type: { type: string, enum: [software-source-code] }
        revision: { type: integer, format: int32, minimum: 1 }
        metadata:
          { $ref: "#/components/schemas/SoftwareSourceCodeDraftMetadata" }
    DiscoveryItem:
      type: object
      required: [type, resource_id, version_id, source_iri, name, status, group]
      properties:
        type:
          {
            type: string,
            enum: [dataset, software-application, software-source-code],
          }
        resource_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        source_iri: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/DatasetStatus" }
        group: { $ref: "#/components/schemas/DiscoveryReference" }
        providers:
          {
            type: array,
            items: { $ref: "#/components/schemas/DiscoveryReference" },
          }
        creators:
          {
            type: array,
            items: { $ref: "#/components/schemas/DiscoveryReference" },
          }
        categories:
          {
            type: array,
            items: { $ref: "#/components/schemas/DiscoveryReference" },
          }
        distributions:
          {
            type: array,
            items: { $ref: "#/components/schemas/DiscoveryReference" },
          }
    DiscoveryReference:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ResourceRecord:
      type: object
      required:
        [
          resource_id,
          version_id,
          revision,
          status,
          created_by,
          group_id,
          group_name,
          created_at,
          updated_at,
          metadata,
        ]
      properties:
        resource_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        revision: { type: integer, format: int32 }
        status: { $ref: "#/components/schemas/DatasetStatus" }
        created_by: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        group_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        metadata:
          anyOf:
            - { $ref: "#/components/schemas/DatasetMetadata" }
            - { $ref: "#/components/schemas/SoftwareApplicationMetadata" }
            - { $ref: "#/components/schemas/SoftwareSourceCodeMetadata" }
    SoftwareApplicationDraftMetadata:
      type: object
      required: [source_iri, name]
      properties:
        source_iri: { type: string }
        name: { type: string }
        description: { type: string }
        main_entity_of_page: { type: string, nullable: true }
        license: { type: string, nullable: true }
        version: { type: string, nullable: true }
        keywords: { type: string }
        download_url: { type: string, nullable: true }
        requirements: { type: string, nullable: true }
        operating_system: { type: string, nullable: true }
        creators:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        identifiers:
          {
            type: array,
            items: { $ref: "#/components/schemas/IdentifierDraft" },
          }
        categories:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        contact_points:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
    SoftwareSourceCodeDraftMetadata:
      type: object
      required: [source_iri, name]
      properties:
        source_iri: { type: string }
        name: { type: string }
        description: { type: string }
        programming_language: { type: string, nullable: true }
        keywords: { type: string }
        repository: { type: string, nullable: true }
        license: { type: string, nullable: true }
        software_requirements: { type: string, nullable: true }
        runtime_platform: { type: string, nullable: true }
        main_entity_of_page: { type: string, nullable: true }
        version: { type: string, nullable: true }
        creators:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        identifiers:
          {
            type: array,
            items: { $ref: "#/components/schemas/IdentifierDraft" },
          }
        categories:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        contact_points:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
    SoftwareApplicationMetadata:
      type: object
      required:
        [
          id,
          source_iri,
          name,
          description,
          keywords,
          creators,
          identifiers,
          contact_points,
          categories,
        ]
      properties:
        id: { type: string, format: uuid }
        source_iri: { type: string }
        name: { type: string }
        description: { type: string }
        main_entity_of_page: { type: string, nullable: true }
        license: { type: string, nullable: true }
        version: { type: string, nullable: true }
        keywords: { type: string }
        download_url: { type: string, nullable: true }
        requirements: { type: string, nullable: true }
        operating_system: { type: string, nullable: true }
        creators:
          {
            type: array,
            items: { $ref: "#/components/schemas/ResourceReference" },
          }
        identifiers:
          { type: array, items: { $ref: "#/components/schemas/Identifier" } }
        contact_points:
          {
            type: array,
            nullable: true,
            items: { $ref: "#/components/schemas/ContactPointReference" },
          }
        categories:
          {
            type: array,
            items: { $ref: "#/components/schemas/ResourceReference" },
          }
    SoftwareSourceCodeMetadata:
      type: object
      required:
        [
          id,
          source_iri,
          name,
          description,
          keywords,
          creators,
          identifiers,
          contact_points,
          categories,
        ]
      properties:
        id: { type: string, format: uuid }
        source_iri: { type: string }
        name: { type: string }
        description: { type: string }
        programming_language: { type: string, nullable: true }
        keywords: { type: string }
        repository: { type: string, nullable: true }
        license: { type: string, nullable: true }
        software_requirements: { type: string, nullable: true }
        runtime_platform: { type: string, nullable: true }
        main_entity_of_page: { type: string, nullable: true }
        version: { type: string, nullable: true }
        creators:
          {
            type: array,
            items: { $ref: "#/components/schemas/ResourceReference" },
          }
        identifiers:
          { type: array, items: { $ref: "#/components/schemas/Identifier" } }
        contact_points:
          {
            type: array,
            nullable: true,
            items: { $ref: "#/components/schemas/ContactPointReference" },
          }
        categories:
          {
            type: array,
            items: { $ref: "#/components/schemas/ResourceReference" },
          }
    SoftwareCategory:
      type: object
      required: [id, source_iri, name, scheme, children]
      properties:
        id: { type: string, format: uuid }
        source_iri: { type: string }
        name: { type: string }
        scheme: { $ref: "#/components/schemas/CategoryScheme" }
        children:
          {
            type: array,
            items: { $ref: "#/components/schemas/SoftwareCategory" },
          }
    ImportResult:
      type: object
      required:
        [
          groups,
          categories,
          organizations,
          contact_points,
          datasets,
          software_applications,
          software_source_codes,
          warnings,
        ]
      properties:
        groups: { type: integer }
        categories: { type: integer }
        organizations: { type: integer }
        contact_points: { type: integer }
        datasets: { type: integer }
        software_applications: { type: integer }
        software_source_codes: { type: integer }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ImportDiagnostic" }
    ImportDiagnostic:
      type: object
      required: [severity, subject, predicate, message]
      properties:
        severity: { type: string, enum: [warning, error] }
        subject: { type: string }
        predicate: { type: string }
        message: { type: string }
    ReplaceDraftRequest:
      type: object
      required: [resource_type, revision, metadata]
      properties:
        {
          resource_type: { type: string, enum: [dataset] },
          revision: { type: integer, format: int32 },
          metadata: { $ref: "#/components/schemas/DatasetDraftMetadata" },
        }
    ReplaceResourceDraftRequest:
      oneOf:
        - { $ref: "#/components/schemas/ReplaceDraftRequest" }
        - {
            $ref: "#/components/schemas/ReplaceSoftwareApplicationDraftRequest",
          }
        - { $ref: "#/components/schemas/ReplaceSoftwareSourceCodeDraftRequest" }
      discriminator:
        propertyName: resource_type
        mapping:
          dataset: "#/components/schemas/ReplaceDraftRequest"
          software-application: "#/components/schemas/ReplaceSoftwareApplicationDraftRequest"
          software-source-code: "#/components/schemas/ReplaceSoftwareSourceCodeDraftRequest"
    RejectRequest:
      {
        type: object,
        required: [note],
        properties: { note: { type: string, minLength: 1 } },
      }
    CreateResourceRequest:
      oneOf:
        - { $ref: "#/components/schemas/CreateDatasetResourceRequest" }
        - {
            $ref: "#/components/schemas/CreateSoftwareApplicationResourceRequest",
          }
        - {
            $ref: "#/components/schemas/CreateSoftwareSourceCodeResourceRequest",
          }
      discriminator:
        propertyName: resource_type
        mapping:
          dataset: "#/components/schemas/CreateDatasetResourceRequest"
          software-application: "#/components/schemas/CreateSoftwareApplicationResourceRequest"
          software-source-code: "#/components/schemas/CreateSoftwareSourceCodeResourceRequest"
    CreateDatasetResourceRequest:
      type: object
      required: [resource_type, metadata]
      properties:
        resource_type: { type: string, enum: [dataset] }
        metadata: { $ref: "#/components/schemas/DatasetDraftMetadata" }
    CreateSoftwareApplicationResourceRequest:
      type: object
      required: [resource_type, metadata]
      properties:
        resource_type: { type: string, enum: [software-application] }
        metadata:
          { $ref: "#/components/schemas/SoftwareApplicationDraftMetadata" }
    CreateSoftwareSourceCodeResourceRequest:
      type: object
      required: [resource_type, metadata]
      properties:
        resource_type: { type: string, enum: [software-source-code] }
        metadata:
          { $ref: "#/components/schemas/SoftwareSourceCodeDraftMetadata" }
    CopyResourceRequest:
      {
        type: object,
        required: [target_group_id, source_iri],
        properties:
          {
            target_group_id: { type: string, format: uuid },
            source_iri: { type: string, format: uri },
          },
      }
    Problem:
      {
        type: object,
        required: [title, status, detail],
        properties:
          {
            title:
              {
                type: string,
                enum:
                  [
                    invalid_request,
                    forbidden,
                    dataset_not_found,
                    software_application_not_found,
                    software_source_code_not_found,
                    conflict,
                    internal_server_error,
                  ],
              },
            status: { type: integer },
            detail: { type: string },
          },
      }
    DatasetDraftMetadata:
      description: Mutable dataset version metadata. Contact points, providers, and categories must reference existing canonical records by ID. IDs on version-owned nested records are accepted but generated by storage.
      type: object
      required: [source_iri, title]
      example:
        source_iri: sourceiritest
        title: my dataset
        description: description
        keywords: test
      properties:
        source_iri: { type: string }
        title: { type: string }
        description: { type: string, default: "" }
        keywords: { type: string, default: "" }
        accrual_periodicity: { type: string, nullable: true }
        quality_annotation: { type: string, nullable: true }
        access_right: { type: string, nullable: true }
        id:
          {
            type: string,
            format: uuid,
            description: Accepted but generated by storage.,
          }
        distributions:
          {
            type: array,
            items: { $ref: "#/components/schemas/DistributionDraft" },
          }
        spatial_coverage: { $ref: "#/components/schemas/Spatial" }
        temporal_coverage: { $ref: "#/components/schemas/Temporal" }
        persistent_identifiers:
          {
            type: array,
            items: { $ref: "#/components/schemas/IdentifierDraft" },
          }
        contact_points:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        providers:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        categories:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
