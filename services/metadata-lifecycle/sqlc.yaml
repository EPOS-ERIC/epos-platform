version: "2"
sql:
  - engine: "postgresql"
    queries: "./db/queries/*.sql"
    schema: "./db/migrations/*.sql"
    gen:
      go:
        package: "sqlc"
        out: "db/sqlc"
        sql_package: "pgx/v5"
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            nullable: false
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            nullable: false
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "geometry"
            nullable: false
            go_type:
              import: "github.com/twpayne/go-geom"
              type: "T"
          - db_type: "geometry"
            nullable: true
            go_type:
              import: "github.com/twpayne/go-geom"
              type: "T"
          - db_type: "nonblank_text"
            nullable: false
            go_type:
              type: "string"
          - db_type: "nonblank_text_opt"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "positive_int"
            nullable: false
            go_type:
              type: "int32"
          - db_type: "positive_int"
            nullable: true
            go_type:
              type: "int32"
              pointer: true
          - column: "string_parameter_schemas.enum"
            go_type:
              import: "github.com/EPOS-ERIC/epos-platform/services/metadata-lifecycle/db/types"
              type: "StringEnumOption"
              slice: true
          - column: "integer_parameter_schemas.enum"
            go_type:
              import: "github.com/EPOS-ERIC/epos-platform/services/metadata-lifecycle/db/types"
              type: "IntegerEnumOption"
              slice: true
          - column: "float_parameter_schemas.enum"
            go_type:
              import: "github.com/EPOS-ERIC/epos-platform/services/metadata-lifecycle/db/types"
              type: "FloatEnumOption"
              slice: true
