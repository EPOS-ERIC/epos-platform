openapi: 3.0.3
info:
  title: EPOS User Group API
  version: 2.0.0
  description: User, group, membership and authorization APIs for orchestrated service access.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service healthy
  /api/v2/authorize:
    post:
      summary: Evaluate authorization decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: Decision computed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
  /api/v2/groups:
    get:
      summary: List groups
      responses:
        '200':
          description: Groups listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      summary: Create group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
  /api/v2/groups/{groupId}:
    get:
      summary: Get group by id
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Group not found
    put:
      summary: Replace group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '200':
          description: Group replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    patch:
      summary: Patch group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    delete:
      summary: Delete group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Group deleted

components:
  schemas:
    Group:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
    CreateGroupRequest:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
    PatchGroupRequest:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
    AuthorizeRequest:
      type: object
      required: [authIdentifier, group, service, action]
      properties:
        authIdentifier:
          type: string
        group:
          type: string
        service:
          type: string
        action:
          type: string
    AuthorizeResponse:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
