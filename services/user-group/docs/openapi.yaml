openapi: 3.0.3
info:
  title: EPOS User Group API
  version: 2.0.0
  description: User, group, membership and authorization APIs for orchestrated service access.
servers:
  - url: /
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service healthy
  /api/v2/authorize:
    post:
      summary: Evaluate authorization decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: Decision computed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
  /api/v2/groups/{groupId}/memberships:
    get:
      summary: List memberships by group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Memberships listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
  /api/v2/groups/{groupId}/memberships/{userId}:
    put:
      summary: Create or update membership
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMembershipRequest'
      responses:
        '200':
          description: Membership upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
    delete:
      summary: Delete membership
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Membership deleted
  /api/v2/groups:
    get:
      summary: List groups
      responses:
        '200':
          description: Groups listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      summary: Create group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
  /api/v2/groups/{groupId}:
    get:
      summary: Get group by id
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Group not found
    put:
      summary: Replace group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '200':
          description: Group replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    patch:
      summary: Patch group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    delete:
      summary: Delete group
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Group deleted
  /api/v2/users:
    get:
      summary: List users
      responses:
        '200':
          description: Users listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /api/v2/users/by-auth/{authIdentifier}:
    get:
      summary: Get user by auth identifier
      parameters:
        - name: authIdentifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
  /api/v2/users/{userId}:
    get:
      summary: Get user by id
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    put:
      summary: Replace user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutUserRequest'
      responses:
        '200':
          description: User replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      summary: Patch user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      summary: Delete user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted
  /api/v2/users/{userId}/friends/{friendUserId}:
    post:
      summary: Create friendship between users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: friendUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Friendship created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friendship'
    delete:
      summary: Delete friendship between users
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: friendUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Friendship deleted

components:
  schemas:
    Group:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
    CreateGroupRequest:
      type: object
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
    PatchGroupRequest:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
    AuthorizeRequest:
      type: object
      required: [authIdentifier, group, service, action]
      properties:
        authIdentifier:
          type: string
        group:
          type: string
        service:
          type: string
        action:
          type: string
        resourceOwnerIdentifier:
          type: string
    AuthorizeResponse:
      type: object
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
    Membership:
      type: object
      properties:
        userId:
          type: string
        groupId:
          type: string
        role:
          type: string
          enum: [VIEWER, EDITOR, REVIEWER, ADMIN]
        status:
          type: string
          enum: [PENDING, ACTIVE, REVOKED, REJECTED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpsertMembershipRequest:
      type: object
      required: [role, status]
      properties:
        role:
          type: string
          enum: [VIEWER, EDITOR, REVIEWER, ADMIN]
        status:
          type: string
          enum: [PENDING, ACTIVE, REVOKED, REJECTED]
    Friendship:
      type: object
      properties:
        userId:
          type: string
        friendId:
          type: string
        createdAt:
          type: string
          format: date-time
    User:
      type: object
      properties:
        id:
          type: string
        authIdentifier:
          type: string
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      required: [authIdentifier]
      properties:
        authIdentifier:
          type: string
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
          default: ACTIVE
    PutUserRequest:
      type: object
      required: [authIdentifier, status]
      properties:
        authIdentifier:
          type: string
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
    PatchUserRequest:
      type: object
      properties:
        authIdentifier:
          type: string
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE, BLOCKED]
