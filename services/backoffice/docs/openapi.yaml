openapi: 3.0.3
info:
  title: EPOS Backoffice Dataset API
  version: 2.0.0
  description: Dataset lifecycle transport. Command endpoints require X-EPOS-User-ID.
servers:
  - url: /
tags:
  - name: Health
    description: Service availability.
  - name: Datasets
    description: Dataset draft metadata and lifecycle commands.
  - name: Imports
    description: Global administrator metadata import.
paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Health check
      security: []
      responses:
        "200": { description: Service healthy }
        "503": { description: Database unreachable }
  /api/v1/imports/turtle:
    post:
      tags: [Imports]
      operationId: importTurtleMetadata
      summary: Import Turtle metadata
      description: Atomically creates or updates groups, categories, organizations, contact points, and dataset DRAFT content. Category schemes become groups. Every dataset must reference categories from exactly one scheme. Global ADMIN only.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          text/turtle:
            schema: { type: string }
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/groups/{group_id}/datasets:
    post:
      tags: [Datasets]
      operationId: createDatasetDraft
      summary: Create draft dataset
      description: Creates a logical dataset and its first editable DRAFT version in path group.
      parameters: [{ $ref: "#/components/parameters/GroupID" }, { $ref: "#/components/parameters/Actor" }]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                   schema: { $ref: "#/components/schemas/DatasetDraftMetadata" },
                },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Dataset" },
          "400": { $ref: "#/components/responses/Invalid" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /api/v1/datasets/{id}/{version_id}:
    get:
      tags: [Datasets]
      operationId: getDataset
      summary: Read current dataset version
      description: Returns published version publicly. Active members receive active non-public version when present. Public responses omit dataset and web-service contact points.
      parameters:
        [
          { $ref: "#/components/parameters/DatasetID" },
          { $ref: "#/components/parameters/VersionID" },
          { $ref: "#/components/parameters/ActorOptional" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/DatasetRead" },
          "400": { $ref: "#/components/responses/Invalid" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
  /api/v1/datasets/{id}/versions/{version_id}/draft:
    put:
      tags: [Datasets]
      operationId: replaceDatasetDraft
      summary: Replace draft metadata
      description: Atomically replaces all mutable draft metadata and nested version-owned content when revision matches. Returns 409 for a stale revision.
      parameters:
        [
          { $ref: "#/components/parameters/DatasetID" },
          { $ref: "#/components/parameters/VersionID" },
          { $ref: "#/components/parameters/Actor" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                {
                  schema: { $ref: "#/components/schemas/ReplaceDraftRequest" },
                },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Dataset" },
          "400": { $ref: "#/components/responses/Invalid" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
    delete:
      tags: [Datasets]
      operationId: discardDatasetVersion
      summary: Discard draft or rejected version
      description: Permanently deletes selected DRAFT or REJECTED version. Deletes logical dataset when no versions remain.
      parameters:
        [
          { $ref: "#/components/parameters/DatasetID" },
          { $ref: "#/components/parameters/VersionID" },
          { $ref: "#/components/parameters/Actor" },
        ]
      responses:
        {
          "204": { description: Draft discarded },
          "400": { $ref: "#/components/responses/Invalid" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /api/v1/datasets/{id}/versions/{version_id}/submit:
    post:
      tags: [Datasets]
      operationId: submitDatasetDraft
      summary: Submit draft for review
      description: Changes selected DRAFT version to SUBMITTED. Submitted metadata becomes immutable.
      parameters:
        [
          { $ref: "#/components/parameters/DatasetID" },
          { $ref: "#/components/parameters/VersionID" },
          { $ref: "#/components/parameters/Actor" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Dataset" },
          "400": { $ref: "#/components/responses/Invalid" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /api/v1/datasets/{id}/versions/{version_id}/withdraw:
    post:
      tags: [Datasets]
      operationId: withdrawDatasetSubmission
      summary: Withdraw submission
      description: Returns selected SUBMITTED version to editable DRAFT status.
      parameters:
        [
          { $ref: "#/components/parameters/DatasetID" },
          { $ref: "#/components/parameters/VersionID" },
          { $ref: "#/components/parameters/Actor" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Dataset" },
          "400": { $ref: "#/components/responses/Invalid" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /api/v1/datasets/{id}/versions/{version_id}/reopen:
    post:
      tags: [Datasets]
      operationId: reopenRejectedDataset
      summary: Reopen rejected version
      description: Returns selected REJECTED version to editable DRAFT status while retaining rejection feedback.
      parameters:
        [
          { $ref: "#/components/parameters/DatasetID" },
          { $ref: "#/components/parameters/VersionID" },
          { $ref: "#/components/parameters/Actor" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Dataset" },
          "400": { $ref: "#/components/responses/Invalid" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /api/v1/datasets/{id}/versions/{version_id}/publish:
    post:
      tags: [Datasets]
      operationId: publishDatasetVersion
      summary: Publish submitted version
      description: Publishes selected SUBMITTED version and atomically archives any current publication.
      parameters:
        [
          { $ref: "#/components/parameters/DatasetID" },
          { $ref: "#/components/parameters/VersionID" },
          { $ref: "#/components/parameters/Actor" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Dataset" },
          "400": { $ref: "#/components/responses/Invalid" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /api/v1/datasets/{id}/versions/{version_id}/unpublish:
    post:
      tags: [Datasets]
      operationId: unpublishDatasetVersion
      summary: Unpublish current version
      description: Archives selected PUBLISHED version without creating a replacement draft.
      parameters:
        [
          { $ref: "#/components/parameters/DatasetID" },
          { $ref: "#/components/parameters/VersionID" },
          { $ref: "#/components/parameters/Actor" },
        ]
      responses:
        {
          "200": { $ref: "#/components/responses/Dataset" },
          "400": { $ref: "#/components/responses/Invalid" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /api/v1/datasets/{id}/versions/{version_id}/reject:
    post:
      tags: [Datasets]
      operationId: rejectDatasetSubmission
      summary: Reject submitted version
      description: Changes selected SUBMITTED version to REJECTED. A non-empty rejection note is required.
      parameters:
        [
          { $ref: "#/components/parameters/DatasetID" },
          { $ref: "#/components/parameters/VersionID" },
          { $ref: "#/components/parameters/Actor" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/RejectRequest" } },
            },
        }
      responses:
        {
          "200": { $ref: "#/components/responses/Dataset" },
          "400": { $ref: "#/components/responses/Invalid" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /api/v1/datasets/{id}/draft-from-publication:
    post:
      tags: [Datasets]
      operationId: createDraftFromPublication
      summary: Create draft from publication
      description: Clones current PUBLISHED version and all version-owned metadata into a new DRAFT for this logical dataset.
      parameters:
        [
          { $ref: "#/components/parameters/DatasetID" },
          { $ref: "#/components/parameters/Actor" },
        ]
      responses:
        {
          "201": { $ref: "#/components/responses/Dataset" },
          "400": { $ref: "#/components/responses/Invalid" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /api/v1/datasets/{id}/draft-from-archive:
    post:
      tags: [Datasets]
      operationId: createDraftFromArchive
      summary: Create draft from latest archive
      description: Clones latest ARCHIVED version when this logical dataset has no active publication.
      parameters:
        [
          { $ref: "#/components/parameters/DatasetID" },
          { $ref: "#/components/parameters/Actor" },
        ]
      responses:
        {
          "201": { $ref: "#/components/responses/Dataset" },
          "400": { $ref: "#/components/responses/Invalid" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
  /api/v1/groups/{group_id}/datasets/{id}/copy:
    post:
      tags: [Datasets]
      operationId: copyPublishedDataset
      summary: Copy published dataset into group
      description: Creates independent DRAFT dataset from source PUBLISHED version. New source IRI is required; categories are not copied.
      parameters:
        [
          { $ref: "#/components/parameters/DatasetID" },
          { $ref: "#/components/parameters/GroupID" },
          { $ref: "#/components/parameters/Actor" },
        ]
      requestBody:
        {
          required: true,
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/CopyRequest" } },
            },
        }
      responses:
        {
          "201": { $ref: "#/components/responses/Dataset" },
          "400": { $ref: "#/components/responses/Invalid" },
          "401": { $ref: "#/components/responses/Unauthorized" },
          "403": { $ref: "#/components/responses/Forbidden" },
          "404": { $ref: "#/components/responses/NotFound" },
          "409": { $ref: "#/components/responses/Conflict" },
        }
components:
  parameters:
    Actor:
      {
        name: X-EPOS-User-ID,
        in: header,
        required: true,
        schema: { type: string, format: uuid },
      }
    ActorOptional:
      {
        name: X-EPOS-User-ID,
        in: header,
        required: false,
        schema: { type: string, format: uuid },
      }
    DatasetID:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    VersionID:
      {
        name: version_id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    GroupID:
      {
        name: group_id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  responses:
    Dataset:
      {
        description: Dataset lifecycle record,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/DatasetRecord" } },
          },
      }
    DatasetRead:
      {
        description: Dataset lifecycle record. Public reads omit dataset and web-service contact_points.,
        content:
          {
            application/json:
              {
                schema:
                  {
                    oneOf:
                      [
                        { $ref: "#/components/schemas/DatasetRecord" },
                        { $ref: "#/components/schemas/PublicDatasetRecord" },
                      ],
                  },
              },
          },
      }
    Invalid:
      {
        description: Invalid request,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    Unauthorized:
      {
        description: Missing or invalid actor header,
        content: { text/plain: { schema: { type: string } } },
      }
    Forbidden:
      {
        description: Access denied,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    NotFound:
      {
        description: Dataset or selected version not found,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    Conflict:
      {
        description: Lifecycle or revision conflict,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
  schemas:
    ImportResult:
      type: object
      required: [groups, categories, organizations, contact_points, datasets, warnings]
      properties:
        groups: { type: integer }
        categories: { type: integer }
        organizations: { type: integer }
        contact_points: { type: integer }
        datasets: { type: integer }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ImportDiagnostic" }
    ImportDiagnostic:
      type: object
      required: [severity, subject, predicate, message]
      properties:
        severity: { type: string, enum: [warning, error] }
        subject: { type: string }
        predicate: { type: string }
        message: { type: string }
    ReplaceDraftRequest:
      type: object
      required: [revision, metadata]
      properties:
        {
          revision: { type: integer, format: int32 },
          metadata: { $ref: "#/components/schemas/DatasetDraftMetadata" },
        }
    RejectRequest:
      {
        type: object,
        required: [note],
        properties: { note: { type: string, minLength: 1 } },
      }
    CopyRequest:
      {
        type: object,
        required: [source_iri],
        properties: { source_iri: { type: string, format: uri } },
      }
    DatasetRecord:
      type: object
      required: [dataset_id, version_id, revision, status, created_by, group, metadata]
      properties:
        dataset_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        revision: { type: integer, format: int32 }
        status: { $ref: "#/components/schemas/DatasetStatus" }
        created_by: { type: string, format: uuid }
        group:
          allOf: [{ $ref: "#/components/schemas/CategoryScheme" }]
          description: Owning group and its category-scheme metadata.
        metadata: { $ref: "#/components/schemas/DatasetMetadata" }
    Problem:
      {
        type: object,
        required: [title, status, detail],
        properties:
          {
            title:
              {
                type: string,
                enum:
                  [
                    invalid_request,
                    forbidden,
                    dataset_not_found,
                    conflict,
                    internal_server_error,
                  ],
              },
            status: { type: integer },
            detail: { type: string },
          },
      }
    DatasetDraftMetadata:
      description: Mutable dataset version metadata. Contact points, providers, and categories must reference existing canonical records by ID. IDs on version-owned nested records are accepted but generated by storage.
      type: object
      required: [source_iri, title]
      example:
        source_iri: sourceiritest
        title: my dataset
        description: description
        keywords: test
      properties:
        source_iri: { type: string }
        title: { type: string }
        description: { type: string, default: "" }
        keywords: { type: string, default: "" }
        accrual_periodicity: { type: string, nullable: true }
        quality_annotation: { type: string, nullable: true }
        access_right: { type: string, nullable: true }
        id:
          {
            type: string,
            format: uuid,
            description: Accepted but generated by storage.,
          }
        distributions:
          {
            type: array,
            items: { $ref: "#/components/schemas/DistributionDraft" },
          }
        spatial_coverage: { $ref: "#/components/schemas/Spatial" }
        temporal_coverage: { $ref: "#/components/schemas/Temporal" }
        persistent_identifiers:
          {
            type: array,
            items: { $ref: "#/components/schemas/IdentifierDraft" },
          }
        contact_points:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        providers:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        categories:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        source_created: { type: string, format: date-time, nullable: true }
        source_updated: { type: string, format: date-time, nullable: true }
    DatasetMetadata:
      type: object
      required:
        [
          id,
          source_iri,
          title,
          description,
          keywords,
          distributions,
          persistent_identifiers,
          contact_points,
          providers,
          categories,
          status,
          created,
          updated,
        ]
      properties:
        id: { type: string, format: uuid }
        source_iri: { type: string }
        title: { type: string }
        description: { type: string }
        keywords: { type: string }
        accrual_periodicity: { type: string, nullable: true }
        quality_annotation: { type: string, nullable: true }
        access_right: { type: string, nullable: true }
        distributions:
          { type: array, items: { $ref: "#/components/schemas/Distribution" } }
        spatial_coverage: { $ref: "#/components/schemas/Spatial" }
        temporal_coverage: { $ref: "#/components/schemas/Temporal" }
        persistent_identifiers:
          { type: array, items: { $ref: "#/components/schemas/Identifier" } }
        contact_points:
          { type: array, items: { $ref: "#/components/schemas/ContactPoint" } }
        providers:
          { type: array, items: { $ref: "#/components/schemas/Organization" } }
        categories:
          { type: array, items: { $ref: "#/components/schemas/Category" } }
        source_created: { type: string, format: date-time, nullable: true }
        source_updated: { type: string, format: date-time, nullable: true }
        status: { $ref: "#/components/schemas/DatasetStatus" }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
    Distribution:
      type: object
      required: [id, title, description, type]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        license: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/DistributionType" }
        issued: { type: string, format: date-time, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        byte_size: { type: integer, format: int64, nullable: true }
        web_service: { $ref: "#/components/schemas/WebService" }
        downloadable_file: { $ref: "#/components/schemas/DownloadableFile" }
    DistributionDraft:
      type: object
      required: [title, type]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: Accepted but generated by storage.,
          }
        title: { type: string }
        description: { type: string, default: "" }
        license: { type: string, nullable: true }
        issued: { type: string, format: date-time, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        byte_size: { type: integer, format: int64, nullable: true }
        type:
          allOf: [{ $ref: "#/components/schemas/DistributionType" }]
          description: Must match selected delivery method.
        web_service: { $ref: "#/components/schemas/WebServiceDraft" }
        downloadable_file: { $ref: "#/components/schemas/DownloadableFile" }
      oneOf:
        - required: [web_service]
        - required: [downloadable_file]
    WebServiceDraft:
      type: object
      required: [name, template_url, format]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: Accepted but generated by storage.,
          }
        name: { type: string }
        description: { type: string, default: "" }
        template_url: { type: string }
        format: { type: string }
        provider: { $ref: "#/components/schemas/CanonicalReference" }
        documentation: { $ref: "#/components/schemas/Documentation" }
        spatial_coverage: { $ref: "#/components/schemas/Spatial" }
        temporal_coverage: { $ref: "#/components/schemas/Temporal" }
        contact_points:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        parameters:
          { type: array, items: { $ref: "#/components/schemas/Parameter" } }
    CanonicalReference:
      {
        type: object,
        required: [id],
        properties: { id: { type: string, format: uuid } },
      }
    Parameter:
      oneOf:
        - { $ref: "#/components/schemas/StringParameter" }
        - { $ref: "#/components/schemas/BooleanParameter" }
        - { $ref: "#/components/schemas/IntegerParameter" }
        - { $ref: "#/components/schemas/FloatParameter" }
        - { $ref: "#/components/schemas/DateTimeParameter" }
      discriminator:
        propertyName: metadata.kind
        mapping:
          {
            STRING: "#/components/schemas/StringParameter",
            BOOLEAN: "#/components/schemas/BooleanParameter",
            INTEGER: "#/components/schemas/IntegerParameter",
            FLOAT: "#/components/schemas/FloatParameter",
            DATETIME: "#/components/schemas/DateTimeParameter",
          }
    ParameterMetadata:
      {
        type: object,
        required:
          [
            id,
            kind,
            variable,
            property,
            label,
            required,
            multiple_values,
            read_only,
          ],
        properties:
          {
            id: { type: string, format: uuid },
            kind: { $ref: "#/components/schemas/ParameterKind" },
            variable: { type: string },
            property: { type: string },
            label: { type: string },
            required: { type: boolean },
            multiple_values: { type: boolean },
            read_only: { type: boolean },
          },
      }
    StringParameter:
      {
        type: object,
        required: [metadata, default, allowed_values, pattern],
        properties:
          {
            metadata:
              {
                allOf:
                  [
                    { $ref: "#/components/schemas/ParameterMetadata" },
                    {
                      type: object,
                      properties: { kind: { type: string, enum: [STRING] } },
                    },
                  ],
              },
            default: { type: string, nullable: true },
            allowed_values: { type: array, items: { type: string } },
            pattern: { type: string },
          },
      }
    BooleanParameter:
      {
        type: object,
        required: [metadata, default],
        properties:
          {
            metadata:
              {
                allOf:
                  [
                    { $ref: "#/components/schemas/ParameterMetadata" },
                    {
                      type: object,
                      properties: { kind: { type: string, enum: [BOOLEAN] } },
                    },
                  ],
              },
            default: { type: boolean, nullable: true },
          },
      }
    IntegerParameter:
      {
        type: object,
        required: [metadata, minimum, maximum, default, allowed_values],
        properties:
          {
            metadata:
              {
                allOf:
                  [
                    { $ref: "#/components/schemas/ParameterMetadata" },
                    {
                      type: object,
                      properties: { kind: { type: string, enum: [INTEGER] } },
                    },
                  ],
              },
            minimum: { type: integer, format: int64, nullable: true },
            maximum: { type: integer, format: int64, nullable: true },
            default: { type: integer, format: int64, nullable: true },
            allowed_values:
              { type: array, items: { type: integer, format: int64 } },
          },
      }
    FloatParameter:
      {
        type: object,
        required: [metadata, minimum, maximum, default, allowed_values],
        properties:
          {
            metadata:
              {
                allOf:
                  [
                    { $ref: "#/components/schemas/ParameterMetadata" },
                    {
                      type: object,
                      properties: { kind: { type: string, enum: [FLOAT] } },
                    },
                  ],
              },
            minimum: { type: number, format: double, nullable: true },
            maximum: { type: number, format: double, nullable: true },
            default: { type: number, format: double, nullable: true },
            allowed_values:
              { type: array, items: { type: number, format: double } },
          },
      }
    DateTimeParameter:
      {
        type: object,
        required: [metadata, minimum, maximum, default, pattern],
        properties:
          {
            metadata:
              {
                allOf:
                  [
                    { $ref: "#/components/schemas/ParameterMetadata" },
                    {
                      type: object,
                      properties: { kind: { type: string, enum: [DATETIME] } },
                    },
                  ],
              },
            minimum: { type: string, format: date-time, nullable: true },
            maximum: { type: string, format: date-time, nullable: true },
            default: { type: string, format: date-time, nullable: true },
            pattern: { type: string },
          },
      }
    WebService:
      type: object
      required: [id, name, description, template_url, format]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        template_url: { type: string }
        parameters:
          { type: array, items: { $ref: "#/components/schemas/Parameter" } }
        format: { type: string }
        provider: { $ref: "#/components/schemas/Organization" }
        documentation: { $ref: "#/components/schemas/Documentation" }
        spatial_coverage: { $ref: "#/components/schemas/Spatial" }
        temporal_coverage: { $ref: "#/components/schemas/Temporal" }
        contact_points:
          { type: array, items: { $ref: "#/components/schemas/ContactPoint" } }
    DownloadableFile:
      {
        type: object,
        required: [url, format],
        properties: { url: { type: string }, format: { type: string } },
      }
    Documentation:
      {
        type: object,
        required: [uri],
        properties:
          {
            title: { type: string, nullable: true },
            description: { type: string, nullable: true },
            uri: { type: string },
          },
      }
    Identifier:
      {
        type: object,
        required: [id, source_iri, type, value],
        properties:
          {
            id: { type: string, format: uuid },
            source_iri: { type: string },
            type: { type: string },
            value: { type: string },
          },
      }
    IdentifierDraft:
      {
        type: object,
        required: [source_iri, type, value],
        properties:
          {
            id:
              {
                type: string,
                format: uuid,
                description: Accepted but generated by storage.,
              },
            source_iri: { type: string },
            type: { type: string },
            value: { type: string },
          },
      }
    ContactPoint:
      {
        type: object,
        required: [id, source_iri, email, role],
        properties:
          {
            id: { type: string, format: uuid },
            source_iri: { type: string },
            email: { type: string },
            role: { type: string },
          },
      }
    Organization:
      {
        type: object,
        required: [id, source_iri, name],
        properties:
          {
            id: { type: string, format: uuid },
            source_iri: { type: string },
            name: { type: string },
            street: { type: string, nullable: true },
            locality: { type: string, nullable: true },
            postal_code: { type: string, nullable: true },
            country: { type: string, nullable: true },
            logo_url: { type: string, nullable: true },
            page_url: { type: string, nullable: true },
            email: { type: string, nullable: true },
            lei_code: { type: string, nullable: true },
            identifiers:
              {
                type: array,
                items: { $ref: "#/components/schemas/Identifier" },
              },
          },
      }
    Category:
      {
        type: object,
        required: [id, source_iri, name],
        properties:
          {
            id: { type: string, format: uuid },
            source_iri: { type: string },
            name: { type: string },
            children:
              { type: array, items: { $ref: "#/components/schemas/Category" } },
          },
      }
    CategoryScheme:
      {
        type: object,
        required: [id, source_iri, name, position, concept],
        properties:
          {
            id: { type: string, format: uuid },
            source_iri: { type: string },
            name: { type: string },
            label: { type: string, nullable: true },
            logo: { type: string, nullable: true },
            page: { type: string, nullable: true },
            color: { type: string, nullable: true },
            position: { type: integer, format: int32 },
            concept: { type: string, enum: [DATA, FACILITIES, SOFTWARE] },
          },
      }
    PublicDatasetRecord:
      type: object
      required: [dataset_id, version_id, revision, status, created_by, group, metadata]
      properties:
        dataset_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        revision: { type: integer, format: int32 }
        status: { $ref: "#/components/schemas/DatasetStatus" }
        created_by: { type: string, format: uuid }
        group: { $ref: "#/components/schemas/CategoryScheme" }
        metadata: { $ref: "#/components/schemas/PublicDatasetMetadata" }
    PublicDatasetMetadata:
      type: object
      required:
        [
          id,
          source_iri,
          title,
          description,
          keywords,
          distributions,
          persistent_identifiers,
          providers,
          categories,
          status,
          created,
          updated,
        ]
      properties:
        id: { type: string, format: uuid }
        source_iri: { type: string }
        title: { type: string }
        description: { type: string }
        keywords: { type: string }
        accrual_periodicity: { type: string, nullable: true }
        quality_annotation: { type: string, nullable: true }
        access_right: { type: string, nullable: true }
        distributions:
          {
            type: array,
            items: { $ref: "#/components/schemas/PublicDistribution" },
          }
        spatial_coverage: { $ref: "#/components/schemas/Spatial" }
        temporal_coverage: { $ref: "#/components/schemas/Temporal" }
        persistent_identifiers:
          { type: array, items: { $ref: "#/components/schemas/Identifier" } }
        providers:
          { type: array, items: { $ref: "#/components/schemas/Organization" } }
        categories:
          { type: array, items: { $ref: "#/components/schemas/Category" } }
        source_created: { type: string, format: date-time, nullable: true }
        source_updated: { type: string, format: date-time, nullable: true }
        status: { $ref: "#/components/schemas/DatasetStatus" }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
    PublicDistribution:
      type: object
      required: [id, title, description, type]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        license: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/DistributionType" }
        issued: { type: string, format: date-time, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        byte_size: { type: integer, format: int64, nullable: true }
        web_service: { $ref: "#/components/schemas/PublicWebService" }
        downloadable_file: { $ref: "#/components/schemas/DownloadableFile" }
    PublicWebService:
      type: object
      required: [id, name, description, template_url, format]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        template_url: { type: string }
        parameters:
          { type: array, items: { $ref: "#/components/schemas/Parameter" } }
        format: { type: string }
        provider: { $ref: "#/components/schemas/Organization" }
        documentation: { $ref: "#/components/schemas/Documentation" }
        spatial_coverage: { $ref: "#/components/schemas/Spatial" }
        temporal_coverage: { $ref: "#/components/schemas/Temporal" }
    ParameterKind:
      { type: string, enum: [STRING, BOOLEAN, INTEGER, FLOAT, DATETIME] }
    DistributionType:
      {
        type: string,
        enum:
          [
            "http://publications.europa.eu/resource/authority/distribution-type/WEB_SERVICE",
            "http://publications.europa.eu/resource/authority/distribution-type/DOWNLOADABLE_FILE",
          ],
      }
    Spatial:
      type: object
      properties:
        point: { $ref: "#/components/schemas/Coordinate" }
        polygon:
          {
            type: array,
            minItems: 4,
            items: { $ref: "#/components/schemas/Coordinate" },
          }
      oneOf:
        - required: [point]
        - required: [polygon]
    Coordinate:
      {
        type: object,
        required: [latitude, longitude],
        properties:
          {
            latitude: { type: number, minimum: -90, maximum: 90 },
            longitude: { type: number, minimum: -180, maximum: 180 },
          },
      }
    Temporal:
      {
        type: object,
        properties:
          {
            start: { type: string, format: date-time, nullable: true },
            end: { type: string, format: date-time, nullable: true },
          },
      }
    DatasetStatus:
      { type: string, enum: [PUBLISHED, DRAFT, SUBMITTED, ARCHIVED, REJECTED] }
