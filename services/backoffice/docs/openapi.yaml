openapi: 3.0.3
info:
  title: EPOS User Group API
  version: 2.0.0
  description: >-
    User, group, membership, and authorization APIs for service access control.
    The API exposes core identity records, group membership management, and the decision
    endpoint used by downstream services to evaluate access.
servers:
  - url: /
tags:
  - name: Health
    description: Service liveness and readiness checks.
  - name: Authorization
    description: Evaluate access decisions for downstream services.
  - name: Users
    description: Manage user identities.
  - name: Groups
    description: Manage groups and group metadata.
  - name: Memberships
    description: Manage group membership assignments.
  - name: Metadata Import
    description: Import dataset metadata from Turtle files.
  - name: Metadata
    description: Read materialized metadata resources.
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns 200 when the service can respond.
      responses:
        '200':
          description: Service healthy
  /api/v2/authorize:
    post:
      tags: [Authorization]
      summary: Evaluate authorization decision
      description: Evaluates whether requester can perform requested action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: Decision computed
          content:
            application/json:
               schema:
                 $ref: '#/components/schemas/AuthorizeResponse'
  /api/v2/import/metadata:
    post:
      tags: [Metadata Import]
      summary: Import dataset metadata
      description: >-
        Imports a Turtle file into dataset-centric backoffice records. Organizations,
        contact points, categories, and category schemes may be shared. Other nested
        resources are materialized per dataset tree. The imported file or Turtle body is
        provided as the request body; identifiers and status are query parameters.
      parameters:
        - name: editorId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: User assigned as editor.
        - name: groupId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Group assigned to datasets.
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [DRAFT, PUBLISHED, SUBMITTED, ARCHIVED, REJECTED]
            default: DRAFT
          description: Imported dataset status. Non-draft statuses require a super admin editor.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MetadataImportRequest'
          text/turtle:
            schema:
              type: string
              format: binary
              description: Turtle metadata body.
      responses:
        '201':
          description: Metadata imported
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataImportResponse'
        '400':
          description: Invalid request, identifiers, or status
        '403':
          description: Requested non-draft status requires a super admin editor
        '404':
          description: Editor or group not found
        '422':
          description: Turtle mapping or domain validation failed
        '500':
          description: Import persistence failed
  /api/v2/resources/{resourceType}/{id}:
    get:
      tags: [Metadata]
      summary: Get materialized metadata resource
      description: Returns canonical Backoffice metadata for a resource identified by its UUID.
      parameters:
        - name: resourceType
          in: path
          required: true
          schema:
            type: string
            enum: [dataset, distribution, webservice, organization, concept, conceptscheme, softwareapplication, softwaresourcecode]
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Resource UUID.
      responses:
        '200':
          description: Canonical resource representation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetadataResource'
        '400':
          description: Unsupported resource type or invalid UUID
        '404':
          description: Resource not found
        '500':
          description: Metadata read failed
  /api/v2/groups/{groupId}/memberships:
    get:
      tags: [Memberships]
      summary: List memberships by group
      description: Returns memberships currently attached to the given group.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Memberships listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
  /api/v2/groups/{groupId}/memberships/{userId}:
    put:
      tags: [Memberships]
      summary: Create or update membership
      description: Upserts membership role and status for a user in a group.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMembershipRequest'
      responses:
        '200':
          description: Membership upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
    delete:
      tags: [Memberships]
      summary: Delete membership
      description: Removes a user from a group.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Membership deleted
  /api/v2/groups:
    get:
      tags: [Groups]
      summary: List groups
      description: Returns groups newest first.
      responses:
        '200':
          description: Groups listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      tags: [Groups]
      summary: Create group
      description: Creates a new group record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
  /api/v2/groups/{groupId}:
    get:
      tags: [Groups]
      summary: Get group by id
      description: Returns single group by UUID.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Group not found
    put:
      tags: [Groups]
      summary: Replace group
      description: Replaces all mutable group fields.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '200':
          description: Group replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    patch:
      tags: [Groups]
      summary: Patch group
      description: Updates selected group fields.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    delete:
      tags: [Groups]
      summary: Delete group
      description: Deletes a group if it exists.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Group deleted
  /api/v2/users:
    get:
      tags: [Users]
      summary: List users
      description: Returns users newest first.
      responses:
        '200':
          description: Users listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [Users]
      summary: Create user
      description: Creates a new user. First created user is promoted to super admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /api/v2/users/by-auth/{authIdentifier}:
    get:
      tags: [Users]
      summary: Get user by auth identifier
      description: Returns user identified by external auth identifier.
      parameters:
        - name: authIdentifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
  /api/v2/users/{userId}:
    get:
      tags: [Users]
      summary: Get user by id
      description: Returns single user by UUID.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    put:
      tags: [Users]
      summary: Replace user
      description: Replaces all mutable user fields.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutUserRequest'
      responses:
        '200':
          description: User replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags: [Users]
      summary: Patch user
      description: Updates selected user fields.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [Users]
      summary: Delete user
      description: Deletes a user and related rows.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted
components:
  schemas:
    MetadataImportRequest:
      type: object
      description: Multipart Turtle metadata import request.
      required: [file]
      properties:
        file:
          type: string
          format: binary
          description: Turtle file to import.
    MetadataResource:
      description: Response shape selected by `resourceType`.
      oneOf:
        - $ref: '#/components/schemas/Dataset'
        - $ref: '#/components/schemas/Distribution'
        - $ref: '#/components/schemas/WebService'
        - $ref: '#/components/schemas/Organization'
        - $ref: '#/components/schemas/Category'
        - $ref: '#/components/schemas/CategoryScheme'
        - $ref: '#/components/schemas/SoftwareApplication'
        - $ref: '#/components/schemas/SoftwareSourceCode'
    Dataset:
      type: object
      required: [id, source_iri, title, description, keywords, status, created, updated, original_dataset_id]
      properties:
        id: {type: string, format: uuid}
        source_iri: {type: string, format: uri}
        title: {type: string}
        description: {type: string}
        keywords: {type: string, description: Comma-separated keywords from imported metadata.}
        accrual_periodicity: {type: string, nullable: true}
        quality_annotation: {type: string, nullable: true}
        access_right: {type: string, nullable: true}
        distributions: {type: array, items: {$ref: '#/components/schemas/Distribution'}}
        spatial_coverage: {$ref: '#/components/schemas/Spatial'}
        temporal_coverage: {$ref: '#/components/schemas/Temporal'}
        persistent_identifiers: {type: array, items: {$ref: '#/components/schemas/Identifier'}}
        contact_points: {type: array, items: {$ref: '#/components/schemas/ContactPoint'}}
        providers: {type: array, items: {$ref: '#/components/schemas/Organization'}}
        categories: {type: array, items: {$ref: '#/components/schemas/Category'}}
        source_created: {type: string, format: date-time, nullable: true}
        source_updated: {type: string, format: date-time, nullable: true}
        status: {$ref: '#/components/schemas/DatasetStatus'}
        editor: {$ref: '#/components/schemas/MetadataUser'}
        group: {$ref: '#/components/schemas/MetadataGroup'}
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
        original_dataset_id: {type: string, format: uuid}
    Distribution:
      type: object
      required: [id, source_iri, title, description, type]
      properties:
        id: {type: string, format: uuid}
        source_iri: {type: string, format: uri}
        title: {type: string}
        description: {type: string}
        license: {type: string, nullable: true}
        type: {$ref: '#/components/schemas/DistributionType'}
        issued: {type: string, format: date-time, nullable: true}
        modified: {type: string, format: date-time, nullable: true}
        byte_size: {type: integer, format: int64, nullable: true}
        web_service: {$ref: '#/components/schemas/WebService'}
        downloadable_file: {$ref: '#/components/schemas/DownloadableFile'}
    DownloadableFile:
      type: object
      properties:
        url: {type: string, format: uri}
        format: {type: string}
    WebService:
      type: object
      required: [id, source_iri, name, description, template_url, format]
      properties:
        id: {type: string, format: uuid}
        source_iri: {type: string, format: uri}
        name: {type: string}
        description: {type: string}
        template_url: {type: string}
        parameters: {type: array, items: {$ref: '#/components/schemas/Parameter'}}
        format: {type: string}
        provider: {$ref: '#/components/schemas/Organization', nullable: true}
        documentation: {$ref: '#/components/schemas/Documentation'}
        spatial_coverage: {$ref: '#/components/schemas/Spatial'}
        temporal_coverage: {$ref: '#/components/schemas/Temporal'}
        contact_points: {type: array, items: {$ref: '#/components/schemas/ContactPoint'}}
    SoftwareApplication:
      type: object
      required: [id, source_iri, name, description, keywords]
      properties:
        id: {type: string, format: uuid}
        source_iri: {type: string, format: uri}
        name: {type: string}
        description: {type: string}
        main_entity_of_page: {type: string, nullable: true}
        license: {type: string, nullable: true}
        version: {type: string, nullable: true}
        keywords: {type: string}
        download_url: {type: string, format: uri, nullable: true}
        requirements: {type: string, nullable: true}
        operating_system: {type: string, nullable: true}
        creators: {type: array, items: {$ref: '#/components/schemas/Organization'}}
        identifiers: {type: array, items: {$ref: '#/components/schemas/Identifier'}}
        categories: {type: array, items: {$ref: '#/components/schemas/Category'}}
    SoftwareSourceCode:
      type: object
      required: [id, source_iri, name, description, keywords]
      properties:
        id: {type: string, format: uuid}
        source_iri: {type: string, format: uri}
        name: {type: string}
        description: {type: string}
        programming_language: {type: string, nullable: true}
        keywords: {type: string}
        repository: {type: string, format: uri, nullable: true}
        license: {type: string, nullable: true}
        software_requirements: {type: string, nullable: true}
        runtime_platform: {type: string, nullable: true}
        main_entity_of_page: {type: string, nullable: true}
        version: {type: string, nullable: true}
        creators: {type: array, items: {$ref: '#/components/schemas/Organization'}}
        identifiers: {type: array, items: {$ref: '#/components/schemas/Identifier'}}
        categories: {type: array, items: {$ref: '#/components/schemas/Category'}}
    Organization:
      type: object
      required: [id, source_iri, name]
      properties:
        id: {type: string, format: uuid}
        source_iri: {type: string, format: uri}
        name: {type: string}
        street: {type: string, nullable: true}
        locality: {type: string, nullable: true}
        postal_code: {type: string, nullable: true}
        country: {type: string, nullable: true}
        logo_url: {type: string, format: uri, nullable: true}
        page_url: {type: string, format: uri, nullable: true}
        email: {type: string, format: email, nullable: true}
        lei_code: {type: string, nullable: true}
        identifiers: {type: array, items: {$ref: '#/components/schemas/Identifier'}}
    Category:
      type: object
      required: [id, source_iri, name, scheme]
      properties:
        id: {type: string, format: uuid}
        source_iri: {type: string, format: uri}
        name: {type: string}
        scheme: {$ref: '#/components/schemas/CategoryScheme'}
        children: {type: array, items: {$ref: '#/components/schemas/Category'}}
    CategoryScheme:
      type: object
      required: [id, source_iri, name, position, concept]
      properties:
        id: {type: string, format: uuid}
        source_iri: {type: string, format: uri}
        name: {type: string}
        label: {type: string, nullable: true}
        logo: {type: string, format: uri, nullable: true}
        page: {type: string, format: uri, nullable: true}
        color: {type: string, nullable: true}
        position: {type: integer, format: int32}
        concept: {type: string, enum: [DATA, FACILITIES, SOFTWARE]}
        top_concepts: {type: array, items: {$ref: '#/components/schemas/Category'}}
    Identifier:
      type: object
      required: [id, source_iri, type, value]
      properties:
        id: {type: string, format: uuid}
        source_iri: {type: string, format: uri}
        type: {type: string}
        value: {type: string}
    ContactPoint:
      type: object
      required: [id, source_iri, email, role]
      properties:
        id: {type: string, format: uuid}
        source_iri: {type: string, format: uri}
        email: {type: string, format: email}
        role: {type: string}
    Documentation:
      type: object
      required: [source_iri, uri]
      properties:
        source_iri: {type: string, format: uri}
        title: {type: string, nullable: true}
        description: {type: string, nullable: true}
        uri: {type: string, format: uri}
    Parameter:
      type: object
      description: Typed web-service parameter. Fields outside metadata vary by parameter range.
      required: [metadata]
      properties:
        metadata: {$ref: '#/components/schemas/ParameterMetadata'}
        default: {}
        minimum: {}
        maximum: {}
        allowed_values: {type: array, items: {}}
        pattern: {type: string}
    ParameterMetadata:
      type: object
      required: [id, source_iri, kind, variable, property, label, required, multiple_values, read_only]
      properties:
        id: {type: string, format: uuid}
        source_iri: {type: string, format: uri}
        kind: {type: string, enum: [STRING, BOOLEAN, INTEGER, FLOAT, DATETIME]}
        variable: {type: string}
        property: {type: string}
        label: {type: string}
        required: {type: boolean}
        multiple_values: {type: boolean}
        read_only: {type: boolean}
    Spatial:
      type: object
      properties:
        point: {$ref: '#/components/schemas/Coordinate'}
        polygon: {type: array, items: {$ref: '#/components/schemas/Coordinate'}}
    Coordinate:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: {type: number, format: double}
        longitude: {type: number, format: double}
    Temporal:
      type: object
      properties:
        start: {type: string, format: date-time, nullable: true}
        end: {type: string, format: date-time, nullable: true}
    MetadataUser:
      type: object
      properties:
        id: {type: string, format: uuid}
        auth_identifier: {type: string}
        family_name: {type: string, nullable: true}
        given_name: {type: string, nullable: true}
        email: {type: string, format: email, nullable: true}
        is_super_admin: {type: boolean}
        status: {type: string}
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
    MetadataGroup:
      type: object
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        name: {type: string}
        description: {type: string, nullable: true}
        is_system: {type: boolean}
        created: {type: string, format: date-time}
        updated: {type: string, format: date-time}
    DatasetStatus:
      type: string
      enum: [PUBLISHED, DRAFT, SUBMITTED, ARCHIVED, REJECTED]
    DistributionType:
      type: string
      enum:
        - http://publications.europa.eu/resource/authority/distribution-type/WEB_SERVICE
        - http://publications.europa.eu/resource/authority/distribution-type/DOWNLOADABLE_FILE
    MetadataImportWarning:
      type: object
      required: [message]
      properties:
        subject:
          type: string
        message:
          type: string
    MetadataImportResponse:
      type: object
      required: [datasets, categorySchemes, categories, organizations, contactPoints]
      properties:
        datasets:
          type: integer
          minimum: 0
        categorySchemes:
          type: integer
          minimum: 0
        categories:
          type: integer
          minimum: 0
        organizations:
          type: integer
          minimum: 0
        contactPoints:
          type: integer
          minimum: 0
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/MetadataImportWarning'
    Group:
      type: object
      description: Group record returned by group endpoints.
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
    CreateGroupRequest:
      type: object
      description: Payload for creating a group.
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
    PatchGroupRequest:
      type: object
      description: Partial payload for updating a group.
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
    AuthorizeRequest:
      type: object
      description: Access-check payload consumed by the authorization endpoint.
      required: [authIdentifier, group, service, action]
      properties:
        authIdentifier:
          type: string
        group:
          type: string
        service:
          type: string
        action:
          type: string
        resourceOwnerIdentifier:
          type: string
    AuthorizeResponse:
      type: object
      description: Decision returned by authorization checks.
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
    UserStatus:
      type: string
      description: Lifecycle state for a user record.
      enum: [ACTIVE, INACTIVE, BLOCKED]
      x-enum-varnames:
        - UserStatusActive
        - UserStatusInactive
        - UserStatusBlocked
    MembershipRole:
      type: string
      description: Role assigned to a user inside a group.
      enum: [VIEWER, EDITOR, REVIEWER, ADMIN]
    MembershipStatus:
      type: string
      description: Lifecycle state for a group membership.
      enum: [PENDING, ACTIVE, REVOKED, REJECTED]
      x-enum-varnames:
        - MembershipStatusPending
        - MembershipStatusActive
        - MembershipStatusRevoked
        - MembershipStatusRejected
    Membership:
      type: object
      description: Membership record linking user to group.
      properties:
        userId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MembershipRole'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpsertMembershipRequest:
      type: object
      description: Payload for creating or updating a membership.
      required: [role, status]
      properties:
        role:
          $ref: '#/components/schemas/MembershipRole'
        status:
          $ref: '#/components/schemas/MembershipStatus'
    User:
      type: object
      description: User record returned by user endpoints.
      properties:
        id:
          type: string
          format: uuid
        authIdentifier:
          type: string
        email:
          type: string
        givenName:
          type: string
