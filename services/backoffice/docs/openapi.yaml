openapi: 3.0.3
info:
  title: Backoffice API
  version: 0.0.0
  description: Example API specification stub for the backoffice service.

paths:
  /health:
    get:
      summary: Check service health
      operationId: getHealth
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    example: ok
