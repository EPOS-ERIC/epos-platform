openapi: 3.0.3
info:
  title: EPOS User Group API
  version: 2.0.0
  description: >-
    User, group, membership, friendship, and authorization APIs for service access control.
    The API exposes core identity records, group membership management, and the decision
    endpoint used by downstream services to evaluate access.
servers:
  - url: /
tags:
  - name: Health
    description: Service liveness and readiness checks.
  - name: Authorization
    description: Evaluate access decisions for downstream services.
  - name: Users
    description: Manage user identities and direct user relationships.
  - name: Groups
    description: Manage groups and group metadata.
  - name: Memberships
    description: Manage group membership assignments.
  - name: Friendships
    description: Manage user-to-user friendships.
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns 200 when the service can respond.
      responses:
        '200':
          description: Service healthy
  /api/v2/authorize:
    post:
      tags: [Authorization]
      summary: Evaluate authorization decision
      description: Evaluates whether requester can perform requested action.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeRequest'
      responses:
        '200':
          description: Decision computed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeResponse'
  /api/v2/groups/{groupId}/memberships:
    get:
      tags: [Memberships]
      summary: List memberships by group
      description: Returns memberships currently attached to the given group.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Memberships listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Membership'
  /api/v2/groups/{groupId}/memberships/{userId}:
    put:
      tags: [Memberships]
      summary: Create or update membership
      description: Upserts membership role and status for a user in a group.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertMembershipRequest'
      responses:
        '200':
          description: Membership upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
    delete:
      tags: [Memberships]
      summary: Delete membership
      description: Removes a user from a group.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Membership deleted
  /api/v2/groups:
    get:
      tags: [Groups]
      summary: List groups
      description: Returns groups newest first.
      responses:
        '200':
          description: Groups listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Group'
    post:
      tags: [Groups]
      summary: Create group
      description: Creates a new group record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
  /api/v2/groups/{groupId}:
    get:
      tags: [Groups]
      summary: Get group by id
      description: Returns single group by UUID.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
        '404':
          description: Group not found
    put:
      tags: [Groups]
      summary: Replace group
      description: Replaces all mutable group fields.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '200':
          description: Group replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    patch:
      tags: [Groups]
      summary: Patch group
      description: Updates selected group fields.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchGroupRequest'
      responses:
        '200':
          description: Group updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    delete:
      tags: [Groups]
      summary: Delete group
      description: Deletes a group if it exists.
      parameters:
        - name: groupId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Group deleted
  /api/v2/users:
    get:
      tags: [Users]
      summary: List users
      description: Returns users newest first.
      responses:
        '200':
          description: Users listed
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      tags: [Users]
      summary: Create user
      description: Creates a new user. First created user is promoted to super admin.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /api/v2/users/by-auth/{authIdentifier}:
    get:
      tags: [Users]
      summary: Get user by auth identifier
      description: Returns user identified by external auth identifier.
      parameters:
        - name: authIdentifier
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
  /api/v2/users/{userId}:
    get:
      tags: [Users]
      summary: Get user by id
      description: Returns single user by UUID.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: User not found
    put:
      tags: [Users]
      summary: Replace user
      description: Replaces all mutable user fields.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutUserRequest'
      responses:
        '200':
          description: User replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags: [Users]
      summary: Patch user
      description: Updates selected user fields.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [Users]
      summary: Delete user
      description: Deletes a user and related rows.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: User deleted
  /api/v2/users/{userId}/friends/{friendUserId}:
    post:
      tags: [Friendships]
      summary: Create friendship between users
      description: Creates a symmetric friendship link between two users.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: friendUserId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Friendship created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Friendship'
    delete:
      tags: [Friendships]
      summary: Delete friendship between users
      description: Removes the friendship link in both directions.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: friendUserId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Friendship deleted

components:
  schemas:
    Group:
      type: object
      description: Group record returned by group endpoints.
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
    CreateGroupRequest:
      type: object
      description: Payload for creating a group.
      required: [slug, name]
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
    PatchGroupRequest:
      type: object
      description: Partial payload for updating a group.
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        isSystem:
          type: boolean
    AuthorizeRequest:
      type: object
      description: Access-check payload consumed by the authorization endpoint.
      required: [authIdentifier, group, service, action]
      properties:
        authIdentifier:
          type: string
        group:
          type: string
        service:
          type: string
        action:
          type: string
        resourceOwnerIdentifier:
          type: string
    AuthorizeResponse:
      type: object
      description: Decision returned by authorization checks.
      required: [allowed]
      properties:
        allowed:
          type: boolean
        reason:
          type: string
    UserStatus:
      type: string
      description: Lifecycle state for a user record.
      enum: [ACTIVE, INACTIVE, BLOCKED]
      x-enum-varnames:
        - UserStatusActive
        - UserStatusInactive
        - UserStatusBlocked
    MembershipRole:
      type: string
      description: Role assigned to a user inside a group.
      enum: [VIEWER, EDITOR, REVIEWER, ADMIN]
    MembershipStatus:
      type: string
      description: Lifecycle state for a group membership.
      enum: [PENDING, ACTIVE, REVOKED, REJECTED]
      x-enum-varnames:
        - MembershipStatusPending
        - MembershipStatusActive
        - MembershipStatusRevoked
        - MembershipStatusRejected
    Membership:
      type: object
      description: Membership record linking user to group.
      properties:
        userId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/MembershipRole'
        status:
          $ref: '#/components/schemas/MembershipStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    UpsertMembershipRequest:
      type: object
      description: Payload for creating or updating a membership.
      required: [role, status]
      properties:
        role:
          $ref: '#/components/schemas/MembershipRole'
        status:
          $ref: '#/components/schemas/MembershipStatus'
    Friendship:
      type: object
      description: Symmetric friendship edge between two users.
      properties:
        userId:
          type: string
          format: uuid
        friendId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
    User:
      type: object
      description: User record returned by user endpoints.
      properties:
        id:
          type: string
          format: uuid
        authIdentifier:
          type: string
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        isSuperAdmin:
          type: boolean
        status:
          $ref: '#/components/schemas/UserStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUserRequest:
      type: object
      description: Payload for creating a user.
      required: [authIdentifier]
      properties:
        authIdentifier:
          type: string
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        isSuperAdmin:
          type: boolean
        status:
          $ref: '#/components/schemas/UserStatus'
          default: ACTIVE
    PutUserRequest:
      type: object
      description: Payload for fully replacing a user.
      required: [authIdentifier, status]
      properties:
        authIdentifier:
          type: string
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        isSuperAdmin:
          type: boolean
        status:
          $ref: '#/components/schemas/UserStatus'
    PatchUserRequest:
      type: object
      description: Partial payload for updating a user.
      properties:
        authIdentifier:
          type: string
        email:
          type: string
        givenName:
          type: string
        familyName:
          type: string
        isSuperAdmin:
          type: boolean
        status:
          $ref: '#/components/schemas/UserStatus'
