openapi: 3.0.3
info:
  title: EPOS Backoffice Lifecycle API
  version: 2.0.0
  description: Dataset and software lifecycle transport. Command endpoints require X-EPOS-User-ID.
servers:
  - url: /
tags:
  - name: Health
    description: Service availability.
  - name: Resources
    description: Shared dataset and software resource lifecycle commands.
  - name: Imports
    description: Global administrator metadata import.
  - name: Internal Identity
    description: Internal gateway-to-Backoffice identity resolution.
paths:
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Health check
      security: []
      responses:
        "200": { description: Service healthy }
        "503": { description: Database unreachable }
  /api/v1/users/by-auth/{auth_identifier}:
    parameters:
      - name: auth_identifier
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Internal Identity]
      operationId: getUserByAuthIdentifier
      summary: Get user by authentication identifier
      description: Internal Gateway-to-Backoffice lookup. Must not be publicly exposed.
      security: []
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/users:
    post:
      tags: [Internal Identity]
      operationId: createUser
      summary: Create user
      description: Internal Gateway-to-Backoffice creation from verified authentication claims. Must not be publicly exposed.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Invalid" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Internal Identity]
      operationId: getUserByID
      summary: Get user by id
      description: Internal Gateway-to-Backoffice user lookup. Must not be publicly exposed.
      security: []
      parameters:
        - $ref: "#/components/parameters/Actor"
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Internal Identity]
      operationId: deleteUser
      summary: Delete user
      description: Internal user deletion. Must not be publicly exposed.
      security: []
      responses:
        "204": { description: User deleted }
        "400": { $ref: "#/components/responses/Invalid" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/imports/turtle:
    post:
      tags: [Imports]
      operationId: importTurtleMetadata
      summary: Import Turtle metadata
      description: Atomically creates or updates groups, categories, organizations, contact points, and dataset or software DRAFT content. Category schemes become groups. Every resource must reference categories from exactly one scheme. Global ADMIN only.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          text/turtle:
            schema: { type: string }
      responses:
        "200":
          description: Import completed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "415": { description: Content-Type must be text/turtle }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups/{group_id}/resources/{resource_type}:
    parameters:
      - { $ref: "#/components/parameters/GroupID" }
      - { $ref: "#/components/parameters/ResourceType" }
    post:
      tags: [Resources]
      operationId: createResource
      summary: Create resource draft
      description: Creates a logical resource and its first editable DRAFT version for the selected resource type.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - { $ref: "#/components/schemas/DatasetDraftMetadata" }
                - { $ref: "#/components/schemas/SoftwareApplicationDraftMetadata" }
                - { $ref: "#/components/schemas/SoftwareSourceCodeDraftMetadata" }
      responses:
        "201": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{id}/versions/{version_id}:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    get:
      tags: [Resources]
      operationId: getResourceVersion
      summary: Read resource version
      description: Returns the selected resource version. Published dataset responses may be full or public; software records are returned directly.
      parameters: [{ $ref: "#/components/parameters/ActorOptional" }]
      responses:
        "200": { $ref: "#/components/responses/ResourceRead" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{id}/versions/{version_id}/draft:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    put:
      tags: [Resources]
      operationId: replaceResourceDraft
      summary: Replace resource draft
      description: Atomically replaces all mutable draft metadata when supplied revision matches selected version.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
                - { $ref: "#/components/schemas/ReplaceDraftRequest" }
                - { $ref: "#/components/schemas/ReplaceSoftwareApplicationDraftRequest" }
                - { $ref: "#/components/schemas/ReplaceSoftwareSourceCodeDraftRequest" }
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
    delete:
      tags: [Resources]
      operationId: discardResourceDraft
      summary: Discard resource draft
      description: Permanently deletes selected DRAFT or REJECTED version and removes its logical resource when no versions remain.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "204": { description: Resource draft discarded }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{id}/versions/{version_id}/submit:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    post:
      tags: [Resources]
      operationId: submitResource
      summary: Submit resource draft
      description: Changes selected DRAFT version to SUBMITTED and makes its metadata immutable.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{id}/versions/{version_id}/withdraw:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    post:
      tags: [Resources]
      operationId: withdrawResource
      summary: Withdraw resource submission
      description: Returns selected SUBMITTED version to editable DRAFT status.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{id}/versions/{version_id}/reject:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    post:
      tags: [Resources]
      operationId: rejectResource
      summary: Reject resource submission
      description: Changes selected SUBMITTED version to REJECTED. A non-empty rejection note is required.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RejectRequest" }
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{id}/versions/{version_id}/reopen:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    post:
      tags: [Resources]
      operationId: reopenResource
      summary: Reopen rejected resource
      description: Returns selected REJECTED version to editable DRAFT status while retaining rejection feedback.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{id}/versions/{version_id}/publish:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    post:
      tags: [Resources]
      operationId: publishResource
      summary: Publish resource submission
      description: Publishes selected SUBMITTED version and atomically archives any current publication.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{id}/versions/{version_id}/unpublish:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
      - { $ref: "#/components/parameters/VersionID" }
    post:
      tags: [Resources]
      operationId: unpublishResource
      summary: Unpublish resource version
      description: Archives selected PUBLISHED version without creating a replacement draft.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "200": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{id}/draft-from-publication:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
    post:
      tags: [Resources]
      operationId: createResourceDraftFromPublication
      summary: Create resource draft from publication
      description: Clones current PUBLISHED version and its version-owned metadata into a new DRAFT.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "201": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/resources/{resource_type}/{id}/draft-from-archive:
    parameters:
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
    post:
      tags: [Resources]
      operationId: createResourceDraftFromArchive
      summary: Create resource draft from archive
      description: Clones latest ARCHIVED version when selected logical resource has no active publication.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      responses:
        "201": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
  /api/v1/groups/{group_id}/resources/{resource_type}/{id}/copy:
    parameters:
      - { $ref: "#/components/parameters/GroupID" }
      - { $ref: "#/components/parameters/ResourceType" }
      - { $ref: "#/components/parameters/ResourceID" }
    post:
      tags: [Resources]
      operationId: copyResource
      summary: Copy published resource into group
      description: Creates an independent DRAFT resource from the source PUBLISHED version. A new source IRI is required.
      parameters: [{ $ref: "#/components/parameters/Actor" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CopyRequest" }
      responses:
        "201": { $ref: "#/components/responses/Resource" }
        "400": { $ref: "#/components/responses/Invalid" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalServerError" }
components:
  parameters:
    Actor:
      {
        name: X-EPOS-User-ID,
        in: header,
        required: true,
        schema: { type: string, format: uuid },
      }
    ActorOptional:
      {
        name: X-EPOS-User-ID,
        in: header,
        required: false,
        schema: { type: string, format: uuid },
      }
    ResourceType:
      {
        name: resource_type,
        in: path,
        required: true,
        schema:
          {
            type: string,
            enum: [dataset, software-application, software-source-code],
          },
      }
    ResourceID:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    VersionID:
      {
        name: version_id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    GroupID:
      {
        name: group_id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
  responses:
    Resource:
      {
        description: Resource lifecycle record,
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/ResourceRecord" },
              },
          },
      }
    ResourceRead:
      description: Resource version record. Sensitive contact points are null unless caller is eligible to read them.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ResourceRecord"
    SoftwareApplication:
      { description: Software application lifecycle record, content: { application/json: { schema: { $ref: "#/components/schemas/ResourceRecord" } } } }
    SoftwareSourceCode:
      { description: Software source code lifecycle record, content: { application/json: { schema: { $ref: "#/components/schemas/ResourceRecord" } } } }
    Dataset:
      {
        description: Dataset lifecycle record,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/ResourceRecord" } },
          },
      }
    DatasetRead:
      {
        description: "Dataset lifecycle record. Public reads return null dataset and web-service contact_points.",
        content:
          {
            application/json:
              {
                schema:
                  { $ref: "#/components/schemas/ResourceRecord" },
              },
          },
      }
    Invalid:
      {
        description: Invalid request,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    Unauthorized:
      {
        description: Missing or invalid actor header,
        content: { text/plain: { schema: { type: string } } },
      }
    Forbidden:
      {
        description: Access denied,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    NotFound:
      {
        description: Resource or selected version not found,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    Conflict:
      {
        description: Lifecycle or revision conflict,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
    InternalServerError:
      {
        description: Internal server error,
        content:
          {
            application/problem+json:
              { schema: { $ref: "#/components/schemas/Problem" } },
          },
      }
  schemas:
    CreateUserRequest:
      type: object
      required: [auth_identifier, email, given_name, family_name]
      additionalProperties: false
      properties:
        auth_identifier:
          type: string
          minLength: 1
          description: Stable external authentication identifier from AAI.
        email:
          type: string
          format: email
        given_name:
          type: string
        family_name:
          type: string
    User:
      type: object
      required: [id, auth_identifier, email, given_name, family_name, status, global_roles, global_permissions, created_at, updated_at, memberships]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        auth_identifier: { type: string }
        email: { type: string, format: email }
        given_name: { type: string }
        family_name: { type: string }
        status: { type: string, enum: [ACTIVE, INACTIVE, BLOCKED] }
        global_roles:
          type: array
          items: { type: string }
        global_permissions:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        memberships:
          type: array
          items: { $ref: "#/components/schemas/UserMembership" }
    UserMembership:
      type: object
      required: [group, roles, status, permissions, created_at, updated_at]
      additionalProperties: false
      properties:
        group: { $ref: "#/components/schemas/GroupReference" }
        roles:
          type: array
          items: { type: string }
        status: { type: string, enum: [PENDING, ACTIVE, REJECTED] }
        permissions:
          type: array
          items: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GroupReference:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    ReplaceSoftwareApplicationDraftRequest:
      type: object
      required: [revision, metadata]
      properties:
        revision: { type: integer, format: int32, minimum: 1 }
        metadata: { $ref: "#/components/schemas/SoftwareApplicationDraftMetadata" }
    ReplaceSoftwareSourceCodeDraftRequest:
      type: object
      required: [revision, metadata]
      properties:
        revision: { type: integer, format: int32, minimum: 1 }
        metadata: { $ref: "#/components/schemas/SoftwareSourceCodeDraftMetadata" }
    ResourceRecord:
      type: object
      required: [resource_id, version_id, revision, status, created_by, group, metadata]
      properties:
        resource_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        revision: { type: integer, format: int32 }
        status: { $ref: "#/components/schemas/DatasetStatus" }
        created_by: { type: string, format: uuid }
        group: { $ref: "#/components/schemas/CategoryScheme" }
        metadata:
          anyOf:
            - { $ref: "#/components/schemas/DatasetMetadata" }
            - { $ref: "#/components/schemas/SoftwareApplicationMetadata" }
            - { $ref: "#/components/schemas/SoftwareSourceCodeMetadata" }
    SoftwareApplicationDraftMetadata:
      type: object
      required: [source_iri, name]
      properties:
        source_iri: { type: string }
        name: { type: string }
        description: { type: string }
        main_entity_of_page: { type: string, nullable: true }
        license: { type: string, nullable: true }
        version: { type: string, nullable: true }
        keywords: { type: string }
        download_url: { type: string, nullable: true }
        requirements: { type: string, nullable: true }
        operating_system: { type: string, nullable: true }
        creators: { type: array, items: { $ref: "#/components/schemas/CanonicalReference" } }
        identifiers: { type: array, items: { $ref: "#/components/schemas/SoftwareIdentifierDraft" } }
        categories: { type: array, items: { $ref: "#/components/schemas/CanonicalReference" } }
        contact_points: { type: array, items: { $ref: "#/components/schemas/CanonicalReference" } }
    SoftwareSourceCodeDraftMetadata:
      type: object
      required: [source_iri, name]
      properties:
        source_iri: { type: string }
        name: { type: string }
        description: { type: string }
        programming_language: { type: string, nullable: true }
        keywords: { type: string }
        repository: { type: string, nullable: true }
        license: { type: string, nullable: true }
        software_requirements: { type: string, nullable: true }
        runtime_platform: { type: string, nullable: true }
        main_entity_of_page: { type: string, nullable: true }
        version: { type: string, nullable: true }
        creators: { type: array, items: { $ref: "#/components/schemas/CanonicalReference" } }
        identifiers: { type: array, items: { $ref: "#/components/schemas/SoftwareIdentifierDraft" } }
        categories: { type: array, items: { $ref: "#/components/schemas/CanonicalReference" } }
        contact_points: { type: array, items: { $ref: "#/components/schemas/CanonicalReference" } }
    SoftwareApplicationMetadata:
      type: object
      required: [id, source_iri, name, description, keywords, creators, identifiers, contact_points, categories]
      properties:
        id: { type: string, format: uuid }
        source_iri: { type: string }
        name: { type: string }
        description: { type: string }
        main_entity_of_page: { type: string, nullable: true }
        license: { type: string, nullable: true }
        version: { type: string, nullable: true }
        keywords: { type: string }
        download_url: { type: string, nullable: true }
        requirements: { type: string, nullable: true }
        operating_system: { type: string, nullable: true }
        creators: { type: array, items: { $ref: "#/components/schemas/Organization" } }
        identifiers: { type: array, items: { $ref: "#/components/schemas/Identifier" } }
        contact_points: { type: array, nullable: true, items: { $ref: "#/components/schemas/ContactPoint" } }
        categories: { type: array, items: { $ref: "#/components/schemas/SoftwareCategory" } }
    SoftwareSourceCodeMetadata:
      type: object
      required: [id, source_iri, name, description, keywords, creators, identifiers, contact_points, categories]
      properties:
        id: { type: string, format: uuid }
        source_iri: { type: string }
        name: { type: string }
        description: { type: string }
        programming_language: { type: string, nullable: true }
        keywords: { type: string }
        repository: { type: string, nullable: true }
        license: { type: string, nullable: true }
        software_requirements: { type: string, nullable: true }
        runtime_platform: { type: string, nullable: true }
        main_entity_of_page: { type: string, nullable: true }
        version: { type: string, nullable: true }
        creators: { type: array, items: { $ref: "#/components/schemas/Organization" } }
        identifiers: { type: array, items: { $ref: "#/components/schemas/Identifier" } }
        contact_points: { type: array, nullable: true, items: { $ref: "#/components/schemas/ContactPoint" } }
        categories: { type: array, items: { $ref: "#/components/schemas/SoftwareCategory" } }
    SoftwareIdentifierDraft:
      type: object
      required: [source_iri, type, value]
      properties:
        source_iri: { type: string }
        type: { type: string }
        value: { type: string }
    SoftwareCategory:
      type: object
      required: [id, source_iri, name, scheme, children]
      properties:
        id: { type: string, format: uuid }
        source_iri: { type: string }
        name: { type: string }
        scheme: { $ref: "#/components/schemas/CategoryScheme" }
        children: { type: array, items: { $ref: "#/components/schemas/SoftwareCategory" } }
    ImportResult:
      type: object
      required: [groups, categories, organizations, contact_points, datasets, software_applications, software_source_codes, warnings]
      properties:
        groups: { type: integer }
        categories: { type: integer }
        organizations: { type: integer }
        contact_points: { type: integer }
        datasets: { type: integer }
        software_applications: { type: integer }
        software_source_codes: { type: integer }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/ImportDiagnostic" }
    ImportDiagnostic:
      type: object
      required: [severity, subject, predicate, message]
      properties:
        severity: { type: string, enum: [warning, error] }
        subject: { type: string }
        predicate: { type: string }
        message: { type: string }
    ReplaceDraftRequest:
      type: object
      required: [revision, metadata]
      properties:
        {
          revision: { type: integer, format: int32 },
          metadata: { $ref: "#/components/schemas/DatasetDraftMetadata" },
        }
    RejectRequest:
      {
        type: object,
        required: [note],
        properties: { note: { type: string, minLength: 1 } },
      }
    CopyRequest:
      {
        type: object,
        required: [source_iri],
        properties: { source_iri: { type: string, format: uri } },
      }
    Problem:
      {
        type: object,
        required: [title, status, detail],
        properties:
          {
            title:
              {
                type: string,
                enum:
                  [
                     invalid_request,
                     forbidden,
                     dataset_not_found,
                     software_application_not_found,
                     software_source_code_not_found,
                     conflict,
                    internal_server_error,
                  ],
              },
            status: { type: integer },
            detail: { type: string },
          },
      }
    DatasetDraftMetadata:
      description: Mutable dataset version metadata. Contact points, providers, and categories must reference existing canonical records by ID. IDs on version-owned nested records are accepted but generated by storage.
      type: object
      required: [source_iri, title]
      example:
        source_iri: sourceiritest
        title: my dataset
        description: description
        keywords: test
      properties:
        source_iri: { type: string }
        title: { type: string }
        description: { type: string, default: "" }
        keywords: { type: string, default: "" }
        accrual_periodicity: { type: string, nullable: true }
        quality_annotation: { type: string, nullable: true }
        access_right: { type: string, nullable: true }
        id:
          {
            type: string,
            format: uuid,
            description: Accepted but generated by storage.,
          }
        distributions:
          {
            type: array,
            items: { $ref: "#/components/schemas/DistributionDraft" },
          }
        spatial_coverage: { $ref: "#/components/schemas/Spatial" }
        temporal_coverage: { $ref: "#/components/schemas/Temporal" }
        persistent_identifiers:
          {
            type: array,
            items: { $ref: "#/components/schemas/IdentifierDraft" },
          }
        contact_points:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        providers:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        categories:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        source_created: { type: string, format: date-time, nullable: true }
        source_updated: { type: string, format: date-time, nullable: true }
    DatasetMetadata:
      type: object
      required: [id, source_iri, title, description, keywords, distributions, persistent_identifiers, contact_points, providers, categories, status, created, updated]
      properties:
        id: { type: string, format: uuid }
        source_iri: { type: string }
        title: { type: string }
        description: { type: string }
        keywords: { type: string }
        accrual_periodicity: { type: string, nullable: true }
        quality_annotation: { type: string, nullable: true }
        access_right: { type: string, nullable: true }
        distributions: { type: array, items: { $ref: "#/components/schemas/Distribution" } }
        spatial_coverage: { $ref: "#/components/schemas/Spatial" }
        temporal_coverage: { $ref: "#/components/schemas/Temporal" }
        persistent_identifiers: { type: array, items: { $ref: "#/components/schemas/Identifier" } }
        contact_points: { type: array, nullable: true, items: { $ref: "#/components/schemas/ContactPoint" } }
        providers: { type: array, items: { $ref: "#/components/schemas/Organization" } }
        categories: { type: array, items: { $ref: "#/components/schemas/Category" } }
        source_created: { type: string, format: date-time, nullable: true }
        source_updated: { type: string, format: date-time, nullable: true }
        status: { $ref: "#/components/schemas/DatasetStatus" }
        created: { type: string, format: date-time }
        updated: { type: string, format: date-time }
    Distribution:
      type: object
      required: [id, title, description, type]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        license: { type: string, nullable: true }
        type: { $ref: "#/components/schemas/DistributionType" }
        issued: { type: string, format: date-time, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        byte_size: { type: integer, format: int64, nullable: true }
        web_service: { $ref: "#/components/schemas/WebService" }
        downloadable_file: { $ref: "#/components/schemas/DownloadableFile" }
    DistributionDraft:
      type: object
      required: [title, type]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: Accepted but generated by storage.,
          }
        title: { type: string }
        description: { type: string, default: "" }
        license: { type: string, nullable: true }
        issued: { type: string, format: date-time, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        byte_size: { type: integer, format: int64, nullable: true }
        type:
          allOf: [{ $ref: "#/components/schemas/DistributionType" }]
          description: Must match selected delivery method.
        web_service: { $ref: "#/components/schemas/WebServiceDraft" }
        downloadable_file: { $ref: "#/components/schemas/DownloadableFile" }
      oneOf:
        - required: [web_service]
        - required: [downloadable_file]
    WebServiceDraft:
      type: object
      required: [name, template_url, format]
      properties:
        id:
          {
            type: string,
            format: uuid,
            description: Accepted but generated by storage.,
          }
        name: { type: string }
        description: { type: string, default: "" }
        template_url: { type: string }
        format: { type: string }
        provider: { $ref: "#/components/schemas/CanonicalReference" }
        documentation: { $ref: "#/components/schemas/Documentation" }
        spatial_coverage: { $ref: "#/components/schemas/Spatial" }
        temporal_coverage: { $ref: "#/components/schemas/Temporal" }
        contact_points:
          {
            type: array,
            items: { $ref: "#/components/schemas/CanonicalReference" },
          }
        parameters:
          { type: array, items: { $ref: "#/components/schemas/Parameter" } }
    CanonicalReference:
      {
        type: object,
        required: [id],
        properties: { id: { type: string, format: uuid } },
      }
    Parameter:
      oneOf:
        - { $ref: "#/components/schemas/StringParameter" }
        - { $ref: "#/components/schemas/BooleanParameter" }
        - { $ref: "#/components/schemas/IntegerParameter" }
        - { $ref: "#/components/schemas/FloatParameter" }
        - { $ref: "#/components/schemas/DateTimeParameter" }
      discriminator:
        propertyName: metadata.kind
        mapping:
          {
            STRING: "#/components/schemas/StringParameter",
            BOOLEAN: "#/components/schemas/BooleanParameter",
            INTEGER: "#/components/schemas/IntegerParameter",
            FLOAT: "#/components/schemas/FloatParameter",
            DATETIME: "#/components/schemas/DateTimeParameter",
          }
    ParameterMetadata:
      {
        type: object,
        required:
          [
            id,
            kind,
            variable,
            property,
            label,
            required,
            multiple_values,
            read_only,
          ],
        properties:
          {
            id: { type: string, format: uuid },
            kind: { $ref: "#/components/schemas/ParameterKind" },
            variable: { type: string },
            property: { type: string },
            label: { type: string },
            required: { type: boolean },
            multiple_values: { type: boolean },
            read_only: { type: boolean },
          },
      }
    StringParameter:
      {
        type: object,
        required: [metadata, default, allowed_values, pattern],
        properties:
          {
            metadata:
              {
                allOf:
                  [
                    { $ref: "#/components/schemas/ParameterMetadata" },
                    {
                      type: object,
                      properties: { kind: { type: string, enum: [STRING] } },
                    },
                  ],
              },
            default: { type: string, nullable: true },
            allowed_values: { type: array, items: { type: string } },
            pattern: { type: string },
          },
      }
    BooleanParameter:
      {
        type: object,
        required: [metadata, default],
        properties:
          {
            metadata:
              {
                allOf:
                  [
                    { $ref: "#/components/schemas/ParameterMetadata" },
                    {
                      type: object,
                      properties: { kind: { type: string, enum: [BOOLEAN] } },
                    },
                  ],
              },
            default: { type: boolean, nullable: true },
          },
      }
    IntegerParameter:
      {
        type: object,
        required: [metadata, minimum, maximum, default, allowed_values],
        properties:
          {
            metadata:
              {
                allOf:
                  [
                    { $ref: "#/components/schemas/ParameterMetadata" },
                    {
                      type: object,
                      properties: { kind: { type: string, enum: [INTEGER] } },
                    },
                  ],
              },
            minimum: { type: integer, format: int64, nullable: true },
            maximum: { type: integer, format: int64, nullable: true },
            default: { type: integer, format: int64, nullable: true },
            allowed_values:
              { type: array, items: { type: integer, format: int64 } },
          },
      }
    FloatParameter:
      {
        type: object,
        required: [metadata, minimum, maximum, default, allowed_values],
        properties:
          {
            metadata:
              {
                allOf:
                  [
                    { $ref: "#/components/schemas/ParameterMetadata" },
                    {
                      type: object,
                      properties: { kind: { type: string, enum: [FLOAT] } },
                    },
                  ],
              },
            minimum: { type: number, format: double, nullable: true },
            maximum: { type: number, format: double, nullable: true },
            default: { type: number, format: double, nullable: true },
            allowed_values:
              { type: array, items: { type: number, format: double } },
          },
      }
    DateTimeParameter:
      {
        type: object,
        required: [metadata, minimum, maximum, default, pattern],
        properties:
          {
            metadata:
              {
                allOf:
                  [
                    { $ref: "#/components/schemas/ParameterMetadata" },
                    {
                      type: object,
                      properties: { kind: { type: string, enum: [DATETIME] } },
                    },
                  ],
              },
            minimum: { type: string, format: date-time, nullable: true },
            maximum: { type: string, format: date-time, nullable: true },
            default: { type: string, format: date-time, nullable: true },
            pattern: { type: string },
          },
      }
    WebService:
      type: object
      required: [id, name, description, template_url, format]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        template_url: { type: string }
        parameters:
          { type: array, items: { $ref: "#/components/schemas/Parameter" } }
        format: { type: string }
        provider: { $ref: "#/components/schemas/Organization" }
        documentation: { $ref: "#/components/schemas/Documentation" }
        spatial_coverage: { $ref: "#/components/schemas/Spatial" }
        temporal_coverage: { $ref: "#/components/schemas/Temporal" }
        contact_points:
          { type: array, items: { $ref: "#/components/schemas/ContactPoint" } }
    DownloadableFile:
      {
        type: object,
        required: [url, format],
        properties: { url: { type: string }, format: { type: string } },
      }
    Documentation:
      {
        type: object,
        required: [uri],
        properties:
          {
            title: { type: string, nullable: true },
            description: { type: string, nullable: true },
            uri: { type: string },
          },
      }
    Identifier:
      {
        type: object,
        required: [id, source_iri, type, value],
        properties:
          {
            id: { type: string, format: uuid },
            source_iri: { type: string },
            type: { type: string },
            value: { type: string },
          },
      }
    IdentifierDraft:
      {
        type: object,
        required: [source_iri, type, value],
        properties:
          {
            id:
              {
                type: string,
                format: uuid,
                description: Accepted but generated by storage.,
              },
            source_iri: { type: string },
            type: { type: string },
            value: { type: string },
          },
      }
    ContactPoint:
      {
        type: object,
        required: [id, source_iri, email, role],
        properties:
          {
            id: { type: string, format: uuid },
            source_iri: { type: string },
            email: { type: string },
            role: { type: string },
          },
      }
    Organization:
      {
        type: object,
        required: [id, source_iri, name],
        properties:
          {
            id: { type: string, format: uuid },
            source_iri: { type: string },
            name: { type: string },
            street: { type: string, nullable: true },
            locality: { type: string, nullable: true },
            postal_code: { type: string, nullable: true },
            country: { type: string, nullable: true },
            logo_url: { type: string, nullable: true },
            page_url: { type: string, nullable: true },
             email: { type: string, nullable: true },
             lei_code: { type: string, nullable: true },
             contact_points: { type: array, nullable: true, items: { $ref: "#/components/schemas/ContactPoint" } },
            identifiers:
              {
                type: array,
                items: { $ref: "#/components/schemas/Identifier" },
              },
          },
      }
    Category:
      {
        type: object,
        required: [id, source_iri, name],
        properties:
          {
            id: { type: string, format: uuid },
            source_iri: { type: string },
            name: { type: string },
            children:
              { type: array, items: { $ref: "#/components/schemas/Category" } },
          },
      }
    CategoryScheme:
      {
        type: object,
        required: [id, source_iri, name, position, concept],
        properties:
          {
            id: { type: string, format: uuid },
            source_iri: { type: string },
            name: { type: string },
            label: { type: string, nullable: true },
            logo: { type: string, nullable: true },
            page: { type: string, nullable: true },
            color: { type: string, nullable: true },
            position: { type: integer, format: int32 },
            concept: { type: string, enum: [DATA, FACILITIES, SOFTWARE] },
          },
      }
    ParameterKind:
      { type: string, enum: [STRING, BOOLEAN, INTEGER, FLOAT, DATETIME] }
    DistributionType:
      {
        type: string,
        enum:
          [
            "http://publications.europa.eu/resource/authority/distribution-type/WEB_SERVICE",
            "http://publications.europa.eu/resource/authority/distribution-type/DOWNLOADABLE_FILE",
          ],
      }
    Spatial:
      type: object
      properties:
        point: { $ref: "#/components/schemas/Coordinate" }
        polygon:
          {
            type: array,
            minItems: 4,
            items: { $ref: "#/components/schemas/Coordinate" },
          }
      oneOf:
        - required: [point]
        - required: [polygon]
    Coordinate:
      {
        type: object,
        required: [latitude, longitude],
        properties:
          {
            latitude: { type: number, minimum: -90, maximum: 90 },
            longitude: { type: number, minimum: -180, maximum: 180 },
          },
      }
    Temporal:
      {
        type: object,
        properties:
          {
            start: { type: string, format: date-time, nullable: true },
            end: { type: string, format: date-time, nullable: true },
          },
      }
    DatasetStatus:
      { type: string, enum: [PUBLISHED, DRAFT, SUBMITTED, ARCHIVED, REJECTED] }
