openapi: 3.0.3
info:
  description: "Public group metadata, group access management, resource lifecycle,\
    \ user access management, and internal identity transport. Authenticated endpoints\
    \ require X-EPOS-User-ID."
  title: EPOS Metadata Lifecycle API
  version: 2.0.0
servers:
- url: /
tags:
- description: Service availability.
  name: Health
- description: Public group metadata.
  name: Groups
- description: "Group memberships, roles, role requests, and direct permissions."
  name: Group Access
- description: "User directory, profiles, and global permissions."
  name: Users
- description: Shared dataset and software resource lifecycle.
  name: Resources
- description: Global administrator metadata import.
  name: Imports
- description: Protected canonical contact-point reads.
  name: Contact Points
- description: Public canonical organization reads.
  name: Organizations
- description: Internal gateway-to-Metadata Lifecycle identity resolution.
  name: Internal Identity
paths:
  /health:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Service healthy
        "503":
          description: Database unreachable
      security: []
      summary: Health check
      tags:
      - Health
  /api/v1/users:
    get:
      description: "Requires global ADMIN, global.membership.manage, global.role.manage,\
        \ or global.permission.manage."
      operationId: listUsers
      parameters:
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UserSummary"
                type: array
          description: Users returned
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: List users
      tags:
      - Users
  /api/v1/internal/users:
    post:
      description: Internal Gateway-to-Metadata-Lifecycle creation from verified authentication
        claims. Must not be publicly exposed.
      operationId: provisionUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Lifecycle or revision conflict
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      security: []
      summary: Provision user
      tags:
      - Internal Identity
  /api/v1/users/{user_id}:
    get:
      description: "Users may read own detail. Global ADMIN, global.membership.manage,\
        \ global.role.manage, and global.permission.manage may read any user detail."
      operationId: getUser
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User found
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Resource or selected version not found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Get user
      tags:
      - Users
  /api/v1/users/{user_id}/block:
    post:
      description: "Block a user with a required reason. Requires active global ADMIN.\
        \ Existing memberships, roles, grants, and subscriptions remain stored."
      operationId: blockUser
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUserRequest"
        required: true
      responses:
        "204":
          description: User blocked
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Resource or selected version not found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Lifecycle or revision conflict
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Block user
      tags:
      - Users
  /api/v1/users/{user_id}/unblock:
    post:
      description: Restore a blocked user to ACTIVE. Requires active global ADMIN.
      operationId: unblockUser
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: User unblocked
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Resource or selected version not found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Unblock user
      tags:
      - Users
  /api/v1/imports/turtle:
    post:
      description: "Atomically creates or updates groups, categories, organizations,\
        \ contact points, and dataset or software DRAFT content. Category schemes\
        \ become groups. Every resource must reference categories from exactly one\
        \ scheme. Global ADMIN only."
      operationId: importTurtleMetadata
      parameters:
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          text/turtle:
            schema:
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
          description: Import completed
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Lifecycle or revision conflict
        "415":
          description: Content-Type must be text/turtle
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Import Turtle metadata
      tags:
      - Imports
  /api/v1/organizations:
    get:
      description: Returns complete public organization documents. Contact-point IDs
        are public; contact-point details require contact-point read eligibility.
      operationId: listOrganizations
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CanonicalOrganization"
                type: array
          description: Organizations returned
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: List organizations
      tags:
      - Organizations
    post:
      description: Creates a canonical organization. Requires global organization.manage
        or global ADMIN. Organization and identifier IDs are generated by storage.
      operationId: createOrganization
      parameters:
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCanonicalOrganizationRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrganization"
          description: Organization created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Lifecycle or revision conflict
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Create organization
      tags:
      - Organizations
  /api/v1/organizations/{organization_id}:
    delete:
      description: "Atomically deletes the organization. Foreign keys remove owned\
        \ identifiers, hierarchy links, organization links, and resource creator/provider\
        \ links; web-service provider links are cleared. Requires global organization.manage\
        \ or global ADMIN."
      operationId: deleteOrganization
      parameters:
      - explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Organization deleted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Resource or selected version not found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Delete organization
      tags:
      - Organizations
    get:
      description: Returns one complete public organization document. Contact-point
        IDs are public; contact-point details require contact-point read eligibility.
      operationId: getOrganization
      parameters:
      - explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrganization"
          description: Organization returned
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Resource or selected version not found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Get organization
      tags:
      - Organizations
    put:
      description: "Fully replaces organization fields, identifiers, parent links,\
        \ and contact-point links. Requires global organization.manage or global ADMIN.\
        \ Organization ID remains immutable; replacement identifiers receive new IDs."
      operationId: replaceOrganization
      parameters:
      - explode: false
        in: path
        name: organization_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceCanonicalOrganizationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanonicalOrganization"
          description: Organization replaced
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Resource or selected version not found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Lifecycle or revision conflict
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Replace organization
      tags:
      - Organizations
  /api/v1/contact-points:
    get:
      description: Returns complete contact-point documents. Requires an active user
        who is a member of any group or global ADMIN.
      operationId: listContactPoints
      parameters:
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/ContactPoint"
                type: array
          description: Contact points returned
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: List contact points
      tags:
      - Contact Points
    post:
      description: Creates a canonical contact point. Requires global contact_point.manage
        or global ADMIN. Contact-point IDs are generated by storage.
      operationId: createContactPoint
      parameters:
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContactPointRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPoint"
          description: Contact point created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Lifecycle or revision conflict
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Create contact point
      tags:
      - Contact Points
  /api/v1/contact-points/{contact_point_id}:
    delete:
      description: "Atomically unlinks organization, resource-version, and web-service\
        \ references before deleting the contact point. Requires global contact_point.manage\
        \ or global ADMIN."
      operationId: deleteContactPoint
      parameters:
      - explode: false
        in: path
        name: contact_point_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          description: Contact point deleted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Resource or selected version not found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Delete contact point
      tags:
      - Contact Points
    get:
      description: Returns a complete contact-point document. Requires an active user
        who is a member of any group or global ADMIN.
      operationId: getContactPoint
      parameters:
      - explode: false
        in: path
        name: contact_point_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPoint"
          description: Contact point returned
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Resource or selected version not found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Get contact point
      tags:
      - Contact Points
    put:
      description: Replaces email and role. Requires global contact_point.manage or
        global ADMIN.
      operationId: replaceContactPoint
      parameters:
      - explode: false
        in: path
        name: contact_point_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceContactPointRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactPoint"
          description: Contact point replaced
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Resource or selected version not found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Lifecycle or revision conflict
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Replace contact point
      tags:
      - Contact Points
  /api/v1/resources:
    get:
      description: |
        Returns summary records for discovered resources. Published records are public.
        Other statuses require X-EPOS-User-ID and active access to the resource group
        or global ADMIN. Results are returned as one mixed array without pagination.
      operationId: searchResources
      parameters:
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      - explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated resource types.
        explode: false
        in: query
        name: type
        required: false
        schema:
          items:
            $ref: "#/components/schemas/ResourceType"
          type: array
        style: form
      - description: WKT geometry intersecting dataset coverage.
        explode: true
        in: query
        name: spatialFilter
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: dateFrom
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - explode: true
        in: query
        name: dateTo
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Comma-separated provider or creator organization UUIDs.
        explode: true
        in: query
        name: provider
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated keywords. All values must match.
        explode: true
        in: query
        name: keywords
        required: false
        schema:
          type: string
        style: form
      - description: Comma-separated lifecycle statuses. Defaults to PUBLISHED; other
          statuses require authentication.
        explode: false
        in: query
        name: versioningStatus
        required: false
        schema:
          default:
          - PUBLISHED
          items:
            enum:
            - PUBLISHED
            - DRAFT
            - SUBMITTED
            - ARCHIVED
            - REJECTED
            type: string
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/DiscoveryItem"
                type: array
          description: Discovered resources returned
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Discover resources
      tags:
      - Resources
  /api/v1/groups/{group_id}/resources:
    post:
      description: Creates a logical resource and its first editable DRAFT version
        in the selected group.
      operationId: createResource
      parameters:
      - explode: false
        in: path
        name: group_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
