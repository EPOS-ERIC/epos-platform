          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Lifecycle or revision conflict
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Create resource draft
      tags:
      - Resources
  /api/v1/resources/{resource_type}/{resource_id}/versions/{version_id}:
    get:
      description: Returns the selected resource version. Published dataset responses
        may be full or public; software records are returned directly.
      operationId: getResourceVersion
      parameters:
      - explode: false
        in: path
        name: resource_type
        required: true
        schema:
          enum:
          - dataset
          - software-application
          - software-source-code
          type: string
        style: simple
      - explode: false
        in: path
        name: resource_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: version_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRecord"
          description: Resource version record. Sensitive contact points are null
            unless caller is eligible to read them.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
