openapi: 3.0.3
info:
  description: "Public group metadata, resource lifecycle, user access management,\
    \ and internal identity transport. Authenticated endpoints require X-EPOS-User-ID."
  title: EPOS Metadata Lifecycle API
  version: 2.0.0
servers:
- url: /
tags:
- description: Service availability.
  name: Health
- description: Public group metadata.
  name: Groups
- description: "User directory, profiles, and global permissions."
  name: Users
- description: Shared dataset and software resource lifecycle.
  name: Resources
- description: Protected canonical contact-point reads.
  name: Contact Points
- description: Public canonical organization reads.
  name: Organizations
- description: Internal gateway-to-Metadata Lifecycle identity resolution.
  name: Internal Identity
paths:
  /health:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Service healthy
        "503":
          description: Database unreachable
      security: []
      summary: Health check
      tags:
      - Health
  /api/v1/internal/users:
    post:
      description: Internal Gateway-to-Metadata-Lifecycle creation from verified authentication
        claims. Must not be publicly exposed.
      operationId: provisionUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Lifecycle or revision conflict
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      security: []
      summary: Provision user
      tags:
      - Internal Identity
  /api/v1/users/{user_id}:
    get:
      description: "Users may read own detail. Global ADMIN, global.membership.manage,\
        \ global.role.manage, and global.permission.manage may read any user detail."
      operationId: getUser
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User found
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Resource or selected version not found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Get user
      tags:
      - Users
  /api/v1/groups/{group_id}/resources:
    post:
      description: Creates a logical resource and its first editable DRAFT version
        in the selected group.
      operationId: createResource
      parameters:
      - explode: false
        in: path
        name: group_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRecord"
          description: Resource lifecycle record
        "400":
          content:
            application/problem+json:
