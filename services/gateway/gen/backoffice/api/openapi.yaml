openapi: 3.0.3
info:
  description: Dataset and software lifecycle transport. Command endpoints require
    X-EPOS-User-ID.
  title: EPOS Backoffice Lifecycle API
  version: 2.0.0
servers:
- url: /
tags:
- description: Service availability.
  name: Health
- description: Shared dataset and software resource lifecycle commands.
  name: Resources
- description: Global administrator metadata import.
  name: Imports
- description: Internal gateway-to-Backoffice identity resolution.
  name: Internal Identity
paths:
  /health:
    get:
      operationId: healthCheck
      responses:
        "200":
          description: Service healthy
        "503":
          description: Database unreachable
      security: []
      summary: Health check
      tags:
      - Health
  /api/v1/users/by-auth/{auth_identifier}:
    get:
      description: Internal Gateway-to-Backoffice lookup. Must not be publicly exposed.
      operationId: getUserByAuthIdentifier
      parameters:
      - explode: false
        in: path
        name: auth_identifier
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User found
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Resource or selected version not found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      security: []
      summary: Get user by authentication identifier
      tags:
      - Internal Identity
  /api/v1/users:
    post:
      description: Internal Gateway-to-Backoffice creation from verified authentication
        claims. Must not be publicly exposed.
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: User created
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Lifecycle or revision conflict
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      security: []
      summary: Create user
      tags:
      - Internal Identity
  /api/v1/users/{id}:
    delete:
      description: Internal user deletion. Must not be publicly exposed.
      operationId: deleteUser
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "204":
          description: User deleted
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      security: []
      summary: Delete user
      tags:
      - Internal Identity
  /api/v1/imports/turtle:
    post:
      description: "Atomically creates or updates groups, categories, organizations,\
        \ contact points, and dataset or software DRAFT content. Category schemes\
        \ become groups. Every resource must reference categories from exactly one\
        \ scheme. Global ADMIN only."
      operationId: importTurtleMetadata
      parameters:
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          text/turtle:
            schema:
              type: string
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
          description: Import completed
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Lifecycle or revision conflict
        "415":
          description: Content-Type must be text/turtle
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Import Turtle metadata
      tags:
      - Imports
  /api/v1/groups/{group_id}/resources/{resource_type}:
    post:
      description: Creates a logical resource and its first editable DRAFT version
        for the selected resource type.
      operationId: createResource
      parameters:
      - explode: false
        in: path
        name: group_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: resource_type
        required: true
        schema:
          enum:
          - dataset
          - software-application
          - software-source-code
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createResource_request"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRecord"
          description: Resource lifecycle record
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Lifecycle or revision conflict
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Create resource draft
      tags:
      - Resources
  /api/v1/resources/{resource_type}/{id}/versions/{version_id}:
    get:
      description: Returns the selected resource version. Published dataset responses
        may be full or public; software records are returned directly.
      operationId: getResourceVersion
      parameters:
      - explode: false
        in: path
        name: resource_type
        required: true
        schema:
          enum:
          - dataset
          - software-application
          - software-source-code
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: path
        name: version_id
        required: true
        schema:
          format: uuid
          type: string
        style: simple
      - explode: false
        in: header
        name: X-EPOS-User-ID
        required: false
        schema:
          format: uuid
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRecord"
          description: Resource version record. Sensitive contact points are null
            unless caller is eligible to read them.
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Invalid request
        "401":
          content:
            text/plain:
              schema:
                type: string
          description: Missing or invalid actor header
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Access denied
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Resource or selected version not found
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Read resource version
      tags:
      - Resources
  /api/v1/resources/{resource_type}/{id}/versions/{version_id}/draft:
