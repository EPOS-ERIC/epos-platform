          description: Access denied
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Resource or selected version not found
        "409":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Lifecycle or revision conflict
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
          description: Internal server error
      summary: Discard resource draft
      tags:
      - Resources
    put:
      description: Atomically replaces all mutable draft metadata when supplied revision
