components:
  parameters:
    ResourceId:
      description: Local identifier of the resource
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    Q:
      description: Free-text search query
      explode: true
      in: query
      name: q
      required: false
      schema:
        type: string
      style: form
    Page:
      description: 1-based page number
      explode: true
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
      style: form
    ResultsPerPage:
      description: Number of items to return per page
      explode: true
      in: query
      name: resultsPerPage
      required: false
      schema:
        default: 10
        maximum: 100
        minimum: 1
        type: integer
      style: form
    TypeFilter:
      description: |
        Filter results to one or more resource types. When omitted, all types are returned.
        Repeat the parameter for multiple values: `?type=dataset&type=distribution`.
      explode: true
      in: query
      name: type
      required: false
      schema:
        items:
          $ref: "#/components/schemas/ResourceType"
        type: array
        default: null
      style: form
    SpatialFilter:
      description: |
        Spatial filter expressed as a WKT polygon string (EPSG:4326).
        Resources whose spatial coverage intersects this polygon are returned.
        Example: `POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))`
      explode: true
      in: query
      name: spatialFilter
      required: false
      schema:
        type: string
      style: form
    DateFrom:
      description: |
        Start of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Resources with temporal coverage overlapping this range are returned.
      explode: true
      in: query
      name: dateFrom
      required: false
      schema:
        format: date-time
        type: string
      style: form
    DateTo:
      description: |
        End of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Must be greater than or equal to `dateFrom` when both are supplied.
      explode: true
      in: query
      name: dateTo
      required: false
      schema:
        format: date-time
        type: string
      style: form
    ServiceProviders:
      description: |
        Filter by one or more service provider names.
        Repeat the parameter for multiple values: `?serviceProvider=INGV&serviceProvider=UNINA`.
      explode: true
      in: query
      name: serviceProvider
      required: false
      schema:
        items:
          type: string
        type: array
        default: null
      style: form
    VersioningStatusFilter:
      description: |
        Filter by one or more versioning statuses.
        When omitted, defaults to `PUBLISHED`.
        Repeat the parameter for multiple values: `?versioningStatus=PUBLISHED&versioningStatus=DRAFT`.
      explode: true
      in: query
      name: versioningStatus
      required: false
      schema:
        default:
        - PUBLISHED
        items:
          $ref: "#/components/schemas/VersioningStatus"
        type: array
      style: form
    Keywords:
      description: |
        Filter resources that carry all the supplied keywords.
        Repeat the parameter for multiple values: `?keywords=seismology&keywords=stations`.
      explode: true
      in: query
      name: keywords
      required: false
      schema:
        items:
          type: string
        type: array
        default: null
      style: form
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Invalid request parameters
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Resource not found
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Internal server error
  schemas:
    ResourceType:
      enum:
      - address
      - agent
      - annotation
      - apidocumentation
      - catalog
      - catalogrecord
      - concept
      - conceptscheme
      - contactpoint
      - contactpointtype
      - controlaction
      - creativework
      - dataset
      - dateordatetimedatatype
      - distribution
      - equipment
      - facility
      - identifier
      - iritemplate
      - iritemplatemapping
      - location
      - operation
      - organization
      - periodoftime
      - person
      - postaladdress
      - project
      - propertyvalue
      - publication
      - quantitativevalue
      - service
      - softwareapplication
      - softwaresourcecode
      - webservice
      type: string
    VersioningStatus:
      enum:
      - DRAFT
      - SUBMITTED
      - PUBLISHED
      - ARCHIVED
      type: string
    SearchResponse:
      example:
        total: 0
        totalItems: 0
        page: 1
        totalPages: 0
        items:
        - type: address
          id: id
          href: href
          fields:
            key: ""
        - type: address
          id: id
          href: href
          fields:
            key: ""
      properties:
        total:
          description: Backward-compatible alias of totalItems
          minimum: 0
          type: integer
        totalItems:
          description: Total number of matching resources across all pages
          minimum: 0
          type: integer
        page:
          minimum: 1
          type: integer
        totalPages:
          minimum: 0
          type: integer
        items:
          items:
            $ref: "#/components/schemas/SearchItem"
          type: array
          default: null
      required:
      - items
      - page
      - total
      - totalItems
      - totalPages
    SearchItem:
      example:
        type: address
        id: id
        href: href
        fields:
          key: ""
      properties:
        type:
          $ref: "#/components/schemas/ResourceType"
        id:
          type: string
        href:
          description: Absolute URL of the typed detail endpoint. Follow this link;
            do not construct URLs.
          type: string
        fields:
          additionalProperties: true
          description: "SHACL-selected property values returned only when includeConstraints=true.\
            \ Relation properties are returned as object(s) with `id`, `type`, and\
            \ `href`; literal properties remain scalar/array values."
          type: object
      required:
      - href
      - id
      - type
    AccessListItem:
      example:
        id: id
        type: type
        title: title
        href: href
      properties:
        id:
          type: string
        type:
          type: string
        title:
          type: string
        href:
          type: string
      required:
      - href
      - id
      - type
    AccessListResponse:
      example:
        shape: shape
        total: 0
        items:
        - id: id
          type: type
          title: title
          href: href
        - id: id
          type: type
          title: title
          href: href
      properties:
        shape:
          type: string
        total:
          minimum: 0
          type: integer
        items:
