components:
  parameters:
    ResourceId:
      description: Local identifier of the resource
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    Q:
      description: Free-text search query
      explode: true
      in: query
      name: q
      required: false
      schema:
        type: string
      style: form
    Page:
      description: 1-based page number
      explode: true
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
      style: form
    ResultsPerPage:
      description: Number of items to return per page
      explode: true
      in: query
      name: resultsPerPage
      required: false
      schema:
        default: 10
        maximum: 100
        minimum: 1
        type: integer
      style: form
    TypeFilter:
      description: |
        Filter results to one or more resource types. When omitted, all types are returned.
        Repeat the parameter for multiple values: `?type=dataset&type=distribution`.
      explode: true
      in: query
      name: type
      required: false
      schema:
        items:
          $ref: "#/components/schemas/ResourceType"
        type: array
      style: form
    SpatialFilter:
      description: |
        Spatial filter expressed as a WKT polygon string (EPSG:4326).
        Resources whose spatial coverage intersects this polygon are returned.
        Example: `POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))`
      explode: true
      in: query
      name: spatialFilter
      required: false
      schema:
        type: string
      style: form
    DateFrom:
      description: |
        Start of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Resources with temporal coverage overlapping this range are returned.
      explode: true
      in: query
      name: dateFrom
      required: false
      schema:
        format: date-time
        type: string
      style: form
    DateTo:
      description: |
        End of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Must be greater than or equal to `dateFrom` when both are supplied.
      explode: true
      in: query
      name: dateTo
      required: false
      schema:
        format: date-time
        type: string
      style: form
    ServiceProviders:
      description: |
        Filter by one or more service provider names.
        Repeat the parameter for multiple values: `?serviceProvider=INGV&serviceProvider=UNINA`.
      explode: true
      in: query
      name: serviceProvider
      required: false
      schema:
        items:
          type: string
        type: array
      style: form
    VersioningStatusFilter:
      description: |
        Filter by one or more versioning statuses.
        When omitted, defaults to `PUBLISHED`.
        Repeat the parameter for multiple values: `?versioningStatus=PUBLISHED&versioningStatus=DRAFT`.
      explode: true
      in: query
      name: versioningStatus
      required: false
      schema:
        default:
        - PUBLISHED
        items:
          $ref: "#/components/schemas/VersioningStatus"
        type: array
      style: form
    Keywords:
      description: |
        Filter resources that carry all the supplied keywords.
        Repeat the parameter for multiple values: `?keywords=seismology&keywords=stations`.
      explode: true
      in: query
      name: keywords
      required: false
      schema:
        items:
          type: string
        type: array
      style: form
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Invalid request parameters
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Resource not found
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Internal server error
  schemas:
    ResourceType:
      enum:
      - address
      - agent
      - annotation
      - apidocumentation
      - catalog
      - catalogrecord
      - concept
      - conceptscheme
      - contactpoint
      - contactpointtype
      - controlaction
      - creativework
      - dataset
      - dateordatetimedatatype
      - distribution
      - equipment
      - facility
      - identifier
      - iritemplate
      - iritemplatemapping
      - location
      - operation
      - organization
      - periodoftime
      - person
      - postaladdress
      - project
      - propertyvalue
      - publication
      - quantitativevalue
      - service
      - softwareapplication
      - softwaresourcecode
      - webservice
      type: string
    VersioningStatus:
      enum:
      - DRAFT
      - SUBMITTED
      - PUBLISHED
      - ARCHIVED
      type: string
    SearchResponse:
      example:
        total: 0
        items:
        - id: id
          href: href
          type: dataset
          fields:
            key: ""
        - id: id
          href: href
          type: dataset
          fields:
            key: ""
      properties:
        total:
          description: Total number of matching resources across all pages
          minimum: 0
          type: integer
        items:
          items:
            $ref: "#/components/schemas/SearchItem"
          type: array
      required:
      - items
      - total
    SearchItem:
      discriminator:
        mapping:
          dataset: "#/components/schemas/DatasetSearchItem"
          distribution: "#/components/schemas/GenericSearchItem"
          software-application: "#/components/schemas/GenericSearchItem"
          software-source-code: "#/components/schemas/GenericSearchItem"
          category: "#/components/schemas/GenericSearchItem"
        propertyName: type
      oneOf:
      - $ref: "#/components/schemas/DatasetSearchItem"
      - $ref: "#/components/schemas/GenericSearchItem"
    BaseSearchItem:
      properties:
        type:
          $ref: "#/components/schemas/ResourceType"
        id:
          type: string
        href:
          description: Absolute URL of the typed detail endpoint. Follow this link;
            do not construct URLs.
          type: string
        fields:
          additionalProperties: true
          description: SHACL-selected property values returned as field-value pairs
            (includes `name`)
          type: object
      required:
      - href
      - id
      - type
    DatasetSearchItem:
      allOf:
      - $ref: "#/components/schemas/BaseSearchItem"
      - properties:
          type:
            enum:
            - dataset
            type: string
        required:
        - type
      example:
        id: id
        href: href
        type: dataset
        fields:
          key: ""
    GenericSearchItem:
      allOf:
      - $ref: "#/components/schemas/BaseSearchItem"
      - properties:
          type:
            enum:
            - distribution
            - software-application
            - software-source-code
            - category
            type: string
        required:
        - type
    ResourceRef:
      properties:
        id:
          type: string
        title:
          type: string
        href:
          description: Absolute URL of the typed detail endpoint
          type: string
      required:
      - href
      - id
    TemporalExtent:
      description: Temporal coverage of a resource
      properties:
        start:
          description: "Start of the temporal coverage (inclusive), ISO 8601 UTC"
          format: date-time
          type: string
        end:
          description: "End of the temporal coverage (inclusive), ISO 8601 UTC. Omitted\
            \ for open-ended coverage."
          format: date-time
          type: string
    Dataset:
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        keywords:
          items:
            type: string
          type: array
        categories:
          description: Category labels assigned to this dataset
          items:
            type: string
          type: array
        publisher:
          description: Names of the organisations publishing this dataset
          items:
            type: string
          type: array
        spatial:
          description: Spatial coverage expressed as a WKT polygon (EPSG:4326)
          type: string
        temporal:
          $ref: "#/components/schemas/TemporalExtent"
        status:
          $ref: "#/components/schemas/VersioningStatus"
        distributions:
          description: Distributions that provide access to this dataset
          items:
            $ref: "#/components/schemas/ResourceRef"
          type: array
        related:
          description: Outbound related entities referenced by this dataset
          items:
            $ref: "#/components/schemas/ResourceRef"
          type: array
        relatedBy:
          description: Inbound related entities that reference this dataset
          items:
            $ref: "#/components/schemas/ResourceRef"
          type: array
      required:
      - id
      - status
      - title
    Distribution:
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        accessUrl:
          description: URL used to access the distribution
          format: uri
          type: string
        operation:
          description: Operation ID describing the service operation exposed by this
            distribution
          type: string
        related:
          description: Outbound related entities referenced by this distribution
          items:
            $ref: "#/components/schemas/ResourceRef"
          type: array
        relatedBy:
          description: Inbound related entities that reference this distribution
          items:
            $ref: "#/components/schemas/ResourceRef"
          type: array
      required:
      - id
      - title
    SoftwareApplication:
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        keywords:
          items:
            type: string
          type: array
        categories:
          description: Category labels assigned to this application
          items:
            type: string
          type: array
        downloadUrl:
          description: URL to download or install the application
          format: uri
          type: string
        related:
          description: Outbound related entities referenced by this application
          items:
            $ref: "#/components/schemas/ResourceRef"
          type: array
        relatedBy:
          description: Inbound related entities that reference this application
          items:
            $ref: "#/components/schemas/ResourceRef"
          type: array
      required:
      - id
      - title
    SoftwareSourceCode:
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        programmingLanguage:
          description: Primary programming language of the source code
          type: string
        keywords:
          items:
            type: string
          type: array
        categories:
          description: Category labels assigned to this source code
          items:
            type: string
          type: array
        repository:
          description: URL of the source code repository
          format: uri
          type: string
        related:
          description: Outbound related entities referenced by this source code
          items:
            $ref: "#/components/schemas/ResourceRef"
          type: array
        relatedBy:
          description: Inbound related entities that reference this source code
          items:
            $ref: "#/components/schemas/ResourceRef"
          type: array
      required:
      - id
      - title
    Category:
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        children:
          description: Nested child categories
          items:
            $ref: "#/components/schemas/Category"
          type: array
      required:
      - id
      - name
    CategoryScheme:
      properties:
        id:
          type: string
        label:
          type: string
        title:
          type: string
        description:
          type: string
        logo:
          format: uri
          type: string
        homepage:
          format: uri
          type: string
        color:
          description: Hex colour code used for UI rendering
          type: string
        orderNumber:
          description: Display order among sibling category schemes
          type: integer
        type:
          enum:
          - DATA
          - FACILITY
          - SOFTWARE
          type: string
        children:
