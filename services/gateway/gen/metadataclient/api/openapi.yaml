components:
  parameters:
    ResourceId:
      description: Local identifier of the resource
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    Q:
      description: Free-text search query
      explode: true
      in: query
      name: q
      required: false
      schema:
        type: string
      style: form
    Page:
      description: 1-based page number
      explode: true
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
      style: form
    ResultsPerPage:
      description: Number of items to return per page
      explode: true
      in: query
      name: resultsPerPage
      required: false
      schema:
        default: 10
        maximum: 100
        minimum: 1
        type: integer
      style: form
    TypeFilter:
      description: |
        Filter results to one or more resource types. When omitted, all types are returned.
        Repeat the parameter for multiple values: `?type=dataset&type=distribution`.
      explode: true
      in: query
      name: type
      required: false
      schema:
        items:
          $ref: "#/components/schemas/ResourceType"
        type: array
      style: form
    SpatialFilter:
      description: |
        Spatial filter expressed as a WKT polygon string (EPSG:4326).
        Resources whose spatial coverage intersects this polygon are returned.
        Example: `POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))`
      explode: true
      in: query
      name: spatialFilter
      required: false
      schema:
        type: string
      style: form
    DateFrom:
      description: |
        Start of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Resources with temporal coverage overlapping this range are returned.
      explode: true
      in: query
      name: dateFrom
      required: false
      schema:
        format: date-time
        type: string
      style: form
    DateTo:
      description: |
        End of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Must be greater than or equal to `dateFrom` when both are supplied.
      explode: true
      in: query
      name: dateTo
      required: false
      schema:
        format: date-time
        type: string
      style: form
    ServiceProviders:
      description: |
        Filter by one or more service provider names.
        Repeat the parameter for multiple values: `?serviceProvider=INGV&serviceProvider=UNINA`.
      explode: true
      in: query
      name: serviceProvider
      required: false
      schema:
        items:
          type: string
        type: array
      style: form
    VersioningStatusFilter:
      description: |
        Filter by one or more versioning statuses.
        When omitted, defaults to `PUBLISHED`.
        Repeat the parameter for multiple values: `?versioningStatus=PUBLISHED&versioningStatus=DRAFT`.
      explode: true
      in: query
      name: versioningStatus
      required: false
      schema:
        default:
        - PUBLISHED
        items:
          $ref: "#/components/schemas/VersioningStatus"
        type: array
      style: form
    Keywords:
      description: |
        Filter resources that carry all the supplied keywords.
        Repeat the parameter for multiple values: `?keywords=seismology&keywords=stations`.
      explode: true
      in: query
      name: keywords
      required: false
      schema:
        items:
          type: string
        type: array
      style: form
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Invalid request parameters
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Resource not found
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Internal server error
