openapi: 3.0.3
info:
  contact:
    name: EPOS Development Team
    url: https://epos-eu.org
  description: |
    REST API to manage the lifecycle of RDF metadata resources in GraphDB.

    ## Lifecycle Workflow
    1. **DRAFT** - Create a new draft of a resource
    2. **SUBMITTED** - Submit the draft for review
    3. **PUBLISHED** - Publish the resource (automatically archives the previous version)
    4. **ARCHIVED** - Outdated versions kept for historical purposes

    ## Authentication
    Use the `X-Agent` header with an absolute URI to identify the agent performing the operation.
    Example: `X-Agent: mailto:user@example.org`
  title: EPOS Metadata Lifecycle API
  version: 2.2.0
servers:
- description: Development server
  url: http://localhost:8080
tags:
- description: System information and health checks
  name: System
- description: Search and discovery endpoints
  name: Search
- description: Direct SPARQL query access
  name: SPARQL
- description: OAI-PMH 2.0 metadata harvesting
  name: OAI-PMH
- description: CRUD operations on metadata resources
  name: Resources
- description: "Lifecycle management (submit, publish)"
  name: Lifecycle
- description: Resource history and versions
  name: Versioning
- description: Batch submit and publish multiple entities
  name: Batch
- description: "Administrative operations (population, maintenance)"
  name: Admin
paths:
  /health:
    get:
      description: Check the service status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_health_get_200_response"
          description: Service operational
      summary: Health check
      tags:
      - System
  /api/v2/resource-types:
    get:
      description: Retrieve available resource types parsed from SHACL shapes
      parameters:
      - description: Include resolvable shape definitions map keyed by shape IRI
        explode: true
        in: query
        name: includeShapeDefinitions
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Include only shape definitions reachable from resource type properties
          via sh:node references
        explode: true
        in: query
        name: includeTransitiveShapeDefinitions
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Add cycle-safe recursive reference metadata per shape definition
        explode: true
        in: query
        name: includeResolvedRefs
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v2_resource_types_get_200_response"
          description: List of resource types
      summary: List resource types
      tags:
      - System
  /api/v2/search:
    get:
      description: |
        Search across all entity types with filtering, pagination, and hierarchical facets.

        **Full GeoSPARQL Spatial Filtering Support:**
        - `bbox`: Simple bounding box filter
        - `geo` + `geoRelation`: Custom WKT geometry with spatial relation
        - `lat`, `lon`, `radius`: Point + radius filter (km)

        **Spatial Relations (geoRelation parameter):**
        - `intersects` (default): Entity intersects the query geometry
        - `within`: Entity is completely within the query geometry
        - `contains`: Entity completely contains the query geometry
        - `overlaps`: Entity overlaps the query geometry
        - `touches`: Entity touches the query geometry
        - `disjoint`: Entity does not touch the query geometry

        **Hierarchical Concept/Theme Filtering:**
        - `concept`: Filter by specific concept URI (dcat:theme)
        - `conceptScheme`: Filter by concept scheme (returns entities themed with any concept in that scheme)

        **Data Provider Filtering:**
        - `dataProvider`: Filter by data provider organization URI
        - `organization`: Filter by organization name (text search)

        **Hierarchical Facets (when facets=true):**
        - `conceptSchemes`: ConceptSchemes with child Concepts and entity counts
        - `dataProviders`: Organizations with resource type breakdown
      parameters:
      - description: Free text search query
        example: seismic data
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: Filter by resource type
        example: dataset
        explode: true
        in: query
        name: type
        required: false
        schema:
          type: string
        style: form
      - description: Lifecycle status filter
        explode: true
        in: query
        name: status
        required: false
        schema:
          default: published
          enum:
          - draft
          - submitted
          - published
          - archived
          type: string
        style: form
      - description: "Bounding box filter (minLon,minLat,maxLon,maxLat). Uses GeoSPARQL\
          \ for spatial filtering."
        example: "-10,35,30,70"
        explode: true
        in: query
        name: bbox
        required: false
        schema:
          type: string
        style: form
      - description: "WKT geometry for spatial filtering (e.g., POLYGON, POINT, LINESTRING)"
        example: "POLYGON((10 40, 40 40, 40 10, 10 10, 10 40))"
        explode: true
        in: query
        name: geo
        required: false
        schema:
          type: string
        style: form
      - description: Spatial relation to use with bbox or geo parameter
        explode: true
        in: query
        name: geoRelation
        required: false
        schema:
          default: intersects
          enum:
          - within
          - intersects
          - contains
          - overlaps
          - touches
          - disjoint
          - crosses
          - equals
          type: string
        style: form
      - description: Latitude for point + radius filter
        example: 45.5
        explode: true
        in: query
        name: lat
        required: false
        schema:
          format: double
          type: number
        style: form
      - description: Longitude for point + radius filter
        example: 9.2
        explode: true
        in: query
        name: lon
        required: false
        schema:
          format: double
          type: number
        style: form
      - description: Radius in kilometers for point + radius filter
        example: 100
        explode: true
        in: query
        name: radius
        required: false
        schema:
          format: double
          type: number
        style: form
      - description: Temporal filter start date (ISO 8601)
        explode: true
        in: query
        name: startDate
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Temporal filter end date (ISO 8601)
        explode: true
        in: query
        name: endDate
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Comma-separated keywords filter
        example: "earthquake,seismology"
        explode: true
        in: query
        name: keywords
        required: false
        schema:
          type: string
        style: form
      - description: Filter by organization URI or name (text search)
        explode: true
        in: query
        name: organization
        required: false
        schema:
          type: string
        style: form
      - description: Filter by concept URI (dcat:theme). Returns entities tagged with
          this specific concept.
        example: https://epos-eu.org/concept/seismology
        explode: true
        in: query
        name: concept
        required: false
        schema:
          type: string
        style: form
      - description: Filter by concept scheme URI. Returns entities tagged with any
          concept in that scheme.
        example: https://epos-eu.org/conceptscheme/domains
        explode: true
        in: query
        name: conceptScheme
        required: false
        schema:
          type: string
        style: form
      - description: Filter by data provider organization URI (exact match)
        example: https://epos-eu.org/organization/ingv
        explode: true
        in: query
        name: dataProvider
        required: false
        schema:
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          type: integer
        style: form
      - description: Include facet counts in response
        explode: true
        in: query
        name: facets
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: |
          How to group results when facets=true. Matches resources-service behavior.
          - categories: Group results hierarchically by ConceptScheme -> Concept
          - dataproviders: Group results by data provider organization
          - serviceproviders: Group results by service provider organization
          - none: Return flat list with facet counts only (default)
        explode: true
        in: query
        name: facetstype
        required: false
        schema:
          default: none
          enum:
          - none
          - categories
          - dataproviders
          - serviceproviders
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v2_search_get_200_response"
          description: Search results
      summary: Search across all entities
      tags:
      - Search
  /api/v2/details/{id}:
    get:
      description: |
        Retrieve detailed information about a specific entity.

        **Standard Response (extended=false):**
        Returns EDM-mapped properties with relations as hrefs.

        **Extended/Aggregated Response (extended=true):**
        Returns fully nested response matching resources-service structure:
        - Nested relatedDataProducts with full DataProduct info
        - Nested relatedWebservices with Operations and ServiceParameters
        - Spatial and temporal extents as structured objects
        - Contact points with person info
        - Available formats for download/access
        - Categories as facet tree
      parameters:
      - description: Entity URI (URL encoded)
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: status
        required: false
        schema:
          default: published
          enum:
          - draft
          - submitted
          - published
          - archived
          type: string
        style: form
      - description: Response format
        explode: true
        in: query
        name: format
        required: false
        schema:
          default: json
          enum:
          - json
          - turtle
          - jsonld
          - rdfxml
          type: string
        style: form
      - description: |
          If true, returns aggregated response with nested related entities
          (DataProducts, WebServices, Operations) matching resources-service structure.
        explode: true
        in: query
        name: extended
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v2_details__id__get_200_response"
          description: Entity details
        "404":
          description: Entity not found
      summary: Get entity details
      tags:
      - Search
  /api/v2/sparql:
    post:
      description: |
        Execute a SPARQL query against the triple store.
        Supports SELECT, ASK, CONSTRUCT, and DESCRIBE queries.
        UPDATE operations are not allowed.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/_api_v2_sparql_post_request"
          application/sparql-query:
            schema:
              type: string
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2_sparql_post_request_1"
        required: true
      responses:
        "200":
          content:
            application/sparql-results+json:
              schema:
                type: object
            application/sparql-results+xml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            application/n-triples:
              schema:
                type: string
            text/turtle:
              schema:
                type: string
          description: Query results
        "400":
          description: Invalid query
        "403":
          description: UPDATE operations not allowed
      summary: Execute SPARQL query
      tags:
      - SPARQL
  /oai-pmh:
    get:
      description: |
        OAI-PMH 2.0 compliant endpoint for metadata harvesting.

        Supported verbs: Identify, ListMetadataFormats, ListSets, ListIdentifiers, ListRecords, GetRecord

        Supported metadata formats: oai_dc (Dublin Core), dcat (DCAT-AP), epos_dcat_ap (EPOS-DCAT-AP)
      parameters:
      - description: OAI-PMH verb
        explode: true
        in: query
        name: verb
        required: true
        schema:
          enum:
          - Identify
          - ListMetadataFormats
          - ListSets
          - ListIdentifiers
          - ListRecords
          - GetRecord
          type: string
        style: form
      - description: "Metadata format (required for ListIdentifiers, ListRecords,\
          \ GetRecord)"
        explode: true
        in: query
        name: metadataPrefix
        required: false
        schema:
          enum:
          - oai_dc
          - dcat
          - epos_dcat_ap
          type: string
        style: form
      - description: Record identifier (required for GetRecord)
        explode: true
        in: query
        name: identifier
        required: false
        schema:
          type: string
        style: form
      - description: Set specification for selective harvesting
        explode: true
        in: query
        name: set
        required: false
        schema:
          type: string
        style: form
      - description: Start date for selective harvesting (ISO 8601)
        explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: End date for selective harvesting (ISO 8601)
        explode: true
        in: query
        name: until
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Token for paginated results
        explode: true
        in: query
        name: resumptionToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            text/xml:
              schema:
                type: string
          description: OAI-PMH XML response
      summary: OAI-PMH 2.0 endpoint
      tags:
      - OAI-PMH
  /api/v2/{resourceType}:
    get:
      description: Retrieve a paginated list of entities of a specific type
      parameters:
      - example: dataset
        explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: status
        required: false
        schema:
          default: published
          enum:
          - draft
          - submitted
          - published
          - archived
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 20
          type: integer
        style: form
      responses:
        "200":
          description: List of entities
      summary: List entities
      tags:
      - Resources
    post:
      description: Create a new entity in DRAFT state
      parameters:
      - example: dataset
        explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - example: mailto:user@example.org
        explode: false
        in: header
        name: X-Agent
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2__resourceType__post_request"
        required: true
      responses:
        "201":
          description: Entity created
      summary: Create new entity (DRAFT)
      tags:
      - Resources
  /api/v2/{resourceType}/{id}:
    delete:
      parameters:
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - description: Full entity URI
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Entity deleted
      summary: Delete entity (DRAFT only)
      tags:
      - Resources
    get:
      description: Retrieve entity details. Supports multiple formats via Accept header
        or format parameter.
      parameters:
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - description: Full entity URI
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: status
        required: false
        schema:
          default: published
          enum:
          - draft
          - submitted
          - published
          - archived
          type: string
        style: form
      - explode: true
        in: query
        name: format
        required: false
        schema:
          enum:
          - json
          - turtle
          - ttl
          - jsonld
          - rdfxml
          - ntriples
          type: string
        style: form
      responses:
        "200":
          description: Entity details
        "404":
          description: Entity not found
      summary: Get entity
      tags:
      - Resources
    put:
      parameters:
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - description: Full entity URI
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Agent
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2__resourceType___id__put_request"
        required: true
      responses:
        "200":
          description: Entity updated
      summary: Update entity (DRAFT only)
      tags:
      - Resources
  /api/v2/{resourceType}/{id}/submit:
    post:
      description: Move an entity from DRAFT to SUBMITTED
      parameters:
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Agent
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Entity submitted
      summary: Submit for review
      tags:
      - Lifecycle
  /api/v2/{resourceType}/{id}/publish:
    post:
      description: Publish an entity from SUBMITTED to PUBLISHED
      parameters:
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Agent
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Entity published
      summary: Publish entity
      tags:
      - Lifecycle
  /api/v2/{resourceType}/{id}/draft:
    post:
      description: Creates a new draft version from a published entity
      parameters:
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: version
        required: false
        schema:
          default: "2.0"
          type: string
        style: form
      - explode: false
        in: header
        name: X-Agent
        required: false
        schema:
          type: string
        style: simple
      responses:
        "201":
          description: Draft created
      summary: Create new draft from published
      tags:
      - Lifecycle
  /api/v2/{resourceType}/{id}/history:
    get:
      description: Retrieve all versions of a conceptual entity
      parameters:
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Version history
      summary: Version history
      tags:
      - Versioning
  /api/v2/batch/submit:
    post:
      description: Submit multiple entities in a single request
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2_batch_submit_post_request"
        required: true
      responses:
        "200":
          description: Batch operation completed
      summary: Batch submit entities
      tags:
      - Batch
  /api/v2/batch/publish:
    post:
      description: Publish multiple entities in a single request
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2_batch_submit_post_request"
        required: true
      responses:
        "200":
          description: Batch operation completed
      summary: Batch publish entities
      tags:
      - Batch
  /api/v2/{resourceType}/{id}/repair:
    post:
      description: Repair missing conceptual graph entries or provenance records
      parameters:
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Agent
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Entity repaired
      summary: Repair entity metadata
      tags:
      - Admin
  /api/v2/admin/populate:
    post:
      description: Triggers initial population from the configured INDEX_URL
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: false
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Population completed
        "500":
          description: Population failed
      summary: Populate database from TTL files
      tags:
      - Admin
  /api/v2/admin/populate/from-url:
    post:
      description: Triggers population from a custom index URL
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2_admin_populate_from_url_post_request"
        required: true
      responses:
        "200":
          description: Population completed
        "400":
          description: Missing indexUrl
        "500":
          description: Population failed
      summary: Populate from custom URL
      tags:
      - Admin
  /api/v2/admin/populate/status:
    get:
      description: Returns current population configuration
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v2_admin_populate_status_get_200_response"
          description: Population configuration
      summary: Get population configuration
      tags:
      - Admin
  /api/v2/admin/populate/file:
    post:
      description: |
        Populates the database from a single TTL source.
        You can provide either:
        - `url`: an HTTP(S) URL to a TTL file
        - `path`: a local filesystem path to a TTL file available on the server
        Useful for loading individual TTL files from GitHub, HTTP endpoints, or mounted local volumes.

        **Private Repository Support:**
        Use the `X-Source-Authorization` header to access private GitHub repositories.
        The header value is forwarded as the `Authorization` header when fetching the file.

        Example URLs:
        - GitHub raw (public): https://raw.githubusercontent.com/org/repo/main/data.ttl
        - GitHub raw (private): Use X-Source-Authorization header with "token ghp_xxx"
        - Direct URLs: https://example.com/metadata.ttl
      parameters:
      - description: Agent URI for provenance tracking
        explode: false
        in: header
        name: X-Agent
        required: false
        schema:
          type: string
        style: simple
      - description: |
          Authorization header to forward when fetching the URL.
          For GitHub private repos, use "token ghp_YOUR_PERSONAL_ACCESS_TOKEN"
        example: token ghp_xxxxxxxxxxxx
        explode: false
        in: header
        name: X-Source-Authorization
        required: false
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2_admin_populate_file_post_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v2_admin_populate_file_post_200_response"
          description: Population completed
        "400":
          description: Invalid request (missing/invalid source or both url and path
            provided)
        "500":
          description: Population failed
      summary: Populate from URL or local TTL file
      tags:
      - Admin
