    ResourceType:
      enum:
      - dataset
      - distribution
      - software-application
      - software-source-code
      - category
      type: string
    VersioningStatus:
      enum:
      - DRAFT
      - SUBMITTED
      - PUBLISHED
      - ARCHIVED
      type: string
    SearchResponse:
      example:
        total: 0
        items:
        - name: name
          id: id
          href: href
          serviceProviders:
          - serviceProviders
          - serviceProviders
          categories:
          - categories
          - categories
          type: dataset
        - name: name
          id: id
          href: href
          serviceProviders:
          - serviceProviders
          - serviceProviders
          categories:
          - categories
          - categories
          type: dataset
      properties:
