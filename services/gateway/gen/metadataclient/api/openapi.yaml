openapi: 3.1.0
info:
  contact:
    email: support@epos-eu.org
    name: EPOS Development Team
    url: https://epos-eu.org
  description: |
    OpenAPI specification for the EPOS catalogue API.

    ## Design Principles
    - Search returns heterogeneous, typed resource items in a flat list.
    - Clients navigate by following `href` links; they never construct URLs themselves.
    - All cross-entity references carry an `href` pointing to the typed detail endpoint.

    ## Lifecycle States
    - **DRAFT** - Resource is being edited
    - **SUBMITTED** - Resource submitted for review
    - **PUBLISHED** - Resource is publicly visible
    - **ARCHIVED** - Outdated versions kept for historical purposes

    ## Authentication
    Mutating operations require both headers with absolute URIs:
    - `X-Agent` identifies the acting agent.
    - `X-Group` identifies the acting group.
    Example:
    - `X-Agent: mailto:user@example.org`
    - `X-Group: https://epos-eu.org/group/ingestion-team`
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  termsOfService: https://www.epos-eu.org/sites/default/files/2026-02/Terms_and_ConditionsJan26_1.pdf
  title: EPOS API
  version: 2.0.0
servers:
- description: Development server
  url: http://localhost:8080
tags:
- description: Search across all resource types
  name: Search
- description: Dataset resources
  name: Datasets
- description: Distribution resources
  name: Distributions
- description: Software application resources
  name: Software Applications
- description: Software source code resources
  name: Software Source Codes
- description: Category taxonomy resources
  name: Categories
- description: System information and health checks
  name: System
- description: Direct SPARQL query access
  name: SPARQL
- description: OAI-PMH 2.0 metadata harvesting
  name: OAI-PMH
- description: CRUD operations on metadata resources
  name: Resources
- description: "Lifecycle management (submit, publish)"
  name: Lifecycle
- description: Resource history and versions
  name: Versioning
- description: Batch submit and publish multiple entities
  name: Batch
- description: "Administrative operations (population, maintenance)"
  name: Admin
paths:
  /health:
    get:
      description: Check the service status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_health_get_200_response"
          description: Service operational
      summary: Health check
      tags:
      - System
  /api/v2/resource-types:
    get:
      description: |
        Retrieve available resource types parsed from SHACL shapes (default view),
        or export the original cached SHACL graph in RDF formats.
      parameters:
      - description: Response view. `parsed` returns JSON resource types; `shacl`
          returns raw SHACL RDF.
        explode: true
        in: query
        name: view
        required: false
        schema:
          default: parsed
          enum:
          - parsed
          - shacl
          type: string
        style: form
      - description: RDF serialization format used when `view=shacl`
        explode: true
        in: query
        name: format
        required: false
        schema:
          enum:
          - turtle
          - ttl
          - jsonld
          - json-ld
          - rdfxml
          - rdf+xml
          - ntriples
          - n-triples
          - nt
          type: string
        style: form
      - description: "When `true` and `view=shacl`, returns compact/beautified output\
          \ for JSON-LD and Turtle"
        explode: true
        in: query
        name: compact
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Include resolvable shape definitions map keyed by shape IRI (only
          for `view=parsed`)
        explode: true
        in: query
        name: includeShapeDefinitions
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Include only shape definitions reachable from resource type properties
          via sh:node references (only for `view=parsed`)
        explode: true
        in: query
        name: includeTransitiveShapeDefinitions
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Add cycle-safe recursive reference metadata per shape definition
          (only for `view=parsed`)
        explode: true
        in: query
        name: includeResolvedRefs
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v2_resource_types_get_200_response"
            text/turtle:
              schema:
                type: string
            application/ld+json:
              schema:
                type: string
            application/rdf+xml:
              schema:
                type: string
            application/n-triples:
              schema:
                type: string
          description: "Parsed resource types or raw SHACL RDF, depending on `view`"
      summary: List resource types
      tags:
      - System
  /api/v2/search:
    get:
      description: |
        Returns a flat, typed list of catalogue resources matching the supplied criteria.
        Results may include datasets, distributions, software applications, software source
        codes, and categories. Each item carries an `href` pointing to its typed detail
        endpoint; clients should follow that link rather than construct URLs themselves.

        **Spatial Filtering:**
        - `spatialFilter`: WKT polygon string (EPSG:4326)

        **Temporal Filtering:**
        - `dateFrom`, `dateTo`: ISO 8601 date-time range

        **Multi-value Parameters:**
        Parameters like `type`, `keywords`, `serviceProvider`, and `versioningStatus` accept
        multiple values by repeating the parameter: `?type=dataset&type=distribution`
      operationId: searchMetadata
      parameters:
      - $ref: "#/components/parameters/Q"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/ResultsPerPage"
      - $ref: "#/components/parameters/TypeFilter"
      - $ref: "#/components/parameters/SpatialFilter"
      - $ref: "#/components/parameters/DateFrom"
      - $ref: "#/components/parameters/DateTo"
      - $ref: "#/components/parameters/ServiceProviders"
      - $ref: "#/components/parameters/VersioningStatusFilter"
      - $ref: "#/components/parameters/Keywords"
      responses:
        "200":
          content:
            application/json:
              examples:
                mixedResults:
                  summary: Mixed resource search results
                  value:
                    total: 42
                    items:
                    - type: dataset
                      id: "123"
                      name: IRPINIA Seismic Stations
                      href: https://metadata.epos-eu.org/api/v2/dataset/123
                      serviceProviders:
                      - UNINA
                      categories:
                      - Seismology
                      - Strong Motion
                    - type: category
                      id: cat-seismology
                      name: Seismology
                      href: https://metadata.epos-eu.org/api/v2/category/cat-seismology
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: Search results returned successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Search metadata resources
      tags:
      - Search
  /api/v2/category:
    get:
      description: |
        Returns the complete category tree as an ordered list of category schemes.
        Each scheme carries its full subtree of nested `Category` objects.
        Intended as the primary data source for building facet navigation in clients.
      operationId: getCategoryTree
      responses:
        "200":
          content:
            application/json:
              examples:
                tree:
                  summary: Category tree with one scheme
                  value:
                    schemes:
                    - id: scheme-solid-earth
                      label: Solid Earth
                      title: Solid Earth Science Categories
                      description: Top-level grouping for solid earth science resources.
                      logo: https://www.epos-eu.org/logos/solid-earth.png
                      homepage: https://www.epos-eu.org/solid-earth
                      color: "#3A7BD5"
                      orderNumber: 1
                      type: DATA
                      children:
                      - id: cat-seismology
                        name: Seismology
                        description: Resources related to seismic monitoring.
                        children:
                        - id: cat-strong-motion
                          name: Strong Motion
                          children: []
              schema:
                $ref: "#/components/schemas/CategoryTreeResponse"
          description: Category tree returned successfully
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Get full category tree
      tags:
      - Categories
  /api/v2/category/{id}:
    get:
      description: Returns a single category node with its full subtree of children.
      operationId: getCategoryById
      parameters:
      - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
          description: Category found
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Get category by id
      tags:
      - Categories
    parameters:
    - $ref: "#/components/parameters/ResourceId"
  /api/v2/dataset/{id}:
    get:
      description: |
        Returns detailed information about a specific dataset.
        Includes distributions as resource references with hrefs.
        Inbound relations (entities referencing this dataset) are always included when present.
      operationId: getDatasetById
      parameters:
      - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
          description: Dataset found
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Get dataset by id
      tags:
      - Datasets
    parameters:
    - $ref: "#/components/parameters/ResourceId"
  /api/v2/distribution/{id}:
    get:
      description: |
        Returns detailed information about a specific distribution.
        Inbound relations (entities referencing this distribution) are always included when present.
      operationId: getDistributionById
      parameters:
      - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distribution"
          description: Distribution found
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Get distribution by id
      tags:
      - Distributions
    parameters:
    - $ref: "#/components/parameters/ResourceId"
  /api/v2/software-application/{id}:
    get:
      description: |
        Returns detailed information about a specific software application.
        Inbound relations (entities referencing this application) are always included when present.
      operationId: getSoftwareApplicationById
      parameters:
      - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftwareApplication"
          description: Software application found
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Get software application by id
      tags:
      - Software Applications
    parameters:
    - $ref: "#/components/parameters/ResourceId"
  /api/v2/software-source-code/{id}:
    get:
      description: |
        Returns detailed information about a specific software source code.
        Inbound relations (entities referencing this source code) are always included when present.
      operationId: getSoftwareSourceCodeById
      parameters:
      - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftwareSourceCode"
          description: Software source code found
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Get software source code by id
      tags:
      - Software Source Codes
    parameters:
    - $ref: "#/components/parameters/ResourceId"
  /api/v2/sparql:
    post:
      description: |
        Execute a SPARQL query against the triple store.
        Supports SELECT, ASK, CONSTRUCT, and DESCRIBE queries.
        UPDATE operations are not allowed.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/_api_v2_sparql_post_request"
          application/sparql-query:
            schema:
              type: string
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2_sparql_post_request_1"
        required: true
      responses:
        "200":
          content:
            application/sparql-results+json:
              schema:
                type: object
            application/sparql-results+xml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            application/n-triples:
              schema:
                type: string
            text/turtle:
              schema:
                type: string
          description: Query results
        "400":
          description: Invalid query
        "403":
          description: UPDATE operations not allowed
      summary: Execute SPARQL query
      tags:
      - SPARQL
  /oai-pmh:
    get:
      description: |
        OAI-PMH 2.0 compliant endpoint for metadata harvesting.

        Supported verbs: Identify, ListMetadataFormats, ListSets, ListIdentifiers, ListRecords, GetRecord

        Supported metadata formats: oai_dc (Dublin Core), dcat (DCAT-AP), epos_dcat_ap (EPOS-DCAT-AP)
      parameters:
      - description: OAI-PMH verb
        explode: true
        in: query
        name: verb
        required: true
        schema:
          enum:
          - Identify
          - ListMetadataFormats
          - ListSets
          - ListIdentifiers
          - ListRecords
          - GetRecord
          type: string
        style: form
      - description: "Metadata format (required for ListIdentifiers, ListRecords,\
          \ GetRecord)"
        explode: true
        in: query
        name: metadataPrefix
        required: false
        schema:
          enum:
          - oai_dc
          - dcat
          - epos_dcat_ap
          type: string
        style: form
      - description: Record identifier (required for GetRecord)
        explode: true
        in: query
        name: identifier
        required: false
        schema:
          type: string
        style: form
      - description: Set specification for selective harvesting
        explode: true
        in: query
        name: set
        required: false
        schema:
          type: string
        style: form
      - description: Start date for selective harvesting (ISO 8601)
        explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: End date for selective harvesting (ISO 8601)
        explode: true
        in: query
        name: until
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Token for paginated results
        explode: true
        in: query
        name: resumptionToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            text/xml:
              schema:
                type: string
          description: OAI-PMH XML response
      summary: OAI-PMH 2.0 endpoint
      tags:
      - OAI-PMH
  /api/v2/{resourceType}:
    get:
      description: Retrieve a paginated list of entities of a specific type
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          default: published
          enum:
          - draft
          - submitted
          - published
          - archived
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 20
          type: integer
        style: form
      - example: dataset
        explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: List of entities
      summary: List entities
      tags:
      - Resources
    parameters:
    - example: dataset
      explode: false
      in: path
      name: resourceType
      required: true
      schema:
        type: string
      style: simple
    post:
      description: Create a new entity in DRAFT state
      parameters:
      - example: mailto:user@example.org
        explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - example: https://epos-eu.org/group/ingestion-team
        explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - example: dataset
        explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2__resourceType__post_request"
        required: true
      responses:
        "201":
          description: Entity created
      summary: Create new entity (DRAFT)
      tags:
      - Resources
  /api/v2/{resourceType}/{id}:
    delete:
      parameters:
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - description: Full entity URI
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Entity deleted
      summary: Delete entity (DRAFT only)
      tags:
      - Resources
    get:
      description: Retrieve entity details. Supports multiple formats via Accept header
        or format parameter.
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          default: published
          enum:
          - draft
          - submitted
          - published
          - archived
          type: string
        style: form
      - explode: true
        in: query
        name: format
        required: false
        schema:
          enum:
          - json
          - turtle
          - ttl
          - jsonld
          - rdfxml
          - ntriples
          type: string
        style: form
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - description: Full entity URI
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Entity details
        "404":
          description: Entity not found
      summary: Get entity
      tags:
      - Resources
    parameters:
    - explode: false
      in: path
      name: resourceType
      required: true
      schema:
        type: string
      style: simple
    - description: Full entity URI
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    patch:
      description: Merge semantics. Only the provided properties are replaced; all
        other properties are preserved.
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - description: Full entity URI
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2__resourceType___id__put_request"
        required: true
      responses:
        "200":
          description: Entity patched
      summary: Patch entity (DRAFT only)
      tags:
      - Resources
    put:
      description: Full replace semantics. Properties not included in the request
        are removed from the draft entity.
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - description: Full entity URI
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2__resourceType___id__put_request"
        required: true
      responses:
        "200":
          description: Entity updated
      summary: Update entity (DRAFT only)
      tags:
      - Resources
  /api/v2/{resourceType}/{id}/submit:
    parameters:
    - explode: false
      in: path
      name: resourceType
      required: true
      schema:
        type: string
      style: simple
    - explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    post:
      description: Move an entity from DRAFT to SUBMITTED
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Entity submitted
      summary: Submit for review
      tags:
      - Lifecycle
  /api/v2/{resourceType}/{id}/publish:
    parameters:
    - explode: false
      in: path
      name: resourceType
      required: true
      schema:
        type: string
      style: simple
    - explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    post:
      description: Publish an entity from SUBMITTED to PUBLISHED
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Entity published
      summary: Publish entity
      tags:
      - Lifecycle
  /api/v2/{resourceType}/{id}/draft:
    parameters:
    - explode: false
      in: path
      name: resourceType
      required: true
      schema:
        type: string
      style: simple
    - explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    post:
      description: Creates a new draft version from a published entity
      parameters:
      - explode: true
        in: query
        name: version
        required: false
        schema:
          default: "2.0"
          type: string
        style: form
      - explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "201":
          description: Draft created
      summary: Create new draft from published
      tags:
      - Lifecycle
  /api/v2/{resourceType}/{id}/history:
    get:
      description: "Retrieve all versions of a conceptual entity, including status,\
        \ agent, and group provenance"
      parameters:
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionHistoryResponse"
          description: Version history
      summary: Version history
      tags:
      - Versioning
    parameters:
    - explode: false
      in: path
      name: resourceType
      required: true
      schema:
        type: string
      style: simple
    - explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
  /api/v2/batch/submit:
    post:
      description: Submit multiple entities in a single request
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
