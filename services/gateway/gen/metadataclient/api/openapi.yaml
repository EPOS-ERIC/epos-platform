openapi: 3.1.0
info:
  contact:
    email: support@epos-eu.org
    name: EPOS Development Team
    url: https://epos-eu.org
  description: |
    OpenAPI specification for the EPOS catalogue API.

    ## Design Principles
    - Search returns heterogeneous, typed resource items in a flat list.
    - Clients navigate by following `href` links; they never construct URLs themselves.
    - All cross-entity references carry an `href` pointing to the typed detail endpoint.

    ## Lifecycle States
    - **DRAFT** - Resource is being edited
    - **SUBMITTED** - Resource submitted for review
    - **PUBLISHED** - Resource is publicly visible
    - **ARCHIVED** - Outdated versions kept for historical purposes

    ## Authentication
    Mutating operations require both headers with absolute URIs:
    - `X-Agent` identifies the acting agent.
    - `X-Group` identifies the acting group.
    Example:
    - `X-Agent: mailto:user@example.org`
    - `X-Group: https://epos-eu.org/group/ingestion-team`
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
  termsOfService: https://www.epos-eu.org/sites/default/files/2026-02/Terms_and_ConditionsJan26_1.pdf
  title: EPOS API
  version: 2.0.0
servers:
- description: Development server
  url: http://localhost:8080
tags:
- description: Unified shape access for list and detail retrieval
  name: Access
- description: System information and health checks
  name: System
- description: Direct SPARQL query access
  name: SPARQL
- description: OAI-PMH 2.0 metadata harvesting
  name: OAI-PMH
- description: CRUD operations on metadata resources
  name: Resources
- description: "Lifecycle management (submit, publish)"
  name: Lifecycle
- description: Resource history and versions
  name: Versioning
- description: Batch submit and publish multiple entities
  name: Batch
- description: "Administrative operations (population, maintenance)"
  name: Admin
paths:
  /health:
    get:
      description: Check the service status
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_health_get_200_response"
          description: Service operational
      summary: Health check
      tags:
      - System
  /api/v2/resource-types:
    get:
      description: |
        Retrieve available resource types parsed from SHACL shapes (default view),
        or export the original cached SHACL graph in RDF formats.
      parameters:
      - description: Response view. `parsed` returns JSON resource types; `shacl`
          returns raw SHACL RDF.
        explode: true
        in: query
        name: view
        required: false
        schema:
          default: parsed
          enum:
          - parsed
          - shacl
          type: string
        style: form
      - description: RDF serialization format used when `view=shacl`
        explode: true
        in: query
        name: format
        required: false
        schema:
          enum:
          - turtle
          - ttl
          - jsonld
          - json-ld
          - rdfxml
          - rdf+xml
          - ntriples
          - n-triples
          - nt
          type: string
        style: form
      - description: "When `true` and `view=shacl`, returns compact/beautified output\
          \ for JSON-LD and Turtle"
        explode: true
        in: query
        name: compact
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Include resolvable shape definitions map keyed by shape IRI (only
          for `view=parsed`)
        explode: true
        in: query
        name: includeShapeDefinitions
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Include only shape definitions reachable from resource type properties
          via sh:node references (only for `view=parsed`)
        explode: true
        in: query
        name: includeTransitiveShapeDefinitions
        required: false
        schema:
          default: false
          type: boolean
        style: form
      - description: Add cycle-safe recursive reference metadata per shape definition
          (only for `view=parsed`)
        explode: true
        in: query
        name: includeResolvedRefs
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v2_resource_types_get_200_response"
            text/turtle:
              schema:
                type: string
            application/ld+json:
              schema:
                type: string
            application/rdf+xml:
              schema:
                type: string
            application/n-triples:
              schema:
                type: string
          description: "Parsed resource types or raw SHACL RDF, depending on `view`"
      summary: List resource types
      tags:
      - System
  /api/v2/access/search:
    get:
      description: "Returns a flat, typed list of catalogue resources matching the\
        \ supplied criteria."
      parameters:
      - $ref: "#/components/parameters/Q"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/ResultsPerPage"
      - $ref: "#/components/parameters/TypeFilter"
      - $ref: "#/components/parameters/SpatialFilter"
      - $ref: "#/components/parameters/DateFrom"
      - $ref: "#/components/parameters/DateTo"
      - $ref: "#/components/parameters/ServiceProviders"
      - $ref: "#/components/parameters/VersioningStatusFilter"
      - $ref: "#/components/parameters/Keywords"
      - description: "When true, include SHACL-driven `fields` in each search item."
        explode: true
        in: query
        name: includeConstraints
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: Search results returned successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Search resources
      tags:
      - Access
  /api/v2/access/search/{shape}:
    get:
      description: "Access search scoped to a single shape (equivalent to applying\
        \ `type={shape}`)."
      parameters:
      - description: Runtime SHACL shape/resource type name.
        explode: false
        in: path
        name: shape
        required: true
        schema:
          type: string
        style: simple
      - $ref: "#/components/parameters/Q"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/ResultsPerPage"
      - $ref: "#/components/parameters/SpatialFilter"
      - $ref: "#/components/parameters/DateFrom"
      - $ref: "#/components/parameters/DateTo"
      - $ref: "#/components/parameters/ServiceProviders"
      - $ref: "#/components/parameters/VersioningStatusFilter"
      - $ref: "#/components/parameters/Keywords"
      - description: "When true, include SHACL-driven `fields` in each search item."
        explode: true
        in: query
        name: includeConstraints
        required: false
        schema:
          default: false
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: Search results returned successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Search resources by shape
      tags:
      - Access
  /api/v2/access/{shape}/{id}:
    get:
      description: |
        Unified access endpoint.
        - `id=all` returns all resources for the selected shape.
        - any other id returns the detailed property-value and property-relation structure.
      parameters:
      - description: Runtime SHACL shape/resource type name.
        explode: false
        in: path
        name: shape
        required: true
        schema:
          type: string
        style: simple
      - description: Resource id or `all`.
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/_api_v2_access__shape___id__get_200_response"
          description: Access response returned successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
      summary: Access shape resources and details
      tags:
      - Access
  /api/v2/sparql:
    post:
      description: |
        Execute a SPARQL query against the triple store.
        Supports SELECT, ASK, CONSTRUCT, and DESCRIBE queries.
        UPDATE operations are not allowed.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/_api_v2_sparql_post_request"
          application/sparql-query:
            schema:
              type: string
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2_sparql_post_request_1"
        required: true
      responses:
        "200":
          content:
            application/sparql-results+json:
              schema:
                type: object
            application/sparql-results+xml:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            application/n-triples:
              schema:
                type: string
            text/turtle:
              schema:
                type: string
          description: Query results
        "400":
          description: Invalid query
        "403":
          description: UPDATE operations not allowed
      summary: Execute SPARQL query
      tags:
      - SPARQL
  /oai-pmh:
    get:
      description: |
        OAI-PMH 2.0 compliant endpoint for metadata harvesting.

        Supported verbs: Identify, ListMetadataFormats, ListSets, ListIdentifiers, ListRecords, GetRecord

        Supported metadata formats: oai_dc (Dublin Core), dcat (DCAT-AP), epos_dcat_ap (EPOS-DCAT-AP)
      parameters:
      - description: OAI-PMH verb
        explode: true
        in: query
        name: verb
        required: true
        schema:
          enum:
          - Identify
          - ListMetadataFormats
          - ListSets
          - ListIdentifiers
          - ListRecords
          - GetRecord
          type: string
        style: form
      - description: "Metadata format (required for ListIdentifiers, ListRecords,\
          \ GetRecord)"
        explode: true
        in: query
        name: metadataPrefix
        required: false
        schema:
          enum:
          - oai_dc
          - dcat
          - epos_dcat_ap
          type: string
        style: form
      - description: Record identifier (required for GetRecord)
        explode: true
        in: query
        name: identifier
        required: false
        schema:
          type: string
        style: form
      - description: Set specification for selective harvesting
        explode: true
        in: query
        name: set
        required: false
        schema:
          type: string
        style: form
      - description: Start date for selective harvesting (ISO 8601)
        explode: true
        in: query
        name: from
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: End date for selective harvesting (ISO 8601)
        explode: true
        in: query
        name: until
        required: false
        schema:
          format: date-time
          type: string
        style: form
      - description: Token for paginated results
        explode: true
        in: query
        name: resumptionToken
        required: false
        schema:
          type: string
        style: form
      responses:
        "200":
          content:
            text/xml:
              schema:
                type: string
          description: OAI-PMH XML response
      summary: OAI-PMH 2.0 endpoint
      tags:
      - OAI-PMH
    post:
      description: |
        Same behavior as GET, with arguments in
        application/x-www-form-urlencoded body.
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/_oai_pmh_post_request"
        required: false
      responses:
        "200":
          content:
            text/xml:
              schema:
                type: string
          description: OAI-PMH XML response (including protocol errors)
      summary: OAI-PMH 2.0 endpoint (POST)
      tags:
      - OAI-PMH
  /api/v2/{resourceType}:
    get:
      description: "Retrieve a paginated list of entities of a specific type. For\
        \ status=draft, X-Agent can scope results to drafts created by that agent."
      parameters:
      - description: Optional agent URI used to filter draft results for this actor.
        explode: false
        in: header
        name: X-Agent
        required: false
        schema:
          type: string
        style: simple
      - explode: true
        in: query
        name: status
        required: false
        schema:
          default: published
          enum:
          - draft
          - submitted
          - published
          - archived
          - discarded
          type: string
        style: form
      - explode: true
        in: query
        name: page
        required: false
        schema:
          default: 1
          type: integer
        style: form
      - explode: true
        in: query
        name: pageSize
        required: false
        schema:
          default: 20
          type: integer
        style: form
      - example: dataset
        explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: List of entities
      summary: List entities
      tags:
      - Resources
    parameters:
    - example: dataset
      explode: false
      in: path
      name: resourceType
      required: true
      schema:
        type: string
      style: simple
    post:
      description: Create a new entity in DRAFT state
      parameters:
      - example: mailto:user@example.org
        explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - example: https://epos-eu.org/group/ingestion-team
        explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - example: dataset
        explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2__resourceType__post_request"
        required: true
      responses:
        "201":
          description: Entity created
      summary: Create new entity (DRAFT)
      tags:
      - Resources
  /api/v2/{resourceType}/{id}:
    delete:
      description: Deletes a DRAFT version. Request fails with 409 if the resolved
        resource is not in DRAFT status.
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - description: "Resource identifier (conceptual id, version id, or identifier)"
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Entity deleted
        "404":
          description: Entity not found
        "409":
          description: Resolved resource is not in DRAFT status
      summary: Delete entity (DRAFT only)
      tags:
      - Resources
    get:
      description: Retrieve entity details. Supports multiple formats via Accept header
        or format parameter.
      parameters:
      - explode: true
        in: query
        name: status
        required: false
        schema:
          default: published
          enum:
          - draft
          - submitted
          - published
          - archived
          - discarded
          type: string
        style: form
      - explode: true
        in: query
        name: format
        required: false
        schema:
          enum:
          - json
          - turtle
          - ttl
          - jsonld
          - rdfxml
          - ntriples
          type: string
        style: form
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - description: "Resource identifier (conceptual id, version id, or identifier)"
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Entity details
        "404":
          description: Entity not found
      summary: Get entity
      tags:
      - Resources
    parameters:
    - explode: false
      in: path
      name: resourceType
      required: true
      schema:
        type: string
      style: simple
    - description: "Resource identifier (conceptual id, version id, or identifier)"
      explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    patch:
      description: Merge semantics. Only the provided properties are replaced; all
        other properties are preserved. Request fails with 409 if the resolved resource
        is not in DRAFT status.
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - description: "Resource identifier (conceptual id, version id, or identifier)"
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2__resourceType___id__put_request"
        required: true
      responses:
        "200":
          description: Entity patched
        "404":
          description: Entity not found
        "409":
          description: Resolved resource is not in DRAFT status
      summary: Patch entity (DRAFT only)
      tags:
      - Resources
    put:
      description: Full replace semantics. Properties not included in the request
        are removed from the draft entity. Request fails with 409 if the resolved
        resource is not in DRAFT status.
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - description: "Resource identifier (conceptual id, version id, or identifier)"
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/_api_v2__resourceType___id__put_request"
        required: true
      responses:
        "200":
          description: Entity updated
        "404":
          description: Entity not found
        "409":
          description: Resolved resource is not in DRAFT status
      summary: Update entity (DRAFT only)
      tags:
      - Resources
  /api/v2/{resourceType}/{id}/submit:
    parameters:
    - explode: false
      in: path
      name: resourceType
      required: true
      schema:
        type: string
      style: simple
    - explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    post:
      description: "Move an entity from DRAFT to SUBMITTED. Path id may be a conceptual\
        \ id, version id, or identifier, but it must resolve to a DRAFT version."
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Entity submitted
        "404":
          description: Entity not found
        "409":
          description: Resource resolves to non-DRAFT status
      summary: Submit for review
      tags:
      - Lifecycle
  /api/v2/{resourceType}/{id}/publish:
    parameters:
    - explode: false
      in: path
      name: resourceType
      required: true
      schema:
        type: string
      style: simple
    - explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    post:
      description: "Publish an entity from SUBMITTED to PUBLISHED. Path id may be\
        \ a conceptual id, version id, or identifier, but it must resolve to a SUBMITTED\
        \ version."
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Entity published
        "404":
          description: Entity not found
        "409":
          description: Resource resolves to non-SUBMITTED status
      summary: Publish entity
      tags:
      - Lifecycle
  /api/v2/{resourceType}/{id}/draft:
    parameters:
    - explode: false
      in: path
      name: resourceType
      required: true
      schema:
        type: string
      style: simple
    - explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    post:
      description: "Creates a new draft version from a published entity. Path id may\
        \ be conceptual id, version id, or identifier and is resolved to conceptual\
        \ resource. The new version number is auto-incremented from the current published\
        \ version."
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "201":
          description: Draft created
        "404":
          description: Resource not found
      summary: Create new draft from published
      tags:
      - Lifecycle
  /api/v2/{resourceType}/{id}/discard:
    parameters:
    - explode: false
      in: path
      name: resourceType
      required: true
      schema:
        type: string
      style: simple
    - explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
    post:
      description: "Move an entity from DRAFT or SUBMITTED to DISCARDED. Path id may\
        \ be a conceptual id, version id, or identifier."
      parameters:
      - explode: false
        in: header
        name: X-Agent
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: header
        name: X-Group
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          description: Entity discarded
        "404":
          description: Entity not found
        "409":
          description: Resource resolves to non-discardable status
      summary: Discard draft/submitted entity
      tags:
      - Lifecycle
  /api/v2/{resourceType}/{id}/history:
    get:
      description: "Retrieve all versions of a conceptual entity, including status,\
        \ agent, and group provenance"
      parameters:
      - explode: false
        in: path
        name: resourceType
        required: true
        schema:
          type: string
        style: simple
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionHistoryResponse"
          description: Version history
      summary: Version history
      tags:
      - Versioning
    parameters:
    - explode: false
      in: path
      name: resourceType
      required: true
      schema:
        type: string
      style: simple
    - explode: false
      in: path
      name: id
      required: true
      schema:
        type: string
      style: simple
  /api/v2/batch/submit:
    post:
