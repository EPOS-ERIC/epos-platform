openapi: 3.0.3
info:
  title: EPOS API
  version: 1.0.0
  description: |
    OpenAPI specification for the EPOS catalogue API.

    Design notes:
    - Search returns heterogeneous, typed resource items in a flat list.
    - Clients navigate by following `href` links; they never construct URLs themselves.
    - All cross-entity references carry an `href` pointing to the typed detail endpoint.
  termsOfService: https://www.epos-eu.org/sites/default/files/2026-02/Terms_and_ConditionsJan26_1.pdf
  contact:
    email: someemail@epos.com
  license:
    name: AGPL
    url: https://www.gnu.org/licenses/agpl-3.0.en.html

servers:
  - url: /v1
    description: Relative versioned API base path

tags:
  - name: Discovery
    description: Search and taxonomy bootstrap endpoints
  - name: Resources
    description: Resource detail endpoints

paths:
  /search:
    get:
      tags:
        - Discovery
      summary: Search metadata resources
      description: |
        Returns a flat, typed list of catalogue resources matching the supplied criteria.
        Results may include datasets, distributions, software applications, and software
        source codes. Each item carries an `href` pointing to its typed detail
        endpoint; clients should follow that link rather than construct URLs themselves.
      operationId: searchMetadata
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/TypeFilter"
        - $ref: "#/components/parameters/SpatialFilter"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/ServiceProviders"
        - $ref: "#/components/parameters/VersioningStatus"
        - $ref: "#/components/parameters/Keywords"
      responses:
        "200":
          description: Search results returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              examples:
                mixedResults:
                  summary: Mixed resource search results
                  value:
                    total: 42
                    items:
                      - type: dataset
                        id: "123"
                        name: "IRPINIA Seismic Stations"
                        href: "/v1/dataset/123"
                        data_providers:
                          - "UNINA"
                        concepts:
                          - "Seismology"
                          - "Strong Motion"
                      - type: distribution
                        id: "456"
                        name: "FDSN Station Service"
                        href: "/v1/distribution/456"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /dataset/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Resources
      summary: Get dataset by id
      operationId: getDatasetById
      responses:
        "200":
          description: Dataset found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /distribution/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Resources
      summary: Get distribution by id
      operationId: getDistributionById
      responses:
        "200":
          description: Distribution found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distribution"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /software-application/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Resources
      summary: Get software application by id
      operationId: getSoftwareApplicationById
      responses:
        "200":
          description: Software application found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftwareApplication"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /software-source-code/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Resources
      summary: Get software source code by id
      operationId: getSoftwareSourceCodeById
      responses:
        "200":
          description: Software source code found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftwareSourceCode"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /agg-operation{resourcetype}{sourceid che può essere dataset, distribution o webservice}:
  # si farà un'aggegazione di tutte le operation associate all'entità che viene passata, quindi i mapping, il template, i plugin, ... e si ritorna una lista con un oggetto per ogni operation aggregata

  /concept:
    get:
      tags:
        - Discovery
      summary: Get full concept tree
      description: |
        Returns the complete concept tree as an ordered list of concept schemes.
        Each scheme carries its full subtree of nested `Concept` objects.
        Intended as the primary data source for building facet navigation in clients.
      operationId: getConceptTree
      responses:
        "200":
          description: Concept tree returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConceptTreeResponse"
              examples:
                tree:
                  summary: Concept tree with one scheme
                  value:
                    schemes:
                      - id: "scheme-solid-earth"
                        label: "Solid Earth"
                        title: "Solid Earth Science Concepts"
                        description: "Top-level grouping for solid earth science resources."
                        logo: "https://www.epos-eu.org/logos/solid-earth.png"
                        homepage: "https://www.epos-eu.org/solid-earth"
                        color: "#3A7BD5"
                        order_number: 1
                        type: "DATA"
                        children:
                          - id: "concept-seismology"
                            name: "Seismology"
                            description: "Resources related to seismic monitoring."
                            children:
                              - id: "concept-strong-motion"
                                name: "Strong Motion"
                                children: []
        "500":
          $ref: "#/components/responses/InternalServerError"

  /concept/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Resources
      summary: Get concept by id
      description: Returns a single concept node with its full subtree of children.
      operationId: getConceptById
      responses:
        "200":
          description: Concept found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Concept"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Local identifier of the resource
      schema:
        type: string
        example: "123"

    Q:
      name: q
      in: query
      required: false
      description: Free-text search query
      schema:
        type: string
        example: "seismic stations"

    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of items to return per page
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
        example: 10

    PageNumber:
      name: pageNumber
      in: query
      required: false
      description: 1-based page index to return
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1

    TypeFilter:
      name: type
      in: query
      required: false
      description: |
        Filter results to one or more resource types. When omitted, all supported search
        resource types are returned.
        Pass comma-separated values in a single parameter: `?type=dataset,distribution`.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/ResourceType"
      style: form
      explode: false

    SpatialFilter:
      name: spatialFilter
      in: query
      required: false
      description: |
        Spatial filter expressed as a WKT polygon string (EPSG:4326).
        Resources whose spatial coverage intersects this polygon are returned.
        Example: `POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))`
      schema:
        type: string
        example: "POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))"

    DateFrom:
      name: dateFrom
      in: query
      required: false
      description: |
        Start of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Resources with temporal coverage overlapping this range are returned.
      schema:
        type: string
        format: date-time
        example: "2020-01-01T00:00:00Z"

    DateTo:
      name: dateTo
      in: query
      required: false
      description: |
        End of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Must be greater than or equal to `dateFrom` when both are supplied.
      schema:
        type: string
        format: date-time
        example: "2023-12-31T23:59:59Z"

    ServiceProviders:
      name: serviceProvider
      in: query
      required: false
      description: |
        Filter by one or more service provider names.
        Pass comma-separated values in a single parameter:
        `?serviceProvider=INGV,UNINA`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false

    VersioningStatus:
      name: versioningStatus
      in: query
      required: false
      description: |
        Filter by one or more versioning statuses.
        When omitted, defaults to `PUBLISHED`.
        Pass comma-separated values in a single parameter:
        `?versioningStatus=PUBLISHED,DRAFT`.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/VersioningStatus"
        default:
          - PUBLISHED
      style: form
      explode: false

    Keywords:
      name: keywords
      in: query
      required: false
      description: |
        Filter resources that carry all the supplied keywords.
        Pass comma-separated values in a single parameter:
        `?keywords=seismology,stations`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # -------------------------------------------------------------------------
    # Shared enums
    # -------------------------------------------------------------------------

    ResourceType:
      type: string
      enum:
        - dataset
        - distribution
        - software-application
        - software-source-code

    VersioningStatus:
      type: string
      enum:
        - DRAFT
        - SUBMITTED
        - PUBLISHED
        - ARCHIVED

    # -------------------------------------------------------------------------
    # Search
    # -------------------------------------------------------------------------

    SearchResponse:
      type: object
      required:
        - total
        - items
      properties:
        total:
          type: integer
          minimum: 0
          description: Total number of matching resources across all pages
          example: 123
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchItem"

    SearchItem:
      oneOf:
        - $ref: "#/components/schemas/DatasetSearchItem"
        - $ref: "#/components/schemas/GenericSearchItem"
      discriminator:
        propertyName: type
        mapping:
          dataset: "#/components/schemas/DatasetSearchItem"
          distribution: "#/components/schemas/GenericSearchItem"
          software-application: "#/components/schemas/GenericSearchItem"
          software-source-code: "#/components/schemas/GenericSearchItem"

    BaseSearchItem:
      type: object
      required:
        - type
        - id
        - name
        - href
      properties:
        type:
          $ref: "#/components/schemas/ResourceType"
        id:
          type: string
          example: "123"
        name:
          type: string
          example: "IRPINIA Seismic Stations"
        href:
          type: string
          description: Path to the typed detail endpoint. Follow this link; do not construct URLs.
          example: "/v1/dataset/123"

    DatasetSearchItem:
      allOf:
        - $ref: "#/components/schemas/BaseSearchItem"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - dataset
            data_providers:
              type: array
              description: Display names of organisations providing this dataset
              items:
                type: string
              example:
                - "UNINA"
                - "INGV"
            concepts:
              type: array
              description: Concept labels assigned to this dataset
              items:
                type: string
              example:
                - "Seismology"
                - "Strong Motion"

    GenericSearchItem:
      allOf:
        - $ref: "#/components/schemas/BaseSearchItem"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - distribution
                - software-application
                - software-source-code

    # -------------------------------------------------------------------------
    # Detail schemas
    # -------------------------------------------------------------------------

    BaseDetailResource:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string

    Dataset:
      allOf:
        - $ref: "#/components/schemas/BaseDetailResource"
        - type: object
          properties:
            created:
              type: string
              format: date-time
              description: Resource creation timestamp in ISO 8601 UTC
              example: "2024-01-15T10:30:00Z"
            modified:
              type: string
              format: date-time
              description: Resource last modification timestamp in ISO 8601 UTC
              example: "2024-03-01T08:45:00Z"
            version_info:
              type: string
              description: Human-readable version information for this dataset
              example: "Revision 3 reviewed by EPOS"
            contact_points:
              type: array
              description: IDs of contact points associated with this dataset
              items:
                type: string
              example:
                - "contact-point-1"
                - "contact-point-2"
            keywords:
              type: array
              items:
                type: string
              example:
                - "seismology"
                - "stations"
                - "Irpinia"
            concepts:
              type: array
              description: Concept labels assigned to this dataset
              items:
                type: string
              example:
                - "Seismology"
                - "Strong Motion"
            publisher:
              type: array
              description: Names of the organisations publishing this dataset
              items:
                type: string
              example:
                - "UNINA"
                - "INGV"
            issued:
              type: string
              format: date-time
              description: Dataset publication or issuance timestamp in ISO 8601 UTC
              example: "2024-02-01T00:00:00Z"
            spatial:
              type: string
              description: Spatial coverage expressed as a WKT polygon (EPSG:4326)
              example: "POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))"
            identifiers:
              type: array
              description: External or domain-specific identifiers for this dataset
              items:
                $ref: "#/components/schemas/Identifier"
            temporal:
              $ref: "#/components/schemas/TemporalExtent"
            status:
              $ref: "#/components/schemas/VersioningStatus"
            distributions:
              type: array
              description: Distributions that provide access to this dataset
              items:
                $ref: "#/components/schemas/Distribution"
              example:
                - id: "456"
                  title: "FDSN Station Service"
                  access_url: "https://service.example.org/fdsnws/station/1/query"
                  operation: "getFDSNStationXML"
                - id: "457"
                  title: "FDSN Event Service"
                  access_url: "https://service.example.org/fdsnws/event/1/query"
            access_rights:
              type: string
              description: Access rights statement for this dataset
              example: "open"
            accrual_periodicity:
              type: string
              description: Frequency with which this dataset is updated
              example: "monthly"
            is_version_of:
              type: string
              description: Identifier of parent resource this dataset version derives from
              example: "dataset-root-123"
            quality_annotation:
              type: array
              description: Quality annotation identifiers associated with this dataset
              items:
                type: string
              example:
                - "qa-1"
                - "qa-2"
            version:
              type: string
              description: Machine-readable version string for this dataset
              example: "3.1.0"

    Distribution:
      allOf:
        - $ref: "#/components/schemas/BaseDetailResource"
        - type: object
          properties:
            access_url:
              type: string
              format: uri
              description: URL used to access the distribution
              example: "https://service.example.org/fdsnws/station/1/query"
            operation:
              type: string
              description: Operation ID describing the service operation exposed by this distribution
              example: "getFDSNStationXML"

    SoftwareApplication:
      allOf:
        - $ref: "#/components/schemas/BaseDetailResource"
        - type: object
          properties:
            keywords:
              type: array
              items:
                type: string
              example:
                - "portal"
                - "seismology"
                - "data access"
            concepts:
              type: array
              description: Concept labels assigned to this application
              items:
                type: string
              example:
                - "Seismology"
                - "Data Services"
            download_url:
              type: string
              format: uri
              description: URL to download or install the application
              example: "https://example.org/application/download"

    SoftwareSourceCode:
      allOf:
        - $ref: "#/components/schemas/BaseDetailResource"
        - type: object
          properties:
            programming_language:
              type: string
              description: Primary programming language of the source code
              example: "Java"
            keywords:
              type: array
              items:
                type: string
              example:
                - "portal"
                - "seismology"
                - "open source"
            concepts:
              type: array
              description: Concept labels assigned to this source code
              items:
                type: string
              example:
                - "Seismology"
                - "Data Services"
            repository:
              type: string
              format: uri
              description: URL of the source code repository
              example: "https://github.com/example/epos-portal"

    Concept:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: "concept-seismology"
        name:
          type: string
          example: "Seismology"
        description:
          type: string
          example: "Resources related to seismic monitoring and analysis."
        children:
          type: array
          description: Nested child concepts
          items:
            $ref: "#/components/schemas/Concept"

    ConceptScheme:
      type: object
      required:
        - id
        - label
        - type
      properties:
        id:
          type: string
          example: "scheme-solid-earth"
        label:
          type: string
          example: "Solid Earth"
        title:
          type: string
          example: "Solid Earth Science Concepts"
        description:
          type: string
          example: "Top-level grouping for all solid earth science resources."
        logo:
          type: string
          format: uri
          example: "https://www.epos-eu.org/logos/solid-earth.png"
        homepage:
          type: string
          format: uri
          example: "https://www.epos-eu.org/solid-earth"
        color:
          type: string
          description: Hex colour code used for UI rendering
          example: "#3A7BD5"
        order_number:
          type: integer
          description: Display order among sibling concept schemes
          example: 1
        type:
          type: string
          enum:
            - DATA
            - FACILITY
            - SOFTWARE
          example: "DATA"
        children:
          type: array
          description: Top-level concepts within this scheme
          items:
            $ref: "#/components/schemas/Concept"

    ConceptTreeResponse:
      type: object
      required:
        - schemes
      properties:
        schemes:
          type: array
          description: Ordered list of concept schemes, each carrying its full concept subtree
          items:
            $ref: "#/components/schemas/ConceptScheme"

    # -------------------------------------------------------------------------
    # Shared helpers
    # -------------------------------------------------------------------------

    TemporalExtent:
      type: object
      description: Temporal coverage of a resource
      properties:
        start:
          type: string
          format: date-time
          description: Start of the temporal coverage (inclusive), ISO 8601 UTC
          example: "2010-01-01T00:00:00Z"
        end:
          type: string
          format: date-time
          description: End of the temporal coverage (inclusive), ISO 8601 UTC. Omitted for open-ended coverage.
          example: "2023-12-31T23:59:59Z"

    Identifier:
      type: object
      description: Typed identifier attached to a resource
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: Identifier scheme or type
          example: "doi"
        value:
          type: string
          description: Identifier value
          example: "10.13127/tsunami/neamthm18"

    ErrorResponse:
      type: object
      required:
        - error_code
        - error_message
      properties:
        error_code:
          type: string
          example: "RESOURCE_NOT_FOUND"
        error_message:
          type: string
          example: "The requested resource was not found"
