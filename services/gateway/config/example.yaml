server:
  listen: ":5000"
  cors_allow_origin: "http://localhost:4200"
  request_timeout: "30s"
  read_timeout: "15s"
  write_timeout: "30s"
  idle_timeout: "60s"

upstream:
  timeout: "5s"
  real_timeout: "15s"
  cache_ttl: "0s"
  max_entries: 128

discovery:
  fan_out_limit: 64

services:
  metadata-lifecycle:
    url: "http://metadata-lifecycle:8080/"
  usergroup:
    url: "http://usergroup:8080/"
