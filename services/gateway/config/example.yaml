server:
  listen: ":5000"
  cors_allow_origin: "http://localhost:4200"
  request_timeout: "30s"
  read_timeout: "15s"
  write_timeout: "30s"
  idle_timeout: "60s"

upstream:
  timeout: "5s"
  real_timeout: "15s"
  cache_ttl: "0s"
  max_entries: 128

services:
  metadata-lifecycle:
    url: "http://metadata-lifecycle:5000/"
  metadata-lifecycle-grpc:
    url: "metadata-lifecycle:5001"
  auth:
    url: "http://oss-aai-service:8080/"
