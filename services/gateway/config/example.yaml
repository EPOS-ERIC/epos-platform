server:
  listen: ":5000"
  cors_allow_origin: "http://localhost:4200"
  request_timeout: "60s"

authentication:
  root_url: "http://localhost:35000"

# Set both URLs to expose the issue tracker in capabilities.
issue_tracker:
  url: ""
  open_new: ""

metadata_sync:
  enabled: false
  base_url: "https://epos-backoffice-tool.nina.elicos.it"
  username: ""
  password_env: "ELICOS_PASSWORD"
  cron: "*/15 * * * *" # UTC
  timeout: "5m"

services:
  metadata-lifecycle:
    url: "metadata-lifecycle:5000"
  data-retriever:
    url: "data-retriever:8100"
  converter:
    url: "converter:8200"
  sharing:
    url: "sharing:8200"
  auth:
    url: "http://oss-aai-service:8080/oauth2/userinfo"

notifications:
  mailgun:
    enable: false
    domain: ""
    from: ""
    api_key_env: "MAILGUN_API_TOKEN"
    timeout: "10s"
    # Nonempty list redirects every email to these addresses instead of real recipients.
    recipient_overrides: []
