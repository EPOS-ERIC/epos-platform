server:
  listen: ":5000"
  cors_allow_origin: "http://localhost:4200"
  request_timeout: "60s"
  read_timeout: "15s"
  write_timeout: "30s"
  idle_timeout: "60s"

services:
  metadata-lifecycle:
    url: "metadata-lifecycle:5000"
  data-retriever:
    url: "data-retriever:8100"
  sharing:
    url: "sharing:8200"
  auth:
    url: "http://oss-aai-service:8080/"

notifications:
  mailgun:
    enable: false
    domain: ""
    from: ""
    api_key_env: "MAILGUN_API_TOKEN"
    timeout: "10s"
