      operationId: grantGlobalPermission
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Global permission granted
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
        - Users
      summary: Revoke global permission
      description: Revoke a global permission from a user. Requires global.permission.manage or global ADMIN.
      operationId: revokeGlobalPermission
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Global permission revoked
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /users/{id}/block:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags:
        - Users
      summary: Block user
      description: Block a user with a required reason. Requires active global ADMIN. Existing memberships, roles, grants, and subscriptions remain stored.
      operationId: blockUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUserRequest"
      responses:
        "204":
          description: User blocked
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /users/{id}/unblock:
    parameters:
      - $ref: "#/components/parameters/UserID"
    post:
      tags:
        - Users
      summary: Unblock user
      description: Restore a blocked user to ACTIVE. Requires active global ADMIN.
      operationId: unblockUser
      security:
        - bearerAuth: []
      responses:
        "204":
          description: User unblocked
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /users/{id}/global-roles/{role}:
    parameters:
      - $ref: "#/components/parameters/UserID"
      - $ref: "#/components/parameters/GlobalRole"
    put:
      tags:
        - Users
      summary: Assign global role
      description: Assign a global role to a user. Requires active global ADMIN. Only ADMIN is valid.
      operationId: assignGlobalRole
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Global role assigned
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    delete:
      tags:
        - Users
      summary: Remove global role
      description: Remove a global role from a user. Removing the last active ADMIN is rejected.
      operationId: removeGlobalRole
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Global role removed
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /groups/{groupId}/resources:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags:
        - Resources
      summary: Create resource draft
      description: Creates an editable draft in the group. Request body shape is selected by `resource_type`.
      operationId: createResource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceDraftRequest"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /groups/{groupId}/resources/{resourceType}/{id}/copy:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags:
        - Resources
      summary: Copy resource
      description: Creates an independent draft copy in the group identified by `groupId`, with new resource and child identities. The target group is taken from the URL, not the request body.
      operationId: copyResource
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Resource copied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /resources/{id}/versions/{versionId}/draft:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/VersionId"
    put:
      tags:
        - Resources
      summary: Replace resource draft version
      description: >-
        Replaces all metadata in an editable draft. Request shape is selected by
        `resource_type` and includes the current revision. To retain a distribution,
        web service, parameter, layer, or identifier, send its `resource_id` from
        the draft read response. Omit `resource_id` for a new child; omit an existing
        child from its collection to remove it. IDs must belong to the same draft and
        parent. Parameters cannot move between collections or web services. Changing
        a parameter's PATH, QUERY, or HEADER location within its collection is an edit.
        Child `id` identifies the version-specific record and is not sent on writes.
      operationId: replaceResourceDraftVersion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceResourceDraftRequest"
      responses:
        "200":
          description: Draft version replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /resources/{resourceType}/{id}/versions/{versionId}/draft:
    parameters:
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/VersionId"
    delete:
      tags:
        - Resources
      summary: Delete resource draft version
      description: Permanently deletes an existing editable DRAFT or REJECTED active change version. This operation does not create or assign a lifecycle status.
      operationId: discardResourceDraftVersion
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Draft version deleted
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /resources/{resourceType}/{id}/versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/VersionId"
    get:
      tags:
        - Resources
      summary: Get resource version
      description: Returns a published version publicly, or a non-public version when caller has access to its group.
      operationId: getResourceVersion
      security:
        - {}
        - bearerAuth: []
      responses:
        "200":
          description: Resource version found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceVersion"
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /resources/{resourceType}/{id}/versions:
    parameters:
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Resources
      summary: List resource versions
      description: Returns the version history for a resource. Requires an authenticated user with access to the resource's owning group.
      operationId: listResourceVersions
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource version summaries returned
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceVersionSummary"
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /resources/{resourceType}/{id}/versions/{versionId}/submit:
    parameters:
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/VersionId"
    post:
      tags:
        - Resources
      summary: Submit resource version
      operationId: submitResourceVersion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource version submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /resources/{resourceType}/{id}/versions/{versionId}/withdraw:
    parameters:
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/VersionId"
    post:
      tags:
        - Resources
      summary: Withdraw resource version
      operationId: withdrawResourceVersion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource version withdrawn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /resources/{resourceType}/{id}/versions/{versionId}/reject:
    parameters:
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/VersionId"
    post:
      tags:
        - Resources
      summary: Reject resource version
      description: Rejects a submitted resource version and records the required reviewer note.
      operationId: rejectResourceVersion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectResourceRequest"
      responses:
        "200":
          description: Resource version rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /resources/{resourceType}/{id}/versions/{versionId}/reopen:
    parameters:
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/VersionId"
    post:
      tags:
        - Resources
      summary: Reopen resource version
      operationId: reopenResourceVersion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource version reopened
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /resources/{resourceType}/{id}/versions/{versionId}/publish:
    parameters:
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/VersionId"
    post:
      tags:
        - Resources
      summary: Publish resource version
      operationId: publishResourceVersion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource version published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /resources/{resourceType}/{id}/versions/{versionId}/unpublish:
    parameters:
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
      - $ref: "#/components/parameters/VersionId"
    post:
      tags:
        - Resources
      summary: Unpublish resource version
      operationId: unpublishResourceVersion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource version unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /resources/{resourceType}/{id}/draft-from-publication:
    parameters:
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags:
        - Resources
      summary: Create draft from publication
      description: Creates a draft version with new version-specific IDs and the same logical resource IDs as the published version.
      operationId: draftFromPublication
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /resources/{resourceType}/{id}/draft-from-archive:
    parameters:
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags:
        - Resources
      summary: Create draft from archive
      description: Creates a draft version with new version-specific IDs and the same logical resource IDs as the latest archived version.
      operationId: draftFromArchive
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        default:
          description: Gateway error
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource identifier.
      schema:
        type: string
        format: uuid

    GetUserID:
      name: id
      in: path
      required: true
      description: User identifier. Use `self` to resolve the authenticated user.
      schema:
        type: string
        example: self

    UserID:
      name: id
      in: path
      required: true
      description: User identifier.
      schema:
        type: string

    NotificationUserId:
      name: userId
      in: path
      required: true
      description: Target user identifier. Use `self` for the authenticated user.
      schema:
        type: string
        minLength: 1

    GlobalNotificationTopicKey:
      name: topicKey
      in: path
      required: true
      description: Global notification topic key.
      schema:
        $ref: "#/components/schemas/GlobalNotificationTopicKey"

    GroupNotificationTopicKey:
      name: topicKey
      in: path
      required: true
      description: Group notification topic key.
      schema:
        $ref: "#/components/schemas/GroupNotificationTopicKey"

    Permission:
      name: permission
      in: path
      required: true
      description: Global permission key.
      example: global.permission.manage
      schema:
        $ref: "#/components/schemas/GlobalPermission"

    GlobalRole:
      name: role
      in: path
      required: true
      description: Global role key.
      schema:
        type: string
        enum: [ADMIN]
        example: ADMIN

    MembershipUserId:
      name: userId
      in: path
      required: true
      description: User identifier for membership operations.
      schema:
        type: string

    DeleteMembershipUserId:
      name: userId
      in: path
      required: true
      description: User identifier for membership deletion. Use 'self' to target the authenticated user.
      schema:
        type: string

    Decision:
      name: decision
      in: path
      required: true
      description: Decision to apply to the pending request.
      schema:
        type: string
        enum: [accept, reject]

    GroupRole:
      name: role
      in: path
      required: true
      description: Group role to assign or remove.
      schema:
        type: string
        enum: [EDITOR, REVIEWER, GROUP_ADMIN]

    GroupPermission:
      name: permission
      in: path
      required: true
      description: Group-scoped permission to grant or revoke.
      schema:
        $ref: "#/components/schemas/GroupPermission"

    GroupId:
      name: groupId
      in: path
      required: true
      description: Group identifier.
      schema:
        type: string
        format: uuid

    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Category identifier.
      schema:
        type: string
        format: uuid

    VersionId:
      name: versionId
      in: path
      required: true
      description: Resource version identifier.
      schema:
        type: string
        format: uuid

    LifecycleResourceType:
      name: resourceType
      in: path
      required: true
      description: Resource type identifier accepted by lifecycle endpoints.
      schema:
        type: string
        enum:
          - dataset
          - software-application
          - software-source-code

    Q:
      name: q
      in: query
      required: false
      description: Free-text query used to search catalogue resources.
      schema:
        type: string
        example: "historical earthquakes"

    TypeFilter:
      name: type
      in: query
      required: false
      description: |
        Filter results to one or more resource types. When omitted, all supported
        resource types are returned.
        Pass comma-separated values in a single parameter:
        `?type=dataset,software-application`.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/DiscoveryResourceType"
      style: form
      explode: false

    ConceptFilter:
      name: concept
      in: query
      required: false
      description: |
        Filter results to one or more catalogue concepts. Pass comma-separated
        values in a single parameter: `?concept=DATA,SOFTWARE`.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/DiscoveryConcept"
      style: form
      explode: false

    GroupFilter:
      name: groupId
      in: query
      required: false
      description: Filter results to resources belonging to the specified group.
      schema:
        type: string
        format: uuid

    EditorFilter:
      name: editorId
      in: query
      required: false
      description: Filter results by the user who created the resource version.
      schema:
        type: string

    SpatialFilter:
      name: spatialFilter
      in: query
      required: false
      description: |
        Dataset spatial filter expressed as a WKT POINT or POLYGON string
        (EPSG:4326). Datasets whose spatial coverage intersects this geometry
        are returned; software resources do not match this filter.
        Example: `POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))`
      schema:
        type: string
        example: "POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))"

    DateFrom:
      name: dateFrom
      in: query
      required: false
      description: |
        Start of the dataset temporal filter (inclusive). ISO 8601 date-time
        (UTC). Datasets with temporal coverage overlapping this range are
        returned; software resources do not match this filter.
        Must be less than or equal to `dateTo` when both are supplied.
      schema:
        type: string
        format: date-time
        example: "2020-01-01T00:00:00Z"

    DateTo:
      name: dateTo
      in: query
      required: false
      description: |
        End of the dataset temporal filter (inclusive). ISO 8601 date-time
        (UTC). Datasets with temporal coverage overlapping this range are
        returned; software resources do not match this filter.
        Must be greater than or equal to `dateFrom` when both are supplied.
      schema:
        type: string
        format: date-time
        example: "2023-12-31T23:59:59Z"

    Provider:
      name: provider
      in: query
      required: false
      description: |
        Filter by one or more organization IDs. For datasets, this matches
        provider organizations. For software applications and source code, this
        matches creator organizations because software resources have no provider
        field.
        Pass comma-separated values in a single parameter:
        `?provider=94f4885e-502e-5f33-ba82-033a72efd827`.
      schema:
        type: array
        items:
          type: string
          format: uuid
      style: form
      explode: false

    VersioningStatus:
      name: versioningStatus
      in: query
      required: false
      description: |
        Filter by one or more versioning states.
        When omitted, defaults to `PUBLISHED`.
        Pass comma-separated values in a single parameter:
        `?versioningStatus=PUBLISHED,DRAFT`.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/VersioningStatus"
        default:
          - PUBLISHED
      style: form
      explode: false

    Keywords:
      name: keywords
      in: query
      required: false
      description: |
        Filter resources that carry all supplied keyword values.
        Pass comma-separated values in a single parameter:
        `?keywords=seismology,stations`.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/Keyword"
      style: form
      explode: false

  responses:
    GatewayError:
      description: Gateway error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: Invalid request parameters
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalidQuery:
              summary: Invalid query parameter
              value:
                type: "validation_failed"
                title: "Bad Request"
                status: 400
                detail: "The request is invalid."

    Unauthorized:
      description: Bearer token missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalidToken:
              summary: Invalid bearer token
              value:
                type: "unauthenticated"
                title: "Unauthorized"
                status: 401
                detail: "Authentication is required."
    Forbidden:
      description: Authenticated user lacks permission
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            forbidden:
              summary: Access denied
              value:
                type: "permission_denied"
                title: "Forbidden"
                status: 403
                detail: "You are not permitted to perform this operation."

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            resourceNotFound:
              summary: Missing resource
              value:
                type: "not_found"
                title: "Not Found"
                status: 404
                detail: "The requested resource was not found."

    Conflict:
      description: Request conflicts with current resource state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            resourceConflict:
              summary: Conflicting resource state
              value:
                type: "conflict"
                title: "Conflict"
                status: 409
                detail: "The operation conflicts with the current state."

    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            internalError:
              summary: Unexpected server failure
              value:
                type: "internal"
                title: "Internal Server Error"
                status: 500
                detail: "An unexpected error occurred."

    GatewayTimeout:
      description: Request could not be completed before timeout
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            upstreamTimeout:
              summary: Request timed out
              value:
                type: "upstream_timeout"
                title: "Gateway Timeout"
                status: 504
                detail: "The request timed out."

    ServiceUnavailable:
      description: Metadata Lifecycle service unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            metadataLifecycleUnavailable:
              summary: Metadata Lifecycle unavailable
              value:
                type: "upstream_unavailable"
                title: "Service Unavailable"
                status: 503
                detail: "A required service is unavailable."

  schemas:
    ConversionRuntime:
      type: string
      enum: [python, java, binary]

    CreateConversionPluginRequest:
      type: object
      additionalProperties: false
      required: [name, repository, branch, runtime]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, default: "" }
        repository: { type: string, description: Public Git repository URL. }
        branch: { type: string, minLength: 1 }
        runtime: { $ref: "#/components/schemas/ConversionRuntime" }
        arguments:
          type: array
          items: { type: string }

    ReplaceConversionPluginRequest:
      type: object
      additionalProperties: false
      required: [name, repository, branch, runtime, enabled]
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string, default: "" }
        repository: { type: string, description: Public Git repository URL. }
        branch: { type: string, minLength: 1 }
        runtime: { $ref: "#/components/schemas/ConversionRuntime" }
        arguments:
          type: array
          items: { type: string }
        enabled: { type: boolean }

    ManagedConversionPlugin:
      type: object
      additionalProperties: false
      required: [id, name, description, repository, branch, runtime, arguments, enabled, installed, installed_commit, created_by, updated_by]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        repository: { type: string }
        branch: { type: string }
        runtime: { $ref: "#/components/schemas/ConversionRuntime" }
        arguments:
          type: array
          items: { type: string }
        enabled: { type: boolean }
        installed: { type: boolean, description: Installation status on the responding converter instance. }
        installed_commit: { type: string, nullable: true, description: Git commit installed on the responding converter instance. }
        created_by: { type: string, description: Immutable creator user ID. }
        updated_by: { type: string, description: Last administrator to change the record. }

    DistributionConversionPlugin:
      type: object
      additionalProperties: false
      required: [id, name, description, repository, enabled, installed, branch, runtime, arguments, relations]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        repository: { type: string }
        enabled: { type: boolean }
        installed: { type: boolean, description: Installation status on the responding converter instance. }
        branch: { type: string }
        runtime: { $ref: "#/components/schemas/ConversionRuntime" }
        arguments:
          type: array
          items: { type: string }
        relations:
          type: array
          items: { $ref: "#/components/schemas/DistributionConversionRelation" }
    DistributionConversionRelation:
      type: object
      additionalProperties: false
      required: [id, input_format, output_format, distribution_id]
      properties:
        id: { type: string, format: uuid }
        input_format: { type: string }
        output_format: { type: string }
        distribution_id: { type: string, format: uuid }
    ConversionRelationInput:
      type: object
      additionalProperties: false
      required: [distribution_id, plugin_id, input_format, output_format]
      properties:
        distribution_id: { type: string, format: uuid }
        plugin_id: { type: string, format: uuid }
        input_format: { type: string, minLength: 1, description: Exact native format string. }
        output_format: { type: string, minLength: 1, description: Output MIME type. }

    ConversionRelation:
      type: object
      additionalProperties: false
      required: [id, distribution_id, plugin_id, input_format, output_format, created_by, updated_by]
      properties:
        id: { type: string, format: uuid, description: Conversion ID used to select this exact relation. }
        distribution_id: { type: string, format: uuid }
        plugin_id: { type: string, format: uuid }
        input_format: { type: string, description: Exact native format string. }
        output_format: { type: string, description: Output MIME type. }
        created_by: { type: string, description: Immutable creator user ID. }
        updated_by: { type: string, description: Last administrator to change the record. }
    PreparedDistributionRequest:
      type: object
      additionalProperties: false
      required: [method, url, headers, body]
      properties:
        method:
          type: string
          enum: [GET, POST, PUT, DELETE]
        url:
          type: string
          format: uri
          description: Fully rendered provider URL, including the encoded query string. Do not encode it again.
        headers:
          type: object
          description: Prepared provider headers; empty object when no headers are defined. Content-Type is never inferred.
          additionalProperties: { type: string }
        body:
          type: string
          nullable: true
          description: Rendered request body as text. Null means absent; an empty string means explicitly empty.

    DistributionAccessRequest:
      oneOf:
        - $ref: "#/components/schemas/HTTPDistributionAccessRequest"
        - $ref: "#/components/schemas/DynamicDistributionAccessRequest"
        - $ref: "#/components/schemas/WFSDistributionAccessRequest"
      discriminator:
        propertyName: type
        mapping:
          HTTP: "#/components/schemas/HTTPDistributionAccessRequest"
          DYNAMIC: "#/components/schemas/DynamicDistributionAccessRequest"
          WFS: "#/components/schemas/WFSDistributionAccessRequest"

    HTTPDistributionAccessRequest:
      type: object
      additionalProperties: false
      required: [type, parameters]
      properties:
        type: { type: string, enum: [HTTP] }
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/DistributionAccessParameter"

    DynamicDistributionAccessRequest:
      type: object
      additionalProperties: false
      required: [type, longitude, latitude, parameters]
      properties:
        type: { type: string, enum: [DYNAMIC] }
        longitude: { type: number, format: double }
        latitude: { type: number, format: double }
        parameters:
          type: array
          description: Ordinary parameter values. Do not include the parameter IDs assigned LONGITUDE or LATITUDE roles; their values are supplied by longitude and latitude.
          items:
            $ref: "#/components/schemas/DistributionAccessParameter"

    WFSDistributionAccessRequest:
      type: object
      additionalProperties: false
      required: [type, parameters]
      properties:
        type: { type: string, enum: [WFS] }
        feature_type: { $ref: "#/components/schemas/NonBlankString" }
        result_limit: { type: integer, format: int64, minimum: 1 }
        bbox:
          type: array
          minItems: 4
          maxItems: 4
          description: Optional CRS84 bounds [west, south, east, north] in degrees, longitude first. Passed to provider without geographic validation or antimeridian handling. Output CRS is always CRS84.
          items: { type: number, format: double }
        parameters:
          type: array
          items:
            $ref: "#/components/schemas/DistributionAccessParameter"

    DistributionAccessParameter:
      type: object
      additionalProperties: false
      required: [id, value]
      properties:
        id: { type: string, format: uuid }
        value:
          oneOf:
            - $ref: "#/components/schemas/DistributionAccessScalar"
            - type: array
              minItems: 1
              items:
                $ref: "#/components/schemas/DistributionAccessScalar"

    DistributionAccessScalar:
      oneOf:
        - type: string
          title: String
        - type: boolean
          title: Boolean
        - type: number
          title: Number

    # -------------------------------------------------------------------------
    # Shared enums
    # -------------------------------------------------------------------------

    NonBlankString:
      type: string
      minLength: 1
      pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'

    StringEnumOption:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }

    IntegerEnumOption:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: integer, format: int64 }
        label: { type: string, minLength: 1 }

    FloatEnumOption:
      type: object
      additionalProperties: false
      required: [value]
      properties:
        value: { type: number, format: double }
        label: { type: string, minLength: 1 }

    Keyword:
      type: string
      minLength: 1
      pattern: "^[A-Za-z0-9 _:-]+$"

    GlobalPermission:
      type: string
      description: Global permission key.
      enum:
        - global.membership.manage
        - global.role.manage
        - global.permission.manage
        - global.notification.manage
        - global.organization.manage
        - global.contact_point.manage
        - global.category_scheme.manage
        - global.resource.create
        - global.resource.edit
        - global.resource.submit
        - global.resource.withdraw
        - global.resource.reopen
        - global.resource.discard
        - global.resource.reject
        - global.resource.publish
        - global.resource.unpublish
        - global.category.manage
        - global.configuration.manage
        - global.converter.manage

    GroupPermission:
      type: string
      description: Group-scoped permission key.
      enum:
        - group.resource.create
        - group.resource.edit
        - group.resource.submit
        - group.resource.withdraw
        - group.resource.reopen
        - group.resource.discard
        - group.resource.reject
        - group.resource.publish
        - group.resource.unpublish
        - group.membership.manage
        - group.role.manage
        - group.permission.manage
        - group.notification.manage
        - group.category.manage

    PermissionScope:
      type: string
      description: Scope at which a permission is evaluated.
      enum: [GLOBAL, GROUP]

    NotificationScope:
      type: string
      enum: [GROUP, GLOBAL]

    NotificationChannel:
      type: string
      enum: [EMAIL]

    NotificationTopicKey:
      type: string
      enum:
        - group.membership.requested
        - global.membership.requested
        - group.role_request.requested
        - global.role_request.requested
        - group.resource.submitted
        - group.resource.published
        - global.resource.submitted
        - global.resource.published
        - global.conversion.requested

    GlobalNotificationTopicKey:
      type: string
      enum:
        - global.membership.requested
        - global.role_request.requested
        - global.resource.submitted
        - global.resource.published
        - global.conversion.requested

    GroupNotificationTopicKey:
      type: string
      enum:
        - group.membership.requested
        - group.role_request.requested
        - group.resource.submitted
        - group.resource.published

    NotificationTopic:
      type: object
      additionalProperties: false
      required: [key, label, description, scope, required_permissions]
      properties:
        key: { $ref: "#/components/schemas/NotificationTopicKey" }
        label:
          type: string
          minLength: 1
          description: Human-readable notification topic label.
        description:
          type: string
          minLength: 1
          description: Human-readable notification topic description.
        scope: { $ref: "#/components/schemas/NotificationScope" }
        required_permissions:
          type: array
          items: { type: string, minLength: 1 }

    NotificationSubscription:
      type: object
      additionalProperties: false
      required: [user_id, topic_key, channel]
      properties:
        user_id: { type: string, minLength: 1 }
        group_id: { type: string, format: uuid }
        topic_key: { $ref: "#/components/schemas/NotificationTopicKey" }
        channel: { $ref: "#/components/schemas/NotificationChannel" }

    Permission:
      type: object
      additionalProperties: false
      required: [key, label, description, scope]
      properties:
        key:
          type: string
          minLength: 1
          description: Stable permission key.
        label:
          type: string
          minLength: 1
          description: Human-readable permission label.
        description:
          type: string
          minLength: 1
          description: Human-readable permission description.
        scope:
          $ref: "#/components/schemas/PermissionScope"

    DiscoveryResourceType:
      type: string
      description: Resource type identifier used in discovery results.
      enum:
        - dataset
        - software-application
        - software-source-code

    DiscoveryConcept:
      type: string
      description: Catalogue concept used to classify a resource.
      enum: [DATA, FACILITIES, SOFTWARE]

    VersioningStatus:
      type: string
      description: Lifecycle state used by resource and discovery operations.
      enum:
        - PUBLISHED
        - DRAFT
        - SUBMITTED
        - ARCHIVED
        - REJECTED

    DatasetDraftMetadata:
      type: object
      additionalProperties: false
      required: [title, description]
      properties:
        title: { $ref: "#/components/schemas/NonBlankString" }
        description: { $ref: "#/components/schemas/NonBlankString" }
        keywords:
          type: array
          items: { $ref: "#/components/schemas/Keyword" }
        accrual_periodicity: { type: string, nullable: true }
        quality_annotation: { type: string, nullable: true }
        access_right: { type: string, nullable: true }
        distributions:
          {
            type: array,
            items: { $ref: "#/components/schemas/DistributionDraft" },
          }
        spatial_coverage:
          type: string
          nullable: true
          minLength: 1
          description: WKT POINT or POLYGON geometry in EPSG:4326.
          example: POINT (12.5 41.9)
        temporal_coverage: { $ref: "#/components/schemas/TemporalCoverage" }
        geological_temporal_coverage:
          {
            $ref: "#/components/schemas/GeologicalTemporalCoverage",
            description: Mutually exclusive with temporal_coverage.
          }
        persistent_identifiers:
          {
            type: array,
            items: { $ref: "#/components/schemas/VersionedIdentifierInput" },
          }
        contact_points: { type: array, items: { type: string, format: uuid } }
        providers: { type: array, items: { type: string, format: uuid } }
        categories: { type: array, items: { type: string, format: uuid } }
        created: { type: string, format: date-time, nullable: true }
        updated: { type: string, format: date-time, nullable: true }

    SoftwareApplicationDraftMetadata:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        description: { $ref: "#/components/schemas/NonBlankString" }
        keywords:
          type: array
          items: { $ref: "#/components/schemas/Keyword" }
        license: { type: string, nullable: true }
        version: { type: string, nullable: true }
        download_url: { type: string, format: uri }
        requirements: { type: string, nullable: true }
        operating_system: { type: string, nullable: true }
        main_entity_of_page: { type: string, format: uri }
        creators: { type: array, items: { type: string, format: uuid } }
        identifiers:
          {
            type: array,
            items: { $ref: "#/components/schemas/VersionedIdentifierInput" },
          }
        categories: { type: array, items: { type: string, format: uuid } }
        contact_points: { type: array, items: { type: string, format: uuid } }

    SoftwareSourceCodeDraftMetadata:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        description: { $ref: "#/components/schemas/NonBlankString" }
        keywords:
          type: array
          items: { $ref: "#/components/schemas/Keyword" }
        repository: { type: string, format: uri }
        programming_language: { type: string }
        license: { type: string, nullable: true }
        software_requirements: { type: string, nullable: true }
        runtime_platform: { type: string, nullable: true }
        main_entity_of_page: { type: string, format: uri }
        version: { type: string, nullable: true }
        creators: { type: array, items: { type: string, format: uuid } }
        identifiers:
          {
            type: array,
            items: { $ref: "#/components/schemas/VersionedIdentifierInput" },
          }
        categories: { type: array, items: { type: string, format: uuid } }
        contact_points: { type: array, items: { type: string, format: uuid } }

    VersionedIdentifierInput:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        resource_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/NonBlankString" }
        value: { $ref: "#/components/schemas/NonBlankString" }

    IdentifierInput:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { $ref: "#/components/schemas/NonBlankString" }
        value: { $ref: "#/components/schemas/NonBlankString" }

    DistributionDraft:
      oneOf:
        - $ref: "#/components/schemas/WebServiceDistributionDraft"
        - $ref: "#/components/schemas/DownloadableFileDistributionDraft"
      discriminator:
        propertyName: type
        mapping:
          "WEB_SERVICE": "#/components/schemas/WebServiceDistributionDraft"
          "DOWNLOADABLE_FILE": "#/components/schemas/DownloadableFileDistributionDraft"

    WebServiceDistributionDraft:
      type: object
      additionalProperties: false
      required: [title, type, web_service]
      properties:
        resource_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        license: { type: string, nullable: true }
        type:
          type: string
          enum:
            - "WEB_SERVICE"
        issued: { type: string, format: date-time, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        byte_size: { type: integer, format: int64, nullable: true, minimum: 1 }
        web_service: { $ref: "#/components/schemas/WebServiceDraft" }

    DownloadableFileDistributionDraft:
      type: object
      additionalProperties: false
      required: [title, type, downloadable_file]
      properties:
        resource_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        license: { type: string, nullable: true }
        type:
          type: string
          enum:
            - "DOWNLOADABLE_FILE"
        issued: { type: string, format: date-time, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        byte_size: { type: integer, format: int64, nullable: true, minimum: 1 }
        downloadable_file: { $ref: "#/components/schemas/DownloadableFile" }

    WebServiceDraft:
      type: object
      additionalProperties: false
      required: [name, configuration]
      properties:
        resource_id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/NonBlankString" }
        description: { type: string, nullable: true, minLength: 1 }
        visible_on:
          type: array
          nullable: true
          minItems: 1
          items: { $ref: "#/components/schemas/WebServiceVisibleOn" }
        provider: { type: string, format: uuid }
        documentation: { $ref: "#/components/schemas/Documentation" }
        spatial_coverage:
          type: string
          nullable: true
          minLength: 1
          description: WKT POINT or POLYGON geometry in EPSG:4326.
          example: POINT (12.5 41.9)
        temporal_coverage: { $ref: "#/components/schemas/TemporalCoverage" }
        contact_points: { type: array, items: { type: string, format: uuid } }
        configuration: { $ref: "#/components/schemas/WebServiceConfigurationDraft" }

    WebServiceConfigurationDraft:
      oneOf:
        - $ref: "#/components/schemas/WmsWebServiceConfigurationDraft"
        - $ref: "#/components/schemas/WmtsWebServiceConfigurationDraft"
        - $ref: "#/components/schemas/WfsWebServiceConfigurationDraft"
        - $ref: "#/components/schemas/GenericWebServiceConfigurationDraft"
        - $ref: "#/components/schemas/DynamicWebServiceConfigurationDraft"
      discriminator:
        propertyName: type
        mapping:
          WMS: "#/components/schemas/WmsWebServiceConfigurationDraft"
          HTTP: "#/components/schemas/GenericWebServiceConfigurationDraft"
          WMTS: "#/components/schemas/WmtsWebServiceConfigurationDraft"
          WFS: "#/components/schemas/WfsWebServiceConfigurationDraft"
          DYNAMIC: "#/components/schemas/DynamicWebServiceConfigurationDraft"

    GenericWebServiceConfigurationDraft:
      type: object
      additionalProperties: false
      required: [type, template_url, method, format]
      properties:
        type:
          type: string
          enum: [HTTP]
        template_url: { $ref: "#/components/schemas/NonBlankString" }
        method: { $ref: "#/components/schemas/WebServiceMethod" }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/ParameterDraft" }
        body_content_type: { $ref: "#/components/schemas/NonBlankString" }
        body_template: { $ref: "#/components/schemas/NonBlankString" }
        body_required:
          type: boolean
          description: Defaults to true when a request body is configured. Must be omitted when no body is configured. Optional bodies are omitted only when unresolved and no child values were supplied.
        body_parameters:
          type: array
          items: { $ref: "#/components/schemas/ScalarParameterDraft" }
        format: { $ref: "#/components/schemas/NonBlankString" }

    DynamicWebServiceConfigurationDraft:
      type: object
      additionalProperties: false
      description: HTTP configuration with exactly one LONGITUDE and one LATITUDE FLOAT parameter across top-level parameters, template children, and body_parameters. Coordinate parameters must be required, editable, single-value, have no default or enum, and must not use explode. Optional minimum and maximum bounds are supported.
      required: [type, template_url, method, format]
      properties:
        type: { type: string, enum: [DYNAMIC] }
        template_url: { $ref: "#/components/schemas/NonBlankString" }
        method: { $ref: "#/components/schemas/WebServiceMethod" }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/ParameterDraft" }
        body_content_type: { $ref: "#/components/schemas/NonBlankString" }
        body_template: { $ref: "#/components/schemas/NonBlankString" }
        body_required:
          type: boolean
          description: Defaults to true when a request body is configured. Must be omitted when no body is configured. Optional bodies are omitted only when unresolved and no child values were supplied.
        body_parameters:
          type: array
          items: { $ref: "#/components/schemas/ScalarParameterDraft" }
        format: { $ref: "#/components/schemas/NonBlankString" }

    WfsWebServiceConfigurationDraft:
      type: object
      additionalProperties: false
      required:
        [type, get_feature_template_url, version, feature_types, default_feature_type, output_formats, default_output_format, result_limit_editable, parameters]
      properties:
        type: { type: string, enum: [WFS] }
        get_feature_template_url:
          type: string
          minLength: 1
          description: Absolute HTTP(S) GetFeature URL. Placeholders are allowed only in the path; nonstandard provider query parameters are retained.
        version: { type: string, enum: ["1.1.0", "2.0.0"] }
        feature_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/NonBlankString" }
        default_feature_type: { $ref: "#/components/schemas/NonBlankString" }
        output_formats:
          type: array
          minItems: 1
          uniqueItems: true
          description: Exact provider outputFormat values, advertised as native formats.
          items: { $ref: "#/components/schemas/NonBlankString" }
        default_output_format: { $ref: "#/components/schemas/NonBlankString" }
        result_limit:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: Optional maximum features requested in one upstream request. Omitted or null means no configured limit; count/maxFeatures is omitted unless an editable limit is supplied during access. No automatic pagination.
        result_limit_editable:
          type: boolean
          description: Whether callers may supply a different limit. False with no configured limit prevents callers from adding one.
        parameters:
          type: array
          items: { $ref: "#/components/schemas/ParameterDraft" }

    WmsWebServiceConfigurationDraft:
      type: object
      additionalProperties: false
      description: WMS layers, styles and request defaults. Provider capabilities are checked by the client, not on write.
      required:
        [type, capabilities_url, default_layer, layers, transparency_editable, default_transparency, get_map_parameters, get_feature_info_parameters]
      properties:
        type: { type: string, enum: [WMS] }
        capabilities_url:
          type: string
          minLength: 1
          description: Absolute HTTP(S) capabilities URL, including provider query parameters.
        default_layer:
          allOf:
            - $ref: "#/components/schemas/NonBlankString"
          description: Must name one configured layer.
        layers:
          type: array
          minItems: 1
          description: Allowed layers in display order. A single layer fixes selection.
          items: { $ref: "#/components/schemas/WmsLayerDraft" }
        transparency_editable: { type: boolean }
        default_transparency:
          type: boolean
          description: Fixed when transparency_editable is false.
        get_map_parameters:
          type: array
          description: Custom GetMap parameters. Standard WMS names are reserved, ignoring case.
          items: { $ref: "#/components/schemas/ParameterDraft" }
        get_feature_info_parameters:
          type: array
          description: Custom GetFeatureInfo parameters, independent of GetMap. Standard WMS names are reserved, ignoring case.
          items: { $ref: "#/components/schemas/ParameterDraft" }

    WmtsWebServiceConfigurationDraft:
      type: object
      additionalProperties: false
      description: WMTS layers, styles and request defaults. Provider capabilities are checked by the client, not on write.
      required: [type, capabilities_url, default_layer, layers, get_tile_parameters, get_feature_info_parameters]
      properties:
        type: { type: string, enum: [WMTS] }
        capabilities_url: { type: string, minLength: 1, description: Absolute HTTP(S) capabilities URL including provider query parameters. }
        default_layer: { $ref: "#/components/schemas/NonBlankString" }
        layers:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WmtsLayerDraft" }
        get_tile_parameters:
          type: array
          items: { $ref: "#/components/schemas/ParameterDraft" }
        get_feature_info_parameters:
          type: array
          items: { $ref: "#/components/schemas/ParameterDraft" }

    WmtsLayerDraft:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        resource_id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/NonBlankString" }
        default_style:
          allOf: [{ $ref: "#/components/schemas/NonBlankString" }]
          description: Configured default style. When omitted, use the provider default if allowed by styles.
        styles:
          type: array
          uniqueItems: true
          description: Allowed styles. Empty or omitted uses the provider default; an explicit default must be listed.
          items: { $ref: "#/components/schemas/NonBlankString" }

    WmsLayerDraft:
      type: object
      additionalProperties: false
      required: [name, default_style, styles]
      properties:
        resource_id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/NonBlankString" }
        default_style:
          type: string
          description: Default configured style. Empty string uses the provider default.
        styles:
          type: array
          minItems: 1
          uniqueItems: true
          description: Allowed styles in display order. Empty string uses the provider default; a single style fixes selection.
          items: { type: string }

    Parameter:
      oneOf:
        - $ref: "#/components/schemas/StringParameter"
        - $ref: "#/components/schemas/BooleanParameter"
        - $ref: "#/components/schemas/IntegerParameter"
        - $ref: "#/components/schemas/FloatParameter"
        - $ref: "#/components/schemas/DateTimeParameter"
        - $ref: "#/components/schemas/TemplateParameter"
      discriminator:
        propertyName: kind
        mapping:
          STRING: "#/components/schemas/StringParameter"
          BOOLEAN: "#/components/schemas/BooleanParameter"
          INTEGER: "#/components/schemas/IntegerParameter"
          FLOAT: "#/components/schemas/FloatParameter"
