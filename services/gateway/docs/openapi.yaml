        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    put:
      tags: [Groups]
      summary: Replace group
      operationId: replaceGroup
      security: [{ bearerAuth: [] }]
