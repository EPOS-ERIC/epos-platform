        start: { type: string, format: date-time, nullable: true }
        end: { type: string, format: date-time, nullable: true }

    GeologicalTemporalCoverage:
      type: object
      additionalProperties: false
      description: Geological age range in millions of years before present. Start is older than or equal to end.
      properties:
        start_mya: { type: number, format: double, nullable: true, minimum: 0 }
        end_mya: { type: number, format: double, nullable: true, minimum: 0 }

    CreateResourceDraftRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateDatasetResourceRequest"
        - $ref: "#/components/schemas/CreateSoftwareApplicationResourceRequest"
        - $ref: "#/components/schemas/CreateSoftwareSourceCodeResourceRequest"
      discriminator:
        propertyName: resource_type
        mapping:
          dataset: "#/components/schemas/CreateDatasetResourceRequest"
          software-application: "#/components/schemas/CreateSoftwareApplicationResourceRequest"
          software-source-code: "#/components/schemas/CreateSoftwareSourceCodeResourceRequest"

    CreateDatasetResourceRequest:
      type: object
      additionalProperties: false
      required: [resource_type, metadata]
      properties:
        resource_type: { type: string, enum: [dataset] }
        metadata: { $ref: "#/components/schemas/DatasetDraftMetadata" }

    CreateSoftwareApplicationResourceRequest:
      type: object
      additionalProperties: false
      required: [resource_type, metadata]
      properties:
        resource_type: { type: string, enum: [software-application] }
        metadata:
          { $ref: "#/components/schemas/SoftwareApplicationDraftMetadata" }

    CreateSoftwareSourceCodeResourceRequest:
      type: object
      additionalProperties: false
      required: [resource_type, metadata]
      properties:
        resource_type: { type: string, enum: [software-source-code] }
        metadata:
          { $ref: "#/components/schemas/SoftwareSourceCodeDraftMetadata" }

    ReplaceDatasetDraftRequest:
      type: object
      additionalProperties: false
      required: [resource_type, revision, metadata]
      properties:
        resource_type: { type: string, enum: [dataset] }
        revision: { type: integer, format: int32, minimum: 1 }
        metadata: { $ref: "#/components/schemas/DatasetDraftMetadata" }

    ReplaceSoftwareApplicationDraftRequest:
      type: object
      additionalProperties: false
      required: [resource_type, revision, metadata]
      properties:
        resource_type: { type: string, enum: [software-application] }
        revision: { type: integer, format: int32, minimum: 1 }
        metadata:
          { $ref: "#/components/schemas/SoftwareApplicationDraftMetadata" }

    ReplaceSoftwareSourceCodeDraftRequest:
      type: object
      additionalProperties: false
      required: [resource_type, revision, metadata]
      properties:
        resource_type: { type: string, enum: [software-source-code] }
        revision: { type: integer, format: int32, minimum: 1 }
        metadata:
          { $ref: "#/components/schemas/SoftwareSourceCodeDraftMetadata" }

    ReplaceResourceDraftRequest:
      oneOf:
        - $ref: "#/components/schemas/ReplaceDatasetDraftRequest"
        - $ref: "#/components/schemas/ReplaceSoftwareApplicationDraftRequest"
        - $ref: "#/components/schemas/ReplaceSoftwareSourceCodeDraftRequest"
      discriminator:
        propertyName: resource_type
        mapping:
          dataset: "#/components/schemas/ReplaceDatasetDraftRequest"
          software-application: "#/components/schemas/ReplaceSoftwareApplicationDraftRequest"
          software-source-code: "#/components/schemas/ReplaceSoftwareSourceCodeDraftRequest"

    RejectResourceRequest:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note: { $ref: "#/components/schemas/NonBlankString" }

    ResourceVersion:
      type: object
      additionalProperties: false
      required:
        [
          resource_id,
          id,
          revision,
          status,
          created_by,
          group_id,
          group_name,
          created_at,
          updated_at,
          metadata,
        ]
      properties:
        resource_id: { type: string, format: uuid, description: Logical resource identity shared across versions. }
        id: { type: string, format: uuid, description: Identity of this specific resource version. }
        revision: { type: integer, format: int32 }
        status: { $ref: "#/components/schemas/VersioningStatus" }
        # TODO: make this not required, only have the creator if the user is authenticated and a member of a group, otherwise omit this field complitely, we don't want to leak other user's ids
        created_by: { type: string }
        group_id: { type: string, format: uuid }
        group_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        rejected_by: { type: string, minLength: 1 }
        rejected_at: { type: string, format: date-time }
        rejection_note: { $ref: "#/components/schemas/NonBlankString" }
        metadata:
          oneOf:
            - $ref: "#/components/schemas/DatasetResourceMetadata"
            - $ref: "#/components/schemas/SoftwareApplicationResourceMetadata"
            - $ref: "#/components/schemas/SoftwareSourceCodeResourceMetadata"
          discriminator:
            propertyName: resource_type
            mapping:
              dataset: "#/components/schemas/DatasetResourceMetadata"
              software-application: "#/components/schemas/SoftwareApplicationResourceMetadata"
              software-source-code: "#/components/schemas/SoftwareSourceCodeResourceMetadata"

    ResourceVersionSummary:
      type: object
      additionalProperties: false
      required:
        [
          resource_type,
          resource_id,
          id,
          revision,
          status,
          name,
          created_by,
          created_at,
          updated_at,
          submitted_by,
          submitted_at,
          published_by,
          published_at,
          archived_by,
          archived_at,
          rejected_by,
          rejected_at,
          rejection_note,
        ]
      properties:
        resource_type: { $ref: "#/components/schemas/DiscoveryResourceType" }
        resource_id: { type: string, format: uuid }
        id: { type: string, format: uuid }
        revision: { type: integer, format: int32, minimum: 1 }
        status: { $ref: "#/components/schemas/VersioningStatus" }
        name: { type: string, minLength: 1 }
        created_by: { type: string, minLength: 1 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        submitted_by: { type: string, minLength: 1, nullable: true }
        submitted_at: { type: string, format: date-time, nullable: true }
        published_by: { type: string, minLength: 1, nullable: true }
        published_at: { type: string, format: date-time, nullable: true }
        archived_by: { type: string, minLength: 1, nullable: true }
        archived_at: { type: string, format: date-time, nullable: true }
        rejected_by: { type: string, minLength: 1, nullable: true }
        rejected_at: { type: string, format: date-time, nullable: true }
        rejection_note: { type: string, minLength: 1, nullable: true }

    DatasetResourceMetadata:
      type: object
      required:
        [
          resource_type,
          title,
          description,
          keywords,
          distributions,
          persistent_identifiers,
          contact_points,
          providers,
          categories,
        ]
      additionalProperties: false
      properties:
        resource_type: { type: string, enum: [dataset] }
        title: { type: string }
        description: { type: string }
        keywords:
          type: array
          items: { $ref: "#/components/schemas/Keyword" }
        accrual_periodicity: { type: string, nullable: true }
        quality_annotation: { type: string, nullable: true }
        access_right: { type: string, nullable: true }
        distributions:
          type: array
          items: { $ref: "#/components/schemas/Distribution" }
        spatial_coverage:
          type: string
          nullable: true
          minLength: 1
          description: WKT POINT or POLYGON geometry in EPSG:4326.
          example: POINT (12.5 41.9)
        temporal_coverage: { $ref: "#/components/schemas/TemporalCoverage" }
        geological_temporal_coverage:
          {
            $ref: "#/components/schemas/GeologicalTemporalCoverage",
            description: Mutually exclusive with temporal_coverage.
          }
        persistent_identifiers:
          type: array
          items: { $ref: "#/components/schemas/VersionedIdentifier" }
        contact_points:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        providers:
          type: array
          items: { $ref: "#/components/schemas/ResourceVersionReference" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/ResourceVersionReference" }
        created: { type: string, format: date-time, nullable: true }
        updated: { type: string, format: date-time, nullable: true }

    SoftwareApplicationResourceMetadata:
      type: object
      required:
        [
          resource_type,
          name,
          description,
          keywords,
          creators,
          identifiers,
          contact_points,
          categories,
        ]
      additionalProperties: false
      properties:
        resource_type: { type: string, enum: [software-application] }
        name: { type: string }
        description: { type: string }
        main_entity_of_page: { type: string, nullable: true }
        license: { type: string, nullable: true }
        version: { type: string, nullable: true }
        keywords:
          type: array
          items: { $ref: "#/components/schemas/Keyword" }
        download_url: { type: string, nullable: true }
        requirements: { type: string, nullable: true }
        operating_system: { type: string, nullable: true }
        creators:
          type: array
          items: { $ref: "#/components/schemas/ResourceVersionReference" }
        identifiers:
          type: array
          items: { $ref: "#/components/schemas/VersionedIdentifier" }
        contact_points:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        categories:
          type: array
          items: { $ref: "#/components/schemas/ResourceVersionReference" }

    SoftwareSourceCodeResourceMetadata:
      type: object
      required:
        [
          resource_type,
          name,
          description,
          keywords,
          creators,
          identifiers,
          contact_points,
          categories,
        ]
      additionalProperties: false
      properties:
        resource_type: { type: string, enum: [software-source-code] }
        name: { type: string }
        description: { type: string }
        programming_language: { type: string, nullable: true }
        keywords:
          type: array
          items: { $ref: "#/components/schemas/Keyword" }
        repository: { type: string, nullable: true }
        license: { type: string, nullable: true }
        software_requirements: { type: string, nullable: true }
        runtime_platform: { type: string, nullable: true }
        main_entity_of_page: { type: string, nullable: true }
        version: { type: string, nullable: true }
        creators:
          type: array
          items: { $ref: "#/components/schemas/ResourceVersionReference" }
        identifiers:
          type: array
          items: { $ref: "#/components/schemas/VersionedIdentifier" }
        contact_points:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        categories:
          type: array
          items: { $ref: "#/components/schemas/ResourceVersionReference" }

    Distribution:
      oneOf:
        - $ref: "#/components/schemas/WebServiceDistribution"
        - $ref: "#/components/schemas/DownloadableFileDistribution"
      discriminator:
        propertyName: type
        mapping:
          "WEB_SERVICE": "#/components/schemas/WebServiceDistribution"
          "DOWNLOADABLE_FILE": "#/components/schemas/DownloadableFileDistribution"

    WebServiceDistribution:
      type: object
      additionalProperties: false
      required: [id, resource_id, title, description, type, web_service, available_formats]
      properties:
        id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        license: { type: string, nullable: true }
        type:
          type: string
          enum:
            - "WEB_SERVICE"
        issued: { type: string, format: date-time, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        byte_size: { type: integer, format: int64, nullable: true, minimum: 1 }
        web_service: { $ref: "#/components/schemas/WebService" }
        available_formats:
          type: array
          description: Native formats and conversions whose plugins are enabled and locally installed. If converter is unavailable, only native formats are returned. WMS and WMTS return image/png as a platform requirement; client must verify provider support.
          items: { $ref: "#/components/schemas/AvailableFormat" }

    AvailableFormat:
      oneOf:
        - $ref: "#/components/schemas/OriginalFormat"
        - $ref: "#/components/schemas/ConvertedFormat"
      discriminator:
        propertyName: kind
        mapping:
          ORIGINAL: "#/components/schemas/OriginalFormat"
          CONVERTED: "#/components/schemas/ConvertedFormat"

    OriginalFormat:
      type: object
      additionalProperties: false
      required: [kind, output_format, label]
      properties:
        kind: { type: string, enum: [ORIGINAL] }
        output_format: { type: string }
        label: { type: string }

    ConvertedFormat:
      type: object
      additionalProperties: false
      required: [kind, conversion_id, input_format, output_format, plugin]
      properties:
        kind: { type: string, enum: [CONVERTED] }
        conversion_id: { type: string, format: uuid }
        input_format: { type: string }
        output_format: { type: string }
        plugin: { $ref: "#/components/schemas/ConversionPlugin" }

    ConversionPlugin:
      type: object
      additionalProperties: false
      required: [id, name, description]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }

    DownloadableFileDistribution:
      type: object
      additionalProperties: false
      required: [id, resource_id, title, description, type, downloadable_file]
      properties:
        id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        license: { type: string, nullable: true }
        type:
          type: string
          enum:
            - "DOWNLOADABLE_FILE"
        issued: { type: string, format: date-time, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        byte_size: { type: integer, format: int64, nullable: true, minimum: 1 }
        downloadable_file: { $ref: "#/components/schemas/DownloadableFile" }

    WebService:
      type: object
      required: [id, resource_id, name, configuration]
      properties:
        id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string, nullable: true, minLength: 1 }
        visible_on:
          type: array
          nullable: true
          minItems: 1
          items: { $ref: "#/components/schemas/WebServiceVisibleOn" }
        provider: { $ref: "#/components/schemas/ResourceVersionReference" }
        documentation: { $ref: "#/components/schemas/Documentation" }
        spatial_coverage:
          type: string
          nullable: true
          minLength: 1
          description: WKT POINT or POLYGON geometry in EPSG:4326.
          example: POINT (12.5 41.9)
        temporal_coverage: { $ref: "#/components/schemas/TemporalCoverage" }
        contact_points:
          type: array
          items: { type: string, format: uuid }
        configuration: { $ref: "#/components/schemas/WebServiceConfiguration" }

    WebServiceConfiguration:
      oneOf:
        - $ref: "#/components/schemas/WmsWebServiceConfiguration"
        - $ref: "#/components/schemas/WmtsWebServiceConfiguration"
        - $ref: "#/components/schemas/WfsWebServiceConfiguration"
        - $ref: "#/components/schemas/GenericWebServiceConfiguration"
        - $ref: "#/components/schemas/DynamicWebServiceConfiguration"
      discriminator:
        propertyName: type
        mapping:
          WMS: "#/components/schemas/WmsWebServiceConfiguration"
          HTTP: "#/components/schemas/GenericWebServiceConfiguration"
          WMTS: "#/components/schemas/WmtsWebServiceConfiguration"
          WFS: "#/components/schemas/WfsWebServiceConfiguration"
          DYNAMIC: "#/components/schemas/DynamicWebServiceConfiguration"

    GenericWebServiceConfiguration:
      type: object
      additionalProperties: false
      required: [type, template_url, method, format]
      properties:
        type:
          type: string
          enum: [HTTP]
        template_url: { type: string }
        method: { $ref: "#/components/schemas/WebServiceMethod" }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/Parameter" }
        body_content_type: { type: string, nullable: true }
        body_template: { type: string, nullable: true }
        body_required:
          type: boolean
          description: Whether the configured request body must be rendered. Omitted when no request body is configured.
        body_parameters:
          type: array
          items: { $ref: "#/components/schemas/ScalarParameter" }
        format: { type: string }

    DynamicWebServiceConfiguration:
      type: object
      additionalProperties: false
      description: HTTP configuration with exactly one LONGITUDE and one LATITUDE FLOAT parameter across top-level parameters, template children, and body_parameters.
      required: [type, template_url, method, format]
      properties:
        type: { type: string, enum: [DYNAMIC] }
        template_url: { type: string }
        method: { $ref: "#/components/schemas/WebServiceMethod" }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/Parameter" }
        body_content_type: { type: string, nullable: true }
        body_template: { type: string, nullable: true }
        body_required:
          type: boolean
          description: Whether the configured request body must be rendered. Omitted when no request body is configured.
        body_parameters:
          type: array
          items: { $ref: "#/components/schemas/ScalarParameter" }
        format: { type: string }

    WfsWebServiceConfiguration:
      type: object
      additionalProperties: false
      required:
        [type, get_feature_template_url, version, feature_types, default_feature_type, output_formats, default_output_format, result_limit_editable, parameters]
      properties:
        type: { type: string, enum: [WFS] }
        get_feature_template_url: { type: string, minLength: 1 }
        version: { type: string, enum: ["1.1.0", "2.0.0"] }
        feature_types:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/NonBlankString" }
        default_feature_type: { $ref: "#/components/schemas/NonBlankString" }
        output_formats:
          type: array
          minItems: 1
          uniqueItems: true
          description: Exact provider outputFormat values, advertised as native formats.
          items: { $ref: "#/components/schemas/NonBlankString" }
        default_output_format: { $ref: "#/components/schemas/NonBlankString" }
        result_limit:
          type: integer
          format: int64
          nullable: true
          minimum: 1
          description: Optional default feature limit. Omitted or null means no configured limit.
        result_limit_editable:
          type: boolean
          description: Whether callers may supply a different limit. False with no configured limit prevents callers from adding one.
        parameters:
          type: array
          items: { $ref: "#/components/schemas/Parameter" }

    WmsWebServiceConfiguration:
      type: object
      additionalProperties: false
      description: WMS layers, styles and request defaults. Provider capabilities are checked by the client, not on write.
      required:
        [type, capabilities_url, default_layer, layers, transparency_editable, default_transparency, get_map_parameters, get_feature_info_parameters]
      properties:
        type: { type: string, enum: [WMS] }
        capabilities_url:
          type: string
          minLength: 1
          description: Absolute HTTP(S) capabilities URL, including provider query parameters.
        default_layer:
          allOf:
            - $ref: "#/components/schemas/NonBlankString"
          description: Must name one configured layer.
        layers:
          type: array
          minItems: 1
          description: Allowed layers in display order. A single layer fixes selection.
          items: { $ref: "#/components/schemas/WmsLayer" }
        transparency_editable: { type: boolean }
        default_transparency:
          type: boolean
          description: Fixed when transparency_editable is false.
        get_map_parameters:
          type: array
          description: Custom GetMap parameters. Standard WMS names are reserved, ignoring case.
          items: { $ref: "#/components/schemas/Parameter" }
        get_feature_info_parameters:
          type: array
          description: Custom GetFeatureInfo parameters, independent of GetMap. Standard WMS names are reserved, ignoring case.
          items: { $ref: "#/components/schemas/Parameter" }

    WmtsWebServiceConfiguration:
      type: object
      additionalProperties: false
      description: WMTS layers, styles and request defaults. Provider capabilities are checked by the client, not on write.
      required: [type, capabilities_url, default_layer, layers, get_tile_parameters, get_feature_info_parameters]
      properties:
        type: { type: string, enum: [WMTS] }
        capabilities_url: { type: string, minLength: 1 }
        default_layer: { $ref: "#/components/schemas/NonBlankString" }
        layers:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/WmtsLayer" }
        get_tile_parameters:
          type: array
          items: { $ref: "#/components/schemas/Parameter" }
        get_feature_info_parameters:
          type: array
          items: { $ref: "#/components/schemas/Parameter" }

    WmtsLayer:
      type: object
      required: [id, resource_id, name]
      properties:
        id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/NonBlankString" }
        default_style:
          allOf: [{ $ref: "#/components/schemas/NonBlankString" }]
          description: Configured default style. When omitted, use the provider default if allowed by styles.
        styles:
          type: array
          uniqueItems: true
          description: Allowed styles. Empty or omitted uses the provider default; an explicit default must be listed.
          items: { $ref: "#/components/schemas/NonBlankString" }

    WmsLayer:
      type: object
      required: [id, resource_id, name, default_style, styles]
      properties:
        id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/NonBlankString" }
        default_style:
          type: string
          description: Default configured style. Empty string uses the provider default.
        styles:
          type: array
          minItems: 1
          uniqueItems: true
          description: Allowed styles in display order. Empty string uses the provider default; a single style fixes selection.
          items: { type: string }

    VersionedIdentifier:
      type: object
      required: [id, resource_id, type, value]
      properties:
        id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        type: { type: string, minLength: 1 }
        value: { type: string, minLength: 1 }

    Identifier:
      type: object
      required: [id, type, value]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, minLength: 1 }
        value: { type: string, minLength: 1 }

    ResourceVersionReference:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    # -------------------------------------------------------------------------
    # Resource write schemas
    # -------------------------------------------------------------------------
    ImportResult:
      type: object
      required:
        [
          groups,
          categories,
          organizations,
          contact_points,
          datasets,
          software_applications,
          software_source_codes,
          warnings,
        ]
      properties:
        groups: { type: integer }
        categories: { type: integer }
        organizations: { type: integer }
        contact_points: { type: integer }
        datasets: { type: integer }
        software_applications: { type: integer }
        software_source_codes: { type: integer }
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ImportDiagnostic"
    ImportDiagnostic:
      type: object
      required: [severity, subject, predicate, message]
      properties:
        severity: { type: string }
        subject: { type: string }
        predicate: { type: string }
        message: { type: string }

    WriteResourceType:
      type: string
      description: Resource type identifier returned by lifecycle write endpoints.
      enum:
        - dataset
        - software-application
        - software-source-code

    WriteResult:
      type: object
      required:
        - resourceType
        - id
        - status
      properties:
        resourceType:
          $ref: "#/components/schemas/WriteResourceType"
        id:
          type: string
        status:
          $ref: "#/components/schemas/VersioningStatus"

    # -------------------------------------------------------------------------
    # Discovery
    # -------------------------------------------------------------------------

    Reference:
      type: object
      description: Reference to another API resource.
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string

    DiscoveryItem:
      oneOf:
        - $ref: "#/components/schemas/DatasetDiscoveryItem"
        - $ref: "#/components/schemas/SoftwareApplicationDiscoveryItem"
        - $ref: "#/components/schemas/SoftwareSourceCodeDiscoveryItem"
      discriminator:
        propertyName: type
        mapping:
          dataset: "#/components/schemas/DatasetDiscoveryItem"
          software-application: "#/components/schemas/SoftwareApplicationDiscoveryItem"
          software-source-code: "#/components/schemas/SoftwareSourceCodeDiscoveryItem"

    DatasetDiscoveryItem:
      type: object
      additionalProperties: false
      required:
        - type
        - resource_id
        - version_id
        - name
        - status
        - updated_at
        - concept
        - group
      properties:
        type: { type: string, enum: [dataset] }
        resource_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        name: { type: string }
        status:
          $ref: "#/components/schemas/VersioningStatus"
        updated_at: { type: string, format: date-time }
        concept: { $ref: "#/components/schemas/DiscoveryConcept" }
        created_by:
          description: Creator identity is returned only when caller may see
            identities for this resource group.
          $ref: "#/components/schemas/Reference"
        group: { $ref: "#/components/schemas/Reference" }
        providers:
          type: array
          items: { $ref: "#/components/schemas/Reference" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Reference" }
        distributions:
          type: array
          items: { $ref: "#/components/schemas/DiscoveryDistribution" }

    DiscoveryDistribution:
      oneOf:
        - $ref: "#/components/schemas/DiscoveryWebServiceDistribution"
        - $ref: "#/components/schemas/DiscoveryDownloadableFileDistribution"
      discriminator:
        propertyName: type
        mapping:
          "WEB_SERVICE": "#/components/schemas/DiscoveryWebServiceDistribution"
          "DOWNLOADABLE_FILE": "#/components/schemas/DiscoveryDownloadableFileDistribution"

    DiscoveryWebServiceDistribution:
      type: object
      additionalProperties: false
      required: [id, name, type, web_service_type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: ["WEB_SERVICE"] }
        web_service_type: { $ref: "#/components/schemas/WebServiceType" }
        visible_on:
          type: array
          nullable: true
          minItems: 1
          items: { $ref: "#/components/schemas/WebServiceVisibleOn" }
        provider: { $ref: "#/components/schemas/Reference" }

    DiscoveryDownloadableFileDistribution:
      type: object
      additionalProperties: false
      required: [id, name, type]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: ["DOWNLOADABLE_FILE"] }

    SoftwareApplicationDiscoveryItem:
      type: object
      additionalProperties: false
      required:
        - type
        - resource_id
        - version_id
        - name
        - status
        - updated_at
        - concept
        - group
      properties:
        type: { type: string, enum: [software-application] }
        resource_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        name: { type: string }
        status:
          $ref: "#/components/schemas/VersioningStatus"
        updated_at: { type: string, format: date-time }
        concept: { $ref: "#/components/schemas/DiscoveryConcept" }
        created_by:
          description: Creator identity is returned only when caller may see
            identities for this resource group.
          $ref: "#/components/schemas/Reference"
        group: { $ref: "#/components/schemas/Reference" }
        creators:
          type: array
          items: { $ref: "#/components/schemas/Reference" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Reference" }

    SoftwareSourceCodeDiscoveryItem:
      type: object
      additionalProperties: false
      required:
        - type
        - resource_id
        - version_id
        - name
        - status
        - updated_at
        - concept
        - group
      properties:
        type: { type: string, enum: [software-source-code] }
        resource_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        name: { type: string }
        status:
          $ref: "#/components/schemas/VersioningStatus"
        updated_at: { type: string, format: date-time }
        concept: { $ref: "#/components/schemas/DiscoveryConcept" }
        created_by:
          description: Creator identity is returned only when caller may see
            identities for this resource group.
          $ref: "#/components/schemas/Reference"
        group: { $ref: "#/components/schemas/Reference" }
        creators:
          type: array
          items: { $ref: "#/components/schemas/Reference" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/Reference" }

    UserStatus:
      type: string
      enum:
        - ACTIVE
        - BLOCKED

    BlockUserRequest:
      type: object
      required:
        - reason
      additionalProperties: false
      properties:
        reason:
          $ref: "#/components/schemas/NonBlankString"

    MembershipRole:
      type: string
      description: Role assigned to a user inside a group.
      enum:
        - EDITOR
        - REVIEWER
        - GROUP_ADMIN

    MembershipStatus:
      type: string
      description: Lifecycle state for a group membership.
      enum:
        - PENDING
        - ACTIVE
        - REJECTED

    User:
      allOf:
        - $ref: "#/components/schemas/UserListItem"
        - type: object
          description: User record returned by gateway user endpoints.
          required:
            - memberships
          properties:
            memberships:
              type: array
              description: Membership previews for this user.
              items:
                $ref: "#/components/schemas/UserMembershipSummary"
            block_reason:
              type: string
              nullable: true
              description: Reason supplied when this user was blocked.

    UserListItem:
      type: object
      description: User record returned by the user list endpoint.
      required:
        - id
        - email
        - given_name
        - family_name
        - status
        - global_roles
        - global_granted_permissions
        - global_role_permissions
        - created_at
        - updated_at
      properties:
        id:
          type: string
        email:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
        global_roles:
          type: array
          items:
            type: string
        global_granted_permissions:
          type: array
          items:
            $ref: "#/components/schemas/GlobalPermission"
        global_role_permissions:
          type: array
          items:
            $ref: "#/components/schemas/GlobalPermission"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Category:
      type: object
      required: [id, group_id, parent_category_id, name]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        parent_category_id: { type: string, format: uuid, nullable: true }
        name: { type: string, minLength: 1 }
    CreateCategoryRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        parent_category_id: { type: string, format: uuid, nullable: true }
    ReplaceCategoryRequest:
      type: object
      required: [name, parent_category_id]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        parent_category_id: { type: string, format: uuid, nullable: true }
    CreateGroupRequest:
      type: object
      required: [name, concept]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        description: { type: string, nullable: true, minLength: 1 }
        label: { type: string, nullable: true, minLength: 1 }
        logo: { type: string, nullable: true, minLength: 1 }
        page: { type: string, nullable: true, minLength: 1 }
        color: { type: string, nullable: true, minLength: 1 }
        position: { type: integer, format: int32 }
        concept: { type: string, enum: [DATA, FACILITIES, SOFTWARE] }
    ReplaceGroupRequest:
      type: object
      required: [name, concept]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        description: { type: string, nullable: true, minLength: 1 }
        label: { type: string, nullable: true, minLength: 1 }
        logo: { type: string, nullable: true, minLength: 1 }
        page: { type: string, nullable: true, minLength: 1 }
        color: { type: string, nullable: true, minLength: 1 }
        position: { type: integer, format: int32 }
        concept: { type: string, enum: [DATA, FACILITIES, SOFTWARE] }
    ContactPoint:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email, minLength: 1 }
        role: { type: string, minLength: 1 }
    CreateContactPointRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: { type: string, format: email, minLength: 1 }
        role: { $ref: "#/components/schemas/NonBlankString" }
    ReplaceContactPointRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: { type: string, format: email, minLength: 1 }
        role: { $ref: "#/components/schemas/NonBlankString" }
    OrganizationAddress:
      type: object
      required: [street, locality, postal_code, country]
      additionalProperties: false
      properties:
        street: { type: string, nullable: true, minLength: 1 }
        locality: { type: string, nullable: true, minLength: 1 }
        postal_code: { type: string, nullable: true, minLength: 1 }
        country: { type: string, nullable: true, minLength: 1 }
    CanonicalOrganization:
      type: object
      required: [id, name, address, identifiers, parents, contact_point_ids]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1 }
        address: { $ref: "#/components/schemas/OrganizationAddress" }
        logo_url: { type: string, format: uri, nullable: true, minLength: 1 }
        page_url: { type: string, format: uri, nullable: true, minLength: 1 }
        email: { type: string, format: email, nullable: true, minLength: 1 }
        lei_code: { type: string, nullable: true, minLength: 1 }
        identifiers:
          type: array
          items: { $ref: "#/components/schemas/Identifier" }
        parents:
          type: array
          items: { type: string, format: uuid }
        contact_point_ids:
          type: array
          items: { type: string, format: uuid }
    CreateOrganizationRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        address: { $ref: "#/components/schemas/OrganizationAddress" }
        logo_url: { type: string, format: uri, nullable: true, minLength: 1 }
        page_url: { type: string, format: uri, nullable: true, minLength: 1 }
        email: { type: string, format: email, nullable: true, minLength: 1 }
        lei_code: { type: string, nullable: true, minLength: 1 }
        identifiers:
          type: array
          items: { $ref: "#/components/schemas/IdentifierInput" }
        parents:
          type: array
          items: { type: string, format: uuid }
        contact_point_ids:
          type: array
          items: { type: string, format: uuid }
    ReplaceOrganizationRequest:
      type: object
      required:
        [
          name,
          address,
          logo_url,
          page_url,
          email,
          lei_code,
          identifiers,
          parents,
          contact_point_ids,
        ]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        address: { $ref: "#/components/schemas/OrganizationAddress" }
        logo_url: { type: string, format: uri, nullable: true, minLength: 1 }
        page_url: { type: string, format: uri, nullable: true, minLength: 1 }
        email: { type: string, format: email, nullable: true, minLength: 1 }
        lei_code: { type: string, nullable: true, minLength: 1 }
        identifiers:
          type: array
          items: { $ref: "#/components/schemas/IdentifierInput" }
        parents:
          type: array
          items: { type: string, format: uuid }
        contact_point_ids:
          type: array
          items: { type: string, format: uuid }
    Group:
      type: object
      description: Public group metadata returned by Metadata Lifecycle.
      required:
        - id
        - name
        - position
        - concept
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        description:
          type: string
          nullable: true
          minLength: 1
        label:
          type: string
          nullable: true
          minLength: 1
        logo:
          type: string
          nullable: true
          minLength: 1
        page:
          type: string
          nullable: true
          minLength: 1
        color:
          type: string
          nullable: true
          minLength: 1
        position:
          type: integer
          format: int32
        concept:
          type: string
          enum: [DATA, FACILITIES, SOFTWARE]

    UserMembershipSummary:
      type: object
      description: Embedded membership preview for one user-group relation.
      required:
        - group
        - roles
        - status
        - granted_permissions
        - role_permissions
        - role_requests
        - created_at
        - updated_at
      properties:
        group:
          $ref: "#/components/schemas/Reference"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/MembershipRole"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        granted_permissions:
          type: array
          items:
            $ref: "#/components/schemas/GroupPermission"
        role_permissions:
          type: array
          items:
            $ref: "#/components/schemas/GroupPermission"
        role_requests:
          type: array
          description: Pending role requests for this membership.
          items:
            $ref: "#/components/schemas/RoleRequest"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GroupMembership:
      type: object
      description: Complete membership record returned after a membership decision.
      required:
        - user
        - status
        - roles
        - granted_permissions
        - role_permissions
        - role_requests
        - created_at
        - updated_at
      properties:
        user:
          $ref: "#/components/schemas/MembershipUser"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/MembershipRole"
        granted_permissions:
          type: array
          items:
            $ref: "#/components/schemas/GroupPermission"
        role_permissions:
          type: array
          items:
            $ref: "#/components/schemas/GroupPermission"
        role_requests:
          type: array
          description: Pending role requests only.
          items:
            $ref: "#/components/schemas/RoleRequest"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MembershipUser:
      type: object
      required:
        - id
        - given_name
        - family_name
        - email
      properties:
        id:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        email:
          type: string
          format: email

    RoleRequest:
      type: object
      required:
        - id
        - role
        - status
        - requested_at
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [EDITOR, REVIEWER]
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED]
        requested_at:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required:
        - role
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [EDITOR, REVIEWER]

    CreateMembershipRequest:
      type: object
      required:
        - roles
      additionalProperties: false
      properties:
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [EDITOR, REVIEWER]

    ConfigurationSummary:
      type: object
      required: [id, title, description, list_of_services, is_official, is_public, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, nullable: true, maxLength: 10000 }
        list_of_services:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 500 }
        is_official: { type: boolean }
        is_public: { type: boolean }
        owner_id:
          type: string
          minLength: 1
          description: Included only for authenticated callers with `global.configuration.manage`; never included in the public official list.
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    OfficialConfigurationSummary:
      type: object
      additionalProperties: false
      required: [id, title, description, list_of_services, is_official, is_public, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, nullable: true, maxLength: 10000 }
        list_of_services:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 500 }
        is_official: { type: boolean }
        is_public: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ConfigurationDetail:
      allOf:
        - $ref: "#/components/schemas/ConfigurationSummary"
        - type: object
          required: [configuration]
          properties:
            configuration:
              description: Opaque workspace configuration document, stored as canonical JSON. Any JSON value is accepted.
    ConfigurationWriteRequest:
      type: object
      required: [configuration, title]
      additionalProperties: false
      properties:
        configuration:
          description: Opaque workspace configuration document, stored as canonical JSON. Any JSON value is accepted.
        title: { type: string, minLength: 1, maxLength: 500 }
        description: { type: string, nullable: true, maxLength: 10000 }
        list_of_services:
          type: array
          maxItems: 100
          items: { type: string, minLength: 1, maxLength: 500 }
        is_public:
          type: boolean
          nullable: true
          description: Visibility flag. Creation defaults absent/null to private. Replacement defaults non-official configurations to private; official configurations stay public and reject false.
    SetConfigurationOfficialStatusRequest:
      type: object
      required: [is_official]
      additionalProperties: false
      properties:
        is_official: { type: boolean }
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri-reference
          description: Stable application error code used by clients
          example: "not_found"
        title:
          type: string
          description: HTTP status reason phrase
          example: "Not Found"
        status:
          type: integer
          description: HTTP status code for this problem occurrence
          example: 404
        detail:
          type: string
          description: Optional human-readable explanation specific to this occurrence
          example: "The requested resource was not found"
        instance:
          type: string
          description: Optional OpenTelemetry trace ID associated with this request
          example: "132c7c05d8f744d596e15a2620cacfeb"
        target:
          type: string
          description: Optional dotted path identifying the request field related to the problem
          example: "metadata.title"
        upstream_response:
          type: object
          description: Present only when an upstream HTTP failure response exists.
          required: [status, body]
          additionalProperties: false
          properties:
            status:
              type: integer
              minimum: 100
              maximum: 599
              description: Original upstream HTTP status.
            body:
              type: string
              description: Original upstream failure body, treated as text.
