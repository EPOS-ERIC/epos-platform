openapi: 3.0.3
info:
  title: EPOS API
  version: 1.0.0
  description: |
    Public API for searching and retrieving EPOS catalogue resources.

    API structure:
    - Use discovery endpoints to search catalogue content and browse the concept tree.
    - Use resource endpoints to retrieve full details for a specific dataset, distribution, webservice, organization, concept, or concept scheme.
    - Search responses may include different resource types in the same result page.

    How to use this API:
    - Start with `/search` when you want to find resources by text, type, provider, time range, spatial area, or keywords.
    - Start with `/concept` when you want to build browse or filtering interfaces based on the concept tree.
    - Follow returned `href` values to retrieve related resources. Or use the IDs in the relative endpoints.
  termsOfService: https://www.epos-eu.org/sites/default/files/2026-02/Terms_and_ConditionsJan26_1.pdf
  license:
    name: AGPL
    url: https://www.gnu.org/licenses/agpl-3.0.en.html

servers:
  - url: /v1
    description: Relative versioned API base path

tags:
  - name: Discovery
    description: Search and taxonomy bootstrap endpoints
  - name: Resources
    description: Resource detail endpoints

paths:
  /search:
    get:
      tags:
        - Discovery
      summary: Search metadata resources
      description: |
        Returns a flat, typed list of catalogue resources matching the supplied criteria.
        Results may include datasets, webservices, organizations, software applications,
        and software source codes. Each item includes an `href` that can be followed
        to retrieve the corresponding resource detail.
      operationId: searchMetadata
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/TypeFilter"
        - $ref: "#/components/parameters/SpatialFilter"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/VersioningStatus"
        - $ref: "#/components/parameters/Keywords"
      responses:
        "200":
          description: Search results returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              examples:
                mixedResults:
                  summary: Mixed resource search results
                  value:
                    page_number: 1
                    page_size: 10
                    total: 42
                    total_pages: 5
                    items:
                      - type: dataset
                        id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/v1.0"
                        name: "TEST1 - Historical earthquakes 1000-1899"
                        href: "v1/dataset/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/v1.0"
                        providers:
                          - id: "PIC:999472675/v1.0"
                            name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                            href: "v1/organization/PIC:999472675/v1.0"
                        concepts:
                          - id: "category:earthquakeparameters/v1.0"
                            name: "Earthquake parameters"
                            href: "v1/concept/category:earthquakeparameters/v1.0"
                        distributions:
                          - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                            href: "v1/distribution/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                      - type: organization
                        id: "PIC:999472675/v1.0"
                        name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                        href: "v1/organization/PIC:999472675/v1.0"
                      - type: webservice
                        id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/WebService/AHEAD/restful/fdsnws-event/v1.0"
                        name: "TEST1- Historical earthquakes 1000-1899 (FDSN-event)"
                        href: "v1/webservice/https://www.epos-eu.org/epos-dcat-ap/Seismology/WebService/AHEAD/restful/fdsnws-event/v1.0"
                        provider:
                          id: "PIC:999472675/v1.0"
                          name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                          href: "v1/organization/PIC:999472675/v1.0"
                        concepts:
                          - id: "category:earthquakeparameters/v1.0"
                            name: "Earthquake parameters"
                            href: "v1/concept/category:earthquakeparameters/v1.0"
                      - type: softwaresourcecode
                        id: "https://doi.org/10.5281/zenodo.17598403"
                        name: "Discovery, automation/scripting and integration of EPOS data and services. Basic workflows in JupyterLab."
                        href: "v1/softwaresourcecode/https://doi.org/10.5281/zenodo.17598403"
                        provider:
                          - id: "ROR:048a87296/v1.0"
                            name: "Uppsala University"
                            href: "v1/organization/ROR:048a87296/v1.0"
        "400":
          $ref: "#/components/responses/BadRequest"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /dataset/{id}:
    parameters:
      - $ref: "#/components/parameters/DatasetId"
    get:
      tags:
        - Resources
      summary: Get dataset by id
      description: |
        Returns dataset detail metadata, including temporal and spatial coverage,
        publishers, linked concepts, and linked distributions.
      operationId: getDatasetById
      responses:
        "200":
          description: Dataset found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dataset"
              examples:
                dataset:
                  summary: Seismology dataset detail
                  value:
                    id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/v1.0"
                    name: "TEST1 - Historical earthquakes 1000-1899"
                    description: "Event data (e.g. epicentre, magnitude) for earthquakes archived in AHEAD"
                    created: "2010-06-01T00:00:00Z"
                    modified: "2018-09-10T00:00:00Z"
                    keywords:
                      - "event"
                      - "earthquake"
                      - "magnitude"
                    concepts:
                      - id: "category:earthquakeparameters/v1.0"
                        name: "Earthquake parameters"
                        href: "v1/concept/category:earthquakeparameters/v1.0"
                    publisher:
                      - id: "PIC:999472675/v1.0"
                        name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                        href: "v1/organization/PIC:999472675/v1.0"
                    spatial: "POLYGON((-34 74,45 74,45 33,-34 33,-34 74))"
                    temporal:
                      start: "1000-01-01T00:00:00Z"
                      end: "1899-12-31T23:59:59Z"
                    distributions:
                      - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                        name: "TEST1 - Parameters of historical earthquakes (1000-1899) - FDSN event"
                        href: "v1/distribution/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                    access_rights: "https://publications.europa.eu/resource/authority/access-right/PUBLIC"
                    accrual_periodicity: "http://purl.org/cld/freq/irregular"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /distribution/{id}:
    parameters:
      - $ref: "#/components/parameters/DistributionId"
    get:
      tags:
        - Resources
      summary: Get distribution by id
      description: |
        Returns distribution detail metadata. Distribution payload shape depends on
        distribution `type`, for example a downloadable file or a linked web service.
      operationId: getDistributionById
      responses:
        "200":
          description: Distribution found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Distribution"
              examples:
                webserviceDistribution:
                  summary: Distribution backed by webservice operation
                  value:
                    id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                    name: "TEST1 - Parameters of historical earthquakes (1000-1899) - FDSN event"
                    description: "The distribution of event parameters via the FDSN-event web service is the main and preferred way to access historical earthquake data archived in AHEAD."
                    type: "http://publications.europa.eu/resource/authority/distribution-type/WEB_SERVICE"
                    format: "http://publications.europa.eu/resource/authority/file-type/XML"
                    issued: "2017-10-25T00:00:00Z"
                    modified: "2017-10-25T00:00:00Z"
                    license: "https://creativecommons.org/licenses/by/4.0/"
                    webservice:
                      id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/WebService/AHEAD/restful/fdsnws-event/v1.0"
                      name: "TEST1- Historical earthquakes 1000-1899 (FDSN-event)"
                      href: "v1/webservice/https://www.epos-eu.org/epos-dcat-ap/Seismology/WebService/AHEAD/restful/fdsnws-event/v1.0"
                    operation:
                      id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/WebService/AHEAD/restful/fdsnws-event/Operation/v1.0"
                      method: "GET"
                      returns:
                        - "application/xml"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /softwareapplication/{id}:
    parameters:
      - $ref: "#/components/parameters/SoftwareApplicationId"
    get:
      tags:
        - Resources
      summary: Get software application by id
      operationId: getSoftwareApplicationById
      responses:
        "200":
          description: Software application found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftwareApplication"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /softwaresourcecode/{id}:
    parameters:
      - $ref: "#/components/parameters/SoftwareSourceCodeId"
    get:
      tags:
        - Resources
      summary: Get software source code by id
      operationId: getSoftwareSourceCodeById
      responses:
        "200":
          description: Software source code found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoftwareSourceCode"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /webservice/{id}:
    parameters:
      - $ref: "#/components/parameters/WebserviceId"
    get:
      tags:
        - Resources
      summary: Get webservice by id
      description: |
        Returns webservice detail metadata, including single provider organization,
        supported operations, API documentation, and temporal or spatial coverage.
      operationId: getWebserviceById
      responses:
        "200":
          description: Webservice found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Webservice"
              examples:
                webservice:
                  summary: Webservice detail
                  value:
                    id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/WebService/AHEAD/restful/fdsnws-event/v1.0"
                    name: "TEST1- Historical earthquakes 1000-1899 (FDSN-event)"
                    description: "FDSN-event web service providing event parameters for historical earthquakes from AHEAD, the European Archive of Historical Earthquake Data"
                    entrypoint: "https://www.emidius.eu/fdsnws/event/1/application.wadl"
                    provider:
                      id: "PIC:999472675/v1.0"
                      name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                      href: "v1/organization/PIC:999472675/v1.0"
                    issued: "2012-12-01T00:00:00Z"
                    modified: "2018-09-10T00:00:00Z"
                    spatial: "POLYGON((-33.5 73.5,34.0 73.5,34.0 33.5,-33.5 33.5,-33.5 73.5))"
                    temporal:
                      start: "1000-01-01T00:00:00Z"
                      end: "1899-12-31T23:59:59Z"
                    keywords:
                      - "seismology, seismicity, catalogue, earthquake, magnitude"
                    concepts:
                      - id: "category:earthquakeparameters/v1.0"
                        name: "Earthquake parameters"
                        href: "v1/concept/category:earthquakeparameters/v1.0"
                    license: "https://creativecommons.org/licenses/by/4.0/"
                    operations:
                      - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/WebService/AHEAD/restful/fdsnws-event/Operation/v1.0"
                        method: "GET"
                        returns:
                          - "application/xml"
                        iri_template:
                          template: "https://www.emidius.eu/fdsnws/event/1/query{?starttime, endtime, eventid, minlatitude, maxlatitude, minlongitude, maxlongitude, latitude, longitude, maxradiuskm, minmagnitude, maxmagnitude, orderby, includeallorigins, includeallmagnitudes, limit, nodata}"
                    api_documentation:
                      title: "ahead-fdsnws-event documentation"
                      description: "Documentation for the fdsnws-event webservice"
                      entrypoint: "https://www.emidius.eu/AHEAD/services/epos_events.php"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /organization/{id}:
    parameters:
      - $ref: "#/components/parameters/OrganizationId"
    get:
      tags:
        - Resources
      summary: Get organization by id
      description: |
        Returns organization detail metadata, including identifiers, contact points,
        and parent organizations when available.
      operationId: getOrganizationById
      responses:
        "200":
          description: Organization found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
              examples:
                organization:
                  summary: Organization detail
                  value:
                    id: "PIC:999472675/v1.0"
                    identifiers:
                      - type: "pic"
                        value: "999472675"
                    name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                    address: "Via di Vigna Murata 605, Rome, 00143, IT"
                    logo: "https://www.ingv.it/templates/g5_helium/custom/images/INGV_logo_colore3.png"
                    url: "http://www.ingv.it"
                    email:
                      - "ufficiostampa@ingv.it"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /concept:
    get:
      tags:
        - Discovery
      summary: Get full concept tree
      description: |
        Returns the complete concept tree as an ordered list of concept schemes.
        Each scheme carries its full subtree of nested concepts.
        Use this endpoint to populate browse or filtering interfaces.
      operationId: getConceptTree
      responses:
        "200":
          description: Concept tree returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConceptTreeResponse"
              examples:
                tree:
                  summary: Concept tree with one scheme
                  value:
                    schemes:
                      - id: "category:seismology/v1.0"
                        label: "SEI"
                        name: "Seismology"
                        description: "TCS Domain"
                        logo: "assets/img/logo/SEISM_logo.png"
                        homepage: "https://www.epos-eu.org/tcs/seismology"
                        color: "#476f57"
                        order_number: 1
                        top_concepts:
                          - id: "category:facets/dataset-theme/v1.0"
                            href: "v1/concept/category:facets/dataset-theme/v1.0"
                        children:
                          - id: "category:facets/dataset-theme/v1.0"
                            name: "Dataset"
                            description: "Dataset"
                            children: []
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /concept/{id}:
    parameters:
      - $ref: "#/components/parameters/ConceptId"
    get:
      tags:
        - Resources
      summary: Get concept by id
      description: |
        Returns a single concept node with its containing concept scheme and direct
        child concept references.
      operationId: getConceptById
      responses:
        "200":
          description: Concept found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Concept"
              examples:
                concept:
                  summary: Concept detail
                  value:
                    id: "category:seismologicalproductsservices/v1.0"
                    name: "Seismological products services"
                    description: "TCS Subdomain"
                    in_scheme:
                      id: "category:seismology/v1.0"
                      name: "Seismology"
                      href: "v1/conceptscheme/category:seismology/v1.0"
                    children:
                      - id: "category:earthquakeparameters/v1.0"
                        name: "Earthquake parameters"
                        href: "v1/concept/category:earthquakeparameters/v1.0"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /conceptscheme/{id}:
    parameters:
      - $ref: "#/components/parameters/ConceptSchemeId"
    get:
      tags:
        - Resources
      summary: Get concept scheme by id
      description: |
        Returns concept scheme detail metadata, including top concepts and optional
        concept tree children when present.
      operationId: getConceptSchemeById
      responses:
        "200":
          description: Concept scheme found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConceptScheme"
              examples:
                conceptScheme:
                  summary: Concept scheme detail
                  value:
                    id: "category:seismology/v1.0"
                    label: "SEI"
                    name: "Seismology"
                    description: "TCS Domain"
                    logo: "assets/img/logo/SEISM_logo.png"
                    homepage: "https://www.epos-eu.org/tcs/seismology"
                    color: "#476f57"
                    order_number: 1
                    top_concepts:
                      - id: "category:facets/dataset-theme/v1.0"
                        name: "Dataset"
                        href: "v1/concept/category:facets/dataset-theme/v1.0"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Local identifier of the resource
      schema:
        type: string
        example: "https%3A%2F%2Fwww.epos-eu.org%2Fepos-dcat-ap%2FSeismology%2FDataset%2FAHEAD%2Fevents%2Fv1.0"

    DatasetId:
      name: id
      in: path
      required: true
      description: Dataset identifier.
      schema:
        type: string
        example: "https%3A%2F%2Fwww.epos-eu.org%2Fepos-dcat-ap%2FSeismology%2FDataset%2FAHEAD%2Fevents%2Fv1.0"

    DistributionId:
      name: id
      in: path
      required: true
      description: Distribution identifier.
      schema:
        type: string
        example: "https%3A%2F%2Fwww.epos-eu.org%2Fepos-dcat-ap%2FSeismology%2FDataset%2FAHEAD%2Fevents%2Fdistribution%2Frestful%2Fv1.0"

    SoftwareApplicationId:
      name: id
      in: path
      required: true
      description: URL-encoded software application identifier.
      schema:
        type: string
        example: "https%3A%2F%2Fepos-eu.org%2Fanthropogenic_hazards%2Fsoftware%2FCatalogToXls%2Fv1.0"

    SoftwareSourceCodeId:
      name: id
      in: path
      required: true
      description: Software source code identifier.
      schema:
        type: string
        example: "https%3A%2F%2Fdoi.org%2F10.5281%2Fzenodo.17598403"

    WebserviceId:
      name: id
      in: path
      required: true
      description: Webservice identifier.
      schema:
        type: string
        example: "https%3A%2F%2Fwww.epos-eu.org%2Fepos-dcat-ap%2FSeismology%2FWebService%2FAHEAD%2Frestful%2Ffdsnws-event%2Fv1.0"

    OrganizationId:
      name: id
      in: path
      required: true
      description: Organization identifier.
      schema:
        type: string
        example: "PIC%3A999472675%2Fv1.0"

    ConceptId:
      name: id
      in: path
      required: true
      description: Concept identifier.
      schema:
        type: string
        example: "category%3Aearthquakeparameters%2Fv1.0"

    ConceptSchemeId:
      name: id
      in: path
      required: true
      description: Concept scheme identifier.
      schema:
        type: string
        example: "category%3Aseismology%2Fv1.0"

    Q:
      name: q
      in: query
      required: false
      description: Free-text query used to search catalogue resources.
      schema:
        type: string
        example: "historical earthquakes"

    PageSize:
      name: pageSize
      in: query
      required: false
      description: Maximum number of search items requested per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
        example: 10

    PageNumber:
      name: pageNumber
      in: query
      required: false
      description: 1-based result page index to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
        default: 1
        example: 1

    TypeFilter:
      name: type
      in: query
      required: false
      description: |
        Filter results to one or more resource types. When omitted, all supported search
        resource types are returned.
        Pass comma-separated values in a single parameter:
        `?type=dataset,webservice`.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/ResourceType"
      style: form
      explode: false

    SpatialFilter:
      name: spatialFilter
      in: query
      required: false
      description: |
        Spatial filter expressed as a WKT polygon string (EPSG:4326).
        Resources whose spatial coverage intersects this polygon are returned.
        Example: `POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))`
      schema:
        type: string
        example: "POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))"

    DateFrom:
      name: dateFrom
      in: query
      required: false
      description: |
        Start of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Resources with temporal coverage overlapping this range are returned.
        Must be less than or equal to `dateTo` when both are supplied.
      schema:
        type: string
        format: date-time
        example: "2020-01-01T00:00:00Z"

    DateTo:
      name: dateTo
      in: query
      required: false
      description: |
        End of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Resources with temporal coverage overlapping this range are returned.
        Must be greater than or equal to `dateFrom` when both are supplied.
      schema:
        type: string
        format: date-time
        example: "2023-12-31T23:59:59Z"

    Provider:
      name: provider
      in: query
      required: false
      description: |
        Filter by one or more provider organization IDs.
        Use this filter to restrict results to resources associated with one of the
        specified provider organizations.
        Pass comma-separated values in a single parameter:
        `?provider=PIC:999472675/v1.0,ROR:048a87296/v1.0`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false

    VersioningStatus:
      name: versioningStatus
      in: query
      required: false
      description: |
        Filter by one or more resource publication statuses.
        When omitted, defaults to `PUBLISHED`.
        Pass comma-separated values in a single parameter:
        `?versioningStatus=PUBLISHED,DRAFT`.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/VersioningStatus"
        default:
          - PUBLISHED
      style: form
      explode: false

    Keywords:
      name: keywords
      in: query
      required: false
      description: |
        Filter resources that carry all supplied keyword values.
        Pass comma-separated values in a single parameter:
        `?keywords=seismology,stations`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalidQuery:
              summary: Invalid query parameter
              value:
                title: "Invalid query parameter"
                status: 400
                detail: "One or more query parameters are invalid."

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            resourceNotFound:
              summary: Missing resource
              value:
                title: "Resource not found"
                status: 404
                detail: "Dataset not found."

    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            internalError:
              summary: Unexpected server failure
              value:
                title: "Internal server error"
                status: 500

    GatewayTimeout:
      description: Request could not be completed before timeout
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            upstreamTimeout:
              summary: Request timed out
              value:
                title: "upstream_timeout"
                status: 504
                detail: "metadata search timed out"

  schemas:
    # -------------------------------------------------------------------------
    # Shared enums
    # -------------------------------------------------------------------------

    ResourceType:
      type: string
      description: Resource type identifier used in search results.
      enum:
        - dataset
        - webservice
        - organization
        - softwareapplication
        - softwaresourcecode

    VersioningStatus:
      type: string
      description: Publication status of resource.
      enum:
        - DRAFT
        - SUBMITTED
        - PUBLISHED
        - ARCHIVED

    # -------------------------------------------------------------------------
    # Search
    # -------------------------------------------------------------------------

    SearchResponse:
      type: object
      required:
        - page_number
        - page_size
        - total
        - total_pages
        - items
      properties:
        page_number:
          type: integer
          minimum: 1
          description: 1-based page index returned in this response
          example: 1
        page_size:
          type: integer
          minimum: 0
          maximum: 100
          description: Number of items returned in this response page
          example: 10
        total:
          type: integer
          minimum: 0
          description: Total number of matching resources across all pages
          example: 123
        total_pages:
          type: integer
          minimum: 0
          description: Total number of available result pages for the supplied page size
          example: 13
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchItem"

    SearchItem:
      oneOf:
        - $ref: "#/components/schemas/DatasetSearchItem"
        - $ref: "#/components/schemas/WebserviceSearchItem"
        - $ref: "#/components/schemas/OrganizationSearchItem"
        - $ref: "#/components/schemas/SoftwareApplicationSearchItem"
        - $ref: "#/components/schemas/SoftwareSourceCodeSearchItem"
      discriminator:
        propertyName: type
        mapping:
          dataset: "#/components/schemas/DatasetSearchItem"
          webservice: "#/components/schemas/WebserviceSearchItem"
          organization: "#/components/schemas/OrganizationSearchItem"
          softwareapplication: "#/components/schemas/SoftwareApplicationSearchItem"
          softwaresourcecode: "#/components/schemas/SoftwareSourceCodeSearchItem"

    BaseSearchItem:
      type: object
      required:
        - type
        - id
        - name
        - href
      properties:
        type:
          $ref: "#/components/schemas/ResourceType"
        id:
          type: string
          description: Identifier of resource within this API.
          example: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/v1.0"
        name:
          description: Human-readable display name used in search results.
          type: string
          example: "TEST1 - Historical earthquakes 1000-1899"
        href:
          type: string
          format: uri-reference
          description: Relative URI reference to resource detail endpoint.
          example: "v1/dataset/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/v1.0"

    DatasetSearchItem:
      allOf:
        - $ref: "#/components/schemas/BaseSearchItem"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - dataset
            providers:
              type: array
              description: Organization references associated with this dataset
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "PIC:999472675/v1.0"
                  name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                  href: "v1/organization/PIC:999472675/v1.0"
                - id: "ROR:048a87296/v1.0"
                  name: "Uppsala University"
                  href: "v1/organization/ROR:048a87296/v1.0"
            concepts:
              type: array
              description: Concept references assigned to this dataset
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "category:seismologicalproductsservices/v1.0"
                  href: "v1/concept/category:seismologicalproductsservices/v1.0"
                - id: "category:earthquakeparameters/v1.0"
                  href: "v1/concept/category:earthquakeparameters/v1.0"
            distributions:
              type: array
              description: Distribution references for this dataset
              items:
                $ref: "#/components/schemas/DatasetDistributionSearchItem"
              example:
                - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                  href: "v1/distribution/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/bibliography/distribution/restful/v1.0"
                  href: "v1/distribution/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/bibliography/distribution/restful/v1.0"

    OrganizationSearchItem:
      allOf:
        - $ref: "#/components/schemas/BaseSearchItem"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - organization

    SoftwareApplicationSearchItem:
      allOf:
        - $ref: "#/components/schemas/BaseSearchItem"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - softwareapplication
            provider:
              type: array
              description: Organization references for providers of this software application
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "ROR:048a87296/v1.0"
                  name: "Uppsala University"
                  href: "v1/organization/ROR:048a87296/v1.0"

    SoftwareSourceCodeSearchItem:
      allOf:
        - $ref: "#/components/schemas/BaseSearchItem"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - softwaresourcecode
            provider:
              type: array
              description: Organization references for providers of this software source code
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "ROR:048a87296/v1.0"
                  name: "Uppsala University"
                  href: "v1/organization/ROR:048a87296/v1.0"

    WebserviceSearchItem:
      allOf:
        - $ref: "#/components/schemas/BaseSearchItem"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - webservice
            provider:
              description: Organization reference for provider of this webservice
              allOf:
                - $ref: "#/components/schemas/ResourceRef"
              example:
                id: "PIC:999472675/v1.0"
                name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                href: "v1/organization/PIC:999472675/v1.0"
            concepts:
              type: array
              description: Concept references assigned to this webservice
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "category:seismologicalproductsservices/v1.0"
                  href: "v1/concept/category:seismologicalproductsservices/v1.0"
                - id: "category:earthquakeparameters/v1.0"
                  href: "v1/concept/category:earthquakeparameters/v1.0"

    DatasetDistributionSearchItem:
      type: object
      required:
        - id
        - href
      properties:
        id:
          type: string
          example: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
        name:
          type: string
          description: Optional human-readable distribution title.
          example: "TEST1 - Parameters of historical earthquakes (1000-1899) - FDSN event"
        href:
          type: string
          format: uri-reference
          description: API-base-relative URI reference to distribution detail endpoint
          example: "v1/distribution/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"

    # -------------------------------------------------------------------------
    # Resource references
    # -------------------------------------------------------------------------

    ResourceRef:
      type: object
      required:
        - id
        - href
      properties:
        id:
          type: string
          example: "PIC:999472675/v1.0"
        name:
          type: string
          description: Optional human-readable label for referenced resource.
          example: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
        href:
          type: string
          format: uri-reference
          description: Relative URI reference to referenced resource detail endpoint
          example: "v1/organization/PIC:999472675/v1.0"

    # -------------------------------------------------------------------------
    # Detail schemas
    # -------------------------------------------------------------------------

    BaseDetailResource:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Identifier of resource within this API.
        name:
          description: Human-readable display name of the resource
          type: string
        description:
          description: Optional human-readable summary of resource.
          type: string

    Dataset:
      allOf:
        - $ref: "#/components/schemas/BaseDetailResource"
        - type: object
          required:
            - description
          properties:
            created:
              type: string
              format: date-time
              description: Resource creation timestamp in ISO 8601 UTC
              example: "2024-01-15T10:30:00Z"
            modified:
              type: string
              format: date-time
              description: Resource last modification timestamp in ISO 8601 UTC
              example: "2024-03-01T08:45:00Z"
            version_info:
              type: string
              description: Human-readable version information for this dataset
              example: "Revision 3 reviewed by EPOS"
            contact_points:
              type: array
              description: Contact point references associated with this dataset
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Facility/AHEAD/contactPoint/v1.0"
                  name: "Manager"
                  href: "http://metadata-lifecycle-service:8080/api/v2/access/contactpoint/https%3A%2F%2Fwww.epos-eu.org%2Fepos-dcat-ap%2FSeismology%2FFacility%2FAHEAD%2FcontactPoint%2Fv1.0"
                - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Facility/AHEAD/scientificContact/v1.0"
                  name: "Scientific contact"
                  href: "http://metadata-lifecycle-service:8080/api/v2/access/contactpoint/https%3A%2F%2Fwww.epos-eu.org%2Fepos-dcat-ap%2FSeismology%2FFacility%2FAHEAD%2FscientificContact%2Fv1.0"
            keywords:
              type: array
              items:
                type: string
              example:
                - "event"
                - "earthquake"
                - "magnitude"
            concepts:
              type: array
              description: Concept references assigned to this dataset
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "category:seismologicalproductsservices/v1.0"
                  name: "Seismological products services"
                  href: "v1/concept/category:seismologicalproductsservices/v1.0"
                - id: "category:earthquakeparameters/v1.0"
                  name: "Earthquake parameters"
                  href: "v1/concept/category:earthquakeparameters/v1.0"
            publisher:
              type: array
              description: Organizations publishing this dataset; exposed as `providers` in search results
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "PIC:999472675/v1.0"
                  name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                  href: "v1/organization/PIC:999472675/v1.0"
            issued:
              type: string
              format: date-time
              description: Dataset publication or issuance timestamp in ISO 8601 UTC
              example: "2024-02-01T00:00:00Z"
            spatial:
              type: string
              description: Spatial coverage expressed as a WKT polygon (EPSG:4326)
              example: "POLYGON((-25 34, 45 34, 45 72, -25 72, -25 34))"
            identifiers:
              type: array
              description: External or domain-specific identifiers for this dataset
              items:
                $ref: "#/components/schemas/Identifier"
            temporal:
              $ref: "#/components/schemas/TemporalExtent"
            status:
              $ref: "#/components/schemas/VersioningStatus"
            distributions:
              type: array
              description: Distributions that provide access to this dataset
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                  name: "TEST1 - Parameters of historical earthquakes (1000-1899) - FDSN event"
                  href: "v1/distribution/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/bibliography/distribution/restful/v1.0"
                  name: "TEST2 - Bibliography for historical earthquakes"
                  href: "v1/distribution/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/bibliography/distribution/restful/v1.0"
            access_rights:
              type: string
              description: Access rights statement for this dataset
              example: "open"
            accrual_periodicity:
              type: string
              description: Frequency with which this dataset is updated
              example: "monthly"
            is_version_of:
              description: Reference to parent dataset resource this dataset version derives from
              allOf:
                - $ref: "#/components/schemas/ResourceRef"
              example:
                id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/bibliography/v1.0"
                name: "TEST2 - Bibliography metadata for historical earthquakes"
                href: "v1/dataset/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/bibliography/v1.0"
            quality_annotation:
              type: string
              description: Aggregated quality annotation summary associated with this dataset
              example: "Validated by EPOS thematic core service; station metadata completeness >95%."
            version:
              type: string
              description: Machine-readable version string for this dataset
              example: "3.1.0"

    Distribution:
      oneOf:
        - $ref: "#/components/schemas/WebServiceDistribution"
        - $ref: "#/components/schemas/DownloadableFileDistribution"
      discriminator:
        propertyName: type
        mapping:
          http://publications.europa.eu/resource/authority/distribution-type/WEB_SERVICE: "#/components/schemas/WebServiceDistribution"
          http://publications.europa.eu/resource/authority/distribution-type/DOWNLOADABLE_FILE: "#/components/schemas/DownloadableFileDistribution"

    DistributionBase:
      allOf:
        - $ref: "#/components/schemas/BaseDetailResource"
        - type: object
          properties:
            format:
              type: string
              description: File format of the distribution
              example: "application/xml"
            issued:
              type: string
              format: date-time
              description: Distribution publication timestamp in ISO 8601 UTC
              example: "2024-02-01T00:00:00Z"
            modified:
              type: string
              format: date-time
              description: Distribution last modification timestamp in ISO 8601 UTC
              example: "2024-03-01T08:45:00Z"
            license:
              type: string
              format: uri
              description: License under which the distribution can be used or reused
              example: "https://creativecommons.org/licenses/by-nc/4.0/"

    WebServiceDistribution:
      allOf:
        - $ref: "#/components/schemas/DistributionBase"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              description: Distribution delivery kind
              enum:
                - "http://publications.europa.eu/resource/authority/distribution-type/WEB_SERVICE"
              example: "http://publications.europa.eu/resource/authority/distribution-type/WEB_SERVICE"
            webservice:
              $ref: "#/components/schemas/ResourceRef"
            operation:
              $ref: "#/components/schemas/Operation"

    DownloadableFileDistribution:
      allOf:
        - $ref: "#/components/schemas/DistributionBase"
        - type: object
          required:
            - type
            - download_url
          properties:
            type:
              type: string
              description: Distribution delivery kind
              enum:
                - "http://publications.europa.eu/resource/authority/distribution-type/DOWNLOADABLE_FILE"
              example: "http://publications.europa.eu/resource/authority/distribution-type/DOWNLOADABLE_FILE"
            download_url:
              type: string
              format: uri
              description: Direct download URL for downloadable-file distributions.
              example: "https://data.ingv.it/downloads/irpinia-stations.xml"

    SoftwareApplication:
      allOf:
        - $ref: "#/components/schemas/BaseDetailResource"
        - type: object
          properties:
            contact_points:
              type: array
              description: Contact point references associated with this software application
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "https://orcid.org/0000-0001-6095-2941/v1.0"
                  name: "Author"
                  href: "http://metadata-lifecycle-service:8080/api/v2/access/contactpoint/https%3A%2F%2Forcid.org%2F0000-0001-6095-2941%2Fv1.0"
            keywords:
              type: array
              items:
                type: string
              example:
                - "portal"
                - "seismology"
                - "data access"
            concepts:
              type: array
              description: Concept references assigned to this application
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "category:software_appl_conc_multi/v1.0"
                  name: "Multidisciplinary software"
                  href: "v1/concept/category:software_appl_conc_multi/v1.0"
            download_url:
              type: string
              format: uri
              description: URL to download or install the application
              example: "https://example.org/application/download"
            install_url:
              type: string
              format: uri
              description: URL at which the application may be installed
              example: "https://example.org/application/install"
            license:
              type: string
              format: uri
              description: URL of the license document for the software application
              example: "https://example.org/licenses/epos-app-license"
            software_version:
              type: string
              description: Version of the software application instance
              example: "2.4.1"
            software_requirements:
              type: string
              description: Runtime dependencies required by the application
              example: "Java 21"
            main_entity_of_page:
              type: string
              format: uri
              description: Web page describing the software application
              example: "https://example.org/app"
            provider:
              type: array
              description: Organizations providing this software application
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "ROR:048a87296/v1.0"
                  name: "Uppsala University"
                  href: "v1/organization/ROR:048a87296/v1.0"
            operations:
              type: array
              description: Web service operations linked to this software application
              items:
                $ref: "#/components/schemas/ResourceRef"

    SoftwareSourceCode:
      allOf:
        - $ref: "#/components/schemas/BaseDetailResource"
        - type: object
          properties:
            contact_points:
              type: array
              description: Contact point references associated with this software source code
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "https://orcid.org/0000-0001-6095-2941/v1.0"
                  name: "Author"
                  href: "http://metadata-lifecycle-service:8080/api/v2/access/contactpoint/https%3A%2F%2Forcid.org%2F0000-0001-6095-2941%2Fv1.0"
            programming_language:
              type: string
              description: Primary programming language of the source code
              example: "Java"
            keywords:
              type: array
              items:
                type: string
              example:
                - "portal"
                - "seismology"
                - "open source"
            concepts:
              type: array
              description: Concept references assigned to this source code
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "category:software_jup_conc_multi/v1.0"
                  name: "Multidisciplinary software"
                  href: "v1/concept/category:software_jup_conc_multi/v1.0"
            repository:
              type: string
              format: uri
              description: URL of the source code repository
              example: "https://github.com/example/epos-portal"
            license:
              type: string
              format: uri
              description: URL of the license document for the software source code
              example: "https://example.org/licenses/epos-source-license"
            software_version:
              type: string
              description: Version of the software source code instance
              example: "2.4.1"
            runtime_platform:
              type: string
              description: Runtime platform or interpreter dependencies
              example: "Java 21"
            target_products:
              type: array
              description: Software applications targeted by this source code
              items:
                $ref: "#/components/schemas/ResourceRef"
            provider:
              type: array
              description: Organizations providing this software source code
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "ROR:048a87296/v1.0"
                  name: "Uppsala University"
                  href: "v1/organization/ROR:048a87296/v1.0"
            main_entity_of_page:
              type: string
              format: uri
              description: Web page describing the software source code
              example: "https://example.org/source"

    Organization:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: "PIC:999472675/v1.0"
        identifiers:
          type: array
          description: External or domain-specific identifiers for this organization
          items:
            $ref: "#/components/schemas/Identifier"
        name:
          type: string
          description: Human-readable display name of the organization
          example: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
        lei_code:
          type: string
          description: Legal Entity Identifier code
          example: "5493001KJTIIGC8Y1R12"
        address:
          type: string
          description: Physical address of the organization
          example: "Via di Vigna Murata 605, Rome, 00143, IT"
        logo:
          type: string
          format: uri
          description: URL of the organization logo
          example: "https://www.ingv.it/images/logo-ingv.png"
        url:
          type: string
          format: uri
          description: URL of the organization website
          example: "http://www.ingv.it"
        email:
          type: array
          description: Email addresses of the organization
          items:
            type: string
          example:
            - "ufficiostampa@ingv.it"
        telephone:
          type: array
          description: Telephone numbers of the organization
          items:
            type: string
        contact_points:
          type: array
          description: Contact point references associated with this organization
          items:
            $ref: "#/components/schemas/ResourceRef"
          example:
            - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Facility/AHEAD/contactPoint/v1.0"
              name: "Manager"
              href: "http://metadata-lifecycle-service:8080/api/v2/access/contactpoint/https%3A%2F%2Fwww.epos-eu.org%2Fepos-dcat-ap%2FSeismology%2FFacility%2FAHEAD%2FcontactPoint%2Fv1.0"
        member_of:
          type: array
          description: Parent organizations to which this organization belongs
          items:
            $ref: "#/components/schemas/ResourceRef"

    Webservice:
      allOf:
        - $ref: "#/components/schemas/BaseDetailResource"
        - type: object
          properties:
            identifiers:
              type: array
              description: External or domain-specific identifiers for this webservice
              items:
                $ref: "#/components/schemas/Identifier"
            entrypoint:
              type: string
              format: uri
              description: API entrypoint of the webservice
              example: "https://webservices.ingv.it/fdsnws/station/1"
            contact_points:
              type: array
              description: Contact point references associated with this webservice
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Facility/AHEAD/contactPoint/v1.0"
                  name: "Manager"
                  href: "http://metadata-lifecycle-service:8080/api/v2/access/contactpoint/https%3A%2F%2Fwww.epos-eu.org%2Fepos-dcat-ap%2FSeismology%2FFacility%2FAHEAD%2FcontactPoint%2Fv1.0"
            provider:
              description: Organization providing this webservice
              allOf:
                - $ref: "#/components/schemas/ResourceRef"
              example:
                id: "PIC:999472675/v1.0"
                name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                href: "v1/organization/PIC:999472675/v1.0"
            issued:
              type: string
              format: date-time
              description: Webservice publication timestamp in ISO 8601 UTC
              example: "2024-02-01T00:00:00Z"
            modified:
              type: string
              format: date-time
              description: Webservice last modification timestamp in ISO 8601 UTC
              example: "2024-03-01T08:45:00Z"
            spatial:
              type: string
              description: Spatial coverage expressed as a WKT polygon (EPSG:4326)
              example: "POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))"
            temporal:
              $ref: "#/components/schemas/TemporalExtent"
            keywords:
              type: array
              items:
                type: string
              example:
                - "fdsn"
                - "station"
            concepts:
              type: array
              description: Concept references assigned to this webservice
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "category:earthquakeparameters/v1.0"
                  name: "Earthquake parameters"
                  href: "v1/concept/category:earthquakeparameters/v1.0"
            license:
              type: string
              description: License under which the webservice can be used or reused
              example: "open"
            operations:
              type: array
              description: Operations supported by this webservice
              items:
                $ref: "#/components/schemas/Operation"
            api_documentation:
              $ref: "#/components/schemas/ApiDocumentation"

    Operation:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          example: "https://www.epos-eu.org/epos-dcat-ap/Seismology/WebService/AHEAD/restful/fdsnws-event/Operation/v1.0"
        method:
          type: string
          description: HTTP method used by the operation
          example: "GET"
        returns:
          type: array
          description: Output media types returned by the operation
          items:
            type: string
          example:
            - "application/xml"
            - "application/json"
        iri_template:
          $ref: "#/components/schemas/IriTemplate"
        api_documentation:
          $ref: "#/components/schemas/ApiDocumentation"

    IriTemplate:
      type: object
      required:
        - template
      properties:
        template:
          type: string
          description: URI template describing the operation endpoint
          example: "https://www.emidius.eu/fdsnws/event/1/query{?starttime, endtime, eventid, minlatitude, maxlatitude, minlongitude, maxlongitude, latitude, longitude, maxradiuskm, minmagnitude, maxmagnitude, orderby, includeallorigins, includeallmagnitudes, limit, nodata}"
        mappings:
          type: array
          description: Parameter mappings supported by the URI template
          items:
            $ref: "#/components/schemas/IriTemplateMapping"

    IriTemplateMapping:
      type: object
      required:
        - variable
        - label
        - required
        - range
      properties:
        variable:
          type: string
          description: Template variable name
          example: "network"
        label:
          type: string
          description: Short string describing the meaning of the parameter
          example: "Network code"
        range:
          type: string
          description: Parameter type such as `xsd:string`, `xsd:boolean`, `xsd:date`, or `xsd:dateTime`
          example: "xsd:string"
        property:
          type: string
          description: Property mapped to the variable
          example: "http://schema.org/name"
        required:
          type: boolean
          description: Whether the variable is required
          example: false
        default_value:
          type: string
          description: Default value of the parameter
          example: "IV"
        min_value:
          type: string
          description: Minimum value of the parameter
          example: "0"
        max_value:
          type: string
          description: Maximum value of the parameter
          example: "9999"
        param_value:
          type: array
          description: Allowed values that can be used for the parameter
          items:
            type: string
          example:
            - "BHZ"
            - "HHZ"
        multiple_values:
          type: boolean
          description: Whether multiple values are allowed for the parameter
          example: true
        readonly_value:
          type: boolean
          description: Whether the parameter is mutable
          example: false
        value_pattern:
          type: string
          description: Regular expression used to validate parameter values
          example: "^[A-Z0-9]+$"

    ApiDocumentation:
      type: object
      required:
        - title
        - description
        - entrypoint
      properties:
        title:
          type: string
          description: Title of the API documentation
          example: "ahead-fdsnws-event documentation"
        description:
          type: string
          description: Description of the API documentation
          example: "Documentation for the fdsnws-event webservice"
        entrypoint:
          type: string
          format: uri
          description: API documentation entry point
          example: "https://www.emidius.eu/AHEAD/services/epos_events.php"

    Concept:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: "category:seismologicalproductsservices/v1.0"
        name:
          type: string
          example: "Seismological products services"
        description:
          type: string
          example: "TCS Subdomain"
        in_scheme:
          description: Concept scheme containing this concept
          allOf:
            - $ref: "#/components/schemas/ResourceRef"
        children:
          type: array
          description: Child concepts directly below this concept
          items:
            $ref: "#/components/schemas/ResourceRef"

    ConceptTreeNode:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: "category:earthquakeparameters/v1.0"
        name:
          type: string
          example: "Earthquake parameters"
        description:
          type: string
          example: "TCS Subdomain"
        children:
          type: array
          description: Nested child concepts directly below this concept
          items:
            $ref: "#/components/schemas/ConceptTreeNode"

    ConceptScheme:
      type: object
      required:
        - id
        - label
        - name
      properties:
        id:
          type: string
          example: "category:seismology/v1.0"
        label:
          type: string
          example: "SEI"
        name:
          type: string
          example: "Seismology"
        description:
          type: string
          example: "TCS Domain"
        logo:
          type: string
          format: uri
          example: "assets/img/logo/SEISM_logo.png"
        homepage:
          type: string
          format: uri
          example: "https://www.epos-eu.org/tcs/seismology"
        color:
          type: string
          description: Hex colour code used for UI rendering
          example: "#476f57"
        order_number:
          type: integer
          description: Display order among sibling concept schemes
          example: 1
        children:
          type: array
          description: Nested child concepts used by concept tree responses
          items:
            $ref: "#/components/schemas/ConceptTreeNode"
        top_concepts:
          type: array
          description: Top concepts directly contained in this concept scheme
          items:
            $ref: "#/components/schemas/ResourceRef"

    ConceptTreeResponse:
      type: object
      required:
        - schemes
      properties:
        schemes:
          type: array
          description: Ordered list of concept schemes, each carrying its full concept subtree
          items:
            $ref: "#/components/schemas/ConceptScheme"

    # -------------------------------------------------------------------------
    # Shared helpers
    # -------------------------------------------------------------------------

    TemporalExtent:
      type: object
      description: Temporal coverage of a resource
      properties:
        start:
          type: string
          format: date-time
          description: Start of the temporal coverage (inclusive), ISO 8601 UTC
          example: "2010-01-01T00:00:00Z"
        end:
          type: string
          format: date-time
          description: End of the temporal coverage (inclusive), ISO 8601 UTC. Omitted for open-ended coverage.
          example: "2023-12-31T23:59:59Z"

    Identifier:
      type: object
      description: Typed identifier attached to a resource
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: Identifier scheme or type
          example: "doi"
        value:
          type: string
          description: Identifier value
          example: "10.13127/tsunami/neamthm18"

    Problem:
      type: object
      required:
        - title
        - status
      properties:
        title:
          type: string
          description: Short, human-readable summary of problem
          example: "Resource not found"
        status:
          type: integer
          description: HTTP status code for this problem occurrence
          example: 404
        detail:
          type: string
          description: Optional human-readable explanation specific to this occurrence
          example: "The requested resource was not found"
        instance:
          type: string
          format: uri-reference
          description: Optional URI reference identifying this specific problem occurrence
          example: "requests/req-123"
