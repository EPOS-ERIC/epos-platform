      - $ref: "#/components/parameters/VersionId"
    post:
      tags:
        - Resources
      summary: Unpublish resource version
      operationId: unpublishResourceVersion
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resource version unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /resources/{resourceType}/{id}/draft-from-publication:
    parameters:
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags:
        - Resources
      summary: Create draft from publication
      operationId: draftFromPublication
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

  /resources/{resourceType}/{id}/draft-from-archive:
    parameters:
      - $ref: "#/components/parameters/LifecycleResourceType"
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags:
        - Resources
      summary: Create draft from archive
      operationId: draftFromArchive
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        "504": { $ref: "#/components/responses/GatewayTimeout" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      description: Resource identifier.
      schema:
        type: string
        format: uuid

    UserId:
      name: id
      in: path
      required: true
      description: User identifier. Use `self` to resolve authenticated user, or UUID for direct user lookup.
      schema:
        anyOf:
          - type: string
            enum:
              - self
          - type: string
            format: uuid
        example: self

    UserUUID:
      name: id
      in: path
      required: true
      description: User identifier.
      schema:
        type: string
        format: uuid

    Permission:
      name: permission
      in: path
      required: true
      description: Global permission key.
      schema:
        type: string
        enum:
          - global.membership.manage
          - global.role.manage
          - global.permission.manage
          - organization.manage
          - contact_point.manage
          - category_scheme.manage
        example: global.permission.manage

    GlobalRole:
      name: role
      in: path
      required: true
      description: Global role key.
      schema:
        type: string
        enum: [ADMIN]
        example: ADMIN

    MembershipUserId:
      name: userId
      in: path
      required: true
      description: User identifier for membership operations.
      schema:
        type: string
        format: uuid

    GroupRole:
      name: role
      in: path
      required: true
      description: Group role to assign or remove.
      schema:
        type: string
        enum: [EDITOR, REVIEWER, GROUP_ADMIN]

    GroupPermission:
      name: permission
      in: path
      required: true
      description: Group-scoped permission to grant or revoke.
      schema:
        type: string
        enum:
          - resource.create
          - resource.edit
          - resource.submit
          - resource.withdraw
          - resource.reopen
          - resource.discard
          - resource.reject
          - resource.publish
          - resource.unpublish
          - group.membership.manage
          - group.role.manage
          - group.permission.manage
          - category.manage

    GroupId:
      name: groupId
      in: path
      required: true
      description: Group identifier.
      schema:
        type: string
        format: uuid

    CategoryId:
      name: categoryId
      in: path
      required: true
      description: Category identifier.
      schema:
        type: string
        format: uuid

    VersionId:
      name: versionId
      in: path
      required: true
      description: Resource version identifier.
      schema:
        type: string
        format: uuid

    LifecycleResourceType:
      name: resourceType
      in: path
      required: true
      description: Resource type identifier accepted by lifecycle endpoints.
      schema:
        type: string
        enum:
          - dataset
          - software-application
          - software-source-code

    Q:
      name: q
      in: query
      required: false
      description: Free-text query used to search catalogue resources.
      schema:
        type: string
        example: "historical earthquakes"

    TypeFilter:
      name: type
      in: query
      required: false
      description: |
        Filter results to one or more resource types. When omitted, all supported
        resource types are returned.
        Pass comma-separated values in a single parameter:
        `?type=dataset,software-application`.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/DiscoveryResourceType"
      style: form
      explode: false

    ConceptFilter:
      name: concept
      in: query
      required: false
      description: |
        Filter results to one or more catalogue concepts. Pass comma-separated
        values in a single parameter: `?concept=DATA,SOFTWARE`.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/DiscoveryConcept"
      style: form
      explode: false

    GroupFilter:
      name: groupId
      in: query
      required: false
      description: Filter results to resources belonging to the specified group.
      schema:
        type: string
        format: uuid

    EditorFilter:
      name: editorId
      in: query
      required: false
      description: Filter results by the user who created the resource version.
      schema:
        type: string

    SpatialFilter:
      name: spatialFilter
      in: query
      required: false
      description: |
        Spatial filter expressed as a WKT POINT or POLYGON string (EPSG:4326).
        Resources whose spatial coverage intersects this geometry are returned.
        Example: `POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))`
      schema:
        type: string
        example: "POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))"

    DateFrom:
      name: dateFrom
      in: query
      required: false
      description: |
        Start of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Resources with temporal coverage overlapping this range are returned.
        Must be less than or equal to `dateTo` when both are supplied.
      schema:
        type: string
        format: date-time
        example: "2020-01-01T00:00:00Z"

    DateTo:
      name: dateTo
      in: query
      required: false
      description: |
        End of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Resources with temporal coverage overlapping this range are returned.
        Must be greater than or equal to `dateFrom` when both are supplied.
      schema:
        type: string
        format: date-time
        example: "2023-12-31T23:59:59Z"

    Provider:
      name: provider
      in: query
      required: false
      description: |
        Filter by one or more provider organization IDs.
        Use this filter to restrict results to resources associated with one of the
        specified provider organizations.
        Pass comma-separated values in a single parameter:
        `?provider=94f4885e-502e-5f33-ba82-033a72efd827`.
      schema:
        type: array
        items:
          type: string
          format: uuid
      style: form
      explode: false

    VersioningStatus:
      name: versioningStatus
      in: query
      required: false
      description: |
        Filter by one or more versioning states.
        When omitted, defaults to `PUBLISHED`.
        Pass comma-separated values in a single parameter:
        `?versioningStatus=PUBLISHED,DRAFT`.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/DiscoveryVersioningStatus"
        default:
          - PUBLISHED
      style: form
      explode: false

    Keywords:
      name: keywords
      in: query
      required: false
      description: |
        Filter resources that carry all supplied keyword values.
        Pass comma-separated values in a single parameter:
        `?keywords=seismology,stations`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalidQuery:
              summary: Invalid query parameter
              value:
                title: "invalid_query_parameter"
                status: 400
                detail: "unsupported search type: concept"

    Unauthorized:
      description: Bearer token missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalidToken:
              summary: Invalid bearer token
              value:
                title: "invalid_token"
                status: 401
                detail: "token is invalid"
            missingToken:
              summary: Missing bearer token
              value:
                title: "missing_token"
                status: 401
                detail: "bearer token required"

    Forbidden:
      description: Authenticated user lacks permission
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            forbidden:
              summary: Access denied
              value:
                title: "forbidden"
                status: 403
                detail: "user access denied"

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            resourceNotFound:
              summary: Missing resource
              value:
                title: "resource_not_found"
                status: 404
                detail: "dataset not found"

    Conflict:
      description: Request conflicts with current resource state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            resourceConflict:
              summary: Conflicting resource state
              value:
                title: "resource_conflict"
                status: 409
                detail: "resource is not in draft state"

    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            internalError:
              summary: Unexpected server failure
              value:
                title: "Internal server error"
                status: 500

    GatewayTimeout:
      description: Request could not be completed before timeout
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            upstreamTimeout:
              summary: Request timed out
              value:
                title: "upstream_timeout"
                status: 504
                detail: "metadata search timed out"

    ServiceUnavailable:
      description: Metadata Lifecycle service unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            metadataLifecycleUnavailable:
              summary: Metadata Lifecycle unavailable
              value:
                title: "metadata_lifecycle_unavailable"
                status: 503
                detail: "metadata-lifecycle service unavailable"

  schemas:
    # -------------------------------------------------------------------------
    # Shared enums
    # -------------------------------------------------------------------------

    NonBlankString:
      type: string
      minLength: 1
      pattern: '[^\u0009-\u000D\u0020\u0085\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]'

    DiscoveryResourceType:
      type: string
      description: Resource type identifier used in discovery results.
      enum:
        - dataset
        - software-application
        - software-source-code

    DiscoveryConcept:
      type: string
      description: Catalogue concept used to classify a resource.
      enum: [DATA, FACILITIES, SOFTWARE]

    VersioningStatus:
      type: string
      description: Lowercase lifecycle state returned by write operations.
      enum:
        - published
        - draft
        - submitted
        - archived
        - discarded
        - rejected

    DiscoveryVersioningStatus:
      type: string
      description: Uppercase versioning state accepted by the discovery filter.
      enum: [PUBLISHED, DRAFT, SUBMITTED, ARCHIVED, REJECTED]

    DatasetDraftMetadata:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { $ref: "#/components/schemas/NonBlankString" }
        description: { type: string }
        keywords: { type: string }
        accrual_periodicity: { type: string, nullable: true }
        quality_annotation: { type: string, nullable: true }
        access_right: { type: string, nullable: true }
        distributions:
          {
            type: array,
            items: { $ref: "#/components/schemas/DistributionDraft" },
          }
        spatial_coverage:
          type: string
          nullable: true
          minLength: 1
          description: WKT POINT or POLYGON geometry in EPSG:4326.
          example: POINT (12.5 41.9)
        temporal_coverage: { $ref: "#/components/schemas/TemporalCoverage" }
        persistent_identifiers:
          {
            type: array,
            items: { $ref: "#/components/schemas/IdentifierDraft" },
          }
        contact_points: { type: array, items: { type: string, format: uuid } }
        providers: { type: array, items: { type: string, format: uuid } }
        categories: { type: array, items: { type: string, format: uuid } }
        created: { type: string, format: date-time, nullable: true }
        updated: { type: string, format: date-time, nullable: true }

    SoftwareApplicationDraftMetadata:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        description: { type: string }
        keywords: { type: string }
        license: { type: string, nullable: true }
        version: { type: string, nullable: true }
        download_url: { type: string, format: uri }
        requirements: { type: string, nullable: true }
        operating_system: { type: string, nullable: true }
        main_entity_of_page: { type: string, format: uri }
        creators: { type: array, items: { type: string, format: uuid } }
        identifiers:
          {
            type: array,
            items: { $ref: "#/components/schemas/SoftwareIdentifier" },
          }
        categories: { type: array, items: { type: string, format: uuid } }
        contact_points: { type: array, items: { type: string, format: uuid } }

    SoftwareSourceCodeDraftMetadata:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        description: { type: string }
        keywords: { type: string }
        repository: { type: string, format: uri }
        programming_language: { type: string }
        license: { type: string, nullable: true }
        software_requirements: { type: string, nullable: true }
        runtime_platform: { type: string, nullable: true }
        main_entity_of_page: { type: string, format: uri }
        version: { type: string, nullable: true }
        creators: { type: array, items: { type: string, format: uuid } }
        identifiers:
          {
            type: array,
            items: { $ref: "#/components/schemas/SoftwareIdentifier" },
          }
        categories: { type: array, items: { type: string, format: uuid } }
        contact_points: { type: array, items: { type: string, format: uuid } }

    SoftwareIdentifier:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { $ref: "#/components/schemas/NonBlankString" }
        value: { $ref: "#/components/schemas/NonBlankString" }

    IdentifierDraft:
      type: object
      additionalProperties: false
      required: [type, value]
      properties:
        type: { $ref: "#/components/schemas/NonBlankString" }
        value: { $ref: "#/components/schemas/NonBlankString" }

    DistributionDraft:
      oneOf:
        - $ref: "#/components/schemas/WebServiceDistributionDraft"
        - $ref: "#/components/schemas/DownloadableFileDistributionDraft"
      discriminator:
        propertyName: type
        mapping:
          # TODO: instead of having these weird constants, change them everywhere to just be WEB_SERVICE or DOWNLOADABLE_FILE (also in the db, ...)
          "http://publications.europa.eu/resource/authority/distribution-type/WEB_SERVICE": "#/components/schemas/WebServiceDistributionDraft"
          "http://publications.europa.eu/resource/authority/distribution-type/DOWNLOADABLE_FILE": "#/components/schemas/DownloadableFileDistributionDraft"

    WebServiceDistributionDraft:
      type: object
      additionalProperties: false
      required: [title, type, web_service]
      properties:
        title: { type: string }
        description: { type: string }
        license: { type: string, nullable: true }
        type:
          type: string
          enum:
            - "http://publications.europa.eu/resource/authority/distribution-type/WEB_SERVICE"
        issued: { type: string, format: date-time, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        byte_size: { type: integer, format: int64, nullable: true }
        web_service: { $ref: "#/components/schemas/WebServiceDraft" }

    DownloadableFileDistributionDraft:
      type: object
      additionalProperties: false
      required: [title, type, downloadable_file]
      properties:
        title: { type: string }
        description: { type: string }
        license: { type: string, nullable: true }
        type:
          type: string
          enum:
            - "http://publications.europa.eu/resource/authority/distribution-type/DOWNLOADABLE_FILE"
        issued: { type: string, format: date-time, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        byte_size: { type: integer, format: int64, nullable: true }
        downloadable_file: { $ref: "#/components/schemas/DownloadableFile" }

    WebServiceDraft:
      type: object
      additionalProperties: false
      required: [name, template_url, format]
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        description: { type: string }
        template_url: { $ref: "#/components/schemas/NonBlankString" }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/ParameterDraft" }
        format: { $ref: "#/components/schemas/NonBlankString" }
        provider: { type: string, format: uuid }
        documentation: { $ref: "#/components/schemas/Documentation" }
        spatial_coverage:
          type: string
          nullable: true
          minLength: 1
          description: WKT POINT or POLYGON geometry in EPSG:4326.
          example: POINT (12.5 41.9)
        temporal_coverage: { $ref: "#/components/schemas/TemporalCoverage" }
        contact_points: { type: array, items: { type: string, format: uuid } }

    Parameter:
      oneOf:
        - $ref: "#/components/schemas/StringParameter"
        - $ref: "#/components/schemas/BooleanParameter"
        - $ref: "#/components/schemas/IntegerParameter"
        - $ref: "#/components/schemas/FloatParameter"
        - $ref: "#/components/schemas/DateTimeParameter"
      discriminator:
        propertyName: kind
        mapping:
          STRING: "#/components/schemas/StringParameter"
          BOOLEAN: "#/components/schemas/BooleanParameter"
          INTEGER: "#/components/schemas/IntegerParameter"
          FLOAT: "#/components/schemas/FloatParameter"
          DATETIME: "#/components/schemas/DateTimeParameter"

    ParameterDraft:
      oneOf:
        - $ref: "#/components/schemas/StringParameterDraft"
        - $ref: "#/components/schemas/BooleanParameterDraft"
        - $ref: "#/components/schemas/IntegerParameterDraft"
        - $ref: "#/components/schemas/FloatParameterDraft"
        - $ref: "#/components/schemas/DateTimeParameterDraft"
      discriminator:
        propertyName: kind
        mapping:
          STRING: "#/components/schemas/StringParameterDraft"
          BOOLEAN: "#/components/schemas/BooleanParameterDraft"
          INTEGER: "#/components/schemas/IntegerParameterDraft"
          FLOAT: "#/components/schemas/FloatParameterDraft"
          DATETIME: "#/components/schemas/DateTimeParameterDraft"

    ParameterDraftMetadata:
      type: object
      additionalProperties: false
      required:
        [kind, variable, property, label, required, multiple_values, read_only]
      properties:
        kind: { $ref: "#/components/schemas/ParameterKind" }
        variable: { type: string }
        property: { type: string }
        label: { type: string }
        required: { type: boolean }
        multiple_values: { type: boolean }
        read_only: { type: boolean }

    StringParameterDraft:
      type: object
      additionalProperties: false
      required: [kind, metadata, default, allowed_values, pattern]
      properties:
        kind: { type: string, enum: [STRING] }
        metadata: { $ref: "#/components/schemas/ParameterDraftMetadata" }
        default: { type: string, nullable: true }
        allowed_values: { type: array, items: { type: string } }
        pattern: { type: string }

    BooleanParameterDraft:
      type: object
      additionalProperties: false
      required: [kind, metadata, default]
      properties:
        kind: { type: string, enum: [BOOLEAN] }
        metadata: { $ref: "#/components/schemas/ParameterDraftMetadata" }
        default: { type: boolean, nullable: true }

    IntegerParameterDraft:
      type: object
      additionalProperties: false
      required: [kind, metadata, minimum, maximum, default, allowed_values]
      properties:
        kind: { type: string, enum: [INTEGER] }
        metadata: { $ref: "#/components/schemas/ParameterDraftMetadata" }
        minimum: { type: integer, format: int64, nullable: true }
        maximum: { type: integer, format: int64, nullable: true }
        default: { type: integer, format: int64, nullable: true }
        allowed_values: { type: array, items: { type: integer, format: int64 } }

    FloatParameterDraft:
      type: object
      additionalProperties: false
      required: [kind, metadata, minimum, maximum, default, allowed_values]
      properties:
        kind: { type: string, enum: [FLOAT] }
        metadata: { $ref: "#/components/schemas/ParameterDraftMetadata" }
        minimum: { type: number, format: double, nullable: true }
        maximum: { type: number, format: double, nullable: true }
        default: { type: number, format: double, nullable: true }
        allowed_values: { type: array, items: { type: number, format: double } }

    DateTimeParameterDraft:
      type: object
      additionalProperties: false
      required: [kind, metadata, minimum, maximum, default, pattern]
      properties:
        kind: { type: string, enum: [DATETIME] }
        metadata: { $ref: "#/components/schemas/ParameterDraftMetadata" }
        minimum: { type: string, format: date-time, nullable: true }
        maximum: { type: string, format: date-time, nullable: true }
        default: { type: string, format: date-time, nullable: true }
        pattern: { type: string }

    ParameterMetadata:
      type: object
      additionalProperties: false
      required:
        [id, variable, property, label, required, multiple_values, read_only]
      properties:
        id: { type: string, format: uuid }
        variable: { type: string }
        property: { type: string }
        label: { type: string }
        required: { type: boolean }
        multiple_values: { type: boolean }
        read_only: { type: boolean }

    StringParameter:
      type: object
      additionalProperties: false
      required: [kind, metadata, default, allowed_values, pattern]
      properties:
        kind: { type: string, enum: [STRING] }
        metadata: { $ref: "#/components/schemas/ParameterMetadata" }
        default: { type: string, nullable: true }
        allowed_values: { type: array, items: { type: string } }
        pattern: { type: string }

    BooleanParameter:
      type: object
      additionalProperties: false
      required: [kind, metadata, default]
      properties:
        kind: { type: string, enum: [BOOLEAN] }
        metadata: { $ref: "#/components/schemas/ParameterMetadata" }
        default: { type: boolean, nullable: true }

    IntegerParameter:
      type: object
      additionalProperties: false
      required: [kind, metadata, minimum, maximum, default, allowed_values]
      properties:
        kind: { type: string, enum: [INTEGER] }
        metadata: { $ref: "#/components/schemas/ParameterMetadata" }
        minimum: { type: integer, format: int64, nullable: true }
        maximum: { type: integer, format: int64, nullable: true }
        default: { type: integer, format: int64, nullable: true }
        allowed_values: { type: array, items: { type: integer, format: int64 } }

    FloatParameter:
      type: object
      additionalProperties: false
      required: [kind, metadata, minimum, maximum, default, allowed_values]
      properties:
        kind: { type: string, enum: [FLOAT] }
        metadata: { $ref: "#/components/schemas/ParameterMetadata" }
        minimum: { type: number, format: double, nullable: true }
        maximum: { type: number, format: double, nullable: true }
        default: { type: number, format: double, nullable: true }
        allowed_values: { type: array, items: { type: number, format: double } }

    DateTimeParameter:
      type: object
      additionalProperties: false
      required: [kind, metadata, minimum, maximum, default, pattern]
      properties:
        kind: { type: string, enum: [DATETIME] }
        metadata: { $ref: "#/components/schemas/ParameterMetadata" }
        minimum: { type: string, format: date-time, nullable: true }
        maximum: { type: string, format: date-time, nullable: true }
        default: { type: string, format: date-time, nullable: true }
        pattern: { type: string }

    ParameterKind:
      type: string
      enum: [STRING, BOOLEAN, INTEGER, FLOAT, DATETIME]

    DownloadableFile:
      type: object
      additionalProperties: false
      required: [url, format]
      properties:
        url: { $ref: "#/components/schemas/NonBlankString" }
        format: { $ref: "#/components/schemas/NonBlankString" }

    Documentation:
      type: object
      additionalProperties: false
      required: [uri]
      properties:
        title: { type: string, nullable: true }
        description: { type: string, nullable: true }
        uri: { $ref: "#/components/schemas/NonBlankString" }

    TemporalCoverage:
      type: object
      additionalProperties: false
      properties:
        start: { type: string, format: date-time, nullable: true }
        end: { type: string, format: date-time, nullable: true }

    CreateResourceDraftRequest:
      oneOf:
        - $ref: "#/components/schemas/CreateDatasetResourceRequest"
        - $ref: "#/components/schemas/CreateSoftwareApplicationResourceRequest"
        - $ref: "#/components/schemas/CreateSoftwareSourceCodeResourceRequest"
      discriminator:
        propertyName: resource_type
        mapping:
          dataset: "#/components/schemas/CreateDatasetResourceRequest"
          software-application: "#/components/schemas/CreateSoftwareApplicationResourceRequest"
          software-source-code: "#/components/schemas/CreateSoftwareSourceCodeResourceRequest"

    CreateDatasetResourceRequest:
      type: object
      additionalProperties: false
      required: [resource_type, metadata]
      properties:
        resource_type: { type: string, enum: [dataset] }
        metadata: { $ref: "#/components/schemas/DatasetDraftMetadata" }

    CreateSoftwareApplicationResourceRequest:
      type: object
      additionalProperties: false
      required: [resource_type, metadata]
      properties:
        resource_type: { type: string, enum: [software-application] }
        metadata:
          { $ref: "#/components/schemas/SoftwareApplicationDraftMetadata" }

    CreateSoftwareSourceCodeResourceRequest:
      type: object
      additionalProperties: false
      required: [resource_type, metadata]
      properties:
        resource_type: { type: string, enum: [software-source-code] }
        metadata:
          { $ref: "#/components/schemas/SoftwareSourceCodeDraftMetadata" }

    ReplaceDatasetDraftRequest:
      type: object
      additionalProperties: false
      required: [resource_type, revision, metadata]
      properties:
        resource_type: { type: string, enum: [dataset] }
        revision: { type: integer, format: int32, minimum: 1 }
        metadata: { $ref: "#/components/schemas/DatasetDraftMetadata" }

    ReplaceSoftwareApplicationDraftRequest:
      type: object
      additionalProperties: false
      required: [resource_type, revision, metadata]
      properties:
        resource_type: { type: string, enum: [software-application] }
        revision: { type: integer, format: int32, minimum: 1 }
        metadata:
          { $ref: "#/components/schemas/SoftwareApplicationDraftMetadata" }

    ReplaceSoftwareSourceCodeDraftRequest:
      type: object
      additionalProperties: false
      required: [resource_type, revision, metadata]
      properties:
        resource_type: { type: string, enum: [software-source-code] }
        revision: { type: integer, format: int32, minimum: 1 }
        metadata:
          { $ref: "#/components/schemas/SoftwareSourceCodeDraftMetadata" }

    ReplaceResourceDraftRequest:
      oneOf:
        - $ref: "#/components/schemas/ReplaceDatasetDraftRequest"
        - $ref: "#/components/schemas/ReplaceSoftwareApplicationDraftRequest"
        - $ref: "#/components/schemas/ReplaceSoftwareSourceCodeDraftRequest"
      discriminator:
        propertyName: resource_type
        mapping:
          dataset: "#/components/schemas/ReplaceDatasetDraftRequest"
          software-application: "#/components/schemas/ReplaceSoftwareApplicationDraftRequest"
          software-source-code: "#/components/schemas/ReplaceSoftwareSourceCodeDraftRequest"

    RejectResourceRequest:
      type: object
      required: [note]
      additionalProperties: false
      properties:
        note: { $ref: "#/components/schemas/NonBlankString" }

    ResourceVersion:
      type: object
      additionalProperties: false
      required:
        [
          resource_id,
          version_id,
          revision,
          status,
          created_by,
          group_id,
          group_name,
          created_at,
          updated_at,
          metadata,
        ]
      properties:
        resource_id: { type: string, format: uuid }
        version_id: { type: string, format: uuid }
        revision: { type: integer, format: int32 }
        status: { type: string }
        # TODO: make this not required, only have the creator if the user is authenticated and a member of a group, otherwise omit this field complitely, we don't want to leak other user's ids
        created_by: { type: string }
        group_id: { type: string, format: uuid }
        group_name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        metadata:
          anyOf:
            - $ref: "#/components/schemas/DatasetResourceMetadata"
            - $ref: "#/components/schemas/SoftwareApplicationResourceMetadata"
            - $ref: "#/components/schemas/SoftwareSourceCodeResourceMetadata"

    DatasetResourceMetadata:
      type: object
      required:
        [
          id,
          title,
          description,
          keywords,
          distributions,
          persistent_identifiers,
          contact_points,
          providers,
          categories,
        ]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        keywords: { type: string }
        accrual_periodicity: { type: string, nullable: true }
        quality_annotation: { type: string, nullable: true }
        access_right: { type: string, nullable: true }
        distributions:
          type: array
          items: { $ref: "#/components/schemas/Distribution" }
        spatial_coverage:
          type: string
          nullable: true
          minLength: 1
          description: WKT POINT or POLYGON geometry in EPSG:4326.
          example: POINT (12.5 41.9)
        temporal_coverage: { $ref: "#/components/schemas/TemporalCoverage" }
        persistent_identifiers:
          type: array
          items: { $ref: "#/components/schemas/ResourceIdentifier" }
        contact_points:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        providers:
          type: array
          items: { $ref: "#/components/schemas/ResourceVersionReference" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/ResourceVersionReference" }
        created: { type: string, format: date-time, nullable: true }
        updated: { type: string, format: date-time, nullable: true }

    SoftwareApplicationResourceMetadata:
      type: object
      required:
        [
          id,
          name,
          description,
          keywords,
          creators,
          identifiers,
          contact_points,
          categories,
        ]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        main_entity_of_page: { type: string, nullable: true }
        license: { type: string, nullable: true }
        version: { type: string, nullable: true }
        keywords: { type: string }
        download_url: { type: string, nullable: true }
        requirements: { type: string, nullable: true }
        operating_system: { type: string, nullable: true }
        creators:
          type: array
          items: { $ref: "#/components/schemas/ResourceVersionReference" }
        identifiers:
          type: array
          items: { $ref: "#/components/schemas/ResourceIdentifier" }
        contact_points:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        categories:
          type: array
          items: { $ref: "#/components/schemas/ResourceVersionReference" }

    SoftwareSourceCodeResourceMetadata:
      type: object
      required:
        [
          id,
          name,
          description,
          keywords,
          creators,
          identifiers,
          contact_points,
          categories,
        ]
      additionalProperties: false
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        programming_language: { type: string, nullable: true }
        keywords: { type: string }
        repository: { type: string, nullable: true }
        license: { type: string, nullable: true }
        software_requirements: { type: string, nullable: true }
        runtime_platform: { type: string, nullable: true }
        main_entity_of_page: { type: string, nullable: true }
        version: { type: string, nullable: true }
        creators:
          type: array
          items: { $ref: "#/components/schemas/ResourceVersionReference" }
        identifiers:
          type: array
          items: { $ref: "#/components/schemas/ResourceIdentifier" }
        contact_points:
          type: array
          nullable: true
          items: { type: string, format: uuid }
        categories:
          type: array
          items: { $ref: "#/components/schemas/ResourceVersionReference" }

    Distribution:
      oneOf:
        - $ref: "#/components/schemas/WebServiceDistribution"
        - $ref: "#/components/schemas/DownloadableFileDistribution"
      discriminator:
        propertyName: type
        mapping:
          "http://publications.europa.eu/resource/authority/distribution-type/WEB_SERVICE": "#/components/schemas/WebServiceDistribution"
          "http://publications.europa.eu/resource/authority/distribution-type/DOWNLOADABLE_FILE": "#/components/schemas/DownloadableFileDistribution"

    WebServiceDistribution:
      type: object
      additionalProperties: false
      required: [id, title, description, type, web_service]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        license: { type: string, nullable: true }
        type:
          type: string
          enum:
            - "http://publications.europa.eu/resource/authority/distribution-type/WEB_SERVICE"
        issued: { type: string, format: date-time, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        byte_size: { type: integer, format: int64, nullable: true }
        web_service: { $ref: "#/components/schemas/WebService" }

    DownloadableFileDistribution:
      type: object
      additionalProperties: false
      required: [id, title, description, type, downloadable_file]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        license: { type: string, nullable: true }
        type:
          type: string
          enum:
            - "http://publications.europa.eu/resource/authority/distribution-type/DOWNLOADABLE_FILE"
        issued: { type: string, format: date-time, nullable: true }
        modified: { type: string, format: date-time, nullable: true }
        byte_size: { type: integer, format: int64, nullable: true }
        downloadable_file: { $ref: "#/components/schemas/DownloadableFile" }

    WebService:
      type: object
      required: [id, name, description, template_url, format]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        template_url: { type: string }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/Parameter" }
        format: { type: string }
        provider: { $ref: "#/components/schemas/ResourceVersionReference" }
        documentation: { $ref: "#/components/schemas/Documentation" }
        spatial_coverage:
          type: string
          nullable: true
          minLength: 1
          description: WKT POINT or POLYGON geometry in EPSG:4326.
          example: POINT (12.5 41.9)
        temporal_coverage: { $ref: "#/components/schemas/TemporalCoverage" }
        contact_points:
          type: array
          items: { type: string, format: uuid }

    ResourceIdentifier:
      type: object
      required: [id, type, value]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        value: { type: string }

    ResourceVersionReference:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    # -------------------------------------------------------------------------
    # Resource write schemas
    # -------------------------------------------------------------------------
    ImportResult:
      type: object
      required:
        [
          groups,
          categories,
          organizations,
          contact_points,
          datasets,
          software_applications,
          software_source_codes,
          warnings,
        ]
      properties:
        groups: { type: integer }
        categories: { type: integer }
        organizations: { type: integer }
        contact_points: { type: integer }
        datasets: { type: integer }
        software_applications: { type: integer }
        software_source_codes: { type: integer }
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/ImportDiagnostic"
    ImportDiagnostic:
      type: object
      required: [severity, subject, predicate, message]
      properties:
        severity: { type: string }
        subject: { type: string }
        predicate: { type: string }
        message: { type: string }

    WriteResourceType:
      type: string
      description: Resource type identifier returned by lifecycle write endpoints.
      enum:
        - dataset
        - software-application
        - software-source-code

    WriteResult:
      type: object
      required:
        - resourceType
        - id
        - status
      properties:
        resourceType:
          $ref: "#/components/schemas/WriteResourceType"
        id:
          type: string
        status:
          $ref: "#/components/schemas/VersioningStatus"

    # -------------------------------------------------------------------------
    # Discovery
    # -------------------------------------------------------------------------

    Reference:
      type: object
      description: Reference to another API resource.
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string

    DiscoveryItem:
      type: object
      required:
        - type
        - resource_id
        - version_id
        - name
        - status
        - updated_at
        - concept
        - group
      properties:
        type:
          $ref: "#/components/schemas/DiscoveryResourceType"
        resource_id:
          type: string
          format: uuid
        version_id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [PUBLISHED, DRAFT, SUBMITTED, ARCHIVED, REJECTED]
        updated_at:
          type: string
          format: date-time
        concept:
          type: string
          enum: [DATA, FACILITIES, SOFTWARE]
        created_by:
          $ref: "#/components/schemas/Reference"
        group:
          $ref: "#/components/schemas/Reference"
        providers:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
        creators:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/Reference"
        distributions:
          type: array
          items:
            $ref: "#/components/schemas/Reference"

    UserStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - BLOCKED

    BlockUserRequest:
      type: object
      required:
        - reason
      additionalProperties: false
      properties:
        reason:
          $ref: "#/components/schemas/NonBlankString"

    MembershipRole:
      type: string
      description: Role assigned to a user inside a group.
      enum:
        - EDITOR
        - REVIEWER
        - GROUP_ADMIN

    MembershipStatus:
      type: string
      description: Lifecycle state for a group membership.
      enum:
        - PENDING
        - ACTIVE
        - REJECTED

    User:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          description: User record returned by gateway user endpoints.
          required:
            - memberships
          properties:
            memberships:
              type: array
              description: Membership previews for this user.
              items:
                $ref: "#/components/schemas/UserMembershipSummary"

    UserSummary:
      type: object
      description: User record returned by user endpoints.
      required:
        - id
        - email
        - given_name
        - family_name
        - status
        - global_roles
        - global_permissions
      properties:
        id:
          type: string
        email:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
        global_roles:
          type: array
          items:
            type: string
        global_permissions:
          type: array
          items:
            type: string
    Category:
      type: object
      required: [id, group_id, parent_category_id, name]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        parent_category_id: { type: string, format: uuid, nullable: true }
        name: { type: string }
    CreateCategoryRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        parent_category_id: { type: string, format: uuid, nullable: true }
    ReplaceCategoryRequest:
      type: object
      required: [name, parent_category_id]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        parent_category_id: { type: string, format: uuid, nullable: true }
    CreateGroupRequest:
      type: object
      required: [name, concept]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        description: { type: string, nullable: true }
        label: { type: string, nullable: true }
        logo: { type: string, nullable: true }
        page: { type: string, nullable: true }
        color: { type: string, nullable: true }
        position: { type: integer, format: int32 }
        concept: { type: string, enum: [DATA, FACILITIES, SOFTWARE] }
    ReplaceGroupRequest:
      type: object
      required: [name, concept]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        description: { type: string, nullable: true }
        label: { type: string, nullable: true }
        logo: { type: string, nullable: true }
        page: { type: string, nullable: true }
        color: { type: string, nullable: true }
        position: { type: integer, format: int32 }
        concept: { type: string, enum: [DATA, FACILITIES, SOFTWARE] }
    ContactPoint:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string }
    CreateContactPointRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: { $ref: "#/components/schemas/NonBlankString" }
        role: { $ref: "#/components/schemas/NonBlankString" }
    ReplaceContactPointRequest:
      type: object
      required: [email, role]
      additionalProperties: false
      properties:
        email: { $ref: "#/components/schemas/NonBlankString" }
        role: { $ref: "#/components/schemas/NonBlankString" }
    OrganizationAddress:
      type: object
      required: [street, locality, postal_code, country]
      additionalProperties: false
      properties:
        street: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        country: { type: string, nullable: true }
    OrganizationIdentifier:
      type: object
      required: [id, type, value]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        value: { type: string }
    OrganizationIdentifierRequest:
      type: object
      required: [type, value]
      additionalProperties: false
      properties:
        type: { $ref: "#/components/schemas/NonBlankString" }
        value: { $ref: "#/components/schemas/NonBlankString" }
    CanonicalOrganization:
      type: object
      required: [id, name, address, identifiers, parents, contact_point_ids]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        address: { $ref: "#/components/schemas/OrganizationAddress" }
        logo_url: { type: string, nullable: true }
        page_url: { type: string, nullable: true }
        email: { type: string, nullable: true }
        lei_code: { type: string, nullable: true }
        identifiers:
          type: array
          items: { $ref: "#/components/schemas/OrganizationIdentifier" }
        parents:
          type: array
          items: { type: string, format: uuid }
        contact_point_ids:
          type: array
          items: { type: string, format: uuid }
    CreateOrganizationRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        address: { $ref: "#/components/schemas/OrganizationAddress" }
        logo_url: { type: string, nullable: true }
        page_url: { type: string, nullable: true }
        email: { type: string, nullable: true }
        lei_code: { type: string, nullable: true }
        identifiers:
          type: array
          items: { $ref: "#/components/schemas/OrganizationIdentifierRequest" }
        parents:
          type: array
          items: { type: string, format: uuid }
        contact_point_ids:
          type: array
          items: { type: string, format: uuid }
    ReplaceOrganizationRequest:
      type: object
      required:
        [
          name,
          address,
          logo_url,
          page_url,
          email,
          lei_code,
          identifiers,
          parents,
          contact_point_ids,
        ]
      additionalProperties: false
      properties:
        name: { $ref: "#/components/schemas/NonBlankString" }
        address: { $ref: "#/components/schemas/OrganizationAddress" }
        logo_url: { type: string, nullable: true }
        page_url: { type: string, nullable: true }
        email: { type: string, nullable: true }
        lei_code: { type: string, nullable: true }
        identifiers:
          type: array
          items: { $ref: "#/components/schemas/OrganizationIdentifierRequest" }
        parents:
          type: array
          items: { type: string, format: uuid }
        contact_point_ids:
          type: array
          items: { type: string, format: uuid }
    Group:
      type: object
      description: Public group metadata returned by Metadata Lifecycle.
      required:
        - id
        - name
        - position
        - concept
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        page:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        position:
          type: integer
          format: int32
        concept:
          type: string
          enum: [DATA, FACILITIES, SOFTWARE]

    UserMembershipSummary:
      type: object
      description: Embedded membership preview for one user-group relation.
      required:
        - group
        - roles
        - status
        - permissions
        - role_requests
        - created_at
        - updated_at
      properties:
        group:
          $ref: "#/components/schemas/Reference"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/MembershipRole"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        permissions:
          type: array
          items:
            type: string
        role_requests:
          type: array
          description: Pending role requests for this membership.
          items:
            $ref: "#/components/schemas/RoleRequest"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GroupMembership:
      type: object
      description: Complete membership record returned after a membership decision.
      required:
        - user
        - status
        - roles
        - permissions
        - role_requests
        - created_at
        - updated_at
      properties:
        user:
          $ref: "#/components/schemas/MembershipUser"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/MembershipRole"
        permissions:
          type: array
          items:
            type: string
        role_requests:
          type: array
          description: Pending role requests only.
          items:
            $ref: "#/components/schemas/RoleRequest"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MembershipUser:
      type: object
      required:
        - id
        - given_name
        - family_name
        - email
      properties:
        id:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        email:
          type: string
          format: email

    RoleRequest:
      type: object
      required:
        - id
        - role
        - status
        - requested_at
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [EDITOR, REVIEWER]
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED]
        requested_at:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required:
        - role
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [EDITOR, REVIEWER]

    CreateMembershipRequest:
      type: object
      required:
        - roles
      additionalProperties: false
      properties:
        roles:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [EDITOR, REVIEWER]

    MembershipDecisionRequest:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ACTIVE, REJECTED]

    RoleRequestDecisionRequest:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ACCEPTED, REJECTED]

    Problem:
      type: object
      required:
        - title
        - status
      properties:
        title:
          type: string
          description: Short, human-readable summary of problem
          example: "Resource not found"
        status:
          type: integer
          description: HTTP status code for this problem occurrence
          example: 404
        detail:
          type: string
          description: Optional human-readable explanation specific to this occurrence
          example: "The requested resource was not found"
        instance:
          type: string
          format: uri-reference
          description: Optional URI reference identifying this specific problem occurrence
          example: "requests/req-123"
