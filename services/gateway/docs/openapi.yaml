    # -------------------------------------------------------------------------
    # Search
    # -------------------------------------------------------------------------

    SearchResponse:
      type: object
      required:
        - page_number
        - page_size
        - total
        - total_pages
        - items
      properties:
        page_number:
          type: integer
          minimum: 1
          description: 1-based page index returned in this response
          example: 1
        page_size:
          type: integer
          minimum: 0
          maximum: 100
          description: Number of items returned in this response page
          example: 10
        total:
          type: integer
          minimum: 0
          description: Total number of matching resources across all pages
          example: 123
        total_pages:
          type: integer
          minimum: 0
          description: Total number of available result pages for the supplied page size
          example: 13
        items:
          type: array
          items:
            $ref: "#/components/schemas/SearchItem"

    SearchItem:
      oneOf:
        - $ref: "#/components/schemas/DatasetSearchItem"
        - $ref: "#/components/schemas/WebserviceSearchItem"
        - $ref: "#/components/schemas/OrganizationSearchItem"
        - $ref: "#/components/schemas/SoftwareApplicationSearchItem"
        - $ref: "#/components/schemas/SoftwareSourceCodeSearchItem"
      discriminator:
        propertyName: type
        mapping:
          dataset: "#/components/schemas/DatasetSearchItem"
          webservice: "#/components/schemas/WebserviceSearchItem"
          organization: "#/components/schemas/OrganizationSearchItem"
          softwareapplication: "#/components/schemas/SoftwareApplicationSearchItem"
          softwaresourcecode: "#/components/schemas/SoftwareSourceCodeSearchItem"

    BaseSearchItem:
      type: object
      required:
        - type
        - id
        - name
        - href
      properties:
        type:
          $ref: "#/components/schemas/SearchResourceType"
        id:
          type: string
          description: Identifier of resource within this API.
          example: "https://doi.org/10.5281/zenodo.17598403"
        name:
          description: Human-readable display name used in search results.
          type: string
          example: "Discovery, automation/scripting and integration of EPOS data and services. Basic workflows in JupyterLab."
        href:
          type: string
          format: uri-reference
          description: Relative URI reference to resource detail endpoint.
          example: "v1/resources/softwaresourcecode/https://doi.org/10.5281/zenodo.17598403"

    DatasetSearchItem:
      allOf:
        - $ref: "#/components/schemas/BaseSearchItem"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - dataset
            providers:
              type: array
              description: Organization references associated with this dataset
              items:
                $ref: "#/components/schemas/DatasetProviderRef"
              example:
                - id: "ROR:048a87296/v1.0"
                  name: "Uppsala University"
                  href: "v1/resources/organization/ROR:048a87296/v1.0"
            concepts:
              type: array
              description: Concept references assigned to this dataset
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "category:software_jup_conc_multi/v1.0"
                  href: "v1/resources/concept/category:software_jup_conc_multi/v1.0"
            distributions:
              type: array
              description: Distribution references for this dataset
              items:
                $ref: "#/components/schemas/DatasetDistributionSearchItem"
              example:
                - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                  href: "v1/resources/distribution/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/bibliography/distribution/restful/v1.0"
                  href: "v1/resources/distribution/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/bibliography/distribution/restful/v1.0"

    OrganizationSearchItem:
      allOf:
        - $ref: "#/components/schemas/BaseSearchItem"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - organization

    SoftwareApplicationSearchItem:
      allOf:
        - $ref: "#/components/schemas/BaseSearchItem"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - softwareapplication
            provider:
              type: array
              description: Organization references for providers of this software application
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "ROR:048a87296/v1.0"
                  name: "Uppsala University"
                  href: "v1/resources/organization/ROR:048a87296/v1.0"

    SoftwareSourceCodeSearchItem:
      allOf:
        - $ref: "#/components/schemas/BaseSearchItem"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - softwaresourcecode
            provider:
              type: array
              description: Organization references for providers of this software source code
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "ROR:048a87296/v1.0"
                  name: "Uppsala University"
                  href: "v1/resources/organization/ROR:048a87296/v1.0"

    WebserviceSearchItem:
      allOf:
        - $ref: "#/components/schemas/BaseSearchItem"
        - type: object
          required:
            - type
          properties:
            type:
              type: string
              enum:
                - webservice
            provider:
              description: Organization reference for provider of this webservice
              allOf:
                - $ref: "#/components/schemas/ResourceRef"
              example:
                id: "PIC:999472675/v1.0"
                name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                href: "v1/resources/organization/PIC:999472675/v1.0"
            concepts:
              type: array
              description: Concept references assigned to this webservice
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "category:seismologicalproductsservices/v1.0"
                  href: "v1/resources/concept/category:seismologicalproductsservices/v1.0"
                - id: "category:earthquakeparameters/v1.0"
                  href: "v1/resources/concept/category:earthquakeparameters/v1.0"

    DatasetDistributionSearchItem:
      type: object
      required:
        - id
        - href
      properties:
        id:
          type: string
          example: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
        name:
          type: string
          description: Optional human-readable distribution title.
          example: "TEST1 - Parameters of historical earthquakes (1000-1899) - FDSN event"
        href:
          type: string
          format: uri-reference
          description: API-base-relative URI reference to distribution detail endpoint
          example: "v1/resources/distribution/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"

    # -------------------------------------------------------------------------
    # Resource references
    # -------------------------------------------------------------------------

    ResourceRef:
      type: object
      required:
        - id
        - href
      properties:
        id:
          type: string
          example: "ROR:048a87296/v1.0"
        name:
          type: string
          description: Optional human-readable label for referenced resource.
          example: "Uppsala University"
        href:
          type: string
          format: uri-reference
          description: Relative URI reference to referenced resource detail endpoint
          example: "v1/resources/organization/ROR:048a87296/v1.0"

    DatasetProviderRef:
      allOf:
        - $ref: "#/components/schemas/ResourceRef"
        - type: object
          required:
            - name

    # -------------------------------------------------------------------------
    # Detail schemas
    # -------------------------------------------------------------------------

    BaseDetailResource:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Identifier of resource within this API.
        name:
          description: Human-readable display name of the resource
          type: string
        description:
          description: Optional human-readable summary of resource.
          type: string

    Dataset:
      allOf:
        - $ref: "#/components/schemas/BaseDetailResource"
        - type: object
          required:
            - description
          properties:
            created:
              type: string
              format: date-time
              description: Resource creation timestamp in ISO 8601 UTC
              example: "2024-01-15T10:30:00Z"
            modified:
              type: string
              format: date-time
              description: Resource last modification timestamp in ISO 8601 UTC
              example: "2024-03-01T08:45:00Z"
            source_created:
              type: string
              format: date-time
              description: Creation timestamp from imported metadata
            source_updated:
              type: string
              format: date-time
              description: Modification timestamp from imported metadata
            version_info:
              type: string
              description: Human-readable version information for this dataset
              example: "Revision 3 reviewed by EPOS"
            keywords:
              type: array
              items:
                type: string
              example:
                - "event"
                - "earthquake"
                - "magnitude"
            concepts:
              type: array
              description: Concept references assigned to this dataset
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "category:seismologicalproductsservices/v1.0"
                  name: "Seismological products services"
                  href: "v1/resources/concept/category:seismologicalproductsservices/v1.0"
                - id: "category:earthquakeparameters/v1.0"
                  name: "Earthquake parameters"
                  href: "v1/resources/concept/category:earthquakeparameters/v1.0"
            publisher:
              type: array
              description: Organizations publishing this dataset; exposed as `providers` in search results
              items:
                allOf:
                  - $ref: "#/components/schemas/ResourceRef"
                  - type: object
                    required:
                      - name
              example:
                - id: "PIC:999472675/v1.0"
                  name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                  href: "v1/resources/organization/PIC:999472675/v1.0"
            issued:
              type: string
              format: date-time
              description: Dataset publication or issuance timestamp in ISO 8601 UTC
              example: "2024-02-01T00:00:00Z"
            spatial:
              type: string
              description: Spatial coverage expressed as a WKT polygon (EPSG:4326)
              example: "POLYGON((-25 34, 45 34, 45 72, -25 72, -25 34))"
            identifiers:
              type: array
              description: External or domain-specific identifiers for this dataset
              items:
                $ref: "#/components/schemas/Identifier"
            temporal:
              $ref: "#/components/schemas/TemporalExtent"
            status:
              $ref: "#/components/schemas/VersioningStatus"
            distributions:
              type: array
              description: Distributions that provide access to this dataset
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                  name: "TEST1 - Parameters of historical earthquakes (1000-1899) - FDSN event"
                  href: "v1/resources/distribution/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/bibliography/distribution/restful/v1.0"
                  name: "TEST2 - Bibliography for historical earthquakes"
                  href: "v1/resources/distribution/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/bibliography/distribution/restful/v1.0"
            access_rights:
              type: string
              description: Access rights statement for this dataset
              example: "open"
            accrual_periodicity:
              type: string
              description: Frequency with which this dataset is updated
              example: "monthly"
            is_version_of:
              description: Reference to parent dataset resource this dataset version derives from
              allOf:
                - $ref: "#/components/schemas/ResourceRef"
              example:
                id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/bibliography/v1.0"
                name: "TEST2 - Bibliography metadata for historical earthquakes"
                href: "v1/resources/dataset/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/bibliography/v1.0"
            quality_annotation:
              type: string
              description: Aggregated quality annotation summary associated with this dataset
              example: "Validated by EPOS thematic core service; station metadata completeness >95%."
            version:
              type: string
              description: Machine-readable version string for this dataset
              example: "3.1.0"

    Distribution:
      oneOf:
        - $ref: "#/components/schemas/WebServiceDistribution"
        - $ref: "#/components/schemas/DownloadableFileDistribution"
      discriminator:
        propertyName: type
