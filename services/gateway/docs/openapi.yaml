openapi: 3.0.3
info:
  title: EPOS API
  version: 1.0.0
  description: |
    Public API for searching and retrieving EPOS catalogue resources.

    API structure:
    - Use discovery endpoints to search catalogue content and browse the concept tree.
    - Use resource endpoints to retrieve full details for a specific dataset, distribution, webservice, organization, concept, or concept scheme.
    - Search responses may include different resource types in the same result page.

    How to use this API:
    - Start with `/search` when you want to find resources by text, type, provider, time range, spatial area, or keywords.
    - Start with `/concept` when you want to build browse or filtering interfaces based on the concept tree.
    - Follow returned `href` values to retrieve related resources. Or use the IDs in the relative endpoints.
  termsOfService: https://www.epos-eu.org/sites/default/files/2026-02/Terms_and_ConditionsJan26_1.pdf
  license:
    name: AGPL
    url: https://www.gnu.org/licenses/agpl-3.0.en.html

servers:
  - url: /v1
    description: Relative versioned API base path

tags:
  - name: Discovery
    description: Search and taxonomy bootstrap endpoints
  - name: Users
    description: User profile endpoints
  - name: Resources
    description: Resource detail endpoints
  - name: Draft Resource Operations
    description: Create, replace, and delete draft aggregates
  - name: Resource Lifecycle
    description: Submit, publish, draft, and discard aggregates

paths:
  /search:
    get:
      tags:
        - Discovery
      summary: Search metadata resources
      description: |
        Returns a flat, typed list of catalogue resources matching the supplied criteria.
        Results may include datasets, webservices, organizations, software applications,
        and software source codes. Each item includes an `href` that can be followed
        to retrieve the corresponding resource detail.
      operationId: searchMetadata
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/PageNumber"
        - $ref: "#/components/parameters/TypeFilter"
        - $ref: "#/components/parameters/SpatialFilter"
        - $ref: "#/components/parameters/DateFrom"
        - $ref: "#/components/parameters/DateTo"
        - $ref: "#/components/parameters/Provider"
        - $ref: "#/components/parameters/VersioningStatus"
        - $ref: "#/components/parameters/Keywords"
      responses:
        "200":
          description: Search results returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
              examples:
                mixedResults:
                  summary: Mixed resource search results
                  value:
                    page_number: 1
                    page_size: 10
                    total: 42
                    total_pages: 5
                    items:
                      - type: dataset
                        id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/v1.0"
                        name: "TEST1 - Historical earthquakes 1000-1899"
                        href: "v1/resources/dataset/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/v1.0"
                        providers:
                          - id: "PIC:999472675/v1.0"
                            name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                            href: "v1/resources/organization/PIC:999472675/v1.0"
                        concepts:
                          - id: "category:earthquakeparameters/v1.0"
                            name: "Earthquake parameters"
                            href: "v1/resources/concept/category:earthquakeparameters/v1.0"
                        distributions:
                          - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                            href: "v1/resources/distribution/https://www.epos-eu.org/epos-dcat-ap/Seismology/Dataset/AHEAD/events/distribution/restful/v1.0"
                      - type: organization
                        id: "PIC:999472675/v1.0"
                        name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                        href: "v1/resources/organization/PIC:999472675/v1.0"
                      - type: webservice
                        id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/WebService/AHEAD/restful/fdsnws-event/v1.0"
                        name: "TEST1- Historical earthquakes 1000-1899 (FDSN-event)"
                        href: "v1/resources/webservice/https://www.epos-eu.org/epos-dcat-ap/Seismology/WebService/AHEAD/restful/fdsnws-event/v1.0"
                        provider:
                          id: "PIC:999472675/v1.0"
                          name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                          href: "v1/resources/organization/PIC:999472675/v1.0"
                        concepts:
                          - id: "category:earthquakeparameters/v1.0"
                            name: "Earthquake parameters"
                            href: "v1/resources/concept/category:earthquakeparameters/v1.0"
                      - type: softwaresourcecode
                        id: "https://doi.org/10.5281/zenodo.17598403"
                        name: "Discovery, automation/scripting and integration of EPOS data and services. Basic workflows in JupyterLab."
                        href: "v1/resources/softwaresourcecode/https://doi.org/10.5281/zenodo.17598403"
                        provider:
                          - id: "ROR:048a87296/v1.0"
                            name: "Uppsala University"
                            href: "v1/resources/organization/ROR:048a87296/v1.0"
        "400":
          $ref: "#/components/responses/BadRequest"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /concept:
    get:
      tags:
        - Discovery
      summary: Get full concept tree
      description: |
        Returns the complete concept tree as an ordered list of concept schemes.
        Each scheme carries its full subtree of nested concepts.
        Use this endpoint to populate browse or filtering interfaces.
      operationId: getConceptTree
      responses:
        "200":
          description: Concept tree returned successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConceptTreeResponse"
              examples:
                tree:
                  summary: Concept tree with one scheme
                  value:
                    schemes:
                      - id: "category:software_jup/v1.0"
                        label: "Jupyter Notebooks"
                        name: "Jupyter Notebooks"
                        description: "Jupyter Notebook Domain"
                        logo: "https://raw.githubusercontent.com/epos-eu/platform-gui-icons/3c13924d1f3483a9e1f1941ba094f0937602d0a9/jupyter-svgrepo-com.svg"
                        homepage: ""
                        color: "#F37726"
                        order_number: 1
                        top_concepts:
                          - id: "category:facets/software-theme/v1.0"
                            href: "v1/resources/concept/category:facets/software-theme/v1.0"
                        children:
                          - id: "category:facets/software-theme/v1.0"
                            name: "Software"
                            description: "Software"
                            children: []
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users:
    get:
      tags:
        - Users
      summary: List users
      description: Retrieve all user profiles from usergroup service.
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Users returned successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      tags:
        - Users
      summary: Get user by id
      description: Retrieve user profile details from usergroup service.
      operationId: getUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      tags:
        - Users
      summary: Patch user
      description: Update mutable user profile fields.
      operationId: patchUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchUserRequest"
            examples:
              update:
                summary: Update fields
                value:
                  given_name: "John"
                  family_name: "Doe"
                  is_super_admin: false
      responses:
        "200":
          description: User updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /resources/{resourceType}:
    parameters:
      - $ref: "#/components/parameters/WriteResourceType"
    post:
      tags:
        - Draft Resource Operations
      summary: Create resource draft
      description: Create a new `draft` resource for the selected type.
      operationId: createResource
      parameters:
        - $ref: "#/components/parameters/XAgent"
        - $ref: "#/components/parameters/XGroup"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceWrite"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /resources/{resourceType}/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      tags:
        - Resources
      summary: Get resource by id
      description: |
        Returns resource detail metadata for the selected resource type.
      operationId: getResourceById
      parameters:
        - $ref: "#/components/parameters/ReadResourceType"
      responses:
        "200":
          description: Resource found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/BadRequest"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "500":
          $ref: "#/components/responses/InternalServerError"
    put:
      tags:
        - Draft Resource Operations
      summary: Replace resource draft
      description: Full replace semantics. Omitted writable fields are removed from the draft resource.
      operationId: updateResource
      parameters:
        - $ref: "#/components/parameters/WriteResourceType"
        - $ref: "#/components/parameters/XAgent"
        - $ref: "#/components/parameters/XGroup"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceWrite"
      responses:
        "200":
          description: Draft replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      tags:
        - Draft Resource Operations
      summary: Delete resource draft
      description: Delete a `draft` resource.
      operationId: deleteResource
      parameters:
        - $ref: "#/components/parameters/WriteResourceType"
        - $ref: "#/components/parameters/XAgent"
        - $ref: "#/components/parameters/XGroup"
      responses:
        "200":
          description: Draft deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # RESOURCE LIFECYCLE ENDPOINTS
  /resources/{resourceType}/{id}/submit:
    parameters:
      - $ref: "#/components/parameters/WriteResourceType"
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags:
        - Resource Lifecycle
      summary: Submit resource draft
      description: Submit a `draft` resource for review.
      operationId: submitResource
      parameters:
        - $ref: "#/components/parameters/XAgent"
        - $ref: "#/components/parameters/XGroup"
      responses:
        "200":
          description: Draft submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /resources/{resourceType}/{id}/publish:
    parameters:
      - $ref: "#/components/parameters/WriteResourceType"
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags:
        - Resource Lifecycle
      summary: Publish resource draft
      description: Publish a `submitted` resource.
      operationId: publishResource
      parameters:
        - $ref: "#/components/parameters/XAgent"
        - $ref: "#/components/parameters/XGroup"
      responses:
        "200":
          description: Draft published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /resources/{resourceType}/{id}/draft:
    parameters:
      - $ref: "#/components/parameters/WriteResourceType"
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags:
        - Resource Lifecycle
      summary: Create draft from published resource
      description: Create a new draft version from a published resource.
      operationId: draftResource
      parameters:
        - $ref: "#/components/parameters/XAgent"
        - $ref: "#/components/parameters/XGroup"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /resources/{resourceType}/{id}/discard:
    parameters:
      - $ref: "#/components/parameters/WriteResourceType"
      - $ref: "#/components/parameters/ResourceId"
    post:
      tags:
        - Resource Lifecycle
      summary: Discard resource draft
      description: Discard a `draft` or `submitted` resource.
      operationId: discardResource
      parameters:
        - $ref: "#/components/parameters/XAgent"
        - $ref: "#/components/parameters/XGroup"
      responses:
        "200":
          description: Draft discarded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WriteResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    XAgent:
      name: X-Agent
      in: header
      required: true
      description: Absolute URI identifying acting agent.
      schema:
        type: string

    XGroup:
      name: X-Group
      in: header
      required: true
      description: Absolute URI identifying acting group.
      schema:
        type: string

    ResourceId:
      name: id
      in: path
      required: true
      description: Resource identifier.
      schema:
        type: string
        pattern: '^[^\x00-\x20\x7F]+$'
        example: "https%3A%2F%2Fwww.epos-eu.org%2Fepos-dcat-ap%2FSeismology%2FDataset%2FAHEAD%2Fevents%2Fv1.0"

    UserId:
      name: id
      in: path
      required: true
      description: User identifier.
      schema:
        type: string
        example: "user-123"
        pattern: '^[^\x00-\x20\x7F]+$'

    WriteResourceType:
      name: resourceType
      in: path
      required: true
      description: Resource type identifier accepted by write endpoints.
      schema:
        $ref: "#/components/schemas/WriteResourceType"

    ReadResourceType:
      name: resourceType
      in: path
      required: true
      description: Resource type identifier accepted by read endpoints.
      schema:
        $ref: "#/components/schemas/ReadResourceType"

    SoftwareSourceCodeId:
      name: id
      in: path
      required: true
      description: Software source code identifier.
      schema:
        type: string
        pattern: '^[^\x00-\x20\x7F]+$'
        example: "https%3A%2F%2Fdoi.org%2F10.5281%2Fzenodo.17598403"

    WebserviceId:
      name: id
      in: path
      required: true
      description: Webservice identifier.
      schema:
        type: string
        pattern: '^[^\x00-\x20\x7F]+$'
        example: "https%3A%2F%2Fwww.epos-eu.org%2Fepos-dcat-ap%2FSeismology%2FWebService%2FAHEAD%2Frestful%2Ffdsnws-event%2Fv1.0"

    OrganizationId:
      name: id
      in: path
      required: true
      description: Organization identifier.
      schema:
        type: string
        pattern: '^[^\x00-\x20\x7F]+$'
        example: "ROR%3A048a87296%2Fv1.0"

    ConceptId:
      name: id
      in: path
      required: true
      description: Concept identifier.
      schema:
        type: string
        pattern: '^[^\x00-\x20\x7F]+$'
        example: "category%3Asoftware_jup_conc_multi%2Fv1.0"

    ConceptSchemeId:
      name: id
      in: path
      required: true
      description: Concept scheme identifier.
      schema:
        type: string
        pattern: '^[^\x00-\x20\x7F]+$'
        example: "category%3Asoftware_jup%2Fv1.0"

    Q:
      name: q
      in: query
      required: false
      description: Free-text query used to search catalogue resources.
      schema:
        type: string
        example: "historical earthquakes"

    PageSize:
      name: pageSize
      in: query
      required: false
      description: Maximum number of search items requested per page.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 10
        example: 10

    PageNumber:
      name: pageNumber
      in: query
      required: false
      description: 1-based result page index to return.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 2147483647
        default: 1
        example: 1

    TypeFilter:
      name: type
      in: query
      required: false
      description: |
        Filter results to one or more resource types. When omitted, all supported search
        resource types are returned.
        Pass comma-separated values in a single parameter:
        `?type=dataset,webservice`.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/SearchResourceType"
      style: form
      explode: false

    SpatialFilter:
      name: spatialFilter
      in: query
      required: false
      description: |
        Spatial filter expressed as a WKT polygon string (EPSG:4326).
        Resources whose spatial coverage intersects this polygon are returned.
        Example: `POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))`
      schema:
        type: string
        example: "POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))"

    DateFrom:
      name: dateFrom
      in: query
      required: false
      description: |
        Start of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Resources with temporal coverage overlapping this range are returned.
        Must be less than or equal to `dateTo` when both are supplied.
      schema:
        type: string
        format: date-time
        example: "2020-01-01T00:00:00Z"

    DateTo:
      name: dateTo
      in: query
      required: false
      description: |
        End of the temporal filter (inclusive). ISO 8601 date-time (UTC).
        Resources with temporal coverage overlapping this range are returned.
        Must be greater than or equal to `dateFrom` when both are supplied.
      schema:
        type: string
        format: date-time
        example: "2023-12-31T23:59:59Z"

    Provider:
      name: provider
      in: query
      required: false
      description: |
        Filter by one or more provider organization IDs.
        Use this filter to restrict results to resources associated with one of the
        specified provider organizations.
        Pass comma-separated values in a single parameter:
        `?provider=PIC:999472675/v1.0,ROR:048a87296/v1.0`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false

    VersioningStatus:
      name: versioningStatus
      in: query
      required: false
      description: |
        Filter by one or more versioning states.
        When omitted, defaults to `published`.
        Pass comma-separated values in a single parameter:
        `?versioningStatus=published,draft`.
      schema:
        type: array
        items:
          $ref: "#/components/schemas/VersioningStatus"
        default:
          - published
      style: form
      explode: false

    Keywords:
      name: keywords
      in: query
      required: false
      description: |
        Filter resources that carry all supplied keyword values.
        Pass comma-separated values in a single parameter:
        `?keywords=seismology,stations`.
      schema:
        type: array
        items:
          type: string
      style: form
      explode: false

  responses:
    BadRequest:
      description: Invalid request parameters
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalidQuery:
              summary: Invalid query parameter
              value:
                title: "invalid_query_parameter"
                status: 400
                detail: "unsupported search type: concept"

    Unauthorized:
      description: Bearer token missing or invalid
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalidToken:
              summary: Invalid bearer token
              value:
                title: "invalid_token"
                status: 401
                detail: "token is invalid"
            missingToken:
              summary: Missing bearer token
              value:
                title: "missing_token"
                status: 401
                detail: "bearer token required"

    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            resourceNotFound:
              summary: Missing resource
              value:
                title: "resource_not_found"
                status: 404
                detail: "dataset not found"

    Conflict:
      description: Request conflicts with current resource state
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            resourceConflict:
              summary: Conflicting resource state
              value:
                title: "resource_conflict"
                status: 409
                detail: "resource is not in draft state"

    InternalServerError:
      description: Internal server error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            internalError:
              summary: Unexpected server failure
              value:
                title: "Internal server error"
                status: 500

    GatewayTimeout:
      description: Request could not be completed before timeout
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            upstreamTimeout:
              summary: Request timed out
              value:
                title: "upstream_timeout"
                status: 504
                detail: "metadata search timed out"

  schemas:
    # -------------------------------------------------------------------------
    # Shared enums
    # -------------------------------------------------------------------------

    SearchResourceType:
      type: string
      description: Resource type identifier used in search results.
      enum:
        - dataset
        - webservice
        - organization
        - softwareapplication
        - softwaresourcecode

    ReadResourceType:
      type: string
      description: Resource type identifier used in detail read endpoints.
      enum:
        - dataset
        - distribution
        - organization
        - softwareapplication
        - softwaresourcecode
        - webservice
        - concept
        - conceptscheme

    VersioningStatus:
      type: string
      description: Versioning state used by search, read, and write endpoints.
      enum:
        - published
        - draft
        - submitted
        - archived
        - discarded

    # -------------------------------------------------------------------------
    # Resource write schemas
    # -------------------------------------------------------------------------

    WriteResourceType:
      type: string
      description: Resource type identifier accepted by write endpoints.
      enum:
        - dataset
        - distribution
        - organization
        - softwareapplication
        - softwaresourcecode
        - webservice
        - concept
        - conceptscheme
        - contactpoint

    ResourceDetail:
      anyOf:
        - $ref: "#/components/schemas/Dataset"
        - $ref: "#/components/schemas/Distribution"
        - $ref: "#/components/schemas/Organization"
        - $ref: "#/components/schemas/SoftwareApplication"
