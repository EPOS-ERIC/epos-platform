  /groups/{groupId}/membership-requests:
    parameters:
      - $ref: "#/components/parameters/GroupId"
    post:
      tags:
        - Memberships
      summary: Request group membership
      description: Create the authenticated user's pending membership request with zero or more requested group roles.
      operationId: requestGroupMembership
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMembershipRequest"
      responses:
        "201":
          description: Membership request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    delete:
      tags:
        - Memberships
      summary: Withdraw own membership request
      description: Delete the authenticated user's pending membership request and pending role requests.
      operationId: withdrawGroupMembershipRequest
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Membership request withdrawn
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /groups/{groupId}/memberships/{userId}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/MembershipUserId"
    delete:
      tags:
        - Memberships
      summary: Delete membership
      description: Remove a user membership from a group. Requires group membership management permission or global membership management permission. Memberships holding GROUP_ADMIN require global membership management permission.
      operationId: deleteGroupMembership
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Membership deleted
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
    patch:
      tags:
        - Memberships
      summary: Accept or reject membership request
      description: Accept or reject a pending membership request. Requires group membership management permission or global membership management permission.
      operationId: decideGroupMembership
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipDecisionRequest"
      responses:
        "200":
          description: Membership decision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMembership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "504":
          $ref: "#/components/responses/GatewayTimeout"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /groups/{groupId}/memberships/{userId}/roles/{role}:
    parameters:
      - $ref: "#/components/parameters/GroupId"
      - $ref: "#/components/parameters/MembershipUserId"
      - $ref: "#/components/parameters/GroupRole"
    put:
      tags:
