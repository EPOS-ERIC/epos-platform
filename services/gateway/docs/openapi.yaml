            install_url:
              type: string
              format: uri
              description: URL at which the application may be installed
              example: "https://example.org/application/install"
            license:
              type: string
              format: uri
              description: URL of the license document for the software application
              example: "https://example.org/licenses/epos-app-license"
            software_version:
              type: string
              description: Version of the software application instance
              example: "2.4.1"
            software_requirements:
              type: string
              description: Runtime dependencies required by the application
              example: "Java 21"
            main_entity_of_page:
              type: string
              format: uri
              description: Web page describing the software application
              example: "https://example.org/app"
            provider:
              type: array
              description: Organizations providing this software application
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "ROR:048a87296/v1.0"
                  name: "Uppsala University"
                  href: "v1/resources/organization/ROR:048a87296/v1.0"
            operations:
              type: array
              description: Web service operations linked to this software application
              items:
                $ref: "#/components/schemas/ResourceRef"

    SoftwareSourceCode:
      allOf:
        - $ref: "#/components/schemas/BaseDetailResource"
        - type: object
          properties:
            programming_language:
              type: string
              description: Primary programming language of the source code
              example: "Java"
            keywords:
              type: array
              items:
                type: string
              example:
                - "portal"
                - "seismology"
                - "open source"
            concepts:
              type: array
              description: Concept references assigned to this source code
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "category:software_jup_conc_multi/v1.0"
                  name: "Multidisciplinary software"
                  href: "v1/resources/concept/category:software_jup_conc_multi/v1.0"
            repository:
              type: string
              format: uri
              description: URL of the source code repository
              example: "https://github.com/example/epos-portal"
            license:
              type: string
              format: uri
              description: URL of the license document for the software source code
              example: "https://example.org/licenses/epos-source-license"
            software_version:
              type: string
              description: Version of the software source code instance
              example: "2.4.1"
            runtime_platform:
              type: string
              description: Runtime platform or interpreter dependencies
              example: "Java 21"
            target_products:
              type: array
              description: Software applications targeted by this source code
              items:
                $ref: "#/components/schemas/ResourceRef"
            provider:
              type: array
              description: Organizations providing this software source code
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "ROR:048a87296/v1.0"
                  name: "Uppsala University"
                  href: "v1/resources/organization/ROR:048a87296/v1.0"
            main_entity_of_page:
              type: string
              format: uri
              description: Web page describing the software source code
              example: "https://example.org/source"

    Organization:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: "PIC:999472675/v1.0"
        identifiers:
          type: array
          description: External or domain-specific identifiers for this organization
          items:
            $ref: "#/components/schemas/Identifier"
        name:
          type: string
          description: Human-readable display name of the organization
          example: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
        lei_code:
          type: string
          description: Legal Entity Identifier code
          example: "5493001KJTIIGC8Y1R12"
        address:
          type: string
          description: Physical address of the organization
          example: "Via di Vigna Murata 605, Rome, 00143, IT"
        logo:
          type: string
          format: uri
          description: URL of the organization logo
          example: "https://www.ingv.it/images/logo-ingv.png"
        url:
          type: string
          format: uri
          description: URL of the organization website
          example: "http://www.ingv.it"
        email:
          type: array
          description: Email addresses of the organization
          items:
            type: string
          example:
            - "ufficiostampa@ingv.it"
        telephone:
          type: array
          description: Telephone numbers of the organization
          items:
            type: string
        contact_points:
          type: array
          description: Contact point references associated with this organization
          items:
            $ref: "#/components/schemas/ResourceRef"
          example:
            - id: "https://www.epos-eu.org/epos-dcat-ap/Seismology/Facility/AHEAD/contactPoint/v1.0"
              name: "Manager"
              href: "http://metadata-lifecycle-service:8080/api/v2/access/contactpoint/https%3A%2F%2Fwww.epos-eu.org%2Fepos-dcat-ap%2FSeismology%2FFacility%2FAHEAD%2FcontactPoint%2Fv1.0"
        member_of:
          type: array
          description: Parent organizations to which this organization belongs
          items:
            $ref: "#/components/schemas/ResourceRef"

    Webservice:
      allOf:
        - $ref: "#/components/schemas/BaseDetailResource"
        - type: object
          properties:
            identifiers:
              type: array
              description: External or domain-specific identifiers for this webservice
              items:
                $ref: "#/components/schemas/Identifier"
            entrypoint:
              type: string
              format: uri
              description: API entrypoint of the webservice
              example: "https://webservices.ingv.it/fdsnws/station/1"
            provider:
              description: Organization providing this webservice
              allOf:
                - $ref: "#/components/schemas/ResourceRef"
              example:
                id: "PIC:999472675/v1.0"
                name: "INGV - Istituto Nazionale di Geofisica e Vulcanologia"
                href: "v1/resources/organization/PIC:999472675/v1.0"
            issued:
              type: string
              format: date-time
              description: Webservice publication timestamp in ISO 8601 UTC
              example: "2024-02-01T00:00:00Z"
            modified:
              type: string
              format: date-time
              description: Webservice last modification timestamp in ISO 8601 UTC
              example: "2024-03-01T08:45:00Z"
            spatial:
              type: string
              description: Spatial coverage expressed as a WKT polygon (EPSG:4326)
              example: "POLYGON((12.3 41.8, 14.5 41.8, 14.5 43.2, 12.3 43.2, 12.3 41.8))"
            temporal:
              $ref: "#/components/schemas/TemporalExtent"
            keywords:
              type: array
              items:
                type: string
              example:
                - "fdsn"
                - "station"
            concepts:
              type: array
              description: Concept references assigned to this webservice
              items:
                $ref: "#/components/schemas/ResourceRef"
              example:
                - id: "category:earthquakeparameters/v1.0"
                  name: "Earthquake parameters"
                  href: "v1/resources/concept/category:earthquakeparameters/v1.0"
            license:
              type: string
              description: License under which the webservice can be used or reused
              example: "open"
            operations:
              type: array
              description: Operations supported by this webservice
              items:
                $ref: "#/components/schemas/Operation"
            api_documentation:
              $ref: "#/components/schemas/ApiDocumentation"

    Operation:
      type: object
      required:
        - id
      properties:
        id:
          type: string
          example: "https://www.epos-eu.org/epos-dcat-ap/Seismology/WebService/AHEAD/restful/fdsnws-event/Operation/v1.0"
        method:
          type: string
          description: HTTP method used by the operation
          example: "GET"
        returns:
          type: array
          description: Output media types returned by the operation
          items:
            type: string
          example:
            - "application/xml"
            - "application/json"
        iri_template:
          $ref: "#/components/schemas/IriTemplate"
        api_documentation:
          $ref: "#/components/schemas/ApiDocumentation"

    IriTemplate:
      type: object
      required:
        - template
      properties:
        template:
          type: string
          description: URI template describing the operation endpoint
          example: "https://www.emidius.eu/fdsnws/event/1/query{?starttime, endtime, eventid, minlatitude, maxlatitude, minlongitude, maxlongitude, latitude, longitude, maxradiuskm, minmagnitude, maxmagnitude, orderby, includeallorigins, includeallmagnitudes, limit, nodata}"
        mappings:
          type: array
          description: Parameter mappings supported by the URI template
          items:
            $ref: "#/components/schemas/IriTemplateMapping"

    IriTemplateMapping:
      type: object
      required:
        - variable
        - label
        - required
        - range
      properties:
        variable:
          type: string
          description: Template variable name
          example: "network"
        label:
          type: string
          description: Short string describing the meaning of the parameter
          example: "Network code"
        range:
          type: string
          description: Parameter type such as `xsd:string`, `xsd:boolean`, `xsd:date`, or `xsd:dateTime`
          example: "xsd:string"
        property:
          type: string
          description: Property mapped to the variable
          example: "http://schema.org/name"
        required:
          type: boolean
          description: Whether the variable is required
          example: false
        default_value:
          type: string
          description: Default value of the parameter
          example: "IV"
        min_value:
          type: string
          description: Minimum value of the parameter
          example: "0"
        max_value:
          type: string
          description: Maximum value of the parameter
          example: "9999"
        param_value:
          type: array
          description: Allowed values that can be used for the parameter
          items:
            type: string
          example:
            - "BHZ"
            - "HHZ"
        multiple_values:
          type: boolean
          description: Whether multiple values are allowed for the parameter
          example: true
        readonly_value:
          type: boolean
          description: Whether the parameter is mutable
          example: false
        value_pattern:
          type: string
          description: Regular expression used to validate parameter values
          example: "^[A-Z0-9]+$"

    ApiDocumentation:
      type: object
      required:
        - title
        - description
        - entrypoint
      properties:
        title:
          type: string
          description: Title of the API documentation
          example: "ahead-fdsnws-event documentation"
        description:
          type: string
          description: Description of the API documentation
          example: "Documentation for the fdsnws-event webservice"
        entrypoint:
          type: string
          format: uri
          description: API documentation entry point
          example: "https://www.emidius.eu/AHEAD/services/epos_events.php"

    Concept:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: "category:seismologicalproductsservices/v1.0"
        name:
          type: string
          example: "Seismological products services"
        description:
          type: string
          example: "TCS Subdomain"
        in_scheme:
          description: Concept scheme containing this concept
          allOf:
            - $ref: "#/components/schemas/ResourceRef"
        children:
          type: array
          description: Child concepts directly below this concept
          items:
            $ref: "#/components/schemas/ResourceRef"

    ConceptTreeNode:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          example: "category:software_jup_conc_multi/v1.0"
        name:
          type: string
          example: "Multidisciplinary software"
        description:
          type: string
          example: "Multidisciplinary software"
        children:
          type: array
          description: Nested child concepts directly below this concept
          items:
            $ref: "#/components/schemas/ConceptTreeNode"

    ConceptScheme:
      type: object
      required:
        - id
        - label
        - name
      properties:
        id:
          type: string
          example: "category:software_jup/v1.0"
        label:
          type: string
          example: "Jupyter Notebooks"
        name:
          type: string
          example: "Jupyter Notebooks"
        description:
          type: string
          example: "Jupyter Notebook Domain"
        logo:
          type: string
          format: uri
          example: "https://raw.githubusercontent.com/epos-eu/platform-gui-icons/3c13924d1f3483a9e1f1941ba094f0937602d0a9/jupyter-svgrepo-com.svg"
        homepage:
          type: string
          format: uri
          example: ""
        color:
          type: string
          description: Hex colour code used for UI rendering
          example: "#F37726"
        order_number:
          type: integer
          description: Display order among sibling concept schemes
          example: 1
        children:
          type: array
          description: Nested child concepts used by concept tree responses
          items:
            $ref: "#/components/schemas/ConceptTreeNode"
        top_concepts:
          type: array
          description: Top concepts directly contained in this concept scheme
          items:
            $ref: "#/components/schemas/ResourceRef"

    ConceptTreeResponse:
      type: object
      required:
        - schemes
      properties:
        schemes:
          type: array
          description: Ordered list of concept schemes, each carrying its full concept subtree
          items:
            $ref: "#/components/schemas/ConceptScheme"

    # -------------------------------------------------------------------------
    # Shared helpers
    # -------------------------------------------------------------------------

    TemporalExtent:
      type: object
      description: Temporal coverage of a resource
      properties:
        start:
          type: string
          format: date-time
          description: Start of the temporal coverage (inclusive), ISO 8601 UTC
          example: "2010-01-01T00:00:00Z"
        end:
          type: string
          format: date-time
          description: End of the temporal coverage (inclusive), ISO 8601 UTC. Omitted for open-ended coverage.
          example: "2023-12-31T23:59:59Z"

    Identifier:
      type: object
      description: Typed identifier attached to a resource
      required:
        - type
        - value
      properties:
        type:
          type: string
          description: Identifier scheme or type
          example: "doi"
        value:
          type: string
          description: Identifier value
          example: "10.13127/tsunami/neamthm18"

    UserStatus:
      type: string
      enum:
        - ACTIVE
        - INACTIVE
        - BLOCKED

    MembershipRole:
      type: string
      description: Role assigned to a user inside a group.
      enum:
        - EDITOR
        - REVIEWER
        - GROUP_ADMIN

    MembershipStatus:
      type: string
      description: Lifecycle state for a group membership.
      enum:
        - PENDING
        - ACTIVE
        - REJECTED

    User:
      allOf:
        - $ref: "#/components/schemas/UserSummary"
        - type: object
          description: User record returned by gateway user endpoints.
          required:
            - memberships
          properties:
            memberships:
              type: array
              description: Membership previews for this user.
              items:
                $ref: "#/components/schemas/UserMembershipSummary"

    UserSummary:
      type: object
      description: User record returned by user endpoints.
      required:
        - id
        - email
        - given_name
        - family_name
        - status
        - global_roles
        - global_permissions
        - created_at
        - updated_at
      properties:
        id:
          type: string
        email:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        status:
          $ref: "#/components/schemas/UserStatus"
        global_roles:
          type: array
          items:
            type: string
        global_permissions:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Group:
      type: object
      description: Public group metadata returned by Backoffice.
      required:
        - id
        - source_iri
        - name
        - position
        - concept
      properties:
        id:
          type: string
          format: uuid
        source_iri:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        label:
          type: string
          nullable: true
        logo:
          type: string
          nullable: true
        page:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        position:
          type: integer
          format: int32
        concept:
          type: string
          enum: [DATA, FACILITIES, SOFTWARE]

    UserMembershipSummary:
      type: object
      description: Embedded membership preview for one user-group relation.
      required:
        - group
        - roles
        - status
        - permissions
        - created_at
        - updated_at
      properties:
        group:
          $ref: "#/components/schemas/ResourceRef"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/MembershipRole"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        permissions:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    GroupMembershipSummary:
      type: object
      description: Embedded membership summary for one group-user relation.
      required:
        - user
        - role
        - status
      properties:
        user:
          $ref: "#/components/schemas/ResourceRef"
        role:
          $ref: "#/components/schemas/MembershipRole"
        status:
          $ref: "#/components/schemas/MembershipStatus"

    GroupMembership:
      type: object
      description: Complete membership record returned after a membership decision.
      required:
        - user
        - status
        - roles
        - permissions
        - role_requests
        - created_at
        - updated_at
      properties:
        user:
          $ref: "#/components/schemas/MembershipUser"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/MembershipRole"
        permissions:
          type: array
          items:
            type: string
        role_requests:
          type: array
          description: Pending role requests only.
          items:
            $ref: "#/components/schemas/RoleRequest"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    MembershipUser:
      type: object
      required:
        - id
        - given_name
        - family_name
        - email
      properties:
        id:
          type: string
        given_name:
          type: string
        family_name:
          type: string
        email:
          type: string
          format: email

    RoleRequest:
      type: object
      required:
        - id
        - role
        - status
        - requested_at
      properties:
        id:
          type: string
          format: uuid
        role:
          type: string
          enum: [EDITOR, REVIEWER]
        status:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED]
        requested_at:
          type: string
          format: date-time

    CreateRoleRequest:
      type: object
      required:
        - role
      additionalProperties: false
      properties:
        role:
          type: string
          enum: [EDITOR, REVIEWER]

    MembershipDecisionRequest:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ACTIVE, REJECTED]

    RoleRequestDecisionRequest:
      type: object
      required:
        - status
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ACCEPTED, REJECTED]

    Membership:
      type: object
      description: Membership record linking user to group.
      required:
        - user_id
        - group_id
        - role
        - status
      properties:
        user_id:
          type: string
        group_id:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateMembershipRequest:
      type: object
      description: Payload for requesting access to a group.
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/MembershipRole"

    CreateGroupRequest:
      type: object
      description: Mutable group fields accepted by gateway create endpoint.
      required:
        - slug
        - name
      properties:
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean

    Problem:
      type: object
      required:
        - title
        - status
      properties:
        title:
          type: string
          description: Short, human-readable summary of problem
          example: "Resource not found"
        status:
          type: integer
          description: HTTP status code for this problem occurrence
          example: 404
        detail:
          type: string
          description: Optional human-readable explanation specific to this occurrence
          example: "The requested resource was not found"
        instance:
          type: string
          format: uri-reference
          description: Optional URI reference identifying this specific problem occurrence
          example: "requests/req-123"
