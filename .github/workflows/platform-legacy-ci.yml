name: Platform Legacy Pipeline

on:
  pull_request:
    paths:
      - apps/platform-legacy/**
      - .github/workflows/platform-legacy-ci.yml
      - .github/workflows/_node-app.yml
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - apps/platform-legacy/**
      - .github/workflows/platform-legacy-ci.yml
      - .github/workflows/_node-app.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_node-app.yml
    secrets: inherit
    with:
      app: apps/platform-legacy
      image: platform-legacy
      dockerfile: Dockerfile
      context: apps/platform-legacy
      node-version: "26"
      lint-command: make lint
      build-command: make build-oss
