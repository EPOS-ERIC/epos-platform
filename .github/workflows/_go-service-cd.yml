name: Go Service CD

on:
  workflow_call:
    inputs:
      service:
        required: true
        type: string
      image:
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: epos-eric/epos-platform

jobs:
  publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ inputs.service }}/go.mod
          cache-dependency-path: ${{ inputs.service }}/go.sum

      - name: Set up Docker registry access
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image }}
          tags: |
            type=raw,value=dev,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
            type=ref,event=tag,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build image
        working-directory: ${{ inputs.service }}
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image }}:${{ steps.meta.outputs.version }}
        run: make docker IMAGE="$IMAGE"

      - name: Push image tags
        shell: bash
        env:
          SOURCE_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image }}:${{ steps.meta.outputs.version }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r image; do
            [[ -z "$image" ]] && continue
            if [[ "$image" != "$SOURCE_IMAGE" ]]; then
              docker tag "$SOURCE_IMAGE" "$image"
            fi
            docker push "$image"
          done <<< "$IMAGE_TAGS"
