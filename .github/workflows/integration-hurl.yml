name: Integration Hurl Pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hurl-tests:
    uses: ./.github/workflows/_integration-suite.yml
    secrets: inherit
    with:
      job-name: Hurl tests
      build-dev-images-command: docker build -t epos-gateway-dev:local -f services/gateway/Dockerfile.dev . && docker build -t epos-backoffice-dev:local -f services/backoffice/Dockerfile.dev . && docker build -t epos-oss-aai-dev:local -f services/oss-aai-service/Dockerfile.dev .
      compose-up-command: docker compose -f docker/compose.dev.yaml up -d --wait gateway-service
      populate-command: make populate-metadatone
      wait-url: http://localhost:32000/v1/search?type=softwareapplication
      test-command: make test-hurl
