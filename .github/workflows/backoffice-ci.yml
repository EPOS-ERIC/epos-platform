name: Backoffice Pipeline

on:
  pull_request:
    paths:
      - services/backoffice/**,
      - packages/go/logging**,
      - packages/go/observability/**,
      - packages/go/middleware/**,
      - packages/go/apidocs/**,
      - packages/scripts/epos-banner.sh
      - Makefile
      - .github/workflows/backoffice-ci.yml
      - .github/workflows/_go-service.yml
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - services/backoffice/**,
      - packages/go/logging**,
      - packages/go/observability/**,
      - packages/go/middleware/**,
      - packages/go/apidocs/**,
      - packages/scripts/epos-banner.sh
      - Makefile
      - .github/workflows/backoffice-ci.yml
      - .github/workflows/_go-service.yml

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/_go-service.yml
    secrets: inherit
    with:
      service: services/backoffice
      image: backoffice
      dockerfile: services/backoffice/Dockerfile
      context: .
      go-version-file: services/backoffice/go.mod
