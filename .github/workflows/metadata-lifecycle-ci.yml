name: Metadata Lifecycle Pipeline

on:
  pull_request:
    paths:
      - services/metadata-lifecycle/**
      - packages/go/apperror/**
      - packages/go/grpcserver/**
      - packages/go/logging/**
      - packages/go/observability/**
      - packages/go/middleware/**
      - packages/go/postgres/**
      - packages/protobuf/**
      - packages/scripts/epos-banner.sh
      - .github/workflows/metadata-lifecycle-ci.yml
      - .github/workflows/_go-service-ci.yml
      - .github/workflows/_go-service-cd.yml
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - services/metadata-lifecycle/**
      - packages/go/apperror/**
      - packages/go/grpcserver/**
      - packages/go/logging/**
      - packages/go/observability/**
      - packages/go/middleware/**
      - packages/go/postgres/**
      - packages/protobuf/**
      - packages/scripts/epos-banner.sh
      - .github/workflows/metadata-lifecycle-ci.yml
      - .github/workflows/_go-service-ci.yml
      - .github/workflows/_go-service-cd.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_go-service-ci.yml
    secrets: inherit
    with:
      service: services/metadata-lifecycle

  publish:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_go-service-cd.yml
    secrets: inherit
    with:
      service: services/metadata-lifecycle
      image: metadata-lifecycle
