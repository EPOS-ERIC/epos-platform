name: Metadata Lifecycle Pipeline

on:
  pull_request:
    paths:
      - services/metadata-lifecycle/**
      - packages/go/logging**
      - packages/go/observability/**
      - packages/go/middleware/**
      - packages/go/apidocs/**
      - packages/scripts/epos-banner.sh
      - Makefile
      - .github/workflows/metadata-lifecycle-ci.yml
      - .github/workflows/_go-service.yml
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - services/metadata-lifecycle/**
      - packages/go/logging**
      - packages/go/observability/**
      - packages/go/middleware/**
      - packages/go/apidocs/**
      - packages/scripts/epos-banner.sh
      - Makefile
      - .github/workflows/metadata-lifecycle-ci.yml
      - .github/workflows/_go-service.yml

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/_go-service.yml
    secrets: inherit
    with:
      service: services/metadata-lifecycle
      image: metadata-lifecycle
      dockerfile: services/metadata-lifecycle/Dockerfile
      context: .
      go-version-file: services/metadata-lifecycle/go.mod
