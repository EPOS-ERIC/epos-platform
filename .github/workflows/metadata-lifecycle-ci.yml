name: Metadata Lifecycle Pipeline

on:
  pull_request:
    paths:
      - "services/metadata-lifecycle/src/**"
      - "services/metadata-lifecycle/gradle/**"
      - "services/metadata-lifecycle/gradlew"
      - "services/metadata-lifecycle/build.gradle.kts"
      - "services/metadata-lifecycle/settings.gradle.kts"
      - "services/metadata-lifecycle/Dockerfile"
      - "packages/scripts/epos-banner.sh"
      - "packages/assets/otel/opentelemetry-javaagent.jar"
      - "Makefile"
      - ".github/workflows/metadata-lifecycle-ci.yml"
      - ".github/workflows/_gradle-service.yml"
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "services/metadata-lifecycle/src/**"
      - "services/metadata-lifecycle/gradle/**"
      - "services/metadata-lifecycle/gradlew"
      - "services/metadata-lifecycle/build.gradle.kts"
      - "services/metadata-lifecycle/settings.gradle.kts"
      - "services/metadata-lifecycle/Dockerfile"
      - "packages/scripts/epos-banner.sh"
      - "packages/assets/otel/opentelemetry-javaagent.jar"
      - "Makefile"
      - ".github/workflows/metadata-lifecycle-ci.yml"
      - ".github/workflows/_gradle-service.yml"

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/_gradle-service.yml
    secrets: inherit
    with:
      service: services/metadata-lifecycle
      image: metadata-lifecycle
      dockerfile: services/metadata-lifecycle/Dockerfile
      context: .
