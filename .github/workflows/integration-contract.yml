name: Integration Contract Pipeline

on:
  pull_request:
    paths:
      - "tests/contract/**"
      - "services/gateway/**"
      - "services/metadata-lifecycle/**"
      - "services/oss-aai-service/**"
      - "packages/go/logging/**"
      - "packages/go/observability/**"
      - "packages/go/middleware/**"
      - "packages/go/apidocs/**"
      - "packages/scripts/epos-banner.sh"
      - "packages/scripts/metadatone.sh"
      - "packages/scripts/schemathesis-env.sh"
      - "docker/compose.ci.yaml"
      - "docker/gateway-config.yaml"
      - "Makefile"
      - ".github/workflows/integration-contract.yml"
      - ".github/workflows/_integration-suite.yml"
  push:
    branches:
      - "main"
    paths:
      - "tests/contract/**"
      - "services/gateway/**"
      - "services/metadata-lifecycle/**"
      - "services/oss-aai-service/**"
      - "packages/go/logging/**"
      - "packages/go/observability/**"
      - "packages/go/middleware/**"
      - "packages/go/apidocs/**"
      - "packages/scripts/epos-banner.sh"
      - "packages/scripts/metadatone.sh"
      - "packages/scripts/schemathesis-env.sh"
      - "docker/compose.ci.yaml"
      - "docker/gateway-config.yaml"
      - "Makefile"
      - ".github/workflows/integration-contract.yml"
      - ".github/workflows/_integration-suite.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    uses: ./.github/workflows/_integration-suite.yml
    secrets: inherit
    with:
      job-name: Contract tests
      ci-command: make ci
      populate-command: make populate-metadatone
      wait-url: http://localhost:32000/health
      test-command: make test-contract
