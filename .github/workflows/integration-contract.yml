name: Integration Contract Pipeline

on:
  pull_request:
    paths:
      - "tests/contract/**"
      - "services/gateway/**"
      - "services/converter/**"
      - "services/metadata-lifecycle/**"
      - "services/oss-aai-service/**"
      - "packages/go/logging/**"
      - "packages/go/observability/**"
      - "packages/go/middleware/**"
      - "packages/scripts/epos-banner.sh"
      - "packages/scripts/metadatone.sh"
      - "docker/compose.ci.yaml"
      - "docker/gateway-config.yaml"
      - "Makefile"
      - ".github/workflows/integration-contract.yml"
  push:
    branches:
      - "main"
    paths:
      - "tests/contract/**"
      - "services/gateway/**"
      - "services/converter/**"
      - "services/metadata-lifecycle/**"
      - "services/oss-aai-service/**"
      - "packages/go/logging/**"
      - "packages/go/observability/**"
      - "packages/go/middleware/**"
      - "packages/scripts/epos-banner.sh"
      - "packages/scripts/metadatone.sh"
      - "docker/compose.ci.yaml"
      - "docker/gateway-config.yaml"
      - "Makefile"
      - ".github/workflows/integration-contract.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # explicitly set up go so to have caching
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/gateway/go.mod
          cache-dependency-path: |
            services/gateway/go.sum
            services/metadata-lifecycle/go.sum
            services/data-retriever/go.sum
            services/converter/go.sum
            services/sharing/go.sum
            services/oss-aai-service/go.sum

      - name: Build CI images
        shell: bash
        run: make ci-images

      - name: Start CI stack
        shell: bash
        run: make ci-start

      - name: Populate integration metadata
        shell: bash
        run: make populate-metadatone

      - name: Wait for populated gateway data
        shell: bash
        run: |
          for i in {1..90}; do
            if curl -fsS 'http://localhost:33000/health' >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker/compose.ci.yaml logs
          exit 1

      - name: Run integration tests
        shell: bash
        run: make test-integration

      - name: Show integration logs on failure
        if: failure()
        shell: bash
        run: docker compose -f docker/compose.ci.yaml logs --no-color

      - name: Show compose state on failure
        if: failure()
        shell: bash
        run: |
          docker compose -f docker/compose.ci.yaml ps -a
          for id in $(docker compose -f docker/compose.ci.yaml ps -q); do
            docker inspect "$id" --format '{{.Name}} {{if .State.Health}}{{json .State.Health}}{{else}}no-healthcheck{{end}}'
          done
