name: Node App CI

on:
  workflow_call:
    inputs:
      app:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: true
        type: string
      node-version:
        required: false
        type: string
        default: "26"
      pnpm-version:
        required: false
        type: string
        default: ""
      codegen-command:
        required: false
        type: string
        default: ""
      lint-command:
        required: false
        type: string
        default: ""
      build-command:
        required: false
        type: string
        default: "make build"

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Set up pnpm
        if: ${{ inputs.pnpm-version != '' }}
        uses: pnpm/action-setup@v6
        with:
          version: ${{ inputs.pnpm-version }}

      - name: Install dependencies
        working-directory: ${{ inputs.app }}
        run: make install

      - name: Generate API types
        if: ${{ inputs.codegen-command != '' }}
        working-directory: ${{ inputs.app }}
        run: ${{ inputs.codegen-command }}

      - name: Run lint
        if: ${{ inputs.lint-command != '' }}
        working-directory: ${{ inputs.app }}
        run: ${{ inputs.lint-command }}

      - name: Run tests
        working-directory: ${{ inputs.app }}
        run: make test

      - name: Build app
        working-directory: ${{ inputs.app }}
        run: ${{ inputs.build-command }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.context }}/${{ inputs.dockerfile }}
          push: false
