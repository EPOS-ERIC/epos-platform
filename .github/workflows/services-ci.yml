name: Services Pipeline

on:
  pull_request:
    paths:
      - "services/**"
      - "apps/platform/**"
      - "packages/go/**"
      - "packages/assets/**"
      - "docker/**"
      - "Makefile"
      - ".github/workflows/services-ci.yml"
  push:
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "services/**"
      - "apps/platform/**"
      - "packages/go/**"
      - "packages/assets/**"
      - "docker/**"
      - "Makefile"
      - ".github/workflows/services-ci.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: epos-eric/epos-platform

jobs:
  go-services:
    name: Go service / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            image: gateway
            dockerfile: services/gateway/Dockerfile
            context: .
          - service: user-group
            image: user-group
            dockerfile: services/user-group/Dockerfile
            context: .
          - service: data-retriever
            image: data-retriever
            dockerfile: services/data-retriever/Dockerfile
            context: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Prepare shared package path
        run: |
          sudo mkdir -p /workspace
          if [ ! -e /workspace/packages ]; then
            sudo ln -s "${GITHUB_WORKSPACE}/packages" /workspace/packages
          fi

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Run Go tests
        working-directory: services/${{ matrix.service }}
        run: make test

      - name: Run Go lint
        working-directory: services/${{ matrix.service }}
        run: make lint

      - name: Build binary
        working-directory: services/${{ matrix.service }}
        run: make build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  metadata-lifecycle:
    name: Gradle service / metadata-lifecycle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make Gradle wrapper executable
        working-directory: services/metadata-lifecycle
        run: chmod +x gradlew

      - name: Run Gradle tests
        working-directory: services/metadata-lifecycle
        run: make test

      - name: Run Gradle lint
        working-directory: services/metadata-lifecycle
        run: make lint

      - name: Build artifact
        working-directory: services/metadata-lifecycle
        run: make build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/metadata-lifecycle
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/metadata-lifecycle/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  platform-app:
    name: Frontend app / platform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: apps/platform/.nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Install dependencies
        working-directory: apps/platform
        run: pnpm install --frozen-lockfile

      - name: Generate API types
        working-directory: apps/platform
        run: make codegen

      - name: Run lint
        working-directory: apps/platform
        run: make lint

      - name: Run tests
        working-directory: apps/platform
        run: make test

      - name: Build app
        working-directory: apps/platform
        run: make build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/platform
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: apps/platform
          file: apps/platform/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
