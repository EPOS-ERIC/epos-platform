name: Notify Slack of merged PRs

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  notify:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Never check out or execute PR code in this secret-bearing workflow.
      - name: Post to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          errors: true
          payload: |
            {
              "unfurl_links": false,
              "unfurl_media": false,
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "plain_text",
                    "text": ${{ toJSON(format('{0} — @{1}', github.event.pull_request.title, github.event.pull_request.user.login)) }}
                  },
                  "accessory": {
                    "type": "button",
                    "text": {"type": "plain_text", "text": "View PR"},
                    "url": ${{ toJSON(github.event.pull_request.html_url) }}
                  }
                },
                {
                  "type": "markdown",
                  "text": ${{ toJSON(github.event.pull_request.body || '_No description provided._') }}
                }
              ]
            }
