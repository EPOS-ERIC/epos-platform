name: OSS AAI Pipeline

on:
  pull_request:
    paths:
      - "services/oss-aai-service/**"
      - "packages/scripts/epos-banner.sh"
      - "Makefile"
      - ".github/workflows/oss-aai-ci.yml"
      - ".github/workflows/_go-service-ci.yml"
      - ".github/workflows/_go-service-cd.yml"
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "services/oss-aai-service/**"
      - "packages/scripts/epos-banner.sh"
      - "Makefile"
      - ".github/workflows/oss-aai-ci.yml"
      - ".github/workflows/_go-service-ci.yml"
      - ".github/workflows/_go-service-cd.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_go-service-ci.yml
    secrets: inherit
    with:
      service: services/oss-aai-service

  publish:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_go-service-cd.yml
    secrets: inherit
    with:
      service: services/oss-aai-service
      image: oss-aai-service
