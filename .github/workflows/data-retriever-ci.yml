name: Data Retriever Pipeline

on:
  pull_request:
    paths:
      - "services/data-retriever/**"
      - "packages/go/logging/**"
      - "packages/go/observability/**"
      - "packages/go/migrations/**"
      - "packages/go/postgres/**"
      - "packages/scripts/epos-banner.sh"
      - "Makefile"
      - ".github/workflows/data-retriever-ci.yml"
      - ".github/workflows/_go-service.yml"
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "services/data-retriever/**"
      - "packages/go/logging/**"
      - "packages/go/observability/**"
      - "packages/go/migrations/**"
      - "packages/go/postgres/**"
      - "packages/scripts/epos-banner.sh"
      - "Makefile"
      - ".github/workflows/data-retriever-ci.yml"
      - ".github/workflows/_go-service.yml"

permissions:
  contents: read
  packages: write

jobs:
  ci:
    uses: ./.github/workflows/_go-service.yml
    secrets: inherit
    with:
      service: services/data-retriever
      image: data-retriever
      dockerfile: services/data-retriever/Dockerfile
      context: .
      go-version-file: services/data-retriever/go.mod
