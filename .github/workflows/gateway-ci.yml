name: Gateway Pipeline

on:
  pull_request:
    paths:
      - "services/gateway/**"
      - "packages/go/apperror/**"
      - "packages/go/logging/**"
      - "packages/go/observability/**"
      - "packages/go/middleware/**"
      - "packages/go/apidocs/**"
      - "packages/protobuf/**"
      - "packages/scripts/epos-banner.sh"
      - "docker/gateway-config.dev.yaml"
      - "Makefile"
      - ".github/workflows/gateway-ci.yml"
      - ".github/workflows/_go-service-ci.yml"
      - ".github/workflows/_go-service-cd.yml"
  push:
    branches:
      - "main"
    tags:
      - "v*"
    paths:
      - "services/gateway/**"
      - "packages/go/apperror/**"
      - "packages/go/logging/**"
      - "packages/go/observability/**"
      - "packages/go/middleware/**"
      - "packages/go/apidocs/**"
      - "packages/protobuf/**"
      - "packages/scripts/epos-banner.sh"
      - "docker/gateway-config.dev.yaml"
      - "Makefile"
      - ".github/workflows/gateway-ci.yml"
      - ".github/workflows/_go-service-ci.yml"
      - ".github/workflows/_go-service-cd.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_go-service-ci.yml
    secrets: inherit
    with:
      service: services/gateway

  publish:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_go-service-cd.yml
    secrets: inherit
    with:
      service: services/gateway
      image: gateway
