name: CLI Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - { goos: linux, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: amd64, ext: "" }
          - { goos: darwin, goarch: arm64, ext: "" }
          - { goos: windows, goarch: amd64, ext: ".exe" }
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Generate code
        run: make generate

      - name: Build release binary
        env:
          GOOS: ${{ matrix.platform.goos }}
          GOARCH: ${{ matrix.platform.goarch }}
          EXT: ${{ matrix.platform.ext }}
          VERSION: ${{ github.ref_name }}
        run: make build-release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: epos-cli-${{ matrix.platform.goos }}-${{ matrix.platform.goarch }}
          path: cli/epos-cli-${{ matrix.platform.goos }}-${{ matrix.platform.goarch }}${{ matrix.platform.ext }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Download binaries
        uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true

      - name: Install minisign
        run: go install aead.dev/minisign/cmd/minisign@v0.3.0

      - name: Generate and sign checksums
        working-directory: artifacts
        env:
          MINISIGN_PRIVATE_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          sha256sum epos-cli-* > SHA256SUMS.txt
          key="$RUNNER_TEMP/minisign.key"
          umask 077
          printf '%s\n' "$MINISIGN_PRIVATE_KEY" > "$key"
          printf '%s\n' "$MINISIGN_PASSWORD" | ~/go/bin/minisign -S -s "$key" -m SHA256SUMS.txt
          for file in epos-cli-*; do
            printf '%s\n' "$MINISIGN_PASSWORD" | ~/go/bin/minisign -S -s "$key" -m "$file"
          done

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/epos-cli-*
            artifacts/SHA256SUMS.txt
            artifacts/SHA256SUMS.txt.minisig
