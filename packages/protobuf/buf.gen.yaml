# buf.gen.yaml
version: v2
plugins:
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/java:v31.1
    out: gen/java
    include_imports: true
  - remote: buf.build/grpc/java:v1.73.0
    out: gen/java
