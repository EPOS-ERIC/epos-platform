syntax = "proto3";

package metadata_lifecycle.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "metadata_lifecycle/v1/annotations.proto";

option go_package = "github.com/EPOS-ERIC/epos-platform/packages/protobuf/gen/go/metadata_lifecycle/v1;metadatalifecyclev1";

message CreateResourceRequest {
  string group_id = 1 [(buf.validate.field).string.min_len = 1];
  oneof metadata {
    option (buf.validate.oneof).required = true;
    DatasetMetadata dataset = 2;
    SoftwareApplicationMetadata software_application = 3;
    SoftwareSourceCodeMetadata software_source_code = 4;
  }
}

message CreateResourceResponse {
  ResourceRecord resource = 1;
}

enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_DATASET = 1;
  RESOURCE_TYPE_SOFTWARE_APPLICATION = 2;
  RESOURCE_TYPE_SOFTWARE_SOURCE_CODE = 3;
}

message GetResourceVersionRequest {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.min_len = 1];
  string version_id = 3 [(buf.validate.field).string.min_len = 1];
}

message GetResourceVersionResponse {
  ResourceVersion resource = 1;
}

enum VersioningStatus {
  VERSIONING_STATUS_UNSPECIFIED = 0;
  VERSIONING_STATUS_PUBLISHED = 1;
  VERSIONING_STATUS_DRAFT = 2;
  VERSIONING_STATUS_SUBMITTED = 3;
  VERSIONING_STATUS_ARCHIVED = 4;
  VERSIONING_STATUS_REJECTED = 5;
}

message ResourceVersion {
  string resource_id = 1;
  string version_id = 2;
  int32 revision = 3;
  VersioningStatus status = 4;
  string created_by = 5;
  string group_id = 6;
  string group_name = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  oneof metadata {
    DatasetResourceMetadata dataset = 10;
    SoftwareApplicationResourceMetadata software_application = 11;
    SoftwareSourceCodeResourceMetadata software_source_code = 12;
  }
}

message ResourceReference {
  string id = 1;
  string name = 2;
}
message ResourceIdentifier {
  string id = 1;
  string type = 2;
  string value = 3;
}

message DatasetResourceMetadata {
  string id = 1;
  string title = 2;
  string description = 3;
  string keywords = 4;
  optional string accrual_periodicity = 5;
  optional string quality_annotation = 6;
  optional string access_right = 7;
  repeated Distribution distributions = 8;
  optional string spatial_coverage = 9;
  Temporal temporal_coverage = 10;
  repeated ResourceIdentifier persistent_identifiers = 11;
  repeated string contact_points = 12;
  repeated ResourceReference providers = 13;
  repeated ResourceReference categories = 14;
  google.protobuf.Timestamp created = 15;
  google.protobuf.Timestamp updated = 16;
  bool contacts_included = 17;
}

message SoftwareApplicationResourceMetadata {
  string id = 1;
  string name = 2;
  string description = 3;
  optional string main_entity_of_page = 4;
  optional string license = 5;
  optional string version = 6;
  string keywords = 7;
  optional string download_url = 8;
  optional string requirements = 9;
  optional string operating_system = 10;
  repeated ResourceReference creators = 11;
  repeated ResourceIdentifier identifiers = 12;
  repeated ResourceReference categories = 13;
  repeated string contact_points = 14;
  bool contacts_included = 15;
}

message SoftwareSourceCodeResourceMetadata {
  string id = 1;
  string name = 2;
  string description = 3;
  optional string programming_language = 4;
  string keywords = 5;
  optional string repository = 6;
  optional string license = 7;
  optional string software_requirements = 8;
  optional string runtime_platform = 9;
  optional string main_entity_of_page = 10;
  optional string version = 11;
  repeated ResourceReference creators = 12;
  repeated ResourceIdentifier identifiers = 13;
  repeated ResourceReference categories = 14;
  repeated string contact_points = 15;
  bool contacts_included = 16;
}

message ResourceRecord {
  string resource_id = 1;
  string version_id = 2;
  int32 revision = 3;
  VersioningStatus status = 4;
}

message Identifier {
  string type = 1;
  string value = 2;
}

message Temporal {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

message DatasetMetadata {
  string title = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2;
  string keywords = 3;
  optional string accrual_periodicity = 4;
  optional string quality_annotation = 5;
  optional string access_right = 6;
  repeated Distribution distributions = 7;
  optional string spatial_coverage = 8;
  Temporal temporal_coverage = 9;
  repeated Identifier persistent_identifiers = 10;
  repeated string contact_points = 11;
  repeated string providers = 12;
  repeated string categories = 13;
  google.protobuf.Timestamp created = 14;
  google.protobuf.Timestamp updated = 15;
}

message Distribution {
  string title = 1;
  string description = 2;
  optional string license = 3;
  string type = 4;
  google.protobuf.Timestamp issued = 5;
  google.protobuf.Timestamp modified = 6;
  optional int64 byte_size = 7;
  oneof delivery {
    WebService web_service = 8;
    DownloadableFile downloadable_file = 9;
  }
  string id = 10;
}

message WebService {
  string name = 1;
  string description = 2;
  string template_url = 3;
  repeated Parameter parameters = 4;
  string format = 5;
  optional string provider = 6;
  Documentation documentation = 7;
  optional string spatial_coverage = 8;
  Temporal temporal_coverage = 9;
  repeated string contact_points = 10;
  string id = 11;
  bool contacts_included = 12;
  ResourceReference provider_reference = 13;
}

message DownloadableFile {
  string url = 1;
  string format = 2;
}

message Documentation {
  optional string title = 1;
  optional string description = 2;
  string uri = 3;
}

message Parameter {
  ParameterMetadata metadata = 1;
  oneof value {
    StringParameter string = 2;
    BooleanParameter boolean = 3;
    IntegerParameter integer = 4;
    FloatParameter float = 5;
    DateTimeParameter date_time = 6;
  }
}

message ParameterMetadata {
  string variable = 1;
  string property = 2;
  string label = 3;
  bool required = 4;
  bool multiple_values = 5;
  bool read_only = 6;
  string id = 7;
  string kind = 8;
}

message StringParameter {
  optional string default = 1;
  repeated string allowed_values = 2;
  string pattern = 3;
}

message BooleanParameter {
  optional bool default = 1;
}

message IntegerParameter {
  optional int64 minimum = 1;
  optional int64 maximum = 2;
  optional int64 default = 3;
  repeated int64 allowed_values = 4;
}

message FloatParameter {
  optional double minimum = 1;
  optional double maximum = 2;
  optional double default = 3;
  repeated double allowed_values = 4;
}

message DateTimeParameter {
  google.protobuf.Timestamp minimum = 1;
  google.protobuf.Timestamp maximum = 2;
  google.protobuf.Timestamp default = 3;
  string pattern = 4;
}

message SoftwareApplicationMetadata {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2;
  optional string main_entity_of_page = 3;
  optional string license = 4;
  optional string version = 5;
  string keywords = 6;
  optional string download_url = 7;
  optional string requirements = 8;
  optional string operating_system = 9;
  repeated string creators = 10;
  repeated Identifier identifiers = 11;
  repeated string categories = 12;
  repeated string contact_points = 13;
}

message SoftwareSourceCodeMetadata {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2;
  optional string programming_language = 3;
  string keywords = 4;
  optional string repository = 5;
  optional string license = 6;
  optional string software_requirements = 7;
  optional string runtime_platform = 8;
  optional string main_entity_of_page = 9;
  optional string version = 10;
  repeated string creators = 11;
  repeated Identifier identifiers = 12;
  repeated string categories = 13;
  repeated string contact_points = 14;
}

message DiscardResourceDraftRequest {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.min_len = 1];
  string version_id = 3 [(buf.validate.field).string.min_len = 1];
}

message SubmitResourceRequest {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.min_len = 1];
  string version_id = 3 [(buf.validate.field).string.min_len = 1];
}
message SubmitResourceResponse {
  ResourceRecord resource = 1;
}
message WithdrawResourceRequest {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.min_len = 1];
  string version_id = 3 [(buf.validate.field).string.min_len = 1];
}
message WithdrawResourceResponse {
  ResourceRecord resource = 1;
}
message ReopenResourceRequest {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.min_len = 1];
  string version_id = 3 [(buf.validate.field).string.min_len = 1];
}
message ReopenResourceResponse {
  ResourceRecord resource = 1;
}
message PublishResourceRequest {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.min_len = 1];
  string version_id = 3 [(buf.validate.field).string.min_len = 1];
}
message PublishResourceResponse {
  ResourceRecord resource = 1;
}
message UnpublishResourceRequest {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.min_len = 1];
  string version_id = 3 [(buf.validate.field).string.min_len = 1];
}
message UnpublishResourceResponse {
  ResourceRecord resource = 1;
}
message DiscardResourceDraftResponse {}

message RejectResourceRequest {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.min_len = 1];
  string version_id = 3 [(buf.validate.field).string.min_len = 1];
  string note = 4 [(buf.validate.field).string.min_len = 1];
}
message RejectResourceResponse {
  ResourceRecord resource = 1;
}

message DraftResourceFromPublicationRequest {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.min_len = 1];
}
message DraftResourceFromPublicationResponse {
  ResourceRecord resource = 1;
}
message DraftResourceFromLatestArchiveRequest {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.min_len = 1];
}
message DraftResourceFromLatestArchiveResponse {
  ResourceRecord resource = 1;
}

message CopyPublishedResourceRequest {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.min_len = 1];
  string group_id = 3 [(buf.validate.field).string.min_len = 1];
}
message CopyPublishedResourceResponse {
  ResourceRecord resource = 1;
}

message ReplaceResourceDraftRequest {
  int32 revision = 1 [(buf.validate.field).int32.gt = 0];
  oneof metadata {
    option (buf.validate.oneof).required = true;
    DatasetDraftMetadata dataset = 2;
    SoftwareApplicationDraftMetadata software_application = 3;
    SoftwareSourceCodeDraftMetadata software_source_code = 4;
  }
  string resource_id = 5 [(buf.validate.field).string.min_len = 1];
  string version_id = 6 [(buf.validate.field).string.min_len = 1];
}

message ReplaceResourceDraftResponse {
  ResourceRecord resource = 1;
}

message DatasetDraftMetadata {
  string title = 1 [(buf.validate.field).string.min_len = 1];
  optional string description = 2;
  optional string keywords = 3;
  optional string accrual_periodicity = 4;
  optional string quality_annotation = 5;
  optional string access_right = 6;
  repeated DistributionDraft distributions = 7;
  optional string spatial_coverage = 8;
  Temporal temporal_coverage = 9;
  repeated IdentifierDraft persistent_identifiers = 10;
  repeated string contact_points = 11;
  repeated string providers = 12;
  repeated string categories = 13;
  google.protobuf.Timestamp created = 14;
  google.protobuf.Timestamp updated = 15;
}

message SoftwareApplicationDraftMetadata {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  optional string description = 2;
  optional string main_entity_of_page = 3;
  optional string license = 4;
  optional string version = 5;
  optional string keywords = 6;
  optional string download_url = 7;
  optional string requirements = 8;
  optional string operating_system = 9;
  repeated string creators = 10;
  repeated IdentifierDraft identifiers = 11;
  repeated string categories = 12;
  repeated string contact_points = 13;
}

message SoftwareSourceCodeDraftMetadata {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  optional string description = 2;
  optional string programming_language = 3;
  optional string keywords = 4;
  optional string repository = 5;
  optional string license = 6;
  optional string software_requirements = 7;
  optional string runtime_platform = 8;
  optional string main_entity_of_page = 9;
  optional string version = 10;
  repeated string creators = 11;
  repeated IdentifierDraft identifiers = 12;
  repeated string categories = 13;
  repeated string contact_points = 14;
}

message IdentifierDraft {
  string type = 1;
  string value = 2;
}

message DistributionDraft {
  string title = 1;
  string description = 2;
  optional string license = 3;
  string type = 4;
  google.protobuf.Timestamp issued = 5;
  google.protobuf.Timestamp modified = 6;
  optional int64 byte_size = 7;
  oneof delivery {
    option (buf.validate.oneof).required = true;
    WebServiceDraft web_service = 8;
    DownloadableFile downloadable_file = 9;
  }
}

message WebServiceDraft {
  string name = 1;
  string description = 2;
  string template_url = 3;
  repeated ParameterDraft parameters = 4;
  string format = 5;
  optional string provider = 6;
  Documentation documentation = 7;
  optional string spatial_coverage = 8;
  Temporal temporal_coverage = 9;
  repeated string contact_points = 10;
}

message ParameterDraft {
  ParameterDraftMetadata metadata = 1;
  oneof value {
    option (buf.validate.oneof).required = true;
    StringParameterDraft string = 2;
    BooleanParameterDraft boolean = 3;
    IntegerParameterDraft integer = 4;
    FloatParameterDraft float = 5;
    DateTimeParameterDraft date_time = 6;
  }
}

message ParameterDraftMetadata {
  string variable = 1;
  string property = 2;
  string label = 3;
  bool required = 4;
  bool multiple_values = 5;
  bool read_only = 6;
}

message StringParameterDraft {
  optional string default = 1;
  repeated string allowed_values = 2;
  string pattern = 3;
}
message BooleanParameterDraft {
  optional bool default = 1;
}
message IntegerParameterDraft {
  optional int64 minimum = 1;
  optional int64 maximum = 2;
  optional int64 default = 3;
  repeated int64 allowed_values = 4;
}
message FloatParameterDraft {
  optional double minimum = 1;
  optional double maximum = 2;
  optional double default = 3;
  repeated double allowed_values = 4;
}
message DateTimeParameterDraft {
  google.protobuf.Timestamp minimum = 1;
  google.protobuf.Timestamp maximum = 2;
  google.protobuf.Timestamp default = 3;
  string pattern = 4;
}

service ResourceService {
  rpc CreateResource(CreateResourceRequest) returns (CreateResourceResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc GetResourceVersion(GetResourceVersionRequest) returns (GetResourceVersionResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_OPTIONAL;
  }
  rpc ReplaceResourceDraft(ReplaceResourceDraftRequest) returns (ReplaceResourceDraftResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc DiscardResourceDraft(DiscardResourceDraftRequest) returns (DiscardResourceDraftResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc SubmitResource(SubmitResourceRequest) returns (SubmitResourceResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc WithdrawResource(WithdrawResourceRequest) returns (WithdrawResourceResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc RejectResource(RejectResourceRequest) returns (RejectResourceResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc ReopenResource(ReopenResourceRequest) returns (ReopenResourceResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc PublishResource(PublishResourceRequest) returns (PublishResourceResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc UnpublishResource(UnpublishResourceRequest) returns (UnpublishResourceResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc DraftResourceFromPublication(DraftResourceFromPublicationRequest) returns (DraftResourceFromPublicationResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc DraftResourceFromLatestArchive(DraftResourceFromLatestArchiveRequest) returns (DraftResourceFromLatestArchiveResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc CopyPublishedResource(CopyPublishedResourceRequest) returns (CopyPublishedResourceResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
}
