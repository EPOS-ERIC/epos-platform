  repeated string output_formats = 5 [(buf.validate.field).repeated.min_items = 1];
  string default_output_format = 6 [(buf.validate.field).string.min_len = 1];
  optional int64 result_limit = 7 [(buf.validate.field).int64.gt = 0];
