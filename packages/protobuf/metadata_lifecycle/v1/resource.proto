syntax = "proto3";

package metadata_lifecycle.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "metadata_lifecycle/v1/annotations.proto";
import "metadata_lifecycle/v1/common.proto";

option go_package = "github.com/EPOS-ERIC/epos-platform/packages/protobuf/gen/go/metadata_lifecycle/v1;metadatalifecyclev1";

message CreateResourceRequest {
  string group_id = 1 [(buf.validate.field).string.uuid = true];
  oneof metadata {
    option (buf.validate.oneof).required = true;
    DatasetInput dataset = 2;
    SoftwareApplicationInput software_application = 3;
    SoftwareSourceCodeInput software_source_code = 4;
  }
}

message CreateResourceResponse {
  ResourceRecord resource = 1;
}

message GetResourceVersionRequest {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.uuid = true];
  string version_id = 3 [(buf.validate.field).string.uuid = true];
}

message GetResourceVersionResponse {
  ResourceVersion resource = 1;
}

message PrepareDistributionDownloadRequest {
  string distribution_id = 1 [(buf.validate.field).string.uuid = true];
}

message PrepareDistributionDownloadResponse {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  string version_id = 2 [(buf.validate.field).string.uuid = true];
  string url = 3 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.uri = true
  ];
}

message DistributionAccessParameterInput {
  string id = 1 [(buf.validate.field).string.uuid = true];
  oneof value {
    option (buf.validate.oneof).required = true;
    DistributionAccessScalarValue scalar = 2;
    DistributionAccessArrayValue array = 3;
  }
}

message DistributionAccessScalarValue {
  oneof value {
    option (buf.validate.oneof).required = true;
    string string_value = 1;
    bool boolean_value = 2;
    int64 integer_value = 3;
    double float_value = 4 [(buf.validate.field).double.finite = true];
  }
}

message DistributionAccessArrayValue {
  repeated DistributionAccessScalarValue values = 1 [(buf.validate.field).repeated.min_items = 1];
}

message PrepareDistributionAccessRequest {
  string distribution_id = 1 [(buf.validate.field).string.uuid = true];
  optional string output_format = 2 [(buf.validate.field).string.min_len = 1];
  oneof input {
    option (buf.validate.oneof).required = true;
    HTTPDistributionAccessInput http = 3;
    WFSDistributionAccessInput wfs = 4;
    DynamicDistributionAccessInput dynamic = 5;
  }
}

message HTTPDistributionAccessInput {
  repeated DistributionAccessParameterInput parameters = 1;
}

message WFSDistributionAccessInput {
  optional string feature_type = 1 [(buf.validate.field).string.min_len = 1];
  optional int64 result_limit = 2 [(buf.validate.field).int64.gt = 0];
  WFSBoundingBox bbox = 3;
  repeated DistributionAccessParameterInput parameters = 4;
}

message DynamicDistributionAccessInput {
  double longitude = 1 [(buf.validate.field).double.finite = true];
  double latitude = 2 [(buf.validate.field).double.finite = true];
  repeated DistributionAccessParameterInput parameters = 3;
}

message WFSBoundingBox {
  double west = 1 [(buf.validate.field).double.finite = true];
  double south = 2 [(buf.validate.field).double.finite = true];
  double east = 3 [(buf.validate.field).double.finite = true];
  double north = 4 [(buf.validate.field).double.finite = true];
}

message PrepareDistributionAccessResponse {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  string version_id = 2 [(buf.validate.field).string.uuid = true];
  WebServiceMethod method = 3 [(buf.validate.field).enum.defined_only = true];
  string url = 4 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.uri = true
  ];
  map<string, string> headers = 5;
  optional bytes body = 6;
}

message ListResourceVersionsRequest {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.uuid = true];
}

message ResourceVersionSummary {
  ResourceType resource_type = 1 [(buf.validate.field).enum.defined_only = true];
  string resource_id = 2 [(buf.validate.field).string.uuid = true];
  string version_id = 3 [(buf.validate.field).string.uuid = true];
  int32 revision = 4 [(buf.validate.field).int32.gte = 1];
  VersioningStatus status = 5 [(buf.validate.field).enum.defined_only = true];
  string name = 6 [(buf.validate.field).string.min_len = 1];
  string created_by = 7 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  optional string submitted_by = 10 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp submitted_at = 11;
  optional string published_by = 12 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp published_at = 13;
  optional string archived_by = 14 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp archived_at = 15;
  optional string rejected_by = 16 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp rejected_at = 17;
  optional string rejection_note = 18 [(buf.validate.field).string.min_len = 1];
}

message ListResourceVersionsResponse {
  repeated ResourceVersionSummary versions = 1;
}

message ResourceVersion {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  string version_id = 2 [(buf.validate.field).string.uuid = true];
  int32 revision = 3 [(buf.validate.field).int32.gte = 0];
  VersioningStatus status = 4 [(buf.validate.field).enum.defined_only = true];
  string created_by = 5 [(buf.validate.field).string.min_len = 1];
  string group_id = 6 [(buf.validate.field).string.uuid = true];
  string group_name = 7 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  oneof metadata {
    DatasetResourceMetadata dataset = 10;
    SoftwareApplicationResourceMetadata software_application = 11;
    SoftwareSourceCodeResourceMetadata software_source_code = 12;
  }
  optional string rejection_note = 13 [(buf.validate.field).string.min_len = 1];
  optional string rejected_by = 14 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp rejected_at = 15;
}

message DatasetResourceMetadata {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string title = 2 [(buf.validate.field).string.min_len = 1];
  string description = 3 [(buf.validate.field).string.min_len = 1];
  repeated string keywords = 4 [(buf.validate.field).repeated.items.string.pattern = "^[A-Za-z0-9 _:-]+$"];
  optional string accrual_periodicity = 5 [(buf.validate.field).string.min_len = 1];
  optional string quality_annotation = 6 [(buf.validate.field).string.min_len = 1];
  optional string access_right = 7 [(buf.validate.field).string.min_len = 1];
  repeated Distribution distributions = 8;
  optional string spatial_coverage = 9 [(buf.validate.field).string.min_len = 1];
  oneof temporal_range {
    Temporal temporal_coverage = 10;
    GeologicalTemporalCoverage geological_temporal_coverage = 17;
  }
  repeated Identifier persistent_identifiers = 11;
  repeated string contact_points = 12 [(buf.validate.field).repeated.items.string.uuid = true];
  repeated EntityReference providers = 13;
  repeated EntityReference categories = 14;
  google.protobuf.Timestamp created = 15;
  google.protobuf.Timestamp updated = 16;
}

message SoftwareApplicationResourceMetadata {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string description = 3 [(buf.validate.field).string.min_len = 1];
  optional string main_entity_of_page = 4 [(buf.validate.field).string.min_len = 1];
  optional string license = 5 [(buf.validate.field).string.min_len = 1];
  optional string version = 6 [(buf.validate.field).string.min_len = 1];
  repeated string keywords = 7 [(buf.validate.field).repeated.items.string.pattern = "^[A-Za-z0-9 _:-]+$"];
  optional string download_url = 8 [(buf.validate.field).string.uri = true];
  optional string requirements = 9 [(buf.validate.field).string.min_len = 1];
  optional string operating_system = 10 [(buf.validate.field).string.min_len = 1];
  repeated EntityReference creators = 11;
  repeated Identifier identifiers = 12;
  repeated EntityReference categories = 13;
  repeated string contact_points = 14 [(buf.validate.field).repeated.items.string.uuid = true];
}

message SoftwareSourceCodeResourceMetadata {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  string description = 3 [(buf.validate.field).string.min_len = 1];
  optional string programming_language = 4 [(buf.validate.field).string.min_len = 1];
  repeated string keywords = 5 [(buf.validate.field).repeated.items.string.pattern = "^[A-Za-z0-9 _:-]+$"];
  optional string repository = 6 [(buf.validate.field).string.min_len = 1];
  optional string license = 7 [(buf.validate.field).string.min_len = 1];
  optional string software_requirements = 8 [(buf.validate.field).string.min_len = 1];
  optional string runtime_platform = 9 [(buf.validate.field).string.min_len = 1];
  optional string main_entity_of_page = 10 [(buf.validate.field).string.min_len = 1];
  optional string version = 11 [(buf.validate.field).string.min_len = 1];
  repeated EntityReference creators = 12;
  repeated Identifier identifiers = 13;
  repeated EntityReference categories = 14;
  repeated string contact_points = 15 [(buf.validate.field).repeated.items.string.uuid = true];
}

message ResourceRecord {
  string resource_id = 1 [(buf.validate.field).string.uuid = true];
  string version_id = 2 [(buf.validate.field).string.uuid = true];
  int32 revision = 3 [(buf.validate.field).int32.gte = 0];
  VersioningStatus status = 4 [(buf.validate.field).enum.defined_only = true];
}

message Temporal {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
}

message GeologicalTemporalCoverage {
  optional double start_mya = 1;
  optional double end_mya = 2;
}

message DatasetInput {
  string title = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2 [(buf.validate.field).string.min_len = 1];
  repeated string keywords = 3 [(buf.validate.field).repeated.items.string.pattern = "^[A-Za-z0-9 _:-]+$"];
  optional string accrual_periodicity = 4 [(buf.validate.field).string.min_len = 1];
  optional string quality_annotation = 5 [(buf.validate.field).string.min_len = 1];
  optional string access_right = 6 [(buf.validate.field).string.min_len = 1];
  repeated DistributionInput distributions = 7;
  optional string spatial_coverage = 8 [(buf.validate.field).string.min_len = 1];
  oneof temporal_range {
    Temporal temporal_coverage = 9;
    GeologicalTemporalCoverage geological_temporal_coverage = 16;
  }
  repeated IdentifierInput persistent_identifiers = 10;
  repeated string contact_points = 11 [(buf.validate.field).repeated.items.string.uuid = true];
  repeated string providers = 12 [(buf.validate.field).repeated.items.string.uuid = true];
  repeated string categories = 13 [(buf.validate.field).repeated.items.string.uuid = true];
  google.protobuf.Timestamp created = 14;
  google.protobuf.Timestamp updated = 15;
}

message DistributionInput {
  string title = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2 [(buf.validate.field).string.min_len = 1];
  optional string license = 3 [(buf.validate.field).string.min_len = 1];
  // TODO: this can be either downloadable file or web service, use an enum like in the db
  string type = 4;
  google.protobuf.Timestamp issued = 5;
  google.protobuf.Timestamp modified = 6;
  optional int64 byte_size = 7 [(buf.validate.field).int64.gte = 1];
  oneof delivery {
    option (buf.validate.oneof).required = true;
    WebServiceInput web_service = 8;
    DownloadableFile downloadable_file = 9;
  }
}

message Distribution {
  string title = 1 [(buf.validate.field).string.min_len = 1];
  string description = 2 [(buf.validate.field).string.min_len = 1];
  optional string license = 3 [(buf.validate.field).string.min_len = 1];
  string type = 4 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp issued = 5;
  google.protobuf.Timestamp modified = 6;
  optional int64 byte_size = 7 [(buf.validate.field).int64.gte = 1];
  oneof delivery {
    WebService web_service = 8;
    DownloadableFile downloadable_file = 9;
  }
  string id = 10 [(buf.validate.field).string.uuid = true];
  repeated NativeFormat native_formats = 11;
}

message NativeFormat {
  string output_format = 1 [(buf.validate.field).string.min_len = 1];
  string label = 2 [(buf.validate.field).string.min_len = 1];
}

enum WebServiceMethod {
  WEB_SERVICE_METHOD_UNSPECIFIED = 0;
  WEB_SERVICE_METHOD_GET = 1;
  WEB_SERVICE_METHOD_POST = 2;
  WEB_SERVICE_METHOD_PUT = 3;
  WEB_SERVICE_METHOD_DELETE = 4;
}

enum WebServiceType {
  WEB_SERVICE_TYPE_UNSPECIFIED = 0;
  WEB_SERVICE_TYPE_WMS = 1;
  WEB_SERVICE_TYPE_WMTS = 2;
  WEB_SERVICE_TYPE_WFS = 3;
  WEB_SERVICE_TYPE_HTTP = 4;
  WEB_SERVICE_TYPE_DYNAMIC = 5;
}

enum WebServiceVisibleOn {
  WEB_SERVICE_VISIBLE_ON_UNSPECIFIED = 0;
  WEB_SERVICE_VISIBLE_ON_GRAPH = 1;
  WEB_SERVICE_VISIBLE_ON_TABLE = 2;
  WEB_SERVICE_VISIBLE_ON_MAP = 3;
}

enum WebServiceParameterLocation {
  WEB_SERVICE_PARAMETER_LOCATION_UNSPECIFIED = 0;
  WEB_SERVICE_PARAMETER_LOCATION_PATH = 1;
  WEB_SERVICE_PARAMETER_LOCATION_QUERY = 2;
  WEB_SERVICE_PARAMETER_LOCATION_HEADER = 3;
}

enum WebServiceParameterRole {
  WEB_SERVICE_PARAMETER_ROLE_UNSPECIFIED = 0;
  WEB_SERVICE_PARAMETER_ROLE_FORMAT = 1;
  WEB_SERVICE_PARAMETER_ROLE_START_DATE = 2;
  WEB_SERVICE_PARAMETER_ROLE_END_DATE = 3;
  WEB_SERVICE_PARAMETER_ROLE_MIN_LON = 4;
  WEB_SERVICE_PARAMETER_ROLE_MAX_LON = 5;
  WEB_SERVICE_PARAMETER_ROLE_MIN_LAT = 6;
  WEB_SERVICE_PARAMETER_ROLE_MAX_LAT = 7;
  WEB_SERVICE_PARAMETER_ROLE_LONGITUDE = 8;
  WEB_SERVICE_PARAMETER_ROLE_LATITUDE = 9;
}

message WebServiceInput {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  optional string description = 2 [(buf.validate.field).string.min_len = 1];
  optional string provider_id = 3 [(buf.validate.field).string.uuid = true];
  Documentation documentation = 4;
  optional string spatial_coverage = 5 [(buf.validate.field).string.min_len = 1];
  Temporal temporal_coverage = 6;
  repeated string contact_points = 7 [(buf.validate.field).repeated.items.string.uuid = true];
  WebServiceType type = 8 [(buf.validate.field).enum.defined_only = true];
  repeated WebServiceVisibleOn visible_on = 9 [(buf.validate.field).repeated.items.enum.defined_only = true];
  oneof configuration {
    option (buf.validate.oneof).required = true;
    GenericWebServiceConfigurationInput generic = 10;
    WMSWebServiceConfigurationInput wms = 11;
    WFSWebServiceConfigurationInput wfs = 12;
    WMTSWebServiceConfigurationInput wmts = 13;
    GenericWebServiceConfigurationInput dynamic = 14;
  }
}

message WebService {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  optional string description = 2 [(buf.validate.field).string.min_len = 1];
  Documentation documentation = 3;
  optional string spatial_coverage = 4 [(buf.validate.field).string.min_len = 1];
  Temporal temporal_coverage = 5;
  repeated string contact_points = 6 [(buf.validate.field).repeated.items.string.uuid = true];
  string id = 7 [(buf.validate.field).string.uuid = true];
  EntityReference provider_reference = 8;
  WebServiceType type = 9 [(buf.validate.field).enum.defined_only = true];
  repeated WebServiceVisibleOn visible_on = 10 [(buf.validate.field).repeated.items.enum.defined_only = true];
  oneof configuration {
    option (buf.validate.oneof).required = true;
    GenericWebServiceConfiguration generic = 11;
    WMSWebServiceConfiguration wms = 12;
    WFSWebServiceConfiguration wfs = 13;
    WMTSWebServiceConfiguration wmts = 14;
    GenericWebServiceConfiguration dynamic = 15;
  }
}

message GenericWebServiceConfigurationInput {
  string template_url = 1 [(buf.validate.field).string.min_len = 1];
  repeated ParameterInput parameters = 2;
  string format = 3 [(buf.validate.field).string.min_len = 1];
  WebServiceMethod method = 4 [(buf.validate.field).enum.defined_only = true];
  optional string body_content_type = 5 [(buf.validate.field).string.min_len = 1];
  optional string body_template = 6 [(buf.validate.field).string.min_len = 1];
  repeated ScalarParameterInput body_parameters = 7;
  optional bool body_required = 8;
}

message GenericWebServiceConfiguration {
  string template_url = 1 [(buf.validate.field).string.min_len = 1];
  repeated Parameter parameters = 2;
  string format = 3 [(buf.validate.field).string.min_len = 1];
  WebServiceMethod method = 4 [(buf.validate.field).enum.defined_only = true];
  optional string body_content_type = 5 [(buf.validate.field).string.min_len = 1];
  optional string body_template = 6 [(buf.validate.field).string.min_len = 1];
