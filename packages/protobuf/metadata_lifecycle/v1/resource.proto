  double latitude = 2 [(buf.validate.field).double.finite = true];
  repeated DistributionAccessParameterInput parameters = 3;
}

message WFSBoundingBox {
  double west = 1 [(buf.validate.field).double.finite = true];
  double south = 2 [(buf.validate.field).double.finite = true];
  double east = 3 [(buf.validate.field).double.finite = true];
  double north = 4 [(buf.validate.field).double.finite = true];
