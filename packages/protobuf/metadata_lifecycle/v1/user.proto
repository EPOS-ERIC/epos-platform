syntax = "proto3";

package metadata_lifecycle.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "metadata_lifecycle/v1/annotations.proto";
import "metadata_lifecycle/v1/common.proto";

option go_package = "github.com/EPOS-ERIC/epos-platform/packages/protobuf/gen/go/metadata_lifecycle/v1;metadatalifecyclev1";

message ListUsersRequest {}
message UserListItem {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string email = 2 [(buf.validate.field).string.email = true];
  string given_name = 3 [(buf.validate.field).string.min_len = 1];
  string family_name = 4 [(buf.validate.field).string.min_len = 1];
  UserStatus status = 5 [(buf.validate.field).enum.defined_only = true];
  repeated GlobalRole global_roles = 6 [(buf.validate.field).repeated.items.enum.defined_only = true];
  repeated string global_permissions = 7 [(buf.validate.field).repeated.items.string.min_len = 1];
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}
message ListUsersResponse {
  repeated UserListItem users = 1;
}

message GetUserRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}
enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
  USER_STATUS_BLOCKED = 2;
}
enum GlobalRole {
  GLOBAL_ROLE_UNSPECIFIED = 0;
  GLOBAL_ROLE_ADMIN = 1;
}
message GetUserResponse {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string email = 2 [(buf.validate.field).string.email = true];
  string given_name = 3 [(buf.validate.field).string.min_len = 1];
  string family_name = 4 [(buf.validate.field).string.min_len = 1];
  UserStatus status = 5 [(buf.validate.field).enum.defined_only = true];
  repeated GlobalRole global_roles = 6 [(buf.validate.field).repeated.items.enum.defined_only = true];
  repeated string global_permissions = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  repeated UserMembership memberships = 10;
}

message GrantGlobalPermissionRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  string permission = 2 [(buf.validate.field).string.min_len = 1];
}
message GrantGlobalPermissionResponse {}

message RevokeGlobalPermissionRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  string permission = 2 [(buf.validate.field).string.min_len = 1];
}
message RevokeGlobalPermissionResponse {}

message AssignGlobalRoleRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  GlobalRole role = 2 [(buf.validate.field).enum.defined_only = true];
}
message AssignGlobalRoleResponse {}

message RemoveGlobalRoleRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  GlobalRole role = 2 [(buf.validate.field).enum.defined_only = true];
}
message RemoveGlobalRoleResponse {}

message BlockUserRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
  string reason = 2 [(buf.validate.field).string.min_len = 1];
}
message BlockUserResponse {}

message UnblockUserRequest {
  string user_id = 1 [(buf.validate.field).string.min_len = 1];
}
message UnblockUserResponse {}

message UserMembership {
  EntityReference group = 1;
  repeated GroupRole group_roles = 2 [(buf.validate.field).repeated.items.enum.defined_only = true];
  MembershipStatus status = 3 [(buf.validate.field).enum.defined_only = true];
  repeated string group_permissions = 4 [(buf.validate.field).repeated.items.string.min_len = 1];
  repeated RoleRequest role_requests = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}
message RoleRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  GroupRole group_role = 2 [(buf.validate.field).enum.defined_only = true];
  RoleRequestStatus status = 3 [(buf.validate.field).enum.defined_only = true];
  google.protobuf.Timestamp requested_at = 4;
}
service UserService {
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc GrantGlobalPermission(GrantGlobalPermissionRequest) returns (GrantGlobalPermissionResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc RevokeGlobalPermission(RevokeGlobalPermissionRequest) returns (RevokeGlobalPermissionResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc AssignGlobalRole(AssignGlobalRoleRequest) returns (AssignGlobalRoleResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc RemoveGlobalRole(RemoveGlobalRoleRequest) returns (RemoveGlobalRoleResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
}
