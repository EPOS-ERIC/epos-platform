syntax = "proto3";

package metadata_lifecycle.v1;

import "buf/validate/validate.proto";
import "metadata_lifecycle/v1/annotations.proto";
import "metadata_lifecycle/v1/organization.proto";

option go_package = "github.com/EPOS-ERIC/epos-platform/packages/protobuf/gen/go/metadata_lifecycle/v1;metadatalifecyclev1";

message SyncOrganization {
  int64 nid = 1 [(buf.validate.field).int64.gt = 0];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  optional string street = 3 [(buf.validate.field).string.min_len = 1];
  optional string locality = 4 [(buf.validate.field).string.min_len = 1];
  optional string postal_code = 5 [(buf.validate.field).string.min_len = 1];
  optional string country = 6 [(buf.validate.field).string.min_len = 1];
  optional string logo_url = 7 [(buf.validate.field).string.uri = true];
  optional string page_url = 8 [(buf.validate.field).string.uri = true];
  optional string email = 9 [(buf.validate.field).string.email = true];
  repeated int64 parent_nids = 10 [(buf.validate.field).repeated = {unique: true}];
  repeated IdentifierInput identifiers = 11;
}

message SyncContactPoint {
  int64 nid = 1 [(buf.validate.field).int64.gt = 0];
  string email = 2 [(buf.validate.field).string.email = true];
}

message OrganizationSnapshot {
  repeated SyncOrganization items = 1;
}

message ContactPointSnapshot {
  repeated SyncContactPoint items = 1;
}

message SyncMetadataRequest {
  OrganizationSnapshot organizations = 1 [(buf.validate.field).required = true];
  ContactPointSnapshot contact_points = 2 [(buf.validate.field).required = true];
}

message SyncMetadataResponse {}

service MetadataSyncService {
  rpc SyncMetadata(SyncMetadataRequest) returns (SyncMetadataResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_NOT_NEEDED;
  }
}
