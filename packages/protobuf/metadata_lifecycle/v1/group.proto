syntax = "proto3";

package metadata_lifecycle.v1;

import "buf/validate/validate.proto";
import "metadata_lifecycle/v1/annotations.proto";

option go_package = "github.com/EPOS-ERIC/epos-platform/packages/protobuf/gen/go/metadata_lifecycle/v1;metadatalifecyclev1";

message ListGroupsRequest {}

message GetGroupRequest {
  string group_id = 1 [(buf.validate.field).string.min_len = 1];
}

message Group {
  string id = 1;
  string name = 2;
  optional string description = 3;
  optional string label = 4;
  optional string logo = 5;
  optional string page = 6;
  optional string color = 7;
  int32 position = 8;
  TopLevelConcept concept = 9;
}

enum TopLevelConcept {
  TOP_LEVEL_CONCEPT_UNSPECIFIED = 0;
  TOP_LEVEL_CONCEPT_DATA = 1;
  TOP_LEVEL_CONCEPT_FACILITIES = 2;
  TOP_LEVEL_CONCEPT_SOFTWARE = 3;
}

message ListGroupsResponse {
  repeated Group groups = 1;
}

message GetGroupResponse {
  Group group = 1;
}

message CreateGroupRequest {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  optional string description = 2;
  optional string label = 3;
  optional string logo = 4;
  optional string page = 5;
  optional string color = 6;
  int32 position = 7;
  string concept = 8 [(buf.validate.field).string.min_len = 1];
}

message CreateGroupResponse {
  Group group = 1;
}

message ReplaceGroupRequest {
  string group_id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2 [(buf.validate.field).string.min_len = 1];
  optional string description = 3;
  optional string label = 4;
  optional string logo = 5;
  optional string page = 6;
  optional string color = 7;
  int32 position = 8;
  string concept = 9 [(buf.validate.field).string.min_len = 1];
}

message ReplaceGroupResponse {
  Group group = 1;
}

message DeleteGroupRequest {
  string group_id = 1 [(buf.validate.field).string.min_len = 1];
}

message DeleteGroupResponse {}

service GroupService {
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_NOT_NEEDED;
  }
  rpc GetGroup(GetGroupRequest) returns (GetGroupResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_NOT_NEEDED;
  }
  rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc ReplaceGroup(ReplaceGroupRequest) returns (ReplaceGroupResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
  rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
}
