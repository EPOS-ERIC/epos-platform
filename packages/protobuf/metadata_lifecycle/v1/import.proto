syntax = "proto3";

package metadata_lifecycle.v1;

import "buf/validate/validate.proto";
import "metadata_lifecycle/v1/annotations.proto";

option go_package = "github.com/EPOS-ERIC/epos-platform/packages/protobuf/gen/go/metadata_lifecycle/v1;metadatalifecyclev1";

message ImportTurtleRequest {
  bytes turtle = 1 [
    (buf.validate.field).bytes.min_len = 1,
    (buf.validate.field).bytes.max_len = 10485760
  ];
}

message ImportTurtleResponse {
  ImportResult result = 1;
}

message ImportResult {
  int32 groups = 1;
  int32 categories = 2;
  int32 organizations = 3;
  int32 contact_points = 4;
  int32 datasets = 5;
  int32 software_applications = 6;
  int32 software_source_codes = 7;
  repeated ImportDiagnostic warnings = 8;
}

message ImportDiagnostic {
  ImportSeverity severity = 1;
  string subject = 2;
  string predicate = 3;
  string message = 4;
}

enum ImportSeverity {
  IMPORT_SEVERITY_UNSPECIFIED = 0;
  IMPORT_SEVERITY_WARNING = 1;
  IMPORT_SEVERITY_ERROR = 2;
}

service ImportService {
  rpc ImportTurtle(ImportTurtleRequest) returns (ImportTurtleResponse) {
    option (metadata_lifecycle.v1.actor_requirement) = ACTOR_REQUIREMENT_REQUIRED;
  }
}
