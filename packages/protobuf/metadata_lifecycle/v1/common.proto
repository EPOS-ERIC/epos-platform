syntax = "proto3";

package metadata_lifecycle.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/EPOS-ERIC/epos-platform/packages/protobuf/gen/go/metadata_lifecycle/v1;metadatalifecyclev1";

enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_DATASET = 1;
  RESOURCE_TYPE_SOFTWARE_APPLICATION = 2;
  RESOURCE_TYPE_SOFTWARE_SOURCE_CODE = 3;
}

enum VersioningStatus {
  VERSIONING_STATUS_UNSPECIFIED = 0;
  VERSIONING_STATUS_PUBLISHED = 1;
  VERSIONING_STATUS_DRAFT = 2;
  VERSIONING_STATUS_SUBMITTED = 3;
  VERSIONING_STATUS_ARCHIVED = 4;
  VERSIONING_STATUS_REJECTED = 5;
}

enum TopLevelConcept {
  TOP_LEVEL_CONCEPT_UNSPECIFIED = 0;
  TOP_LEVEL_CONCEPT_DATA = 1;
  TOP_LEVEL_CONCEPT_FACILITIES = 2;
  TOP_LEVEL_CONCEPT_SOFTWARE = 3;
}

enum MembershipStatus {
  MEMBERSHIP_STATUS_UNSPECIFIED = 0;
  MEMBERSHIP_STATUS_PENDING = 1;
  MEMBERSHIP_STATUS_ACTIVE = 2;
  MEMBERSHIP_STATUS_REJECTED = 3;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ACCEPT = 1;
  DECISION_REJECT = 2;
}

enum GroupRole {
  GROUP_ROLE_UNSPECIFIED = 0;
  GROUP_ROLE_EDITOR = 1;
  GROUP_ROLE_REVIEWER = 2;
  GROUP_ROLE_ADMIN = 3;
}

enum GlobalPermission {
  GLOBAL_PERMISSION_UNSPECIFIED = 0;
  GLOBAL_PERMISSION_MEMBERSHIP_MANAGE = 1;
  GLOBAL_PERMISSION_ROLE_MANAGE = 2;
  GLOBAL_PERMISSION_PERMISSION_MANAGE = 3;
  GLOBAL_PERMISSION_ORGANIZATION_MANAGE = 4;
  GLOBAL_PERMISSION_CONTACT_POINT_MANAGE = 5;
  GLOBAL_PERMISSION_CATEGORY_SCHEME_MANAGE = 6;
  GLOBAL_PERMISSION_RESOURCE_CREATE = 7;
  GLOBAL_PERMISSION_RESOURCE_EDIT = 8;
  GLOBAL_PERMISSION_RESOURCE_SUBMIT = 9;
  GLOBAL_PERMISSION_RESOURCE_WITHDRAW = 10;
  GLOBAL_PERMISSION_RESOURCE_REOPEN = 11;
  GLOBAL_PERMISSION_RESOURCE_DISCARD = 12;
  GLOBAL_PERMISSION_RESOURCE_REJECT = 13;
  GLOBAL_PERMISSION_RESOURCE_PUBLISH = 14;
  GLOBAL_PERMISSION_RESOURCE_UNPUBLISH = 15;
  GLOBAL_PERMISSION_CATEGORY_MANAGE = 16;
  GLOBAL_PERMISSION_NOTIFICATION_MANAGE = 17;
  GLOBAL_PERMISSION_CONFIGURATION_MANAGE = 18;
  GLOBAL_PERMISSION_CONVERTER_MANAGE = 19;
}

enum GroupPermission {
  GROUP_PERMISSION_UNSPECIFIED = 0;
  GROUP_PERMISSION_RESOURCE_CREATE = 1;
  GROUP_PERMISSION_RESOURCE_EDIT = 2;
  GROUP_PERMISSION_RESOURCE_SUBMIT = 3;
  GROUP_PERMISSION_RESOURCE_WITHDRAW = 4;
  GROUP_PERMISSION_RESOURCE_REOPEN = 5;
  GROUP_PERMISSION_RESOURCE_DISCARD = 6;
  GROUP_PERMISSION_RESOURCE_REJECT = 7;
  GROUP_PERMISSION_RESOURCE_PUBLISH = 8;
  GROUP_PERMISSION_RESOURCE_UNPUBLISH = 9;
  GROUP_PERMISSION_MEMBERSHIP_MANAGE = 10;
  GROUP_PERMISSION_ROLE_MANAGE = 11;
  GROUP_PERMISSION_PERMISSION_MANAGE = 12;
  GROUP_PERMISSION_CATEGORY_MANAGE = 13;
  GROUP_PERMISSION_NOTIFICATION_MANAGE = 14;
}

enum NotificationScope {
  NOTIFICATION_SCOPE_UNSPECIFIED = 0;
  NOTIFICATION_SCOPE_DIRECT = 1;
  NOTIFICATION_SCOPE_GROUP = 2;
  NOTIFICATION_SCOPE_GLOBAL = 3;
}

enum NotificationChannel {
  NOTIFICATION_CHANNEL_UNSPECIFIED = 0;
  NOTIFICATION_CHANNEL_EMAIL = 1;
}

enum NotificationEventKind {
  NOTIFICATION_EVENT_KIND_UNSPECIFIED = 0;
  NOTIFICATION_EVENT_KIND_MEMBERSHIP_REQUESTED = 1;
  NOTIFICATION_EVENT_KIND_MEMBERSHIP_ACCEPTED = 2;
  NOTIFICATION_EVENT_KIND_MEMBERSHIP_REJECTED = 3;
  NOTIFICATION_EVENT_KIND_ROLE_REQUEST_REQUESTED = 4;
  NOTIFICATION_EVENT_KIND_ROLE_REQUEST_ACCEPTED = 5;
  NOTIFICATION_EVENT_KIND_ROLE_REQUEST_REJECTED = 6;
  NOTIFICATION_EVENT_KIND_ROLE_ASSIGNED = 7;
  NOTIFICATION_EVENT_KIND_PERMISSION_ASSIGNED = 8;
  NOTIFICATION_EVENT_KIND_RESOURCE_SUBMITTED = 9;
  NOTIFICATION_EVENT_KIND_RESOURCE_PUBLISHED = 10;
  NOTIFICATION_EVENT_KIND_RESOURCE_REJECTED = 11;
  NOTIFICATION_EVENT_KIND_RESOURCE_UNPUBLISHED = 12;
}

message Notification {
  NotificationEventKind event_kind = 1 [(buf.validate.field).enum.defined_only = true];
  optional string group_id = 2 [(buf.validate.field).string.uuid = true];
  ResourceType resource_type = 3 [(buf.validate.field).enum.defined_only = true];
  optional string resource_id = 4 [(buf.validate.field).string.uuid = true];
  optional string version_id = 5 [(buf.validate.field).string.uuid = true];
  optional string access_id = 6 [(buf.validate.field).string.uuid = true];
  string target_user_id = 7 [(buf.validate.field).string.min_len = 1];
  string target_email = 8 [(buf.validate.field).string.email = true];
  string subject = 9 [(buf.validate.field).string.min_len = 1];
  string body = 10 [(buf.validate.field).string.min_len = 1];
  NotificationChannel channel = 11 [(buf.validate.field).enum.defined_only = true];
}

enum RoleRequestStatus {
  ROLE_REQUEST_STATUS_UNSPECIFIED = 0;
  ROLE_REQUEST_STATUS_PENDING = 1;
  ROLE_REQUEST_STATUS_ACCEPTED = 2;
  ROLE_REQUEST_STATUS_REJECTED = 3;
}

message Identifier {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string type = 2 [(buf.validate.field).string.min_len = 1];
  string value = 3 [(buf.validate.field).string.min_len = 1];
}

message IdentifierInput {
  string type = 1 [(buf.validate.field).string.min_len = 1];
  string value = 2 [(buf.validate.field).string.min_len = 1];
}

message EntityReference {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2;
}

message UserReference {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2;
}
