syntax = "proto3";

package metadata_lifecycle.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/EPOS-ERIC/epos-platform/packages/protobuf/gen/go/metadata_lifecycle/v1;metadatalifecyclev1";

enum ResourceType {
  RESOURCE_TYPE_UNSPECIFIED = 0;
  RESOURCE_TYPE_DATASET = 1;
  RESOURCE_TYPE_SOFTWARE_APPLICATION = 2;
  RESOURCE_TYPE_SOFTWARE_SOURCE_CODE = 3;
}

enum VersioningStatus {
  VERSIONING_STATUS_UNSPECIFIED = 0;
  VERSIONING_STATUS_PUBLISHED = 1;
  VERSIONING_STATUS_DRAFT = 2;
  VERSIONING_STATUS_SUBMITTED = 3;
  VERSIONING_STATUS_ARCHIVED = 4;
  VERSIONING_STATUS_REJECTED = 5;
}

enum TopLevelConcept {
  TOP_LEVEL_CONCEPT_UNSPECIFIED = 0;
  TOP_LEVEL_CONCEPT_DATA = 1;
  TOP_LEVEL_CONCEPT_FACILITIES = 2;
  TOP_LEVEL_CONCEPT_SOFTWARE = 3;
}

enum MembershipStatus {
  MEMBERSHIP_STATUS_UNSPECIFIED = 0;
  MEMBERSHIP_STATUS_PENDING = 1;
  MEMBERSHIP_STATUS_ACTIVE = 2;
  MEMBERSHIP_STATUS_REJECTED = 3;
}

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_ACCEPT = 1;
  DECISION_REJECT = 2;
}

enum GroupRole {
  GROUP_ROLE_UNSPECIFIED = 0;
  GROUP_ROLE_EDITOR = 1;
  GROUP_ROLE_REVIEWER = 2;
  GROUP_ROLE_ADMIN = 3;
}

enum GlobalPermission {
  GLOBAL_PERMISSION_UNSPECIFIED = 0;
  GLOBAL_PERMISSION_MEMBERSHIP_MANAGE = 1;
  GLOBAL_PERMISSION_ROLE_MANAGE = 2;
  GLOBAL_PERMISSION_PERMISSION_MANAGE = 3;
  GLOBAL_PERMISSION_ORGANIZATION_MANAGE = 4;
  GLOBAL_PERMISSION_CONTACT_POINT_MANAGE = 5;
  GLOBAL_PERMISSION_CATEGORY_SCHEME_MANAGE = 6;
}

enum GroupPermission {
  GROUP_PERMISSION_UNSPECIFIED = 0;
  GROUP_PERMISSION_RESOURCE_CREATE = 1;
  GROUP_PERMISSION_RESOURCE_EDIT = 2;
  GROUP_PERMISSION_RESOURCE_SUBMIT = 3;
  GROUP_PERMISSION_RESOURCE_WITHDRAW = 4;
  GROUP_PERMISSION_RESOURCE_REOPEN = 5;
  GROUP_PERMISSION_RESOURCE_DISCARD = 6;
  GROUP_PERMISSION_RESOURCE_REJECT = 7;
  GROUP_PERMISSION_RESOURCE_PUBLISH = 8;
  GROUP_PERMISSION_RESOURCE_UNPUBLISH = 9;
  GROUP_PERMISSION_MEMBERSHIP_MANAGE = 10;
  GROUP_PERMISSION_ROLE_MANAGE = 11;
  GROUP_PERMISSION_PERMISSION_MANAGE = 12;
  GROUP_PERMISSION_CATEGORY_MANAGE = 13;
}

enum RoleRequestStatus {
  ROLE_REQUEST_STATUS_UNSPECIFIED = 0;
  ROLE_REQUEST_STATUS_PENDING = 1;
  ROLE_REQUEST_STATUS_ACCEPTED = 2;
  ROLE_REQUEST_STATUS_REJECTED = 3;
}

message Identifier {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string type = 2 [(buf.validate.field).string.min_len = 1];
  string value = 3 [(buf.validate.field).string.min_len = 1];
}

message IdentifierInput {
  string type = 1 [(buf.validate.field).string.min_len = 1];
  string value = 2 [(buf.validate.field).string.min_len = 1];
}

message EntityReference {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2;
}

message UserReference {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2;
}
