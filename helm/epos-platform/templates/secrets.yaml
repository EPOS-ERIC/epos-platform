apiVersion: v1
kind: Secret
metadata:
  name: {{ include "epos-platform.fullname" . }}-secrets
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  user-group-db-password: {{ .Values.postgresql.userGroup.password | quote }}
  data-retriever-db-password: {{ .Values.postgresql.dataRetriever.password | quote }}
  neo4j-password: {{ .Values.neo4j.password | quote }}
  neo4j-auth: {{ printf "%s/%s" .Values.neo4j.username .Values.neo4j.password | quote }}
