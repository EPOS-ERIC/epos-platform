  {{- else }}
      volumes:
        - name: data
          emptyDir: {}
  {{- end }}
---
{{- end }}
{{- if .Values.neo4j.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "epos-platform.fullname" . }}-neo4j
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
spec:
  ports:
    - name: http
      port: 7474
      targetPort: http
    - name: bolt
      port: 7687
      targetPort: bolt
  selector:
    {{- include "epos-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "epos-platform.fullname" . }}-neo4j
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: neo4j
spec:
  serviceName: {{ include "epos-platform.fullname" . }}-neo4j
  replicas: 1
  selector:
    matchLabels:
      {{- include "epos-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: neo4j
  template:
    metadata:
      labels:
        {{- include "epos-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: neo4j
    spec:
      containers:
        - name: neo4j
          image: {{ .Values.neo4j.image | quote }}
          ports:
            - name: http
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: {{ include "epos-platform.fullname" . }}-secrets
                  key: neo4j-auth
            - name: NEO4J_dbms_usage__report_enabled
              value: "false"
          readinessProbe:
            httpGet:
              path: /
              port: http
          volumeMounts:
            - name: data
              mountPath: /data
  {{- if .Values.neo4j.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.neo4j.persistence.size }}
  {{- else }}
      volumes:
        - name: data
          emptyDir: {}
  {{- end }}
{{- end }}
