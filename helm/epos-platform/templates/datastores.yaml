{{- if .Values.postgresql.userGroup.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "epos-platform.fullname" . }}-user-group-db
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: user-group-db
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "epos-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: user-group-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "epos-platform.fullname" . }}-user-group-db
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: user-group-db
spec:
  serviceName: {{ include "epos-platform.fullname" . }}-user-group-db
  replicas: 1
  selector:
    matchLabels:
      {{- include "epos-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: user-group-db
  template:
    metadata:
      labels:
        {{- include "epos-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: user-group-db
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgresql.userGroup.image | quote }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.userGroup.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.userGroup.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "epos-platform.fullname" . }}-secrets
                  key: user-group-db-password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgresql.userGroup.username | quote }}, "-d", {{ .Values.postgresql.userGroup.database | quote }}]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  {{- if .Values.postgresql.userGroup.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgresql.userGroup.persistence.size }}
  {{- else }}
      volumes:
        - name: data
          emptyDir: {}
  {{- end }}
---
{{- end }}
