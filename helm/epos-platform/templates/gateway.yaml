{{- if .Values.gateway.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "epos-platform.fullname" . }}-gateway
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  ports:
    - name: http
      port: {{ .Values.gateway.service.port }}
      targetPort: http
  selector:
    {{- include "epos-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "epos-platform.fullname" . }}-gateway
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicaCount }}
  selector:
    matchLabels:
      {{- include "epos-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        {{- include "epos-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
    spec:
      serviceAccountName: {{ include "epos-platform.serviceAccountName" . }}
      containers:
        - name: gateway
          image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          args:
            - -config
            - /etc/gateway/config.yaml
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            - name: LOG_LEVEL
              value: {{ .Values.gateway.logLevel | quote }}
            - name: LOG_LEVEL_GATEWAY_HTTP_CLIENT
              value: {{ .Values.gateway.httpClientLogLevel | quote }}
            {{- if .Values.global.otel.enabled }}
            - name: OTEL_SERVICE_NAME
              value: gateway
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.global.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.global.otel.protocol | quote }}
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ .Values.global.otel.metricExportInterval | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /openapi.yaml
              port: http
          livenessProbe:
            httpGet:
              path: /openapi.yaml
              port: http
          volumeMounts:
            - name: gateway-config
              mountPath: /etc/gateway/config.yaml
              subPath: config.yaml
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
      volumes:
        - name: gateway-config
          configMap:
            name: {{ include "epos-platform.fullname" . }}-gateway-config
{{- end }}
