{{- if .Values.platform.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "epos-platform.fullname" . }}-platform
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
spec:
  type: {{ .Values.platform.service.type }}
  ports:
    - name: http
      port: {{ .Values.platform.service.port }}
      targetPort: http
  selector:
    {{- include "epos-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: platform
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "epos-platform.fullname" . }}-platform
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
spec:
  replicas: {{ .Values.platform.replicaCount }}
  selector:
    matchLabels:
      {{- include "epos-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: platform
  template:
    metadata:
      labels:
        {{- include "epos-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: platform
    spec:
      serviceAccountName: {{ include "epos-platform.serviceAccountName" . }}
      containers:
        - name: platform
          image: "{{ .Values.platform.image.repository }}:{{ .Values.platform.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.platform.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.platform.resources | nindent 12 }}
{{- if .Values.platform.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "epos-platform.fullname" . }}-platform
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: platform
  {{- with .Values.platform.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.platform.ingress.className }}
  ingressClassName: {{ .Values.platform.ingress.className }}
  {{- end }}
  {{- if .Values.platform.ingress.tls }}
  tls:
    {{- toYaml .Values.platform.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.platform.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .gatewayPaths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "epos-platform.fullname" $ }}-gateway
                port:
                  name: http
          {{- end }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "epos-platform.fullname" $ }}-platform
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}
