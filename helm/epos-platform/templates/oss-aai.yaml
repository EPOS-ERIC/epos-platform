{{- if .Values.ossAai.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "epos-platform.fullname" . }}-oss-aai
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: oss-aai
spec:
  type: {{ .Values.ossAai.service.type }}
  ports:
    - name: http
      port: {{ .Values.ossAai.service.port }}
      targetPort: http
  selector:
    {{- include "epos-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: oss-aai
---
{{- if .Values.ossAai.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "epos-platform.fullname" . }}-oss-aai-data
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: oss-aai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.ossAai.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "epos-platform.fullname" . }}-oss-aai
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: oss-aai
spec:
  replicas: {{ .Values.ossAai.replicaCount }}
  selector:
    matchLabels:
      {{- include "epos-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: oss-aai
  template:
    metadata:
      labels:
        {{- include "epos-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: oss-aai
    spec:
      serviceAccountName: {{ include "epos-platform.serviceAccountName" . }}
      containers:
        - name: oss-aai
          image: "{{ .Values.ossAai.image.repository }}:{{ .Values.ossAai.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ossAai.port }}
          env:
            - name: OSS_AAI_LISTEN_ADDR
              value: ":{{ .Values.ossAai.port }}"
            - name: APP_CORS_ALLOW_ORIGIN
              value: {{ .Values.ossAai.corsAllowOrigin | quote }}
            {{- if .Values.ossAai.oidcIssuer }}
            - name: OIDC_ISSUER
              value: {{ .Values.ossAai.oidcIssuer | quote }}
            {{- end }}
            - name: INITIAL_ADMIN_NAME
              value: {{ .Values.ossAai.initialAdmin.name | quote }}
            - name: INITIAL_ADMIN_SURNAME
              value: {{ .Values.ossAai.initialAdmin.surname | quote }}
            - name: INITIAL_ADMIN_EMAIL
              value: {{ .Values.ossAai.initialAdmin.email | quote }}
            - name: INITIAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "epos-platform.fullname" . }}-secrets
                  key: oss-aai-initial-admin-password
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            {{- toYaml .Values.ossAai.resources | nindent 12 }}
      volumes:
        - name: data
          {{- if .Values.ossAai.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "epos-platform.fullname" . }}-oss-aai-data
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
