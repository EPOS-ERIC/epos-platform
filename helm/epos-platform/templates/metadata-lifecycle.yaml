{{- if .Values.metadataLifecycle.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "epos-platform.fullname" . }}-metadata-lifecycle
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: metadata-lifecycle
spec:
  type: {{ .Values.metadataLifecycle.service.type }}
  ports:
    - name: http
      port: {{ .Values.metadataLifecycle.service.port }}
      targetPort: http
  selector:
    {{- include "epos-platform.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: metadata-lifecycle
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "epos-platform.fullname" . }}-metadata-lifecycle
  labels:
    {{- include "epos-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: metadata-lifecycle
spec:
  replicas: {{ .Values.metadataLifecycle.replicaCount }}
  selector:
    matchLabels:
      {{- include "epos-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: metadata-lifecycle
  template:
    metadata:
      labels:
        {{- include "epos-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: metadata-lifecycle
    spec:
      serviceAccountName: {{ include "epos-platform.serviceAccountName" . }}
      containers:
        - name: metadata-lifecycle
          image: "{{ .Values.metadataLifecycle.image.repository }}:{{ .Values.metadataLifecycle.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.metadataLifecycle.port }}
          env:
            - name: EPOS_NEO4J_URI
              value: {{ default (printf "bolt://%s-neo4j:7687" (include "epos-platform.fullname" .)) .Values.neo4j.uri | quote }}
            - name: EPOS_NEO4J_USERNAME
              value: {{ .Values.neo4j.username | quote }}
            - name: EPOS_NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "epos-platform.fullname" . }}-secrets
                  key: neo4j-password
            - name: EPOS_NEO4J_DATABASE
              value: {{ .Values.neo4j.database | quote }}
            {{- if .Values.metadataLifecycle.shaclFile }}
            - name: EPOS_SHACL_FILE
              value: {{ .Values.metadataLifecycle.shaclFile | quote }}
            {{- end }}
            {{- if .Values.metadataLifecycle.shaclUrl }}
            - name: EPOS_SHACL_URL
              value: {{ .Values.metadataLifecycle.shaclUrl | quote }}
            {{- end }}
            - name: EPOS_GRAPH_BOOTSTRAP_MODE
              value: {{ .Values.metadataLifecycle.graphBootstrapMode | quote }}
            - name: EPOS_SERVER_HOST
              value: 0.0.0.0
            - name: EPOS_SERVER_PORT
              value: {{ .Values.metadataLifecycle.port | quote }}
            {{- if .Values.metadataLifecycle.javaToolOptions }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.metadataLifecycle.javaToolOptions | quote }}
            {{- end }}
            {{- if .Values.global.otel.enabled }}
            - name: OTEL_SERVICE_NAME
              value: metadata-lifecycle
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.global.otel.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.global.otel.protocol | quote }}
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: {{ .Values.global.otel.metricExportInterval | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.metadataLifecycle.resources | nindent 12 }}
{{- end }}
