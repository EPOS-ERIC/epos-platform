global:
  imagePullPolicy: IfNotPresent
  otel:
    enabled: false
    endpoint: http://otel-lgtm:4318
    protocol: http/protobuf
    metricExportInterval: "5000"

serviceAccount:
  create: true
  name: ""

platform:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/epos-eric/epos-platform/platform
    tag: latest
  port: 80
  service:
    type: ClusterIP
    port: 80
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: platform.local
        gatewayPaths:
          - path: /v1
            pathType: Prefix
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources: {}

gateway:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/epos-eric/epos-platform/gateway
    tag: latest
  port: 5000
  service:
    type: ClusterIP
    port: 5000
  logLevel: INFO
  httpClientLogLevel: INFO
  corsAllowOrigin: "*"
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: gateway.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources: {}

metadataLifecycle:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/epos-eric/epos-platform/metadata-lifecycle
    tag: latest
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  graphBootstrapMode: skip-cypher
  shaclFile: ""
  shaclUrl: ""
  javaToolOptions: ""
  resources: {}

userGroup:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/epos-eric/epos-platform/user-group
    tag: latest
  port: 8090
  service:
    type: ClusterIP
    port: 8090
  resources: {}

dataRetriever:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/epos-eric/epos-platform/data-retriever
    tag: latest
  port: 8100
  httpTimeout: 30s
  service:
    type: ClusterIP
    port: 8100
  resources: {}

ossAai:
  enabled: true
  replicaCount: 1
  image:
    repository: ghcr.io/epos-eric/epos-platform/oss-aai-service
    tag: latest
  port: 8080
  service:
    type: ClusterIP
    port: 8080
  corsAllowOrigin: "*"
  oidcIssuer: ""
  initialAdmin:
    name: Admin
    surname: Admin
    email: admin@admin.org
    password: adminadmin
  persistence:
    enabled: true
    size: 1Gi
  resources: {}

postgresql:
  userGroup:
    enabled: true
    image: postgres:16-alpine
    host: ""
    port: 5432
    database: user_group
    username: user_group
    password: user_group
    persistence:
      enabled: true
      size: 1Gi
  dataRetriever:
    enabled: true
    image: postgres:16-alpine
    host: ""
    port: 5432
    database: data_retriever
    username: data_retriever
    password: data_retriever
    persistence:
      enabled: true
      size: 1Gi

neo4j:
  enabled: true
  image: neo4j:2026.04.0-community
  uri: ""
  username: neo4j
  password: neo4jpassword
  database: neo4j
  persistence:
    enabled: true
    size: 2Gi
