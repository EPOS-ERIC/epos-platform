domain: "localhost"
protocol: "http"
url_prefix_namespace: true
create_namespace: true
image_pull_policy: "IfNotPresent"

components:
  platform_ui:
    base_url: "/"
    tls:
      enabled: false
      secret_name: ""
  gateway:
    base_url: "/v1/"
    aai:
      enabled: true
      service_endpoint: ""
      gateway_endpoint: ""
    tls:
      enabled: false
      secret_name: ""
  backoffice:
    enabled: true
    gui:
      base_url: "/backoffice/"
    tls:
      enabled: false
      secret_name: ""
  metadata_database:
    enabled: true
    host: "metadata-database"
    port: 5432
    user: "metadata-lifecycle"
    password: ""
    db_name: "metadata-lifecycle"
  data_retriever_database:
    enabled: true
    host: "retriever-db"
    port: 5432
    user: "data_retriever"
    password: ""
    db_name: "data_retriever"
  sharing_database:
    enabled: true
    host: "sharing-db"
    port: 5432
    user: "sharing"
    password: ""
    db_name: "sharing"
  aai_service:
    enabled: true
    name: "EPOS"
    surname: "User"
    email: "epos@epos.eu"
    password: ""
    tls:
      enabled: false
      secret_name: ""
  otel:
    enabled: false
    endpoint: ""
    admin_user: "admin"
    admin_password: ""
    tls:
      enabled: false
      secret_name: ""

image_pull_secrets:
  enabled: false
  registry_server: ""
  registry_username: ""
  registry_password: ""
cert_manager_issuer: "letsencrypt"

images:
  platform_ui: "ghcr.io/epos-eric/epos-platform/platform-legacy:main"
  backoffice_ui: "ghcr.io/epos-eric/epos-platform/backoffice:main"
  gateway: "ghcr.io/epos-eric/epos-platform/gateway:main"
  metadata_lifecycle: "ghcr.io/epos-eric/epos-platform/metadata-lifecycle:main"
  data_retriever: "ghcr.io/epos-eric/epos-platform/data-retriever:main"
  sharing_service: "ghcr.io/epos-eric/epos-platform/sharing:main"
  aai_service: "ghcr.io/epos-eric/epos-platform/oss-aai-service:main"
  metadata_database: "postgis/postgis:18-3.6-alpine"
  data_retriever_database: "postgres:18-alpine"
  sharing_database: "postgres:18-alpine"
  otel_lgtm: "grafana/otel-lgtm:latest"
