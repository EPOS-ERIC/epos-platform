{{- $services := dict
  "metadata-lifecycle" (dict "port" 5000 "portEnv" "SERVER_PORT" "db" .Values.components.metadata_database "dbService" "metadata-database" "image" .Values.images.metadata_lifecycle)
  "data-retriever" (dict "port" 8100 "portEnv" "GRPC_LISTEN_ADDR" "db" .Values.components.data_retriever_database "dbService" "retriever-db" "image" .Values.images.data_retriever)
  "sharing" (dict "port" 8200 "portEnv" "SERVER_PORT" "db" .Values.components.sharing_database "dbService" "sharing-db" "image" .Values.images.sharing_service)
}}
{{- range $name, $service := $services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "epos.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "epos.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "epos.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- include "epos.image_pull_secrets" $ | nindent 6 }}
      containers:
        - name: {{ $name }}
          image: {{ $service.image | quote }}
          imagePullPolicy: {{ $.Values.image_pull_policy }}
          ports:
            - containerPort: {{ $service.port }}
          env:
            - name: {{ $service.portEnv }}
              value: {{ if eq $name "data-retriever" }}{{ printf ":%d" (int $service.port) | quote }}{{ else }}{{ $service.port | quote }}{{ end }}
            - name: DB_HOST
              value: {{ if $service.db.enabled }}{{ $service.dbService | quote }}{{ else }}{{ $service.db.host | quote }}{{ end }}
            - name: DB_PORT
              value: {{ if $service.db.enabled }}"5432"{{ else }}{{ $service.db.port | quote }}{{ end }}
            - name: DB_NAME
              value: {{ $service.db.db_name | quote }}
            - name: DB_USER
              value: {{ $service.db.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $service.dbService }}
                  key: password
            - name: OTEL_SDK_DISABLED
              value: {{ not $.Values.components.otel.enabled | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ $name | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ if $.Values.components.otel.enabled }}{{ default "http://otel-lgtm:4318" $.Values.components.otel.endpoint | quote }}{{ else }}""{{ end }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"
            {{- if eq $name "metadata-lifecycle" }}
            - name: GATEWAY_PUBLIC_URL
              value: {{ printf "%s://%s%s%s" $.Values.protocol $.Values.domain (ternary (printf "/%s" $.Release.Namespace) "" $.Values.url_prefix_namespace) (trimSuffix "/v1" (trimSuffix "/" $.Values.components.gateway.base_url)) | quote }}
            {{- end }}
          readinessProbe:
            tcpSocket:
              port: {{ $service.port }}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "epos.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  ports:
    - port: {{ $service.port }}
      targetPort: {{ $service.port }}
  selector:
    {{- include "epos.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
{{- end }}
