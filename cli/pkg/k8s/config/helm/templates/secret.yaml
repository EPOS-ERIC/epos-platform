{{- if .Values.image_pull_secrets.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: epos-registry-secret
  labels:
    {{- include "epos.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict .Values.image_pull_secrets.registry_server (dict "username" .Values.image_pull_secrets.registry_username "password" .Values.image_pull_secrets.registry_password "auth" (printf "%s:%s" .Values.image_pull_secrets.registry_username .Values.image_pull_secrets.registry_password | b64enc))) | toJson | b64enc }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: metadata-database
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: metadata-database
type: Opaque
stringData:
  password: {{ .Values.components.metadata_database.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: retriever-db
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: retriever-db
type: Opaque
stringData:
  password: {{ .Values.components.data_retriever_database.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: converter-db
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: converter-db
type: Opaque
stringData:
  password: {{ .Values.components.converter_database.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: sharing-db
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: sharing-db
type: Opaque
stringData:
  password: {{ .Values.components.sharing_database.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: gateway-mailgun
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
type: Opaque
stringData:
  api_key: {{ .Values.components.gateway.mailgun.api_key | quote }}
{{- if .Values.components.aai_service.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: aai-service
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: aai-service
type: Opaque
stringData:
  password: {{ .Values.components.aai_service.password | quote }}
{{- end }}
{{- if and .Values.components.otel.enabled (not .Values.components.otel.endpoint) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: otel-lgtm
type: Opaque
stringData:
  admin-password: {{ .Values.components.otel.admin_password | quote }}
{{- end }}
