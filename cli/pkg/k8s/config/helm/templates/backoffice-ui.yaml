apiVersion: apps/v1
kind: Deployment
metadata:
  name: backoffice-ui
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: backoffice-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "epos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backoffice-ui
  template:
    metadata:
      labels:
        {{- include "epos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: backoffice-ui
    spec:
      {{- include "epos.image_pull_secrets" . | nindent 6 }}
      containers:
        - name: backoffice-ui
          image: {{ .Values.images.backoffice_ui | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          ports:
            - containerPort: 8080
          env:
            - name: BASE_URL
              value: {{ include "epos.backofficeBasePath" . | quote }}
            - name: API_HOST
              value: "http://gateway:5000"
            - name: AUTH_ROOT_URL
              value: {{ include "epos.aaiAuthRootURL" . | quote }}
          readinessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: backoffice-ui
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: backoffice-ui
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    {{- include "epos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: backoffice-ui
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backoffice-ui
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    {{- if and .Values.components.backoffice.tls.enabled .Values.cert_manager_issuer }}
    cert-manager.io/cluster-issuer: {{ .Values.cert_manager_issuer | quote }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - {{- if (include "epos.ingressHost" .) }}
      host: {{ include "epos.ingressHost" . | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ if eq (include "epos.backofficeBasePath" .) "/" }}/(|/)(.*){{ else }}{{ trimSuffix "/" (include "epos.backofficeBasePath" .) }}(/|$)(.*){{ end }}
            pathType: ImplementationSpecific
            backend:
              service:
                name: backoffice-ui
                port:
                  number: 8080
  {{- if .Values.components.backoffice.tls.enabled }}
  tls:
    - hosts: [{{ .Values.domain | quote }}]
      secretName: {{ .Values.components.backoffice.tls.secret_name | quote }}
  {{- end }}
