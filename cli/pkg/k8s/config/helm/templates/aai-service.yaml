{{- if .Values.components.aai_service.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aai-service
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: aai-service
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "epos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: aai-service
  template:
    metadata:
      labels:
        {{- include "epos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: aai-service
      annotations:
        checksum/secret-aai-service: {{ .Values.components.aai_service.password | toString | sha256sum }}
    spec:
      {{- include "epos.image_pull_secrets" . | nindent 6 }}
      securityContext:
        fsGroup: 1000
      containers:
      - name: aai-service
        image: {{ .Values.images.aai_service }}
        imagePullPolicy: {{ .Values.image_pull_policy }}
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
        env:
        - name: APP_SECURE_COOKIES
          value: {{ eq .Values.protocol "https" | quote }}
        - name: INITIAL_ADMIN_NAME
          value: {{ .Values.components.aai_service.name | quote }}
        - name: INITIAL_ADMIN_SURNAME
          value: {{ .Values.components.aai_service.surname | quote }}
        - name: INITIAL_ADMIN_EMAIL
          value: {{ .Values.components.aai_service.email | quote }}
        - name: APP_CORS_ALLOW_ORIGIN
          value: "*"
        - name: OIDC_ISSUER
          value: {{ printf "%s/oauth2" (include "epos.defaultAAIAuthRootURL" .) | quote }}
        - name: OAUTH_GUI_URLS
          value: {{ printf "%s,%s" (include "epos.platformURL" .) (include "epos.backofficeURL" .) | quote }}
        - name: LOG_LEVEL
          value: {{ ternary "DEBUG" "INFO" .Values.debug | quote }}
        - name: OTEL_SDK_DISABLED
          value: {{ not .Values.components.otel.enabled | quote }}
        - name: OTEL_SERVICE_NAME
          value: aai-service
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: {{ if .Values.components.otel.enabled }}{{ default "http://otel-lgtm:4318" .Values.components.otel.endpoint | quote }}{{ else }}""{{ end }}
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          value: "http/protobuf"
        - name: OTEL_METRIC_EXPORT_INTERVAL
          value: "5000"
        - name: INITIAL_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aai-service
              key: password
        volumeMounts:
        - name: aai
          mountPath: /app/data
      volumes:
      - name: aai
        persistentVolumeClaim:
          claimName: aai
---
apiVersion: v1
kind: Service
metadata:
  name: aai-service
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: aai-service
spec:
  ports:
  - port: 8080
    name: http
  selector:
    {{- include "epos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: aai-service
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aai-service
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: aai-service
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2

    {{- if and .Values.components.aai_service.tls.enabled .Values.cert_manager_issuer }}
    cert-manager.io/cluster-issuer: {{ .Values.cert_manager_issuer | quote }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
  - {{- if (include "epos.ingressHost" .) }}
    host: {{ include "epos.ingressHost" . | quote }}
    {{- end }}
    http:
      paths:
      {{- if .Values.url_prefix_namespace }}
      - path: /{{ .Release.Namespace }}/aai(/|$)(.*)
      {{- else }}
      - path: /aai(/|$)(.*)
      {{- end }}
        pathType: ImplementationSpecific
        backend:
          service:
            name: aai-service
            port:
              number: 8080
  {{- if .Values.components.aai_service.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.domain }}
    secretName: {{ .Values.components.aai_service.tls.secret_name | quote }}
  {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aai
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: aai-service
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
{{- end }}
