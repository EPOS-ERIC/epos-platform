---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-retriever
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-retriever
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "epos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: data-retriever
  template:
    metadata:
      labels:
        {{- include "epos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: data-retriever
    spec:
      {{- include "epos.image_pull_secrets" . | nindent 6 }}
      containers:
        - name: data-retriever
          image: {{ .Values.images.data_retriever | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          ports:
            - containerPort: 8100
          env:
            - name: GRPC_LISTEN_ADDR
              value: ":8100"
            - name: DB_HOST
              value: {{ if .Values.components.data_retriever_database.enabled }}"retriever-db"{{ else }}{{ .Values.components.data_retriever_database.host | quote }}{{ end }}
            - name: DB_PORT
              value: {{ if .Values.components.data_retriever_database.enabled }}"5432"{{ else }}{{ .Values.components.data_retriever_database.port | quote }}{{ end }}
            - name: DB_NAME
              value: {{ .Values.components.data_retriever_database.db_name | quote }}
            - name: DB_USER
              value: {{ .Values.components.data_retriever_database.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retriever-db
                  key: password
            - name: OTEL_SDK_DISABLED
              value: {{ not .Values.components.otel.enabled | quote }}
            - name: OTEL_SERVICE_NAME
              value: "data-retriever"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ if .Values.components.otel.enabled }}{{ default "http://otel-lgtm:4318" .Values.components.otel.endpoint | quote }}{{ else }}""{{ end }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"

          readinessProbe:
            tcpSocket:
              port: 8100
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: data-retriever
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-retriever
spec:
  ports:
    - port: 8100
      targetPort: 8100
  selector:
    {{- include "epos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: data-retriever

{{- if .Values.components.data_retriever_database.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: retriever-db
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: retriever-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "epos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: retriever-db
  template:
    metadata:
      labels:
        {{- include "epos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: retriever-db
    spec:
      {{- include "epos.image_pull_secrets" . | nindent 6 }}
      containers:
        - name: retriever-db
          image: {{ .Values.images.data_retriever_database | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ .Values.components.data_retriever_database.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.components.data_retriever_database.db_name | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retriever-db
                  key: password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: retriever-db
---
apiVersion: v1
kind: Service
metadata:
  name: retriever-db
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: retriever-db
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    {{- include "epos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: retriever-db
{{- end }}
