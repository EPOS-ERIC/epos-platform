---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-retriever
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-retriever
spec:
  selector:
    matchLabels:
      {{- include "epos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: data-retriever
  template:
    metadata:
      labels:
        {{- include "epos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: data-retriever
      annotations:
        checksum/secret-retriever-db: {{ .Values.components.data_retriever_database.password | toString | sha256sum }}
    spec:
      {{- include "epos.image_pull_secrets" . | nindent 6 }}
      containers:
        - name: data-retriever
          image: {{ .Values.images.data_retriever | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          env:
            - name: SERVER_PORT
              value: "8100"
            - name: DB_HOST
              value: {{ if .Values.components.data_retriever_database.enabled }}"retriever-db"{{ else }}{{ .Values.components.data_retriever_database.host | quote }}{{ end }}
            - name: DB_PORT
              value: {{ if .Values.components.data_retriever_database.enabled }}"5432"{{ else }}{{ .Values.components.data_retriever_database.port | quote }}{{ end }}
            - name: DB_NAME
              value: {{ .Values.components.data_retriever_database.db_name | quote }}
            - name: DB_USER
              value: {{ .Values.components.data_retriever_database.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retriever-db
                  key: password
            - name: LOG_LEVEL
              value: {{ ternary "DEBUG" "INFO" .Values.debug | quote }}
            - name: OTEL_SDK_DISABLED
              value: {{ not .Values.components.otel.enabled | quote }}
            - name: OTEL_SERVICE_NAME
              value: "data-retriever"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ if .Values.components.otel.enabled }}{{ default "http://otel-lgtm:4318" .Values.components.otel.endpoint | quote }}{{ else }}""{{ end }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"

          readinessProbe:
            grpc:
              port: 8100
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: data-retriever
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: data-retriever
spec:
  ports:
    - port: 8100
  selector:
    {{- include "epos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: data-retriever

{{ include "epos.postgres" (dict "root" . "name" "retriever-db" "database" .Values.components.data_retriever_database "image" .Values.images.data_retriever_database) }}
