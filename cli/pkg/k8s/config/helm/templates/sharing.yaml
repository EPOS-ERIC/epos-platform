---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sharing
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: sharing
spec:
  selector:
    matchLabels:
      {{- include "epos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: sharing
  template:
    metadata:
      labels:
        {{- include "epos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sharing
      annotations:
        checksum/secret-sharing-db: {{ .Values.components.sharing_database.password | toString | sha256sum }}
    spec:
      {{- include "epos.image_pull_secrets" . | nindent 6 }}
      containers:
        - name: sharing
          image: {{ .Values.images.sharing_service | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          env:
            - name: SERVER_PORT
              value: "8200"
            - name: DB_HOST
              value: {{ if .Values.components.sharing_database.enabled }}"sharing-db"{{ else }}{{ .Values.components.sharing_database.host | quote }}{{ end }}
            - name: DB_PORT
              value: {{ if .Values.components.sharing_database.enabled }}"5432"{{ else }}{{ .Values.components.sharing_database.port | quote }}{{ end }}
            - name: DB_NAME
              value: {{ .Values.components.sharing_database.db_name | quote }}
            - name: DB_USER
              value: {{ .Values.components.sharing_database.user | quote }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sharing-db
                  key: password
            - name: LOG_LEVEL
              value: {{ ternary "DEBUG" "INFO" .Values.debug | quote }}
            - name: OTEL_SDK_DISABLED
              value: {{ not .Values.components.otel.enabled | quote }}
            - name: OTEL_SERVICE_NAME
              value: "sharing"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ if .Values.components.otel.enabled }}{{ default "http://otel-lgtm:4318" .Values.components.otel.endpoint | quote }}{{ else }}""{{ end }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "5000"

          readinessProbe:
            tcpSocket:
              port: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: sharing
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: sharing
spec:
  ports:
    - port: 8200
  selector:
    {{- include "epos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: sharing

{{ include "epos.postgres" (dict "root" . "name" "sharing-db" "database" .Values.components.sharing_database "image" .Values.images.sharing_database) }}
