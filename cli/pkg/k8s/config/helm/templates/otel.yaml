{{- if and .Values.components.otel.enabled (not .Values.components.otel.endpoint) }}
{{- $path := printf "%s/grafana" (ternary (printf "/%s" .Release.Namespace) "" .Values.url_prefix_namespace) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-lgtm
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "epos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-lgtm
  template:
    metadata:
      labels:
        {{- include "epos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: otel-lgtm
    spec:
      {{- include "epos.image_pull_secrets" . | nindent 6 }}
      containers:
        - name: otel-lgtm
          image: {{ .Values.images.otel_lgtm | quote }}
          imagePullPolicy: {{ .Values.image_pull_policy }}
          ports:
            - name: grafana
              containerPort: 3000
            - name: otlp-http
              containerPort: 4318
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PYROSCOPE_EXTRA_ARGS
              value: "-memberlist.advertise-addr=$(POD_IP)"
            - name: GF_SECURITY_ADMIN_USER
              value: {{ .Values.components.otel.admin_user | quote }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: otel-lgtm
                  key: admin-password
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SERVER_ROOT_URL
              value: {{ printf "%s://%s%s/" .Values.protocol .Values.domain $path | quote }}
            - name: GF_SERVER_SERVE_FROM_SUB_PATH
              value: "true"
          readinessProbe:
            tcpSocket:
              port: 3000
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: otel-lgtm
---
apiVersion: v1
kind: Service
metadata:
  name: otel-lgtm
spec:
  ports:
    - name: grafana
      port: 3000
      targetPort: 3000
    - name: otlp-http
      port: 4318
      targetPort: 4318
  selector:
    {{- include "epos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: otel-lgtm
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: otel-lgtm
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    {{- if and .Values.components.otel.tls.enabled .Values.cert_manager_issuer }}
    cert-manager.io/cluster-issuer: {{ .Values.cert_manager_issuer | quote }}
    {{- end }}
spec:
  ingressClassName: nginx
  rules:
    - {{- if (include "epos.ingressHost" .) }}
      host: {{ include "epos.ingressHost" . | quote }}
      {{- end }}
      http:
        paths:
          - path: {{ $path }}(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: otel-lgtm
                port:
                  number: 3000
  {{- if .Values.components.otel.tls.enabled }}
  tls:
    - hosts: [{{ .Values.domain | quote }}]
      secretName: {{ .Values.components.otel.tls.secret_name | quote }}
  {{- end }}
{{- end }}
