{{- range $name, $db := dict "retriever-db" (dict "config" .Values.components.data_retriever_database "image" .Values.images.data_retriever_database) "sharing-db" (dict "config" .Values.components.sharing_database "image" .Values.images.sharing_database) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "epos.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
type: Opaque
stringData:
  password: {{ $db.config.password | quote }}
{{- if $db.config.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "epos.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "epos.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "epos.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "epos.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
    spec:
      {{- include "epos.image_pull_secrets" $ | nindent 6 }}
      containers:
        - name: {{ $name }}
          image: {{ $db.image | quote }}
          imagePullPolicy: {{ $.Values.image_pull_policy }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ $db.config.user | quote }}
            - name: POSTGRES_DB
              value: {{ $db.config.db_name | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $name }}
                  key: password
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "epos.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    {{- include "epos.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
{{- end }}
{{- end }}
