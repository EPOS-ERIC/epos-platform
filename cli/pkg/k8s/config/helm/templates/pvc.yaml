{{- if .Values.components.aai_service.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aai
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: aai-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
{{- end }}
{{- if .Values.components.metadata_database.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: psqldata
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: metadata-database
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
{{- end }}
{{- if .Values.components.data_retriever_database.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: retriever-db
  labels:
    {{- include "epos.labels" . | nindent 4 }}
    app.kubernetes.io/component: retriever-db
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
{{- end }}
