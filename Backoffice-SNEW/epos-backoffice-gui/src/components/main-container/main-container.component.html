<main class="main-container-layout">
  <app-navigation-sidebar
    [isAdmin]="isAdmin()"
    [groups]="groups()"
    [groupsLoading]="groupsLoading()"
    [currentSectionPath]="sectionPath()"
    [selectedGroupId]="selectedGroupId()"
    [detailItems]="detailStore.navigationItems()"
    [showBackButton]="accountPage() === 'memberships' || manageGroup()"
    [detailRootLabel]="detailStore.rootLabel()"
    [detailBackLink]="accountPage() === 'memberships' ? membershipBackLink() : ['/', sectionPath()]"
    [detailBackQueryParams]="selectedGroupId() ? { groupId: selectedGroupId() } : null"
    [detailActions]="detailStore.sidebarActions()"
    (detailAction)="detailStore.handleSidebarAction($event)"
  />

  <section class="content" #detailScrollContainer>
    <app-backoffice-header
      [sectionTitle]="sectionTitle()"
      [pageLabel]="pageLabel()"
      [darkMode]="darkMode()"
      [showSearchActions]="pageLabel() === 'Results'"
      [searchQuery]="searchQuery()"
      [selectedDataTypes]="selectedDataTypes()"
      [selectedVersioningStatuses]="selectedVersioningStatuses()"
      (searchQueryChange)="updateSearchQuery($event)"
      (filtersChange)="updateResultsFilters($event)"
      (toggleTheme)="toggleTheme()"
      (addNewResource)="openCreateResourceDialog()"
    />

    @if (pageLabel() === 'Detail') {
      <div class="detail-page-actions">
        <button type="button" class="app-button app-button--icon detail-back-to-top" (click)="scrollDetailToTop()" title="Back to top" aria-label="Back to top">
          <span aria-hidden="true" class="detail-back-to-top-icon">⌃</span>
        </button>
      </div>
    }

    <div class="content-spacer">
      @if (accountPage() === 'memberships') {
        <app-memberships-page />
      } @else if (manageGroup()) {
        <app-manage-group-page [groupId]="selectedGroupId()" [groupName]="selectedGroupName()" />
      } @else if (adminPage() === 'groups') {
        <app-admin-groups />
      } @else if (adminPage() === 'categories') {
        <app-admin-categories [groups]="groups()" [groupsLoading]="groupsLoading()" />
      } @else if (adminPage() === 'organizations') {
        <app-admin-organizations />
      } @else if (pageLabel() === 'Detail') {
        <app-resource-detail-page />
      } @else {
        <app-results-table [sectionTitle]="sectionTitle()" [sectionPath]="sectionPath()" [selectedGroupId]="selectedGroupId()" [selectedGroupName]="selectedGroupName()" [canManageGroup]="canManageSelectedGroup()" [discoveryItems]="discoveryItems()" [discoveryLoading]="discoveryLoading()" />
      }
    </div>
  </section>
</main>
