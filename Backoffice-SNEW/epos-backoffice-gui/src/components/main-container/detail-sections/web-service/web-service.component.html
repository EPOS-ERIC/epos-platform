<div id="web-service" class="distribution-subsection">
  <h3 class="distribution-root-title">Web Service</h3>

  @if (model) {
    <fieldset class="detail-fieldset" [disabled]="disabled">
      <div class="detail-form-grid">
        <label class="detail-field">
          <span class="detail-label">Name</span>
          <input class="app-input" type="text" [(ngModel)]="model.name" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()" />
        </label>

        <label class="detail-field detail-field--full">
          <span class="detail-label">Description</span>
          <textarea class="app-input detail-textarea" rows="3" [(ngModel)]="model.description" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()"></textarea>
        </label>

        <label class="detail-field">
          <span class="detail-label">Template URL</span>
          <input class="app-input" type="text" [(ngModel)]="model.templateUrl" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()" />
        </label>

        <label class="detail-field">
          <span class="detail-label">Format</span>
          <input class="app-input" type="text" [(ngModel)]="model.format" [ngModelOptions]="{ standalone: true }" (ngModelChange)="emitModelChange()" />
        </label>
      </div>

    <app-web-service-documentation [model]="model.documentation" [disabled]="disabled" (modelChange)="onDocumentationChange($event)"></app-web-service-documentation>

    <details id="webservice-provider" class="webservice-subsection">
      <summary class="webservice-subsection-summary">
        <span class="distribution-subtitle">Provider</span>
        <span class="webservice-summary-hint">Closed</span>
      </summary>
      <div class="webservice-subsection-body">
        <app-providers [model]="model.provider" [single]="true" [disabled]="disabled" (modelChange)="onProviderChange($any($event))"></app-providers>
      </div>
    </details>

    <details id="webservice-contact-points" class="webservice-subsection">
      <summary class="webservice-subsection-summary">
        <span class="distribution-subtitle">Contact Points</span>
        <span class="webservice-summary-hint">Closed</span>
      </summary>
      <div class="webservice-subsection-body">
        <app-contact-points [model]="model.contactPoints" [editable]="true" [disabled]="disabled" (modelChange)="onContactPointsChange($event)"></app-contact-points>
      </div>
    </details>

    <details id="webservice-spatial-coverage" class="webservice-subsection">
      <summary class="webservice-subsection-summary">
        <span class="distribution-subtitle">Spatial Coverage</span>
        <span class="webservice-summary-hint">Closed</span>
      </summary>
      <div class="webservice-subsection-body">
        <app-spatial-coverage [model]="model.spatialCoverage" [disabled]="disabled" (modelChange)="onSpatialChange($event)" />
      </div>
    </details>

    <details id="webservice-temporal-coverage" class="webservice-subsection">
      <summary class="webservice-subsection-summary">
        <span class="distribution-subtitle">Temporal Coverage</span>
        <span class="webservice-summary-hint">Closed</span>
      </summary>
      <div class="webservice-subsection-body">
        <app-temporal-coverage [model]="model.temporalCoverage" [disabled]="disabled" (modelChange)="onTemporalChange($event)"></app-temporal-coverage>
      </div>
    </details>

    <app-web-service-parameters [model]="model.parameters" [disabled]="disabled" (modelChange)="onParametersChange($event)"></app-web-service-parameters>
    </fieldset>
  }
</div>
