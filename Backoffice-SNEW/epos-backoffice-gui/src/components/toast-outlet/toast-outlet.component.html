@if (toastService.state(); as toast) {
  <div
    class="toast"
    [class.toast--visible]="toast.visible"
    [attr.data-tone]="toast.tone"
    role="status"
    aria-live="polite"
  >
    <span class="toast-message">{{ toast.message }}</span>
    <button type="button" class="toast-close" (click)="toastService.dismiss()" aria-label="Dismiss notification">×</button>
  </div>
}
