services:
  data-retriever-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=data_retriever
      - POSTGRES_USER=data_retriever
      - POSTGRES_PASSWORD=data_retriever
    ports:
      - "5433:5432"
    volumes:
      - data-retriever-db-data:/var/lib/postgresql/data
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_retriever -d data_retriever || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:2026.04.0-community
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
      - NEO4J_dbms_usage__report_enabled=false
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  metadata-lifecycle-service:
    image: epos-metadata-lifecycle:latest
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - EPOS_NEO4J_URI=bolt://neo4j:7687
      - EPOS_NEO4J_USERNAME=neo4j
      - EPOS_NEO4J_PASSWORD=neo4jpassword
      - EPOS_NEO4J_DATABASE=neo4j
      - EPOS_GRAPH_BOOTSTRAP_MODE=skip-cypher
      - EPOS_SERVER_HOST=0.0.0.0
      - EPOS_SERVER_PORT=8080
    ports:
      - "8080:8080"
    restart: on-failure
    networks:
      - epos-network

  gateway-service:
    image: epos-gateway:latest
    depends_on:
      metadata-lifecycle-service:
        condition: service_started
    ports:
      - "5000:5000"
    restart: on-failure
    networks:
      - epos-network

  data-retriever-service:
    image: epos-data-retriever:latest
    depends_on:
      data-retriever-db:
        condition: service_healthy
    environment:
      - DATA_RETRIEVER_LISTEN_ADDR=:8100
      - DATA_RETRIEVER_DB_HOST=data-retriever-db
      - DATA_RETRIEVER_DB_PORT=5432
      - DATA_RETRIEVER_DB_NAME=data_retriever
      - DATA_RETRIEVER_DB_USER=data_retriever
      - DATA_RETRIEVER_DB_PASSWORD=data_retriever
      - DATA_RETRIEVER_MIGRATIONS_DIR=/migrations
      - DATA_RETRIEVER_HTTP_TIMEOUT=30s
    ports:
      - "8100:8100"
    restart: on-failure
    networks:
      - epos-network

volumes:
  data-retriever-db-data:
  neo4j-data:

networks:
  epos-network:
    driver: bridge
