server:
  listen: ":5000"
  cors_allow_origin: "*"
  request_timeout: "5s"
  read_timeout: "15s"
  write_timeout: "30s"
  idle_timeout: "60s"

authentication:
  root_url: "http://localhost:35000"

metadata_sync:
  enabled: false
  base_url: "https://epos-backoffice-tool.nina.elicos.it"
  username: ""
  password_env: "ELICOS_PASSWORD"
  cron: "*/15 * * * *" # UTC
  timeout: "5m"

upstream:
  timeout: "5s"
  real_timeout: "30s"
  cache_ttl: "5m"
  max_entries: 2048

services:
  metadata-lifecycle:
    url: "metadata-lifecycle:5000"
  data-retriever:
    url: "data-retriever:8100"
  converter:
    url: "converter:8200"
  sharing:
    url: "sharing:8200"
  auth:
    url: "http://oss-aai-service:8080/oauth2/userinfo"
