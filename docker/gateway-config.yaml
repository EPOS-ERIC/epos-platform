server:
  listen: ":5000"
  cors_allow_origin: "*"
  request_timeout: "5s"
  read_timeout: "15s"
  write_timeout: "30s"
  idle_timeout: "60s"

upstream:
  timeout: "5s"
  real_timeout: "30s"
  cache_ttl: "5m"
  max_entries: 2048

services:
  metadata-lifecycle:
    url: "metadata-lifecycle:5000"
  data-retriever:
    url: "data-retriever:8100"
  converter:
    url: "converter:8200"
  sharing:
    url: "sharing:8200"
  auth:
    url: "http://oss-aai-service:8080/"
