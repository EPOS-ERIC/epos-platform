services:
  data-retriever-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=data_retriever
      - POSTGRES_USER=data_retriever
      - POSTGRES_PASSWORD=data_retriever
    ports:
      - "5433:5432"
    volumes:
      - data-retriever-db-data:/var/lib/postgresql/data
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U data_retriever -d data_retriever || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  backoffice-db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      - POSTGRES_DB=backoffice
      - POSTGRES_USER=backoffice
      - POSTGRES_PASSWORD=backoffice
    ports:
      - "5434:5432"
    volumes:
      - backoffice-db-data:/var/lib/postgresql/data
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backoffice -d backoffice || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway-service:
    image: epos-gateway-dev:local
    depends_on:
      backoffice-service:
        condition: service_healthy
      oss-aai-service:
        condition: service_healthy
    ports:
      - "32000:5000"
    environment:
      - LOG_LEVEL=DEBUG
      # - LOG_LEVEL_GATEWAY_HTTP_CLIENT=DEBUG
      - LOG_LEVEL_GATEWAY_HTTP_CLIENT=INFO
      - LOG_LEVEL_METADATA_READER=INFO

      - OTEL_SERVICE_NAME=gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    user: 0:0 # run as root indev for intercting with system volumes
    volumes:
      - gateway-gomod-cache:/go/pkg/mod
      - gateway-gobuild-cache:/root/.cache/go-build
    restart: on-failure
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:5000/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  backoffice-service:
    image: epos-backoffice-dev:local
    depends_on:
      backoffice-db:
        condition: service_healthy
    ports:
      - "33000:5000"
    environment:
      - LOG_LEVEL=DEBUG
      - DB_HOST=backoffice-db
      - DB_PORT=5432
      - DB_NAME=backoffice
      - DB_USER=backoffice
      - DB_PASSWORD=backoffice
      - OTEL_SERVICE_NAME=backoffice
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    user: 0:0
    volumes:
      - backoffice-gomod-cache:/go/pkg/mod
      - backoffice-gobuild-cache:/root/.cache/go-build
    restart: on-failure
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:5000/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  platform-app:
    image: epos-platform-dev:local
    depends_on:
      gateway-service:
        condition: service_healthy
    ports:
      - "4200:4200"
    environment:
      - PLATFORM_API_PROXY_TARGET=http://gateway-service:5000
    restart: on-failure
    networks:
      - epos-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://localhost:4200/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  data-retriever-service:
    image: epos-data-retriever-dev:local
    depends_on:
      data-retriever-db:
        condition: service_healthy
    ports:
      - "8100:8100"
    environment:
      - DATA_RETRIEVER_LISTEN_ADDR=:8100
      - DATA_RETRIEVER_DB_HOST=data-retriever-db
      - DATA_RETRIEVER_DB_PORT=5432
      - DATA_RETRIEVER_DB_NAME=data_retriever
      - DATA_RETRIEVER_DB_USER=data_retriever
      - DATA_RETRIEVER_DB_PASSWORD=data_retriever
      - DATA_RETRIEVER_HTTP_TIMEOUT=30s
      - OTEL_SERVICE_NAME=data-retriever
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    volumes:
      - data-retriever-gomod-cache:/go/pkg/mod
      - data-retriever-gobuild-cache:/root/.cache/go-build
    restart: on-failure
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8100/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  oss-aai-service:
    image: epos-oss-aai-dev:local
    ports:
      - "8110:8080"
    environment:
      - OSS_AAI_LISTEN_ADDR=:8080
      - APP_CORS_ALLOW_ORIGIN=*
      - OIDC_ISSUER=http://localhost:8110/oauth2
    volumes:
      - oss-aai-gomod-cache:/go/pkg/mod
      - oss-aai-gobuild-cache:/root/.cache/go-build
      - oss-aai-data:/workspace/services/oss-aai-service/data
    restart: on-failure
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  otel-lgtm:
    image: grafana/otel-lgtm
    ports:
      - 3000:3000
      - 4040:4040
      - 4317:4317
      - 4318:4318
      - 9090:9090
    networks:
      - epos-network
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor # or Admin if you need write access

volumes:
  gateway-gomod-cache:
  gateway-gobuild-cache:
  backoffice-gomod-cache:
  backoffice-gobuild-cache:
  backoffice-db-data:
  data-retriever-gomod-cache:
  data-retriever-gobuild-cache:
  data-retriever-db-data:
  oss-aai-gomod-cache:
  oss-aai-gobuild-cache:
  oss-aai-data:

networks:
  epos-network:
    driver: bridge
