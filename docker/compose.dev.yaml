services:
  user-group-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=user_group
      - POSTGRES_USER=user_group
      - POSTGRES_PASSWORD=user_group
    ports:
      - "5432:5432"
    volumes:
      - user-group-db-data:/var/lib/postgresql/data
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_group -d user_group || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  data-retriever-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=data_retriever
      - POSTGRES_USER=data_retriever
      - POSTGRES_PASSWORD=data_retriever
    ports:
      - "5433:5432"
    volumes:
      - data-retriever-db-data:/var/lib/postgresql/data
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U data_retriever -d data_retriever || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  cassandra:
    image: cassandra:4.1
    environment:
      - MAX_HEAP_SIZE=512M
      - HEAP_NEWSIZE=128M
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 15s
      timeout: 10s
      retries: 20

  janusgraph:
    image: janusgraph/janusgraph:1.1.0
    depends_on:
      cassandra:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    environment:
      - JANUS_PROPS_TEMPLATE=cql-es
      - janusgraph.storage.hostname=cassandra
      - janusgraph.index.search.hostname=elasticsearch
      - janusgraph.graphname=epos-dev
      - JANUS_STORAGE_TIMEOUT=60000
      - JAVA_OPTIONS=-Xms256m -Xmx512m
    ports:
      - "8182:8182"
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/localhost/8182' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  janusgraph-visualizer:
    image: janusgraph/janusgraph-visualizer:latest
    depends_on:
      janusgraph:
        condition: service_started
    environment:
      - GREMLIN_HOST=janusgraph
      - GREMLIN_PORT=8182
      - GREMLIN_TRAVERSAL_SOURCE=g
    ports:
      - "3001:3001"
    restart: on-failure
    networks:
      - epos-network

  metadata-lifecycle-service:
    image: epos-metadata-lifecycle-dev:local
    depends_on:
      janusgraph:
        condition: service_healthy
    environment:
      - EPOS_JANUSGRAPH_HOST=janusgraph
      - EPOS_JANUSGRAPH_PORT=8182
      - EPOS_JANUSGRAPH_TRAVERSAL_SOURCE=g
      - EPOS_JANUSGRAPH_USERNAME=
      - EPOS_JANUSGRAPH_PASSWORD=
      - EPOS_SHACL_FILE=/workspace/packages/shacl/shacl.ttl
      - EPOS_GRAPH_BOOTSTRAP_MODE=skip-cypher
      - EPOS_SERVER_HOST=0.0.0.0
      - EPOS_SERVER_PORT=8080
      - JAVA_TOOL_OPTIONS=-Dio.ktor.development=true
    ports:
      - "8080:8080"
    volumes:
      - metadata-gradle-cache:/root/.gradle
      - ../packages/shacl:/workspace/packages/shacl:ro
    restart: on-failure
    networks:
      - epos-network

  gateway-service:
    image: epos-gateway-dev:local
    depends_on:
      metadata-lifecycle-service:
        condition: service_started
    ports:
      - "32000:5000"
    environment:
      - LOG_LEVEL=DEBUG
      - LOG_LEVEL_GATEWAY_HTTP_CLIENT=INFO
    user: 0:0 # run as root indev for intercting with system volumes
    volumes:
      - gateway-gomod-cache:/go/pkg/mod
      - gateway-gobuild-cache:/root/.cache/go-build
    restart: on-failure
    networks:
      - epos-network

  user-group-service:
    image: epos-user-group-dev:local
    depends_on:
      user-group-db:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      - USER_GROUP_LISTEN_ADDR=:8090
      - USER_GROUP_DB_HOST=user-group-db
      - USER_GROUP_DB_PORT=5432
      - USER_GROUP_DB_NAME=user_group
      - USER_GROUP_DB_USER=user_group
      - USER_GROUP_DB_PASSWORD=user_group
    volumes:
      - user-group-gomod-cache:/go/pkg/mod
      - user-group-gobuild-cache:/root/.cache/go-build
    restart: on-failure
    networks:
      - epos-network

  data-retriever-service:
    image: epos-data-retriever-dev:local
    depends_on:
      data-retriever-db:
        condition: service_healthy
    ports:
      - "8100:8100"
    environment:
      - DATA_RETRIEVER_LISTEN_ADDR=:8100
      - DATA_RETRIEVER_DB_HOST=data-retriever-db
      - DATA_RETRIEVER_DB_PORT=5432
      - DATA_RETRIEVER_DB_NAME=data_retriever
      - DATA_RETRIEVER_DB_USER=data_retriever
      - DATA_RETRIEVER_DB_PASSWORD=data_retriever
      - DATA_RETRIEVER_HTTP_TIMEOUT=30s
    volumes:
      - data-retriever-gomod-cache:/go/pkg/mod
      - data-retriever-gobuild-cache:/root/.cache/go-build
    restart: on-failure
    networks:
      - epos-network

volumes:
  cassandra-data:
  elasticsearch-data:
  metadata-gradle-cache:
  gateway-gomod-cache:
  gateway-gobuild-cache:
  user-group-gomod-cache:
  user-group-gobuild-cache:
  user-group-db-data:
  data-retriever-gomod-cache:
  data-retriever-gobuild-cache:
  data-retriever-db-data:

networks:
  epos-network:
    driver: bridge
