services:
  user-group-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=user_group
      - POSTGRES_USER=user_group
      - POSTGRES_PASSWORD=user_group
    ports:
      - "5432:5432"
    volumes:
      - user-group-db-data:/var/lib/postgresql/data
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_group -d user_group || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  data-retriever-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=data_retriever
      - POSTGRES_USER=data_retriever
      - POSTGRES_PASSWORD=data_retriever
    ports:
      - "5433:5432"
    volumes:
      - data-retriever-db-data:/var/lib/postgresql/data
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U data_retriever -d data_retriever || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:2026.04.0-community
    environment:
      - NEO4J_AUTH=neo4j/neo4jpassword
      - NEO4J_dbms_usage__report_enabled=false
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20

  metadata-lifecycle-service:
    image: epos-metadata-lifecycle-dev:local
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - EPOS_NEO4J_URI=bolt://neo4j:7687
      - EPOS_NEO4J_USERNAME=neo4j
      - EPOS_NEO4J_PASSWORD=neo4jpassword
      - EPOS_NEO4J_DATABASE=neo4j
      - EPOS_SHACL_FILE=/workspace/packages/shacl/shacl.ttl
      - EPOS_GRAPH_BOOTSTRAP_MODE=skip-cypher
      - EPOS_SERVER_HOST=0.0.0.0
      - EPOS_SERVER_PORT=8080
      - JAVA_TOOL_OPTIONS=-javaagent:/otel/opentelemetry-javaagent.jar -Dio.ktor.development=true
      - OTEL_SERVICE_NAME=metadata-lifecycle
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    ports:
      - "8080:8080"
    volumes:
      - metadata-gradle-cache:/root/.gradle
      - ../packages/shacl:/workspace/packages/shacl:ro
    restart: on-failure
    networks:
      - epos-network

  gateway-service:
    image: epos-gateway-dev:local
    depends_on:
      metadata-lifecycle-service:
        condition: service_started
    ports:
      - "32000:5000"
    environment:
      - LOG_LEVEL=DEBUG
      - LOG_LEVEL_GATEWAY_HTTP_CLIENT=DEBUG

      - OTEL_SERVICE_NAME=gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    user: 0:0 # run as root indev for intercting with system volumes
    volumes:
      - gateway-gomod-cache:/go/pkg/mod
      - gateway-gobuild-cache:/root/.cache/go-build
    restart: on-failure
    networks:
      - epos-network

  user-group-service:
    image: epos-user-group-dev:local
    depends_on:
      user-group-db:
        condition: service_healthy
    ports:
      - "8090:8090"
    environment:
      - USER_GROUP_LISTEN_ADDR=:8090
      - USER_GROUP_DB_HOST=user-group-db
      - USER_GROUP_DB_PORT=5432
      - USER_GROUP_DB_NAME=user_group
      - USER_GROUP_DB_USER=user_group
      - USER_GROUP_DB_PASSWORD=user_group
      - OTEL_SERVICE_NAME=user-group
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    volumes:
      - user-group-gomod-cache:/go/pkg/mod
      - user-group-gobuild-cache:/root/.cache/go-build
    restart: on-failure
    networks:
      - epos-network

  data-retriever-service:
    image: epos-data-retriever-dev:local
    depends_on:
      data-retriever-db:
        condition: service_healthy
    ports:
      - "8100:8100"
    environment:
      - DATA_RETRIEVER_LISTEN_ADDR=:8100
      - DATA_RETRIEVER_DB_HOST=data-retriever-db
      - DATA_RETRIEVER_DB_PORT=5432
      - DATA_RETRIEVER_DB_NAME=data_retriever
      - DATA_RETRIEVER_DB_USER=data_retriever
      - DATA_RETRIEVER_DB_PASSWORD=data_retriever
      - DATA_RETRIEVER_HTTP_TIMEOUT=30s
      - OTEL_SERVICE_NAME=data-retriever
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    volumes:
      - data-retriever-gomod-cache:/go/pkg/mod
      - data-retriever-gobuild-cache:/root/.cache/go-build
    restart: on-failure
    networks:
      - epos-network

  otel-lgtm:
    image: grafana/otel-lgtm

    ports:
      - 3000:3000
      - 4040:4040
      - 4317:4317
      - 4318:4318
      - 9090:9090
    networks:
      - epos-network

volumes:
  neo4j-data:
  metadata-gradle-cache:
  gateway-gomod-cache:
  gateway-gobuild-cache:
  user-group-gomod-cache:
  user-group-gobuild-cache:
  user-group-db-data:
  data-retriever-gomod-cache:
  data-retriever-gobuild-cache:
  data-retriever-db-data:

networks:
  epos-network:
    driver: bridge
