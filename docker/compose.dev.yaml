services:
  data-retriever-db:
    image: postgres:18-alpine
    user: "70:70"
    environment:
      - POSTGRES_DB=data_retriever
      - POSTGRES_USER=data_retriever
      - POSTGRES_PASSWORD=data_retriever
    volumes:
      - data-retriever-db-data:/var/lib/postgresql
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U data_retriever -d data_retriever || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  metadata-lifecycle-db:
    image: postgis/postgis:18-3.6-alpine
    user: "70:70"
    platform: linux/amd64
    environment:
      - POSTGRES_DB=metadata-lifecycle
      - POSTGRES_USER=metadata-lifecycle
      - POSTGRES_PASSWORD=metadata-lifecycle
    volumes:
      - metadata-lifecycle-db-data:/var/lib/postgresql
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U metadata-lifecycle -d metadata-lifecycle || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  sharing-db:
    image: postgres:18-alpine
    user: "70:70"
    environment:
      - POSTGRES_DB=sharing
      - POSTGRES_USER=sharing
      - POSTGRES_PASSWORD=sharing
    volumes:
      - sharing-db-data:/var/lib/postgresql
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharing -d sharing || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  gateway-service:
    image: epos-gateway-dev:local
    ports:
      - "33000:5000"
    env_file:
      - .env
    environment:
      - LOG_LEVEL=DEBUG

      - OTEL_SERVICE_NAME=gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    volumes:
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/appuser/.cache/go-build
    restart: on-failure
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:5000/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  metadata-lifecycle-service:
    image: epos-metadata-lifecycle-dev:local
    depends_on:
      metadata-lifecycle-db:
        condition: service_healthy
    environment:
      - LOG_LEVEL=DEBUG
      - SERVER_PORT=5000
      - GATEWAY_PUBLIC_URL=http://localhost:33000
      - DB_HOST=metadata-lifecycle-db
      - DB_PORT=5432
      - DB_NAME=metadata-lifecycle
      - DB_USER=metadata-lifecycle
      - DB_PASSWORD=metadata-lifecycle
      - OTEL_SERVICE_NAME=metadata-lifecycle
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    volumes:
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/appuser/.cache/go-build
    restart: on-failure
    networks:
      - epos-network
    healthcheck:
      test: ["CMD", "grpc-health-probe", "-addr=localhost:5000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  sharing-service:
    image: epos-sharing-dev:local
    depends_on:
      sharing-db:
        condition: service_healthy
    environment:
      - LOG_LEVEL=DEBUG
      - SERVER_PORT=8200
      - DB_HOST=sharing-db
      - DB_PORT=5432
      - DB_NAME=sharing
      - DB_USER=sharing
      - DB_PASSWORD=sharing
      - OTEL_SERVICE_NAME=sharing
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    volumes:
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/appuser/.cache/go-build
    restart: on-failure
    networks:
      - epos-network
    healthcheck:
      test: ["CMD", "grpc-health-probe", "-addr=localhost:8200"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  data-retriever-service:
    image: epos-data-retriever-dev:local
    depends_on:
      data-retriever-db:
        condition: service_healthy
    environment:
      - GRPC_LISTEN_ADDR=:8100
      - DB_HOST=data-retriever-db
      - DB_PORT=5432
      - DB_NAME=data_retriever
      - DB_USER=data_retriever
      - DB_PASSWORD=data_retriever
      - HTTP_TIMEOUT=30s
      - OTEL_SERVICE_NAME=data-retriever
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    volumes:
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/appuser/.cache/go-build
    restart: on-failure
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "nc -z localhost 8100 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  oss-aai-service:
    image: epos-oss-aai-dev:local
    ports:
      - "35000:8080"
    environment:
      - OSS_AAI_LISTEN_ADDR=:8080
      - APP_CORS_ALLOW_ORIGIN=*
      - OIDC_ISSUER=http://localhost:35000/oauth2
      - OAUTH_GUI_URLS=http://localhost:32000/,http://localhost:32000/testpath/,http://localhost:34000/,http://localhost:4200/testpath/
    volumes:
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/home/appuser/.cache/go-build
      - oss-aai-data:/workspace/services/oss-aai-service/data
    restart: on-failure
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:8080/health >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  platform-legacy:
    image: epos-platform-legacy-dev:local
    ports:
      - "32000:4200"
    volumes:
      - platform-legacy-node-modules:/workspace/apps/platform-legacy/node_modules
      - platform-legacy-angular-cache:/workspace/apps/platform-legacy/.angular
    restart: on-failure
    networks:
      - epos-network

  backoffice:
    image: epos-backoffice-dev:local
    ports:
      - "34000:4200"
    volumes:
      - backoffice-node-modules:/workspace/apps/backoffice/node_modules
      - backoffice-angular-cache:/workspace/apps/backoffice/.angular
    restart: on-failure
    networks:
      - epos-network

  otel-lgtm:
    image: epos-otel-lgtm-dev:local
    ports:
      - 36000:3000
    networks:
      - epos-network
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor # or Admin if you need write access

volumes:
  go-mod-cache:
  go-build-cache:
  platform-legacy-angular-cache:
  platform-legacy-node-modules:
  backoffice-angular-cache:
  backoffice-node-modules:
  metadata-lifecycle-db-data:
  data-retriever-db-data:
  sharing-db-data:
  oss-aai-data:

networks:
  epos-network:
    driver: bridge
