server:
  listen: ":5000"
  cors_allow_origin: "*"
  request_timeout: "5s"
  read_timeout: "15s"
  write_timeout: "30s"
  idle_timeout: "60s"

upstream:
  timeout: "5s"
  real_timeout: "30s"
  cache_ttl: "5m"
  max_entries: 2048

discovery:
  fan_out_limit: 64

services:
  metadata-lifecycle:
    url: "http://metadata-lifecycle-service:8080/"
  usergroup:
    url: "http://user-group-service:8090/"
