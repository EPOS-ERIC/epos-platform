server:
  listen: ":5000"
  cors_allow_origin: "*"
  request_timeout: "60s"
  read_timeout: "15s"
  write_timeout: "30s"
  idle_timeout: "60s"

services:
  metadata-lifecycle:
    url: "metadata-lifecycle-service:5000"
  data-retriever:
    url: "data-retriever-service:8100"
  sharing:
    url: "sharing-service:8200"
  converter:
    url: "converter-service:8200"
  auth:
    url: "http://oss-aai-service:8080/"

notifications:
  mailgun:
    enable: false
    domain: "epos-ip.org"
    from: "epos-ics-c@epos-ip.org"
    api_key_env: "MAILGUN_API_TOKEN"
    timeout: "10s"
