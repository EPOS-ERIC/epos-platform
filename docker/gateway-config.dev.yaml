server:
  listen: ":5000"
  cors_allow_origin: "*"
  request_timeout: "60s"

authentication:
  root_url: "http://localhost:35000"

issue_tracker:
  url: "https://epos-ci.brgm.fr/epos-public/issuetracker/-/work_items"
  open_new: "https://epos-ci.brgm.fr/epos-public/issuetracker/-/work_items/new?type=Issue"

# EPOS's own external organizations back office tool
metadata_sync:
  enabled: false
  base_url: "https://epos-backoffice-tool.nina.elicos.it"
  username: ""
  password_env: "ELICOS_PASSWORD"
  cron: "*/15 * * * *" # UTC
  timeout: "5m"

services:
  metadata-lifecycle:
    url: "metadata-lifecycle-service:5000"
  data-retriever:
    url: "data-retriever-service:8100"
  sharing:
    url: "sharing-service:8200"
  converter:
    url: "converter-service:8200"
  auth:
    url: "http://oss-aai-service:8080/oauth2/userinfo"

notifications:
  mailgun:
    enable: false
    domain: "epos-ip.org"
    from: "epos-ics-c@epos-ip.org"
    api_key_env: "MAILGUN_API_TOKEN"
    timeout: "10s"
    # Set test addresses before enabling Mailgun; an empty list sends to real recipients.
    recipient_overrides: []
