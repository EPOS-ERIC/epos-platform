services:
  metadata-lifecycle-db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      - POSTGRES_DB=metadata-lifecycle
      - POSTGRES_USER=metadata-lifecycle
      - POSTGRES_PASSWORD=metadata-lifecycle
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U metadata-lifecycle -d metadata-lifecycle || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - metadata-lifecycle-db-data-ci:/var/lib/postgresql/data

  metadata-lifecycle:
    image: epos-metadata-lifecycle:latest
    depends_on:
      metadata-lifecycle-db:
        condition: service_healthy
    environment:
      - SERVER_PORT=5000
      - GATEWAY_PUBLIC_URL=http://localhost:32000
      - DB_HOST=metadata-lifecycle-db
      - DB_PORT=5432
      - DB_NAME=metadata-lifecycle
      - DB_USER=metadata-lifecycle
      - DB_PASSWORD=metadata-lifecycle
      - OTEL_SERVICE_NAME=metadata-lifecycle
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  sharing-db:
    image: postgres:18-alpine
    environment:
      - POSTGRES_DB=sharing
      - POSTGRES_USER=sharing
      - POSTGRES_PASSWORD=sharing
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sharing -d sharing || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - sharing-db-data-ci:/var/lib/postgresql

  sharing:
    image: epos-sharing:latest
    depends_on:
      sharing-db:
        condition: service_healthy
    environment:
      - SERVER_PORT=8200
      - DB_HOST=sharing-db
      - DB_PORT=5432
      - DB_NAME=sharing
      - DB_USER=sharing
      - DB_PASSWORD=sharing
      - OTEL_SERVICE_NAME=sharing
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8200 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  oss-aai-service:
    image: epos-oss-aai-service:latest
    environment:
      - OSS_AAI_LISTEN_ADDR=:8080
      - APP_CORS_ALLOW_ORIGIN=*
      - OIDC_ISSUER=http://localhost:8110/oauth2
    ports:
      - "8110:8080"
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  gateway-service:
    image: epos-gateway:latest
    depends_on:
      metadata-lifecycle:
        condition: service_healthy
      sharing:
        condition: service_healthy
      oss-aai-service:
        condition: service_healthy
    environment:
      - LOG_LEVEL=DEBUG
      - OTEL_SERVICE_NAME=gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    ports:
      - "32000:5000"
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:5000/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  metadata-lifecycle-db-data-ci:
  sharing-db-data-ci:

networks:
  epos-network:
    driver: bridge
