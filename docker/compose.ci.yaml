services:
  metadata-lifecycle-db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      - POSTGRES_DB=metadata-lifecycle
      - POSTGRES_USER=metadata-lifecycle
      - POSTGRES_PASSWORD=metadata-lifecycle
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U metadata-lifecycle -d metadata-lifecycle || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - metadata-lifecycle-db-data-ci:/var/lib/postgresql/data

  metadata-lifecycle:
    image: epos-metadata-lifecycle:latest
    depends_on:
      metadata-lifecycle-db:
        condition: service_healthy
    environment:
      - SERVER_PORT=5000
      - DB_HOST=metadata-lifecycle-db
      - DB_PORT=5432
      - DB_NAME=metadata-lifecycle
      - DB_USER=metadata-lifecycle
      - DB_PASSWORD=metadata-lifecycle
      - OTEL_SERVICE_NAME=metadata-lifecycle
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  data-retriever-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=data_retriever
      - POSTGRES_USER=data_retriever
      - POSTGRES_PASSWORD=data_retriever
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_retriever -d data_retriever || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      - data-retriever-db-data-ci:/var/lib/postgresql/data

  data-retriever:
    image: epos-data-retriever:latest
    depends_on:
      data-retriever-db:
        condition: service_healthy
    environment:
      - DATA_RETRIEVER_GRPC_LISTEN_ADDR=:8100
      - DATA_RETRIEVER_DB_HOST=data-retriever-db
      - DATA_RETRIEVER_DB_PORT=5432
      - DATA_RETRIEVER_DB_NAME=data_retriever
      - DATA_RETRIEVER_DB_USER=data_retriever
      - DATA_RETRIEVER_DB_PASSWORD=data_retriever
      - DATA_RETRIEVER_HTTP_TIMEOUT=30s
    networks:
      - epos-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8100 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  oss-aai-service:
    image: epos-oss-aai-service:latest
    environment:
      - OSS_AAI_LISTEN_ADDR=:8080
      - APP_CORS_ALLOW_ORIGIN=*
      - OIDC_ISSUER=http://localhost:8110/oauth2
    ports:
      - "8110:8080"
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:8080/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  gateway-service:
    image: epos-gateway:latest
    depends_on:
      metadata-lifecycle:
        condition: service_healthy
      data-retriever:
        condition: service_healthy
      oss-aai-service:
        condition: service_healthy
    environment:
      - LOG_LEVEL=DEBUG
      - OTEL_SERVICE_NAME=gateway
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-lgtm:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_METRIC_EXPORT_INTERVAL=5000
    ports:
      - "32000:5000"
    networks:
      - epos-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://localhost:5000/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  metadata-lifecycle-db-data-ci:
  data-retriever-db-data-ci:

networks:
  epos-network:
    driver: bridge
